  if(gEntry){
    let stand = getStand(tourn, gEntry[0]).find(x => x.p === p);
    if(stand) form = { w: stand.w||0, l: stand.l||0, gw: stand.gw||0, gl: stand.gl||0 };

function winChance(a, b, t){

  let pow2 = getPlayerTournamentPower(b, t).power;
  let diff = pow1 - pow2;
  let prob = 1 / (1 + Math.exp(-diff / 150));

function createPrng(seedStr){
  let h = 2166136261 >>> 0;
  for(let i = 0; i < seedStr.length; i++){
    h = Math.imul(h ^ seedStr.charCodeAt(i), 16777619);
  }
  return function(){
    h += 0x6D2B79F5;
    let t = Math.imul(h ^ (h >>> 15), 1 | h);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

function simulateTournamentOdds(tourn, runs = 2000, rng = Math.random, passedLeagueRecs = null){
  if(!tourn || !tourn.players || !tourn.players.length) return {};
  let groups = groupsOf(tourn);
  let cut = advancePerGroup(tourn);
  let players = tourn.players;

  let leagueRecs = passedLeagueRecs || (typeof isCalculatingRecords !== 'undefined' && isCalculatingRecords ? { statsByPlayer: {} } : calculateLeagueRecords());
  let playerPowers = {};
  players.forEach(p => {
    playerPowers[p] = getPlayerTournamentPower(p, tourn, leagueRecs);
  });

  let matchProbMatrix = {};
  players.forEach(p1 => {
    players.forEach(p2 => {
      if(p1 !== p2){
        let diff = (playerPowers[p1]?.power || 1000) - (playerPowers[p2]?.power || 1000);
        matchProbMatrix[p1 + '|' + p2] = Math.max(0.12, Math.min(0.88, 1 / (1 + Math.exp(-diff / 150))));
      }
    });
  });

  let topCutCounts = Object.fromEntries(players.map(p => [p, 0]));
  let finalsCounts = Object.fromEntries(players.map(p => [p, 0]));
  let champCounts = Object.fromEntries(players.map(p => [p, 0]));

  let groupMatchList = tourn.matches || [];

  for(let r = 0; r < runs; r++){
    let groupResults = {};
    for(let [g, ps] of Object.entries(groups)){
      groupResults[g] = Object.fromEntries(ps.map(p => [p, { p, w: 0, l: 0, gw: 0, gl: 0, h2h: {} }]));
    }

    groupMatchList.forEach(m => {
      let g = m.group || Object.keys(groups)[0];
      let aObj = groupResults[g]?.[m.a];
      let bObj = groupResults[g]?.[m.b];
      if(!aObj || !bObj) return;

      let sa, sb;
      if(m.as !== '' && m.as != null && m.bs !== '' && m.bs != null){
        sa = +m.as;
        sb = +m.bs;
      } else {
        let pWin = matchProbMatrix[m.a + '|' + m.b] || 0.5;
        let aWon = rng() < pWin;
        let sweep = rng() < 0.55;
        sa = aWon ? 2 : (sweep ? 0 : 1);
        sb = aWon ? (sweep ? 0 : 1) : 2;
      }

      aObj.gw += sa; aObj.gl += sb;
      bObj.gw += sb; bObj.gl += sa;
      if(sa > sb){
        aObj.w++; bObj.l++;
        aObj.h2h[m.b] = 1; bObj.h2h[m.a] = 0;
      } else if(sb > sa){
        bObj.w++; aObj.l++;
        bObj.h2h[m.a] = 1; aObj.h2h[m.b] = 0;
      }
    });

    let qualifiers = [];
    for(let [g, ps] of Object.entries(groups)){
      let list = Object.values(groupResults[g]);
      list.sort((a, b) => {
        let diff = (b.w - a.w) || (b.gw - a.gw) || ((b.gw - b.gl) - (a.gw - a.gl));
        if(diff) return diff;
        let ah = a.h2h[b.p], bh = b.h2h[a.p];
        if(ah !== undefined && bh !== undefined) return bh - ah;
        return a.p.localeCompare(b.p);
      });

      let gCut = Math.min(cut, list.length);
      let groupQuals = list.slice(0, gCut).map(x => x.p);
      groupQuals.forEach(p => topCutCounts[p]++);
      qualifiers.push(...groupQuals);
    }

    if(!qualifiers.length) continue;

    // Simulate bracket between qualifiers
    let pool = [...qualifiers];
    while(pool.length > 1){
      let nextRound = [];
      for(let i = 0; i < pool.length; i += 2){
        if(i + 1 >= pool.length){
          nextRound.push(pool[i]);
        } else {
          let p1 = pool[i], p2 = pool[i + 1];
          let p1Chance = matchProbMatrix[p1 + '|' + p2] || 0.5;
          let winner = rng() < p1Chance ? p1 : p2;
          if(pool.length === 2){
            finalsCounts[p1]++;
            finalsCounts[p2]++;
          }
          nextRound.push(winner);
        }
      }
      pool = nextRound;
    }

    if(pool.length === 1){
      champCounts[pool[0]]++;
    }
  }

  let results = {};
  players.forEach(p => {
    let topCutPct = Math.round((topCutCounts[p] / runs) * 100);
    let finalsPct = Math.round((finalsCounts[p] / runs) * 100);
    let champPct = +((champCounts[p] / runs) * 100).toFixed(1);

    let ml = champPct >= 50 
      ? `-${Math.round((champPct / (100 - champPct + 0.1)) * 100)}` 
      : (champPct > 0 ? `+${Math.round(((100 - champPct) / (champPct + 0.1)) * 100)}` : '+9900');

    let pPow = playerPowers[p] || { ovr: 70, elo: 1000, form: { w: 0, l: 0, gw: 0, gl: 0 } };

    let unplayed = (tourn.matches || []).filter(m => (m.a === p || m.b === p) && (m.as === '' || m.as == null));

      ovr: pPow.ovr,
      ovrObj: pPow.ovrObj,
      elo: pPow.elo,
      form: pPow.form,
      group: gName,
      avgGroupOvr,
      unplayedCount: unplayed.length,
      remainingOpponents,
      topCutPct,
      finalsPct,
      champPct,
      moneyline: ml,
      decimalOdds: dec

function getTournamentOddsChecksum(t){
  if(!t || !t.players) return '';
  let cut = advancePerGroup(t);
  return JSON.stringify({
    id: t.id,
    matches: (t.matches || []).map(m => [m.a, m.b, m.as, m.bs, m.group]),
    advance: cut,
    groups: t.groupAssignments || {},

function isOddsDarkHorse(x, i, totalCount = 8){
  if(!x || i < 3) return false;
  let cutoffRank = Math.max(5, Math.ceil(totalCount * 0.6));
  return (x.champPct >= 3.5) || (i < cutoffRank && x.champPct >= 2.0) || (x.topCutPct >= 14 && x.champPct >= 1.5);
}

function getOrComputeTournamentOdds(t){
  if(!t || !t.players || !t.players.length) return { data: {}, sim: {} };
  let key = getTournamentOddsChecksum(t);

  // 1. Instant return if tournament already has a persisted odds snapshot matching the current match scores
  if(t.oddsSnapshot && t.oddsSnapshot.key === key && t.oddsSnapshot.sim && t.oddsSnapshot.data){
    return t.oddsSnapshot;
  }

  // 2. Compute deterministically with a seeded PRNG based on the tournament state checksum
  let prng = createPrng(key + '-cherrymoon-odds-v1');
  let sim = simulateTournamentOdds(t, 2000, prng);
  let data = {};
  t.players.forEach(p => {
    if(isMathematicallyEliminated(t, p)) data[p] = 0;
    else if(isMathematicallyClinched(t, p)) data[p] = 100;
    else data[p] = Math.max(1, Math.min(99, sim[p]?.topCutPct ?? 50));
  });

  t.oddsSnapshot = { key, data, sim, updatedAt: Date.now() };

  // If this simulation is running before any match has a score recorded, record preTournamentOdds
  let isPreTournament = !(t.matches || []).some(m => m.as !== '' && m.as != null);
  if(isPreTournament || !t.preTournamentOdds){
    let list = Object.values(sim).sort((a, b) => b.champPct - a.champPct || b.topCutPct - a.topCutPct);
    let darkHorses = [];
    list.forEach((x, i) => {
      if(isOddsDarkHorse(x, i, list.length)){
        darkHorses.push(x.player);
      }
    });
    if(isPreTournament || !t.preTournamentOdds){
      t.preTournamentOdds = { sim, list, darkHorses };
    }
  }

  return t.oddsSnapshot;
}

function playoffOddsData(t){
  return getOrComputeTournamentOdds(t).data;
}

function getPreTournamentOdds(t, passedLeagueRecs = null){
  if(!t || !t.players || !t.players.length) return null;
  if(t.preTournamentOdds && t.preTournamentOdds.darkHorses && t.preTournamentOdds.darkHorses.length) return t.preTournamentOdds;

  let unplayedMatches = (t.matches || []).map(m => ({ ...m, as: '', bs: '' }));
  let preT = { ...t, matches: unplayedMatches, bracketManagerData: null, phase: 'group', champion: null };
  let prng = createPrng(t.id + '-pre-tournament-odds-v1');
  let sim = simulateTournamentOdds(preT, 2000, prng, passedLeagueRecs);
  let list = Object.values(sim).sort((a, b) => b.champPct - a.champPct || b.topCutPct - a.topCutPct);
  
  // Projected Dark Horses: outside top 3 favorites (rank 4+) with qualifying dark horse equity
  let darkHorses = [];
  list.forEach((x, i) => {
    if(isOddsDarkHorse(x, i, list.length)){
      darkHorses.push(x.player);
    }
  });
  t.preTournamentOdds = { sim, list, darkHorses };
  return t.preTournamentOdds;
}

var matchSearchTerm = '';

function resetGroupStageScores(){
  let t = (current === 'Tournament Detail' ? activeT() : ongoingT()) || activeT();
  if(!t || !moderator) return;
  let hasScores = (t.matches || []).some(m => m.as !== '' && m.as != null);
  if(!hasScores){
    alert('No group stage match scores have been reported yet.');
    return;
  }
  if(!confirm(`Reset all group stage scores for "${t.name}"? This will clear all reported match scores back to unplayed (0-0), while keeping your group placements, schedule, and participants intact.`)) return;

  (t.matches || []).forEach(m => {
    m.as = '';
    m.bs = '';
    m.date = 'TBD';
    delete m.completedAt;
  });
  delete t.finalStandings;
  scoreDrafts = {};
  persistLeague();
  render();
}

function renderMatchRow(m, i, t){
  let editable = moderator && t.status === 'ONGOING' && t.phase !== 'topcut';
  let a = m.a || 'TBD', b = m.b || 'TBD';
  let av = scoreDrafts['a'+i] ?? m.as ?? '';
  let bv = scoreDrafts['b'+i] ?? m.bs ?? '';
  let reported = m.as !== '' && m.as != null && m.bs !== '' && m.bs != null;

  let sa = reported ? +m.as : null;
  let sb = reported ? +m.bs : null;
  let aWon = reported && sa > sb;
  let bWon = reported && sb > sa;

  let aFace = profilePictures[a] ? `url('${esc(profilePictures[a])}')` : (teamCovers[a] ? `url('${esc(teamCovers[a])}')` : fallbackArt(a));
  let aLetter = (profilePictures[a] || teamCovers[a]) ? '' : esc((a || '?')[0]);

  let bFace = profilePictures[b] ? `url('${esc(profilePictures[b])}')` : (teamCovers[b] ? `url('${esc(teamCovers[b])}')` : fallbackArt(b));
  let bLetter = (profilePictures[b] || teamCovers[b]) ? '' : esc((b || '?')[0]);

  let aTeam = esc(teamName(t, a));
  let bTeam = esc(teamName(t, b));

  let label = m.custom ? 'Custom Match' : (m.group || 'Group Match');

  let headerBadge = '';
  if(reported){
    headerBadge = `<span style="color:#4bdd91;font-weight:900">FINAL ${m.date ? `· ${esc(m.date)}` : ''}</span>`;
  } else {
    headerBadge = `<span style="color:#ffd166;font-weight:800">AWAITING SCORE</span>`;
  }

  return `<article class="m-card ${reported ? 'reported' : ''}" data-players="${esc(a)}|${esc(b)}">
    <div class="m-card-head">
      <span>${esc(label)}</span>
      ${headerBadge}
    </div>
    <div class="m-card-body">
      <div class="m-slot ${aWon ? 'winner' : (bWon ? 'loser' : '')}">
        <span class="m-slot-avatar" style="background-image:${aFace}">${aLetter}</span>
        <div class="m-slot-info">
          <div class="m-slot-name-row">
            <span class="m-slot-name">${playerLink(a)}</span>
          </div>
          <span class="m-slot-team">${aTeam}</span>
        </div>
        ${editable ? `
          <input aria-label="${esc(a)} score" id="a${i}" class="m-slot-input" type="number" min="0" inputmode="numeric" placeholder="0" value="${av}">
        ` : `
          <span class="m-slot-score">${reported ? m.as : '—'}</span>
        `}
      </div>

      <div class="m-slot ${bWon ? 'winner' : (aWon ? 'loser' : '')}">
        <span class="m-slot-avatar" style="background-image:${bFace}">${bLetter}</span>
        <div class="m-slot-info">
          <div class="m-slot-name-row">
            <span class="m-slot-name">${playerLink(b)}</span>
          </div>
          <span class="m-slot-team">${bTeam}</span>
        </div>
        ${editable ? `
          <input aria-label="${esc(b)} score" id="b${i}" class="m-slot-input" type="number" min="0" inputmode="numeric" placeholder="0" value="${bv}">
        ` : `
          <span class="m-slot-score">${reported ? m.bs : '—'}</span>
        `}
      </div>
    </div>
    ${editable ? `
      <div class="m-card-foot">
        ${m.custom ? `<button class="btn ghost btn-sm" style="color:#ff969c;padding:3px 8px;font-size:10px" onclick="removeCustom(${i})">Remove</button>` : ''}
        ${reported ? `<button class="btn ghost btn-sm" style="padding:3px 8px;font-size:10px;color:#a09fa8" onclick="clearSingleScore(${i})">Clear</button>` : ''}
        <button class="btn btn-sm" style="padding:4px 12px;font-size:10px" onclick="score(${i})">Save Result</button>
      </div>
    ` : ''}
  </article>`;
}

function onMatchSearchInput(val){
  matchSearchTerm = val;
  render();
  let box = document.querySelector('#matchSearchBox');
  if(box){
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  }
}

function toggleMatchPlayerFilter(p){
  let idx = matchFilterPlayers.indexOf(p);
  if(idx > -1){
    matchFilterPlayers.splice(idx, 1);
  } else {
    matchFilterPlayers.push(p);
  }
  render();
}

function Matches(){
  let t = ongoingT();
  if(!t) return noTournament();
  viewTournament = t.id;

  let groups = Object.keys(groupsOf(t));
  let allMatches = t.matches || [];
  let totalMatches = allMatches.length;
  let reportedMatches = allMatches.filter(m => m.as !== '' && m.as != null && m.bs !== '' && m.bs != null).length;

  let visibleGroups = matchGroupTab === 'all' ? groups : groups.filter(g => g === matchGroupTab);

  let modActions = (moderator && t.status === 'ONGOING' && t.phase !== 'topcut') ? `
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">
      <button class="btn ghost" style="padding:6px 11px;font-size:11px" onclick="openGroupPlacementEditor()">👥 Arrange groups</button>
      <button class="btn ghost" style="padding:6px 11px;font-size:11px" onclick="addCustom()">⚡ Custom match</button>
      <button class="btn ghost" style="padding:6px 11px;font-size:11px;color:#ff9ba1;border-color:#4a242a" onclick="resetGroupStageScores()">➔ Reset group scores</button>
      <button class="btn" style="padding:6px 13px;font-size:11px" onclick="endGroupStage()">🏆 End group stage</button>
    </div>
  ` : '';

  let filterMatch = m => {
    if(matchStatusTab === 'pending' && m.as !== '' && m.as != null && m.bs !== '' && m.bs != null) return false;
    if(matchStatusTab === 'reported' && (m.as === '' || m.as == null || m.bs === '' || m.bs == null)) return false;
    if(matchFilterPlayers.length && !matchFilterPlayers.includes(m.a) && !matchFilterPlayers.includes(m.b)) return false;
    if(matchSearchTerm){
      let q = matchSearchTerm.toLowerCase();
      let aName = (m.a || '').toLowerCase(), bName = (m.b || '').toLowerCase();
      let aTeam = (profiles[m.a]?.team || '').toLowerCase(), bTeam = (profiles[m.b]?.team || '').toLowerCase();
      if(!aName.includes(q) && !bName.includes(q) && !aTeam.includes(q) && !bTeam.includes(q)) return false;
    }
    return true;
  };

  let playersList = t.players || [];

  return head('Matches', t.name + ' · group stage fixtures', modActions) + `
    <div class="match-layout-modern">
      <div class="match-controls-bar">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;width:100%">
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
            <div class="match-filter-tabs">
              <button class="m-tab ${matchGroupTab === 'all' ? 'active' : ''}" onclick="matchGroupTab='all';render()">All Groups</button>
              ${groups.map(g => `<button class="m-tab ${matchGroupTab === g ? 'active' : ''}" onclick="matchGroupTab='${g}';render()">${esc(g)}</button>`).join('')}
            </div>

            <span style="color:#4a4a58">|</span>

            <div class="match-filter-tabs">
              <button class="m-tab ${matchStatusTab === 'all' ? 'active' : ''}" onclick="matchStatusTab='all';render()">All (${totalMatches})</button>
              <button class="m-tab ${matchStatusTab === 'pending' ? 'active' : ''}" onclick="matchStatusTab='pending';render()">Pending (${totalMatches - reportedMatches})</button>
              <button class="m-tab ${matchStatusTab === 'reported' ? 'active' : ''}" onclick="matchStatusTab='reported';render()">Reported (${reportedMatches})</button>
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <input id="matchSearchBox" placeholder="🔍 Search trainer or team..." value="${esc(matchSearchTerm)}" oninput="onMatchSearchInput(this.value)" style="background:#0d0d12;border:1px solid #363644;border-radius:5px;padding:6px 12px;color:#f5f3f0;font-size:11px;min-width:180px">
            ${matchFilterPlayers.length || matchSearchTerm ? `<button class="btn ghost btn-sm" style="padding:6px 10px;font-size:10px" onclick="matchFilterPlayers=[];matchSearchTerm='';render()">Clear Filters</button>` : ''}
          </div>
        </div>

        ${playersList.length ? `
          <div class="match-player-filter-bar" style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;width:100%;margin-top:10px;padding-top:10px;border-top:1px solid #23232c">
            <span style="font-size:10px;font-weight:800;color:#8e8c95;letter-spacing:.6px;text-transform:uppercase;margin-right:2px">Filter by Trainer:</span>
            <button class="m-player-chip ${matchFilterPlayers.length === 0 ? 'active' : ''}" onclick="matchFilterPlayers=[];render()">All Trainers</button>
            ${playersList.map(p => {
              let isSel = matchFilterPlayers.includes(p);
              let face = profilePictures[p] ? `url('${esc(profilePictures[p])}')` : (teamCovers[p] ? `url('${esc(teamCovers[p])}')` : fallbackArt(p));
              let letter = (profilePictures[p] || teamCovers[p]) ? '' : esc((p || '?')[0]);
              return `<button class="m-player-chip ${isSel ? 'active' : ''}" onclick="toggleMatchPlayerFilter('${jsArg(p)}')">
                <span class="m-player-chip-face" style="background-image:${face}">${letter}</span>
                ${esc(p)}
              </button>`;
            }).join('')}
          </div>
        ` : ''}
      </div>

      <div>
        ${visibleGroups.map(g => {
          let gMatches = (t.matches || []).filter(m => (m.group || 'Group A') === g);
          let filtered = gMatches.filter(filterMatch);
          let gReported = gMatches.filter(m => m.as !== '' && m.as != null && m.bs !== '' && m.bs != null).length;
          let isDone = gMatches.length > 0 && gReported === gMatches.length;

          return `
            <section class="card round-list" style="margin-bottom:20px;padding:16px 18px;background:#141419;border-color:#2c2c36">
              <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid #252530;padding-bottom:12px;margin-bottom:16px">
                <div style="display:flex;align-items:center;gap:10px">
                  <span style="font:900 22px 'Barlow Condensed';letter-spacing:.6px;color:#f5f3f0;text-transform:uppercase">${esc(g)}</span>
                  <span class="tag ${isDone ? 'safe' : 'hunt'}">${gReported}/${gMatches.length} REPORTED</span>
                </div>
                <div style="font-size:11px;color:#8e8c95;font-weight:700">
                  ${isDone ? '✨ Group Stage Complete' : `${gMatches.length - gReported} matches remaining`}
                </div>
              </div>

              <div class="match-grid-modern">
                ${filtered.map(m => renderMatchRow(m, (t.matches || []).indexOf(m), t)).join('') || '<div class="empty" style="grid-column:1/-1;padding:20px">No matches found matching the current filters.</div>'}
              </div>
            </section>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function matchesView(t=activeT(), editable=moderator){
  if(!t) return '';
  let groups = Object.keys(groupsOf(t));
  return `<div style="display:grid;gap:20px">
    ${groups.map(g => {
      let gMatches = groupMatches(t, g);
      let gReported = gMatches.filter(m => m.as !== '' && m.as != null && m.bs !== '' && m.bs != null).length;
      let isDone = gMatches.length > 0 && gReported === gMatches.length;
      return `<section class="card round-list" style="margin-bottom:0;padding:16px 18px;background:#141419;border-color:#2c2c36">
        <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252530;padding-bottom:12px;margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font:900 20px 'Barlow Condensed';letter-spacing:.5px;color:#f5f3f0;text-transform:uppercase">${esc(g)}</span>
            <span class="tag ${isDone ? 'safe' : 'hunt'}">${gReported}/${gMatches.length} REPORTED</span>
          </div>
          <span style="font-size:11px;color:#8e8c95;font-weight:700">${gMatches.length - gReported === 0 ? 'All Matches Complete' : `${gMatches.length - gReported} remaining`}</span>
        </div>
        <div class="match-grid-modern">
          ${gMatches.map(m => renderMatchRow(m, (t.matches || []).indexOf(m), t)).join('') || '<div class="empty" style="grid-column:1/-1">No matches scheduled.</div>'}
        </div>
      </section>`;
    }).join('')}
  </div>`;
}
function getStand(t=activeT(),group=null){
  let buckets=groupsOf(t),g=group||Object.keys(buckets)[0],members=buckets[g]||t.players,s={};
  members.forEach(p=>s[p]={p,w:0,l:0,gw:0,gl:0,h2h:0,results:{}});
  groupMatches(t,g).filter(m=>m.as!==''&&m.as!=null&&m.bs!==''&&m.bs!=null).forEach(m=>{
    let a=s[m.a],b=s[m.b];
    if(!a||!b)return;
    a.gw+=+m.as;a.gl+=+m.bs;b.gw+=+m.bs;b.gl+=+m.as;
    if(+m.as>+m.bs){a.w++;b.l++;a.results[m.b]=1;b.results[m.a]=0}
    else if(+m.bs>+m.as){b.w++;a.l++;b.results[m.a]=1;a.results[m.b]=0}
  });
  let list=Object.values(s);
  list.sort((a,b)=>{
    let basic=b.w-a.w||b.gw-a.gw||(b.gw-b.gl)-(a.gw-a.gl);
    if(basic)return basic;
    let ah=a.results[b.p],bh=b.results[a.p];
    if(ah!==undefined&&bh!==undefined)return bh-ah;
    return a.p.localeCompare(b.p);
  });
  let manual=t.manualStandings?.[g];
  if(Array.isArray(manual)&&manual.length===list.length&&manual.every(p=>members.includes(p))){
    let rank=Object.fromEntries(manual.map((p,i)=>[p,i]));
    list.sort((a,b)=>rank[a.p]-rank[b.p]);
  }
  return list;
}

function standingTable(t, g){
  let list = getStand(t, g);
  let cut = advancePerGroup(t);
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid #282834">
      <span style="font:900 20px 'Barlow Condensed';letter-spacing:.5px;color:#f5f3f0;text-transform:uppercase">${esc(g)}</span>
      <span style="font-size:10px;font-weight:800;color:var(--amber);letter-spacing:.6px">TOP ${cut} ADVANCE</span>
    </div>
    <table class="standings">
      <thead>
        <tr>
          <th style="width:36px;text-align:center">#</th>
          <th>Trainer / Team</th>
          <th style="text-align:center;white-space:nowrap">OVR</th>
          <th style="text-align:center;white-space:nowrap">W-L</th>
          <th style="text-align:center;white-space:nowrap">GW</th>
          <th style="text-align:center;white-space:nowrap">GD</th>
          <th style="text-align:center;white-space:nowrap">H2H</th>
          <th style="text-align:center;white-space:nowrap">Status</th>
        </tr>
      </thead>
      <tbody>
        ${list.map((x, i) => {
          let p = x.p;
          let ovrObj = calculatePlayerOVR(p);
          let isCutoff = (i === cut);
          let statusTag = '';
          if(isMathematicallyClinched(t, p)){
            statusTag = '<span class="tag safe">CLINCHED</span>';
          } else if(isMathematicallyEliminated(t, p)){
            statusTag = '<span class="tag out">ELIMINATED</span>';
          } else {
            statusTag = i < cut ? '<span class="tag hunt">IN CUT</span>' : '<span class="tag hunt">HUNT</span>';
          }
          let gd = x.gw - x.gl;
          let gdStr = (gd > 0 ? '+' : '') + gd;
          return `
            <tr class="${isCutoff ? 'cutoff-row' : ''} ${i < cut ? 'safe' : ''}">
              <td class="rank" style="text-align:center">${i + 1}</td>
              <td class="player">
                ${playerLink(p)}
                <span class="team">${esc(teamName(t, p))}</span>
              </td>
              <td style="text-align:center">${ovrObj.badgeHtml}</td>
              <td style="text-align:center;white-space:nowrap;font-weight:800">${x.w}-${x.l}</td>
              <td style="text-align:center;white-space:nowrap">${x.gw}</td>
              <td style="text-align:center;white-space:nowrap">${gdStr}</td>
              <td style="text-align:center;white-space:nowrap">${x.h2h}</td>
              <td style="text-align:center">${statusTag}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

function openRankingEditor(){
  let t=ongoingT();if(!moderator||!t)return;
  let groups=Object.keys(groupsOf(t));
  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:760px"><div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Arrange standings</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="sub">Drag a trainer onto another trainer in the same group to swap their displayed rank. This manual order is also used for qualification and Top Cut seeding.</p><div class="group-placement-grid">${groups.map(g=>`<section class="group-dropzone rank-dropzone" data-rank-group="${g}"><div class="eyebrow">${g}</div>${getStand(t,g).map((x,i)=>`<button class="group-placement-drag rank-placement-drag" draggable="true" data-player="${x.p}" data-rank-group="${g}"><span style="color:#aaa;margin-right:10px">${i+1}</span>${x.p}</button>`).join('')}</section>`).join('')}</div><div class="creator-actions"><button class="btn ghost" onclick="resetManualStandings()">Return to automatic order</button></div></div></div>`;
}

function swapStandingRanks(first,second,group){
  let t=ongoingT();if(!t||!first||!second||first===second||!moderator)return;
  let ordered=getStand(t,group).map(x=>x.p),a=ordered.indexOf(first),b=ordered.indexOf(second);
  if(a<0||b<0)return;
  [ordered[a],ordered[b]]=[ordered[b],ordered[a]];
  t.manualStandings=t.manualStandings||{};
  t.manualStandings[group]=ordered;
  persistLeague();
  openRankingEditor();
  render();
}

function resetManualStandings(){
  let t=ongoingT();if(!t)return;
  delete t.manualStandings;
  persistLeague();
  closeModal();
  render();
}

function calculateLeagueRivalries(allMatches){
  let pairs = {};
  (allMatches||[]).forEach(m => {
    if(!m.a || !m.b || m.a === m.b) return;
    let [p1, p2] = [m.a, m.b].sort();
    let key = `${p1}|||${p2}`;
    if(!pairs[key]){
      pairs[key] = { p1, p2, total: 0, p1Wins: 0, p2Wins: 0, playoffMatches: 0, p1PlayoffWins: 0, p2PlayoffWins: 0, matches: [] };
    }
    pairs[key].total++;
    if(m.winner === p1) pairs[key].p1Wins++;
    else if(m.winner === p2) pairs[key].p2Wins++;

    if(m.stage === 'topcut'){
      pairs[key].playoffMatches++;
      if(m.winner === p1) pairs[key].p1PlayoffWins++;
      else if(m.winner === p2) pairs[key].p2PlayoffWins++;
    }
    pairs[key].matches.push(m);
  });

  let list = Object.values(pairs);
  if(!list.length) return null;

  // 1. Most Played Rivalry (min 5 games if possible, fallback to max played >= 2)
  let playedEligible = list.filter(r => r.total >= 5);
  if(!playedEligible.length) playedEligible = list.filter(r => r.total >= 3);
  if(!playedEligible.length) playedEligible = list.filter(r => r.total >= 2);
  playedEligible.sort((a, b) => b.total - a.total || Math.abs(a.p1Wins - a.p2Wins) - Math.abs(b.p1Wins - b.p2Wins));
  let mostPlayed = playedEligible[0] || null;

  // 2. Most One-Sided Rivalry (min 3 games, highest win differential / dominance)
  let oneSidedEligible = list.filter(r => r.total >= 3);
  if(!oneSidedEligible.length) oneSidedEligible = list.filter(r => r.total >= 2);
  oneSidedEligible.sort((a, b) => {
    let aDiff = Math.abs(a.p1Wins - a.p2Wins) / a.total;
    let bDiff = Math.abs(b.p1Wins - b.p2Wins) / b.total;
    return bDiff - aDiff || b.total - a.total;
  });
  let mostOneSided = oneSidedEligible[0] || null;

  // 3. Most Contested / Heated Rivalry (closest to 50/50 winrate, min 3 games, prioritized by total games)
  let contestedEligible = list.filter(r => r.total >= 3);
  if(!contestedEligible.length) contestedEligible = list.filter(r => r.total >= 2);
  contestedEligible.sort((a, b) => {
    let aDiff = Math.abs(a.p1Wins - a.p2Wins);
    let bDiff = Math.abs(b.p1Wins - b.p2Wins);
    return aDiff - bDiff || b.total - a.total;
  });
  let mostContested = contestedEligible[0] || null;

  // 4. Peak Playoff Rivalry
  let playoffEligible = [...list].sort((a, b) => (b.playoffMatches * 2 + b.total) - (a.playoffMatches * 2 + a.total));
  let peakPlayoff = (playoffEligible[0]?.playoffMatches > 0) ? playoffEligible[0] : (list.find(r => r !== mostPlayed && r !== mostOneSided && r !== mostContested) || mostPlayed);

  return { mostPlayed, mostOneSided, mostContested, peakPlayoff, totalRivalries: list.length };
}

function Standings(){
  let t=ongoingT();
  if(!t){
    let {statsByPlayer, records}=calculateLeagueRecords();
    let {allMatches}=getChronologicalMatches();
    let r=recapRankings();
    let rivalries = calculateLeagueRivalries(allMatches);

   Same editor, same teamCovers storage — only the file handler

function shrinkImage(file,maxW,quality){return new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=()=>reject(new Error('read'));r.onload=()=>{let i=new Image();i.onerror=()=>reject(new Error('decode'));i.onload=()=>{let w=Math.min(maxW,i.width),h=Math.round(i.height*(w/i.width)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};i.src=r.result};r.readAsDataURL(file)})}

/* --- reading the sheet ------------------------------------------- */
function parseCSV(text){
  let rows=[],row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    let c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else if(c!=='\r')cell+=c;
  }
  row.push(cell);rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()))
}
function notSummary(s){return !/^(total|sum|points?|cost|tier|name|pok[eé]mon|team|player|trainer|round|banned|available|drafted|remaining|budget|notes?)\b/i.test(String(s).trim())}
function looksLikeMon(s){s=String(s).trim();return /^[A-Za-z][A-Za-z0-9''.\- é:]{1,26}$/.test(s)&&s.split(/\s+/).length<=3&&notSummary(s)}
function poolScore(items){return items.filter(x=>looksLikeMon(x.name)&&x.cost>=0&&x.cost<=60).length}
function dedupe(items){let seen=new Set();return items.filter(x=>{let k=x.name.toLowerCase();if(seen.has(k)||!x.name)return false;seen.add(k);return true})}
function poolFromRows(rows){
  let candidates=[];
  /* a. header row with a name column and a cost column */
  for(let r=0;r<Math.min(rows.length,12);r++){
    let nameCol=rows[r].findIndex(c=>/^(pok[eé]mon|name|species|mon)s?\b/i.test(c));
    let costCol=rows[r].findIndex(c=>/^(cost|points?|pts|price|value|tier)s?\b/i.test(c));
    if(nameCol>-1&&costCol>-1){
      let items=[];
      for(let i=r+1;i<rows.length;i++){
        let n=rows[i][nameCol]||'',c=parseFloat(String(rows[i][costCol]||'').replace(/[^0-9.]/g,''));
        if(n&&Number.isFinite(c)&&looksLikeMon(n))items.push({name:n,cost:c});
      }
      candidates.push({items:dedupe(items),mode:'columns'});
    }
  }
  /* b. tier grid — a numeric header cell with names listed underneath */
  let tier=[];
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){
    let cell=String(rows[r][c]||'').trim();
    let m=cell.match(/^\$?(\d{1,2})\s*(pts?|points?)?$/i)||cell.match(/^tier\s*(\d{1,2})$/i);
    if(!m)continue;
    let cost=+m[1];
    for(let i=r+1;i<rows.length;i++){
      let v=(rows[i]||[])[c]||'';
      if(!v)break;
      if(/^\$?\d{1,2}\s*(pts?|points?)?$/i.test(v)||/^tier\s*\d{1,2}$/i.test(v))break;
      if(looksLikeMon(v))tier.push({name:v,cost});
    }
  }
  candidates.push({items:dedupe(tier),mode:'tiers'});
  /* c. name cell with a number next to it */
  let pairs=[];
  rows.forEach(r=>r.forEach((v,c)=>{
    let next=String(r[c+1]??'');
    if(looksLikeMon(v)&&/^\d{1,2}(\.\d+)?$/.test(next))pairs.push({name:v,cost:+next});
  }));
  candidates.push({items:dedupe(pairs),mode:'pairs'});
  candidates.sort((a,b)=>poolScore(b.items)-poolScore(a.items));
  return candidates[0]||{items:[],mode:'none'}
}
function applyPool(items,mode,source){
  items=dedupe(items.filter(x=>x.name&&Number.isFinite(x.cost))).sort((a,b)=>b.cost-a.cost||a.name.localeCompare(b.name));
  draftPool={items,syncedAt:Date.now(),source:source||'Google Sheet',mode};
  try{localStorage.setItem('draftdex-pool',JSON.stringify(draftPool))}catch{}
  if(moderator)persistLeague();
  return items.length
}
async function syncDraftPool(fromSettings){
  if(fromSettings){let v=document.querySelector('#boardInput')?.value.trim();if(v&&/^https?:\/\//i.test(v)){boardLink=v;localStorage.setItem('draftdex-board',boardLink)}}
  let s=sheetIds(boardLink);
  if(!s.id){alert('Add a Google Sheets link first.');return}
  poolStatus='Reading the sheet...';if(!fromSettings)render();
  let urls=s.published
    ?[`https://docs.google.com/spreadsheets/d/e/${s.id}/pub?output=csv${s.gid?'&gid='+s.gid:''}`]
    :[`https://docs.google.com/spreadsheets/d/${s.id}/gviz/tq?tqx=out:csv${s.gid?'&gid='+s.gid:''}`,
      `https://docs.google.com/spreadsheets/d/${s.id}/gviz/tq?tqx=out:csv`,
      `https://docs.google.com/spreadsheets/d/${s.id}/export?format=csv${s.gid?'&gid='+s.gid:''}`];
  for(let url of urls){
    try{
      let res=await fetch(url,{cache:'no-store'});
      if(!res.ok)continue;
      let text=await res.text();
      if(/^\s*</.test(text))continue;
      window.poolRows=parseCSV(text);
      let found=poolFromRows(window.poolRows);
      let n=applyPool(found.items,found.mode,'Google Sheet');
      poolStatus=n?`Loaded ${n} Pokémon from the sheet.`:'The sheet loaded but no Pokémon/cost pairs were recognised — use "Fix columns".';
      closeModal();boardTab='My Mock Draft';render();
      if(!n)openPoolColumns();
      return
    }catch(e){}
  }
  poolStatus='';
  closeModal();
  alert('The sheet could not be read from the browser.\n\nEither set Share → "Anyone with the link · Viewer", or in Google Sheets use File → Share → Publish to web → CSV and paste that link here.\n\nYou can also paste the sheet data manually.');
  openPasteCSV()
}

function importPastedPool(){

function nameColumnCandidates(rows){
  let width=Math.max(0,...rows.map(r=>r.length)),cols=[];
  for(let c=0;c<width;c++){
    let names=rows.map(r=>(r[c]||'').trim()).filter(v=>looksLikeMon(v));
    if(names.length>=2)cols.push({col:c,hits:names.length,sample:[...new Set(names)].slice(0,3).join(', ')});
  }
  return cols.sort((a,b)=>b.hits-a.hits)
}
/* Work out the cost for a chosen name column without asking the user:
   first look for the numeric column that lines up with it, then fall
   back to a tier header sitting above the names in the same column. */
function costsForNameColumn(rows,nameCol){
  let rowsWithNames=rows.map((r,i)=>[i,(r[nameCol]||'').trim()]).filter(([,n])=>looksLikeMon(n));
  if(!rowsWithNames.length)return {items:[],via:'none'};
  let tally={};
  rowsWithNames.forEach(([i])=>(rows[i]||[]).forEach((v,c)=>{
    if(c===nameCol)return;
    let num=parseFloat(String(v).replace(/[^0-9.]/g,''));
    if(Number.isFinite(num)&&num>=0&&num<=60&&/\d/.test(String(v)))tally[c]=(tally[c]||0)+1;
  }));
  let best=Object.entries(tally).sort((a,b)=>b[1]-a[1]||Math.abs(a[0]-nameCol)-Math.abs(b[0]-nameCol))[0];
  if(best&&best[1]>=rowsWithNames.length*.6){
    let c=+best[0];
    return {items:rowsWithNames.map(([i,n])=>({name:n,cost:parseFloat(String(rows[i][c]).replace(/[^0-9.]/g,''))})).filter(x=>Number.isFinite(x.cost)),
            via:'the numbers in column '+String.fromCharCode(65+c)};
  }
  let items=[];
  rowsWithNames.forEach(([i,n])=>{
    for(let up=i-1;up>=0;up--){
      let v=String((rows[up]||[])[nameCol]||'').trim();
      if(!v)continue;
      let m=v.match(/^\$?(\d{1,2})\s*(pts?|points?)?$/i)||v.match(/^tier\s*(\d{1,2})$/i);
      if(m){items.push({name:n,cost:+m[1]});return}
      if(looksLikeMon(v))continue;
      return
    }
  });
  return {items,via:'the tier headings above each name'}
}
function openPoolColumns(){
  let rows=window.poolRows||[];
  if(!rows.length){openPasteCSV();return}
  let cols=nameColumnCandidates(rows);
  if(!cols.length){closeModal();alert('No column in that sheet looks like a list of Pokémon. Try the paste option, or point the board link at the tab that holds the costs.');openPasteCSV();return}
  let opts=cols.map((x,i)=>`<option value="${x.col}" ${i?'':'selected'}>${esc(x.sample)}${x.hits>3?' ...':''} · ${x.hits} name${x.hits===1?'':'s'}</option>`).join('');
  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:540px">
    <div class="modal-head"><div><div class="eyebrow">Draft pool</div><h2>Which list is the Pokémon?</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <p class="sub">Pick the list that holds the Pokémon names. Their costs are read automatically from the sheet.</p>
    <div class="field"><label>Pokémon list</label><select id="poolNameCol">${opts}</select></div>
    <div class="creator-actions"><button class="btn" onclick="applyPoolColumns()">Load pool</button></div></div></div>`
}
function applyPoolColumns(){
  let rows=window.poolRows||[],nameCol=+document.querySelector('#poolNameCol').value;
  let found=costsForNameColumn(rows,nameCol),items=found.items,note=found.via;
  /* A tier heading means the sheet is a grid of cost columns, so pull the
     rest of the tiers too rather than loading only the column they clicked. */
  if(found.via.indexOf('tier')>-1){
    let all=[...items];
    nameColumnCandidates(rows).forEach(x=>{
      if(x.col===nameCol)return;
      let extra=costsForNameColumn(rows,x.col);
      if(extra.via.indexOf('tier')>-1)all.push(...extra.items);
    });
    if(all.length>items.length){items=all;note='the tier headings above each column'}
  }
  let count=applyPool(items,'names+auto-cost','Google Sheet');
  closeModal();
  poolStatus=count?`Loaded ${count} Pokémon, costs read from ${note}.`:'Those names loaded but no costs lined up with them. Try the paste option so the costs come across too.';
  if(!count)openPasteCSV();else boardTab='My Mock Draft';
  render()
}

function accountKey(){return window.currentAccount?.username||sessionUser?.id||'guest'}
function ensureMock(){
  let key=accountKey();
  if(mockDraft.key===key)return mockDraft;
  let saved=null;try{saved=JSON.parse(localStorage.getItem('draftdex-mock-'+key)||'null')}catch{}
  mockDraft={key,picks:saved?.picks||[],budget:saved?.budget??100,slots:saved?.slots??10};
  return mockDraft
}
function saveMock(){try{localStorage.setItem('draftdex-mock-'+mockDraft.key,JSON.stringify(mockDraft))}catch{}}
function mockSpent(){return ensureMock().picks.reduce((n,x)=>n+(+x.cost||0),0)}
function draftMon(name,cost){
  let m=ensureMock();
  if(m.picks.some(x=>x.name.toLowerCase()===String(name).toLowerCase()))return;
  if(m.picks.length>=m.slots){poolStatus=`That is ${m.slots} Pokémon already — raise the roster size to add more.`;refreshMock();return}
  m.picks.push({name,cost:+cost||0});saveMock();poolStatus='';refreshMock()
}
function undraftMon(i){let m=ensureMock();m.picks.splice(i,1);saveMock();refreshMock()}
function clearMock(){let m=ensureMock();if(!m.picks.length)return;m.picks=[];saveMock();refreshMock()}
function setMockNumber(field,value){let m=ensureMock();m[field]=Math.max(1,+value||0);saveMock();refreshMock()}
function copyMock(){

  let text=m.picks.map(x=>`${x.name} — ${x.cost}`).join('\n')+`\nTotal: ${mockSpent()} / ${m.budget}`;

      <span style="flex:1;min-width:0">${esc(m)}</span>
      ${canEdit?`
        <div style="display:flex;align-items:center;gap:2px;flex:none">
          <button class="swap-icon" title="Replace ${esc(m)}" onclick="event.stopPropagation();openReplaceHistoryMonModal('${jsArg(p)}',${i},${j})">⇄</button>
          <button class="x" title="Remove ${esc(m)}" onclick="event.stopPropagation();removeHistoryMon('${jsArg(p)}',${i},${j})">×</button>

    </div>`).join('')}</div>`:`<div class="pf-empty">No Pokémon recorded for this team.</div>`}
    ${moderator?`<div class="poke-search" style="margin-top:11px"><input id="historyMon${i}" placeholder="Add Pokémon to this team"><button class="save" onclick="addHistoryMon('${jsArg(p)}',${i})">Add</button></div>`:''}
  </div>`).join('')
}

/* --- past tournaments (automatic & expandable) ---
   Everything here is derived from tournament data that already exists:
   the same record maths the stats engine uses, plus the finish worked
   out from the champion, the bracket cache, and the group standings. */
function tournamentFinish(t,p){
  if(!t || !p) return {place:999,label:'—',note:'Participating',cls:''};
  if(t.champion===p) return {place:1,label:'1st',note:'Champion',cls:'gold'};

  // 1. Bracket Model Data (Double Elimination Stages)
  if(t.bracketManagerData || t.phase==='topcut' || t.status==='COMPLETE'){
    try{
      let model=getTournamentTopCutModel(t);
      if(model && (model.wbRounds?.length || model.lbRounds?.length)){
        let qualifiers = qualified(t).map(x => x.p);
        if(t.bracketManagerData?.participant?.length){
          qualifiers = t.bracketManagerData.participant.map(pt => pt.name);
        }
        let inBracket = qualifiers.includes(p);

        if(inBracket){
          let gf = model.gfMatches || [];
          let lastGf = gf[gf.length - 1];
          let gf1 = gf[0];

          if(lastGf?.isDone && lastGf.winner === p){
            return {place:1, label:'1st', note:'Champion', cls:'gold'};
          }
          if((lastGf?.isDone && lastGf.loser === p) || (gf1?.isDone && !lastGf?.isDone && gf1.loser === p && gf.length === 1)){
            return {place:2, label:'2nd', note:'Runner-up', cls:'silver'};
          }

          // Losers Bracket Rounds (checked in reverse from Final to R1)
          let lbRounds = model.lbRounds || [];
          let lbFinal = lbRounds.find(r => r.title.toLowerCase().includes('losers final') || r.name.toLowerCase().includes('round 4'))?.matches?.[0];
          if(lbFinal?.isDone && lbFinal.loser === p){
            return {place:3, label:'3rd', note:'3rd Place', cls:'bronze'};
          }

          let lbSemi = lbRounds.find(r => r.title.toLowerCase().includes('semifinal') || r.name.toLowerCase().includes('round 3'))?.matches?.[0];
          if(lbSemi?.isDone && lbSemi.loser === p){
            return {place:4, label:'4th', note:'4th Place', cls:'cut'};
          }

          let lbR2 = lbRounds.find(r => r.title.toLowerCase().includes('lb round 2') || r.name.toLowerCase().includes('round 2'))?.matches || [];
          if(lbR2.some(m => m.isDone && m.loser === p)){
            return {place:5, label:'Top 6', note:'5th-6th Place', cls:'cut'};
          }

          let lbR1 = lbRounds.find(r => r.title.toLowerCase().includes('lb round 1') || r.name.toLowerCase().includes('round 1'))?.matches || [];
          if(lbR1.some(m => m.isDone && m.loser === p)){
            let count = qualifiers.length;
            if(count <= 4) return {place:4, label:'4th', note:'4th Place', cls:'cut'};
            return {place:7, label:'Top 8', note:'7th-8th Place', cls:'cut'};
          }

          // Active / undefeated so far in Top Cut
          return {place:3, label:'Top Cut', note: t.status === 'COMPLETE' ? 'Top Cut' : 'In Top Cut', cls:'cut'};
        }
      }
    }catch(e){}
  }

  // 2. Legacy / Cached Top Cut
  let cache=t.topCutCache,inCut=false;
  if(cache&&Array.isArray(cache.participants)&&cache.participants.length)inCut=cache.participants.includes(p);
  else if(cache&&Array.isArray(cache.results))inCut=cache.results.some(x=>x.p1===p||x.p2===p);
  else if(t.finalStandings)inCut=Object.values(t.finalStandings).some(arr=>arr.slice(0,advancePerGroup(t)).includes(p));

  if(inCut){
    let isChamp=(t.champion===p||(cache?.champion===p));
    if(isChamp) return {place:1,label:'1st',note:'Champion',cls:'gold'};

    let losses=(cache?.results||[]).filter(m=>(m.p1===p&&+m.s2>+m.s1)||(m.p2===p&&+m.s1>+m.s2));
    if(!losses.length){
      return {place:3,label:'Top Cut',note:t.status==='COMPLETE'?'Top Cut':'In Top Cut',cls:'cut'};
    }

    losses.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
    let lastLoss=losses[0];
    let title=(lastLoss.title||'').toLowerCase();

    if(title.includes('grand final')||title.includes('bracket reset')){
      return {place:2,label:'2nd',note:'Runner-up',cls:'silver'};
    }
    if(title.includes('losers final')){
      return {place:3,label:'3rd',note:'3rd Place',cls:'bronze'};
    }
    if(title.includes('losers round 3')||title.includes('losers semifinal')){
      return {place:4,label:'4th',note:'4th Place',cls:'cut'};
    }
    if(title.includes('losers round 2')){
      return {place:5,label:'Top 6',note:'5th-6th Place',cls:'cut'};
    }
    if(title.includes('losers round 1')){
      let count=(cache?.participants||[]).length;
      if(count<=4){
        return {place:4,label:'4th',note:'4th Place',cls:'cut'};
      }
      return {place:7,label:'Top 8',note:'7th-8th Place',cls:'cut'};
    }
    if(title.includes('winners final')){
      return {place:3,label:'Top 3',note:'Winners Finalist',cls:'bronze'};
    }
    return {place:3,label:'Top Cut',note:lastLoss.title||'Top Cut',cls:'cut'};
  }

  /* group stage only — report where they placed overall/in group */
  let buckets=groupsOf(t);
  let totalGroups=Object.keys(buckets).length;
  let entry=Object.entries(buckets).find(([,ps])=>ps.includes(p));
  if(entry){
    try{
      let gName=entry[0];
      let finalArr=t.finalStandings?.[gName]||t.manualStandings?.[gName];
      let idx=-1;
      if(Array.isArray(finalArr)&&finalArr.includes(p)){
        idx=finalArr.indexOf(p);
      }else{
        let stand=getStand(t,gName);
        idx=stand.findIndex(x=>x.p===p);
      }
      if(idx>-1){
        let cutPerGroup=Number(t.advancePerGroup||2);
        let label='';
        if(totalGroups>1){
          let minRank=(cutPerGroup*totalGroups)+(idx-cutPerGroup)*totalGroups+1;
          let maxRank=minRank+totalGroups-1;
          if(minRank>0&&maxRank>0&&idx>=cutPerGroup){
            label=(minRank===maxRank)?ordinal(minRank):(minRank+'th-'+maxRank+'th');
          }else{
            label=ordinal(idx+1);
          }
        }else{
          label=ordinal(idx+1);
        }
        return {
          place: 100+idx,
          label: label,
          note: (totalGroups>1?gName+' ('+ordinal(idx+1)+') · ':'')+(t.status==='COMPLETE'?'Group Stage':'Current Rank'),
          cls: ''
        };
      }
    }catch(e){}
  }
  return {place:999,label:'—',note:t.status==='COMPLETE'?'Group Stage':'Participating',cls:''};
}
function ordinal(n){let s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function pastTournaments(p){

var _calculatingRecords = false;
function calculatePlayerOVR(p, leagueData=null){
  let career=playerCareerStats(p);
  let recs = (leagueData && leagueData.statsByPlayer) ? leagueData : null;
  if(!recs && !_calculatingRecords && typeof calculateLeagueRecords === 'function'){
    try {
      _calculatingRecords = true;
      recs = calculateLeagueRecords();
    } catch(e){}
    finally {
      _calculatingRecords = false;
    }
  }
  let s=recs?.statsByPlayer?.[p]||{wins:career.wins,losses:career.losses,maxWinStreak:0,currentWinStreak:0,currentLossStreak:0,bestGD:0,tournamentFinishes:[]};
  let wins = (s.wins !== undefined) ? s.wins : career.wins;
  let losses = (s.losses !== undefined) ? s.losses : career.losses;
  let total = wins + losses;
  let overallWinPct = total > 0 ? (wins / total) * 100 : (career.winPct || 50);

  if(total===0){
    return {
      ovr:70,
      tier:'silver',
      tierName:'Silver',
      tierUpper:'SILVER',
      color:'#d0d0dc',
      badgeCls:'ovr-silver',
      badgeHtml:'<span class="ovr-badge-pill ovr-silver">70</span>',
      subStats:{win:50,tit:0,cut:0,strk:0}
    };
  }

  // Baseline: 72 (Forgiving in lower overalls; average players sit safely in Silver ~72-76)
  let base=72;

  // 1. Dynamic Recent Tournament Form (Balanced recency with sample size anchoring)
  // Live Tournament Rule: Ratings only update after group stage completes (top cut starts) or tournament completes
  let allTfs = s.tournamentFinishes || [];
  let tf = allTfs.filter(item => {
    let t = item.tournament;
    if(!t) return false;
    if(t.status === 'COMPLETE') return true;
    let isCompleteOrTopCut = (t.phase === 'topcut' || !!t.bracketManagerData || item.gComplete);
    return isCompleteOrTopCut;
  });
  let lastTFinish = tf[tf.length - 1] || null;
  let recentWins = lastTFinish ? (lastTFinish.w || 0) : 0;
  let recentLosses = lastTFinish ? (lastTFinish.l || 0) : 0;
  let recentTotal = recentWins + recentLosses;
  let recentWinPct = recentTotal > 0 ? (recentWins / recentTotal) * 100 : overallWinPct;

  // Balanced Volatility: Scale recent weight by sample size (up to max 38%) so a 3-game losing stint doesn't tank career
  let recentWeight = (recentTotal > 0) ? Math.min(0.38, Math.max(0.12, recentTotal * 0.06)) : 0;
  let effectiveWinPct = (recentTotal > 0)
    ? (recentWinPct * recentWeight + overallWinPct * (1 - recentWeight))
    : overallWinPct;

  let winRateDiff = 0;
  if(effectiveWinPct >= 50){
    winRateDiff = (effectiveWinPct - 50) * 0.28;
  } else {
    // Gentle floor: losing games drops rating moderately, not a plummet
    winRateDiff = (effectiveWinPct - 50) * 0.20;
  }

  // 2. Playoff Placements & Championship Hardware (Scaled by tournament field size & progression depth)
  let sortedT = typeof sortedTournamentsChronological === 'function' ? sortedTournamentsChronological() : Object.values(tournamentData);
  let latestCompletedT = sortedT.filter(t => t.status === 'COMPLETE').pop() || sortedT[sortedT.length - 1] || null;
  let isReigningChamp = (latestCompletedT && latestCompletedT.champion === p);

  let lastPlace = lastTFinish?.finish?.place || (isReigningChamp ? 1 : 999);
  let lastT = lastTFinish?.tournament || latestCompletedT;
  let lastFieldSize = Math.max(4, lastT?.players?.length || Object.keys(profiles).length || 8);
  let lastFieldMult = Math.min(1.2, Math.max(0.85, Math.sqrt(lastFieldSize / 10)));

  let recentPlacementBonus = 0;
  // Early exits / bottom half of tournament receive 0 placement bonus
  let isEarlyExit = (lastPlace >= lastFieldSize * 0.65 || (lastPlace >= 7 && lastFieldSize <= 8) || lastPlace >= 100);
  if(!isEarlyExit || isReigningChamp){
    let basePlacementPts = 0;
    if(lastPlace === 1 || isReigningChamp){
      basePlacementPts = 7.5; // Reigning Champion
    } else if(lastPlace === 2){
      basePlacementPts = 5.8; // Runner-up / Grand Finalist
    } else if(lastPlace === 3){
      basePlacementPts = 4.8; // 3rd Place / Losers Finalist
    } else if(lastPlace === 4){
      basePlacementPts = 3.8; // 4th Place / Losers Semifinalist
    } else if(lastPlace <= 6 && lastFieldSize >= 10){
      basePlacementPts = 2.4; // 5th-6th Place / Top 6 in 10+ field
    } else if(lastPlace <= 8 && lastFieldSize >= 14){
      basePlacementPts = 1.2; // 7th-8th Place / Top 8 in 14+ field
    }
    recentPlacementBonus = basePlacementPts * lastFieldMult;
  }

  // Older / Career Playoff Pedigree with Recency Decay
  let olderPlacementBonus = 0;
  let olderFinishes = tf.slice(0, -1);
  olderFinishes.forEach(f => {
    let pRank = f.finish?.place || 999;
    let fSize = Math.max(4, f.tournament?.players?.length || 8);
    let fMult = Math.min(1.2, Math.max(0.85, Math.sqrt(fSize / 10)));
    if(pRank >= fSize * 0.65 || (pRank >= 7 && fSize <= 8) || pRank >= 100) return;

    let olderBase = 0;
    if(pRank === 1) olderBase = 3.0;      // Past Championship
    else if(pRank === 2) olderBase = 1.8; // Past Runner-up
    else if(pRank === 3) olderBase = 1.2; // Past 3rd Place
    else if(pRank === 4) olderBase = 0.8; // Past 4th Place
    else if(pRank <= 6 && fSize >= 10) olderBase = 0.4; // Past Top 6
    else if(pRank <= 8 && fSize >= 14) olderBase = 0.2; // Past Top 8
    olderPlacementBonus += olderBase * fMult;
  });
  // Cap historical playoff pedigree at +6.0 so multi-time contenders maintain high baseline
  olderPlacementBonus = Math.min(6.0, olderPlacementBonus);

  // 3. Active Momentum & Streak Volatility (Balanced: drops rating on slumps, but does not plummet)
  let isTopFourFinish = (lastPlace <= 4);
  let activeStreakBonus = Math.min(4.5, (s.currentWinStreak || 0) * 1.0);
  let activeLossPenalty = isTopFourFinish ? 0 : Math.min(3.0, (s.currentLossStreak || 0) * 0.75);

  // All-time historic streak legacy: modest +0.35 per game (cap +2.5)
  let maxStreakBonus = Math.min(2.5, (s.maxWinStreak || 0) * 0.35);

  let rawOvr = base + recentPlacementBonus + olderPlacementBonus + winRateDiff + activeStreakBonus - activeLossPenalty + maxStreakBonus;

  // 4. Scarcity Curve at the Very Top (Extremely hard to hit 90+, near-impossible to hit 96-99 without absolute dominance)
  if(rawOvr > 86){
    rawOvr = 86 + (rawOvr - 86) * 0.48;
  }
  if(rawOvr > 92){
    rawOvr = 92 + (rawOvr - 92) * 0.32;
  }

  // Regression / confidence weighting for low sample size (< 4 games)
  let sampleWeight = Math.min(1.0, total / 4);
  let finalOvr = Math.round(70 * (1 - sampleWeight) + rawOvr * sampleWeight);

  // Hard clamp between 50 and 99
  finalOvr = Math.max(50, Math.min(99, finalOvr));

  let tier = 'bronze', tierName = 'Bronze', tierUpper = 'BRONZE', color = '#cd7f32', badgeCls = 'ovr-bronze', badgePrefix = '';
  if(finalOvr >= 90){
    tier = 'elite';
    tierName = 'Elite';
    tierUpper = 'ELITE';
    color = '#ff4d58';
    badgeCls = 'ovr-elite';
  } else if(finalOvr >= 80){
    tier = 'gold';
    tierName = 'Gold';
    tierUpper = 'GOLD';
    color = '#ffd166';
    badgeCls = 'ovr-gold';
  } else if(finalOvr >= 70){
    tier = 'silver';
    tierName = 'Silver';
    tierUpper = 'SILVER';
    color = '#d0d0dc';
    badgeCls = 'ovr-silver';
  }

  return {
    ovr: finalOvr,
    tier,
    tierName,
    tierUpper,
    color,
    badgeCls,
    badgeHtml: `<span class="ovr-badge-pill ${badgeCls}">${badgePrefix}${finalOvr}</span>`,
    subStats: {
      win: Math.round(effectiveWinPct),
      tit: career.titles,
      cut: career.topCuts,
      strk: s.maxWinStreak || 0
    }
  };
}

function onBadgePresetChange(){
  let presetSelect = document.querySelector('#grantBadgePreset');
  let tSelect = document.querySelector('#grantBadgeTournament');
  if(!presetSelect || !tSelect) return;
  
  let opt = presetSelect.selectedOptions[0];
  let tVal = tSelect.value;
  if(presetSelect.value === 'custom'){
    document.querySelector('#grantBadgeIcon').value = '🌸';
    document.querySelector('#grantBadgeName').value = tVal ? `Custom Badge (${tVal})` : 'Custom Badge';
    document.querySelector('#grantBadgeDesc').value = 'Special award granted by league moderators.';
    return;
  }
  let icon = opt?.dataset.icon || '🎖️';
  let name = opt?.dataset.name || 'Badge';
  let color = opt?.dataset.color || 'blue';
  let desc = opt?.dataset.desc || '';
  let perT = opt?.dataset.pert === 'true';

  let fullName = (perT && tVal) ? `${name} (${tVal})` : name;
  let fullDesc = (perT && tVal) ? desc.replace('a tournament', tVal).replace('in a tournament', `in ${tVal}`) : desc;

  document.querySelector('#grantBadgeIcon').value = icon;
  document.querySelector('#grantBadgeName').value = fullName;
  document.querySelector('#grantBadgeColor').value = color;
  document.querySelector('#grantBadgeDesc').value = fullDesc;
}

function submitGrantBadge(p){
  let q = ensureProfile(p);
  q.customBadges = q.customBadges || [];
  q.revokedBadges = q.revokedBadges || [];

  let icon = document.querySelector('#grantBadgeIcon')?.value.trim() || '🎖️';
  let name = document.querySelector('#grantBadgeName')?.value.trim() || 'Badge';
  let color = document.querySelector('#grantBadgeColor')?.value || 'purple';
  let desc = document.querySelector('#grantBadgeDesc')?.value.trim() || '';
  let tVal = document.querySelector('#grantBadgeTournament')?.value || '';

  let newBadge = {
    id: 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
    icon,
    name,
    desc,
    color,
    category: 'custom',
    tournament: tVal
  };

  q.revokedBadges = q.revokedBadges.filter(x => x !== name && x !== newBadge.id);
  q.customBadges.push(newBadge);

  persistLeague();
  render();
  openBadgeManager(p);
}

function revokePlayerBadge(p, badgeId, badgeName){
  let q = ensureProfile(p);
  q.customBadges = q.customBadges || [];
  q.revokedBadges = q.revokedBadges || [];

  q.customBadges = q.customBadges.filter(b => b.id !== badgeId && b.name !== badgeName);

  let key = badgeId || badgeName;
  if(key && !q.revokedBadges.some(x => (typeof x === 'object' ? (x.id === key || x.name === key) : x === key))){
    q.revokedBadges.push({ id: badgeId || badgeName, name: badgeName || badgeId });
  }

  persistLeague();
  render();
  openBadgeManager(p);
}

function restorePlayerBadge(p, revokedKey){
  let q = ensureProfile(p);
  q.revokedBadges = (q.revokedBadges || []).filter(x => {
    if(typeof x === 'object') return x.id !== revokedKey && x.name !== revokedKey;
    return x !== revokedKey;
  });
  persistLeague();
  render();
  openBadgeManager(p);
}
/* ------------------------------------------------------------ 2. ACCOUNTS LINKED TO PLAYER PROFILES ------------------------------------------------------------
   The link lives in league_state (moderator-writable) rather than in
   user_profiles, so no schema migration is needed and players cannot
   claim to be someone else. Keyed by account username. */
var accountLinks=(()=>{try{return JSON.parse(localStorage.getItem('draftdex-accountlinks')||'{}')||{}}catch{return {}}})();
/* Links are validated against live profiles, so a deleted player can
   never leave an account pointing at a profile that no longer exists. */
function accountForPlayer(p){return (p&&profiles[p])?(Object.keys(accountLinks).find(u=>accountLinks[u]===p)||null):null}
function playerForAccount(u){let p=u?accountLinks[u]:null;return (p&&profiles[p])?p:null}
(function(){
  let base=window.deleteProfile;
  if(typeof base!=='function')return;
  window.deleteProfile=function(p){
    let had=accountForPlayer(p);
    base(p);
    if(profiles[p])return;                       /* the delete was cancelled */
    Object.keys(accountLinks).forEach(u=>{if(accountLinks[u]===p)delete accountLinks[u]});
    if(had){try{localStorage.setItem('draftdex-accountlinks',JSON.stringify(accountLinks))}catch{}persistLeague()}
  }
})();
function myPlayer(){return playerForAccount(window.currentAccount?.username)}
function knownAccounts(){
  let names=new Set(Object.keys(accountLinks));
  (window.leagueAccounts||[]).forEach(a=>names.add(a.username));
  if(window.currentAccount?.username)names.add(window.currentAccount.username);
  return [...names].filter(Boolean).sort((a,b)=>a.localeCompare(b))
}
async function loadAccounts(){
  if(!supabaseClient)return window.leagueAccounts||[];
  try{
    let {data}=await supabaseClient.from('user_profiles').select('id,username,role');
    window.leagueAccounts=data||[];
  }catch(e){}
  return window.leagueAccounts||[]
}
function openAccountLinks(focusPlayer){
  if(!moderator)return;
  loadAccounts().then(()=>{
    let players=Object.keys(profiles).sort((a,b)=>a.localeCompare(b));
    let accounts=knownAccounts();
    let rows=accounts.length?accounts.map(u=>`<div class="link-row">
      <div><b>${esc(u)}</b><div class="sub" style="margin:2px 0 0">${accountLinks[u]?'Plays as '+esc(accountLinks[u]):'Not linked to a player yet'}</div></div>
      <select class="accountLink" data-account="${esc(u)}">
        <option value="">— no player —</option>
        ${players.map(p=>`<option value="${esc(p)}" ${accountLinks[u]===p?'selected':''} ${accountForPlayer(p)&&accountForPlayer(p)!==u?'disabled':''}>${esc(p)}${accountForPlayer(p)&&accountForPlayer(p)!==u?' (taken)':''}</option>`).join('')}
      </select></div>`).join(''):'<p class="sub">No accounts found yet. Accounts appear here once somebody signs up.</p>';
    document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:620px">
      <div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Link accounts to players</h2></div><button class="close" onclick="closeModal()">×</button></div>
      <p class="sub">Connect each sign-in account to the player profile it belongs to. Linked players see their own profile from the account page, and prediction points are tracked against the account.</p>
      ${focusPlayer&&!accountForPlayer(focusPlayer)?`<p class="sub" style="color:#ffb0b5">${esc(focusPlayer)} has no account linked yet.</p>`:''}
      <div class="card" style="padding:6px 14px">${rows}</div>
      <div class="creator-actions"><button class="btn" onclick="saveAccountLinks()">Save links</button></div>
    </div></div>`
  })
}
function saveAccountLinks(){
  if(!moderator)return;
  let next={};
  document.querySelectorAll('.accountLink').forEach(sel=>{let p=sel.value.trim();if(p)next[sel.dataset.account]=p});
  accountLinks=next;
  try{localStorage.setItem('draftdex-accountlinks',JSON.stringify(accountLinks))}catch{}
  persistLeague();closeModal();render()
}

/* ------------------------------------------------------------ 3. PREDICTION POINTS BELONG TO ACCOUNTS ------------------------------------------------------------
   Scored from the predictions table against the real results, so the
   leaderboard lists sign-in accounts rather than tournament players.
   Nothing is written back: user_profiles.prediction_points can only be
   updated by its owner under the current RLS policy, so totals are
   derived on read instead. */
/* A group-stage question and a Top Cut question can produce the exact
   same key ("Who wins: A vs B"), so resolve the answer and its point
   value together rather than guessing the value from the key alone. */
function predictionOutcome(t, key){
  if(!t || !key) return { value: 0, answer: null };

  if(/^Who will be the .* Champion\?$/.test(key)){
    let champ = (t.champion && t.champion !== 'TBD' && t.champion !== 'BYE') ? t.champion : null;
    return { value: 100, answer: champ };
  }

  let top = key.match(/^Who will top (.+)\?$/);
  if(top){
    let g = top[1], buckets = groupsOf(t);
    if(!buckets[g]) return { value: 45, answer: null };
    let gMatches = (t.matches || []).filter(m => (m.group || 'Group A') === g);
    let done = gMatches.length > 0 && gMatches.every(m => m.as !== '' && m.as != null && m.bs !== '' && m.bs != null);
    if(!done && t.status !== 'COMPLETE' && t.phase !== 'topcut') return { value: 45, answer: null };
    try {
      let leader = getStand(t, g)[0]?.p || null;
      return { value: 45, answer: leader };
    } catch(e){ return { value: 45, answer: null }; }
  }

  // Bracket Slot Predictions (draftdex-bpick-wb1, Top Cut Bracket Match · wb1, etc.)
  let bSlot = key.match(/^(?:draftdex-bpick-|Top Cut Bracket Match · )(.+)$/);
  if(bSlot){
    let slotId = bSlot[1];
    let model = getTournamentTopCutModel(t);
    let allBracketMatches = [...(model?.wbRounds || []).flatMap(r => r.matches), ...(model?.lbRounds || []).flatMap(r => r.matches), ...(model?.gfMatches || [])];
    let bm = allBracketMatches.find(m => m.id === slotId);
    if(bm && bm.isDone && bm.winner && isKnownPlayer(bm.winner)){
      return { value: 20, answer: bm.winner };
    }
    return { value: 20, answer: null };
  }

  /* Top Cut questions carry a prefix so a bracket rematch of a group pairing can never be scored against the group result */
  let cut = key.match(/^Top Cut · Who wins: (.+) vs (.+)$/);
  if(cut){
    let model = getTournamentTopCutModel(t);
    let allBracketMatches = [...(model?.wbRounds || []).flatMap(r => r.matches), ...(model?.lbRounds || []).flatMap(r => r.matches), ...(model?.gfMatches || [])];
    let bm = allBracketMatches.find(x => (x.p1 === cut[1] && x.p2 === cut[2]) || (x.p1 === cut[2] && x.p2 === cut[1]));
    if(bm && bm.isDone && bm.winner) return { value: 20, answer: bm.winner };
    return { value: 20, answer: null };
  }

  let vs = key.match(/^Who wins: (.+) vs (.+)$/);
  if(vs){
    let [, a, b] = vs;
    let m = (t.matches || []).find(x => (x.a === a && x.b === b) || (x.a === b && x.b === a));
    if(m){
      if(m.as === '' || m.as == null || m.bs === '' || m.bs == null || +m.as === +m.bs) return { value: 8, answer: null };
      return { value: 8, answer: +m.as > +m.bs ? m.a : m.b };
    }
    /* legacy rows */
    let model = getTournamentTopCutModel(t);
    let allBracketMatches = [...(model?.wbRounds || []).flatMap(r => r.matches), ...(model?.lbRounds || []).flatMap(r => r.matches), ...(model?.gfMatches || [])];
    let bm = allBracketMatches.find(x => (x.p1 === a && x.p2 === b) || (x.p1 === b && x.p2 === a));
    if(bm && bm.isDone && bm.winner) return { value: 20, answer: bm.winner };
    return { value: 20, answer: null };
  }

  return { value: 0, answer: null };
}

function predictionAnswer(t,key){return predictionOutcome(t,key).answer}
function predictionValue(key,t){return predictionOutcome(t,key).value}

function scorePredictionRows(t,rows,nameOf){
  let totals={},settled=0,pending=0,cache={};
  rows.forEach(r=>{
    if(!(r.prediction_key in cache)) cache[r.prediction_key] = predictionOutcome(t, r.prediction_key);
    let { answer, value } = cache[r.prediction_key];
    let who = nameOf ? nameOf(r.user_id) : r.user_id;
    if(!who) who = r.user_id || 'Player';
    totals[who] = totals[who] || { pts: 0, hits: 0, made: 0, open: 0 };
    totals[who].made++;
    if(answer == null){
      totals[who].open++;
      pending++;
      return;
    }
    settled++;
    if(answer === r.selection){
      totals[who].pts += value;
      totals[who].hits++;
    }
  });
  return {
    rows: Object.entries(totals).map(([u, v]) => ({ u, ...v })).sort((a, b) => b.pts - a.pts || b.hits - a.hits || a.u.localeCompare(b.u)),
    settled,
    pending
  };
}

let predictionScoresCache = {}; // tournament_id -> { rows, accounts, html, timestamp }

function getLocalPredictionRows(tournamentId){
  if(!tournamentId) return [];
  let prefix = 'draftdex-pick-' + tournamentId + '-';
  let rows = [];
  let userIdentifier = sessionUser?.id || (window.currentAccount?.username || 'local_user');
  try {
    for(let i = 0; i < localStorage.length; i++){
      let k = localStorage.key(i);
      if(k && k.startsWith(prefix)){
        let question = k.slice(prefix.length);
        let selection = localStorage.getItem(k);
        if(selection){
          rows.push({
            user_id: userIdentifier,
            tournament_id: tournamentId,
            prediction_key: question,
            selection: selection
          });
        }
      }
    }
  } catch(e){}
  return rows;
}

  }
  return `<aside class="card leaderboard" id="predLeaders" data-tournament="${esc(t?.id||'')}">
    <div class="card-title">Prediction leaders</div>
    <p class="sub" id="predLeadersBody">Loading account scores...</p></aside>`;
}

function updateLocalPredictionInCache(tournamentId, question, choice, isRemoving){
  if(!tournamentId) return;
  if(!predictionScoresCache[tournamentId]) predictionScoresCache[tournamentId] = { rows: [], accounts: [] };
  let rows = predictionScoresCache[tournamentId].rows || [];
  let effectiveUsername = window.currentAccount?.username || (sessionUser?.user_metadata?.username) || 'You';
  let userIdentifier = sessionUser?.id || effectiveUsername;

  if(isRemoving){
    rows = rows.filter(r => !( (r.user_id === userIdentifier || r.user_id === 'local_user') && r.prediction_key === question));
  } else {
    let existing = rows.find(r => (r.user_id === userIdentifier || r.user_id === 'local_user') && r.prediction_key === question);
    if(existing){
      existing.selection = choice;
      existing.user_id = userIdentifier;
    } else {
      rows.push({ user_id: userIdentifier, tournament_id: tournamentId, prediction_key: question, selection: choice });
    }
  }

  // Ensure all local picks from localStorage are incorporated
  let localRows = getLocalPredictionRows(tournamentId);
  localRows.forEach(lr => {
    let matchIdx = rows.findIndex(r => (r.user_id === userIdentifier || r.user_id === 'local_user') && r.prediction_key === lr.prediction_key);
    if(matchIdx >= 0){
      rows[matchIdx].selection = lr.selection;
      rows[matchIdx].user_id = userIdentifier;
    } else {
      rows.push({ ...lr, user_id: userIdentifier });
    }
  });

  predictionScoresCache[tournamentId].rows = rows;

  let accounts = predictionScoresCache[tournamentId].accounts || [];
  let userAcc = accounts.find(a => a.id === userIdentifier || a.username === effectiveUsername);
  if(!userAcc){
    accounts.push({ id: userIdentifier, username: effectiveUsername });
  } else {
    userAcc.username = effectiveUsername;
    userAcc.id = userIdentifier;
  }
  predictionScoresCache[tournamentId].accounts = accounts;

  let t = ongoingT() || activeT();
  if(t && t.id === tournamentId){
    let byId = Object.fromEntries(accounts.map(a => [a.id, a.username]));
    let { rows: board, settled, pending } = scorePredictionRows(t, rows, id => byId[id] || (id === userIdentifier ? effectiveUsername : id));
    let me = window.currentAccount?.username || effectiveUsername;
    let list = board.length ? board.map((x, i) => {
      let player = playerForAccount(x.u) || (profiles[x.u] ? x.u : null) || (x.u === me ? myPlayer() : null);
      return `<div class="leader ${x.u === me ? 'me' : ''}">
        <span class="rank">${i + 1}</span>
        <span class="mini-avatar" style="background-image:${player ? teamArt(player, t) : fallbackArt(x.u)};background-size:cover;background-position:center">${player && (teamCovers[player] || profilePictures[player]) ? '' : esc(x.u[0] || '')}</span>
        <b>${esc(player || x.u)}${player && player !== x.u ? `<span class="sub" style="display:block;font-size:9px">as ${esc(x.u)}</span>` : ''}</b>
        <span class="pts">${x.pts} pts</span></div>`;
    }).join('') : '<p class="sub">No predictions submitted yet. Points are awarded once results come in.</p>';
    let note = `<div class="leader-note">${settled} scored · ${pending} still open. Points follow the sign-in account, so they stay with you across tournaments whether or not you are playing.</div>`;
    let fullHtml = `<div class="card-title">Prediction leaders</div>${list}${note}`;
    predictionScoresCache[tournamentId].html = fullHtml;

    let host = document.querySelector('#predLeaders');
    if(host && host.dataset.tournament === tournamentId){
      host.innerHTML = fullHtml;
    }
  }
}

async function renderPredictionLeaders(t, forceFresh = false){
  let host = document.querySelector('#predLeaders');
  if(!host || !t) return;

  let rows = [], accounts = [];
  let effectiveUsername = window.currentAccount?.username || (sessionUser?.user_metadata?.username) || 'You';
  let currentUserId = sessionUser?.id || effectiveUsername;

  if(supabaseClient && supabaseReady()){
    try {
      let res = await supabaseClient.from('predictions').select('user_id,prediction_key,selection').eq('tournament_id', t.id);
      rows = res.data || [];
      accounts = await loadAccounts();
    } catch(e){
      console.warn('Prediction scores load error:', e);
    }
  }

  // Merge local predictions from localStorage for the active user so points are always calculated
  let localRows = getLocalPredictionRows(t.id);
  localRows.forEach(lr => {
    let matchIdx = rows.findIndex(r => (r.user_id === currentUserId || r.user_id === sessionUser?.id || r.user_id === 'local_user') && r.prediction_key === lr.prediction_key);
    if(matchIdx >= 0){
      rows[matchIdx].selection = lr.selection;
      rows[matchIdx].user_id = currentUserId;
    } else {
      rows.push({ ...lr, user_id: currentUserId });
    }
  });

  if(!accounts.some(a => a.id === currentUserId || a.username === effectiveUsername)){
    accounts.push({ id: currentUserId, username: effectiveUsername });
  }

  let byId = Object.fromEntries((accounts || []).map(a => [a.id, a.username]));
  let { rows: board, settled, pending } = scorePredictionRows(t, rows, id => byId[id] || (id === currentUserId ? effectiveUsername : id));
  let me = window.currentAccount?.username || effectiveUsername;
  let list = board.length ? board.map((x, i) => {
    let player = playerForAccount(x.u) || (profiles[x.u] ? x.u : null) || (x.u === me ? myPlayer() : null);
    return `<div class="leader ${x.u === me ? 'me' : ''}">
      <span class="rank">${i + 1}</span>
      <span class="mini-avatar" style="background-image:${player ? teamArt(player, t) : fallbackArt(x.u)};background-size:cover;background-position:center">${player && (teamCovers[player] || profilePictures[player]) ? '' : esc(x.u[0] || '')}</span>
      <b>${esc(player || x.u)}${player && player !== x.u ? `<span class="sub" style="display:block;font-size:9px">as ${esc(x.u)}</span>` : ''}</b>
      <span class="pts">${x.pts} pts</span></div>`;
  }).join('') : '<p class="sub">No predictions submitted yet. Points are awarded once results come in.</p>';
  let note = `<div class="leader-note">${settled} scored · ${pending} still open. Points follow the sign-in account, so they stay with you across tournaments whether or not you are playing.</div>`;
  let fullHtml = `<div class="card-title">Prediction leaders</div>${list}${note}`;

  predictionScoresCache[t.id] = { rows, accounts, html: fullHtml, timestamp: Date.now() };
  if(document.querySelector('#predLeaders')?.dataset.tournament === t.id){
    host.innerHTML = fullHtml;
  }

  if(board.length && board[0].pts > 0){
    let topUser = board[0].u;
    if(t.predictionKing !== topUser){
      t.predictionKing = topUser;
      try { persistLeague(); } catch(e){}
      if(typeof rebuildAllPlayerStats === 'function') rebuildAllPlayerStats();
    }
  }
}

function savePredictionPick(question, choice, el){
  let t = ongoingT() || activeT();
  if(!t || !question || !choice) return;

  let currentPick = savedPick(t, question);
  let isTogglingOff = (currentPick === choice);

  try {
    if(isTogglingOff){
      localStorage.removeItem('draftdex-pick-' + t.id + '-' + question);
    } else {
      localStorage.setItem('draftdex-pick-' + t.id + '-' + question, choice);
    }
  } catch(e){}

  updateLocalPredictionInCache(t.id, question, choice, isTogglingOff);

  // Synchronous, instant 0ms UI update!
  if(current === 'Predictions' || detailTab === 'Predictions'){
    render();
  }

  // Fire Supabase sync in background
  if(supabaseClient && sessionUser){
    (async () => {
      try {
        if(isTogglingOff){
          await supabaseClient.from('predictions').delete().match({
            user_id: sessionUser.id,
            tournament_id: t.id,
            prediction_key: question
          });
        } else {
          await supabaseClient.from('predictions').upsert({
            user_id: sessionUser.id,
            tournament_id: t.id,
            prediction_key: question,
            selection: choice
          }, { onConflict: 'user_id,tournament_id,prediction_key' });
        }
      } catch(e){
        console.warn('Prediction background sync error:', e);
      }
    })();
  }
}

          <div class="eyebrow" style="color:var(--amber);margin-bottom:2px">100 PTS · TOURNAMENT OUTCOME</div>

        </div>
        ${locked ? '<span class="tag" style="background:#262630;color:#a09fa8;border:1px solid #3a3a46">LOCKED</span>' : '<span class="tag" style="background:#163821;color:#7df0aa;border:1px solid #2b5c39">PICKS OPEN</span>'}
      </div>

      <div class="pred-contender-grid">
        ${players.map(p => {
          let isChosen = (chosen === p);
