.tc-section-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2b2b35;padding-bottom:8px;margin-bottom:16px}

.tc-bracket-grid{display:flex;align-items:flex-start;gap:28px;overflow-x:auto;padding:10px 4px 14px}
.tc-round-col{display:flex;flex-direction:column;gap:16px;width:260px;flex-shrink:0}
.tc-round-head{font:800 12px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:#d8b44b;padding:0 2px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}

.tc-match-card{background:#131318;border:1px solid #33333e;border-radius:7px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.4);transition:border-color .15s,transform .15s;position:relative}

.tc-slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #1c1c24;transition:background .12s}

.tc-slot-info{display:flex;align-items:center;gap:8px;min-width:0}
.tc-slot-name{font:800 13px 'Barlow Condensed';letter-spacing:.3px;color:#f5f3f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tc-slot.tbd{background:#0e0e13;opacity:0.75}
.tc-slot-tbd{font-size:11px;color:#75737e;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-slot-score{font:900 15px 'Barlow Condensed';color:#f5f3f0;min-width:20px;text-align:center;padding:2px 6px;border-radius:3px;background:#0b0b0f}
.tc-slot.winner .tc-slot-score{background:#143822;color:#4bdd91;border:1px solid #28683f}
.tc-slot.interactive{cursor:pointer;transition:background .12s,transform .12s}
.tc-slot.interactive:hover{background:rgba(255,255,255,0.06);transform:translateX(2px)}
.tc-slot.picked{background:linear-gradient(90deg,rgba(239,48,56,0.22),transparent)!important;border-left:3px solid var(--red)}
.tc-slot.picked .tc-slot-name{color:#ffd166!important;font-weight:900}
.tc-slot.hit{background:linear-gradient(90deg,rgba(75,221,145,0.22),transparent)!important;border-left:3px solid #4bdd91}
.tc-slot.hit .tc-slot-name{color:#4bdd91!important}
.tc-slot.miss{opacity:0.45;text-decoration:line-through}

.tc-slot-pickbox{width:22px;height:22px;border-radius:4px;border:1px solid #3c3c4a;background:#14141c;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#7e7c85;transition:all .15s ease;flex:none}
.tc-slot.interactive:hover .tc-slot-pickbox{border-color:#ffd166;color:#ffd166;background:rgba(255,209,102,0.12)}
.tc-slot.picked .tc-slot-pickbox{background:#ffd166!important;color:#121212!important;border-color:#ffd166!important;box-shadow:0 0 10px rgba(255,209,102,0.5)}
.tc-slot.hit .tc-slot-pickbox{background:#4bdd91!important;color:#0b2214!important;border-color:#4bdd91!important;box-shadow:0 0 10px rgba(75,221,145,0.45)}
.tc-slot.miss .tc-slot-pickbox{background:#2a1518!important;color:#ff7079!important;border-color:#5c2227!important}

.tc-ledger-table{width:100%;border-collapse:collapse}
.tc-ledger-table th{padding:9px 12px;font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#8e8c95;border-bottom:1px solid #2a2a34;text-align:left}
.tc-ledger-table td{padding:10px 12px;font-size:12px;border-bottom:1px solid #202028}
.tc-ledger-table tr:last-child td{border-bottom:0}

.teams>div{width:100%}

/* ------------------------------------------------------------ Sprint layer: team-cover polish · draft board · versus graphics ------------------------------------------------------------ */
.photo-preview{height:170px;border-radius:6px;margin-top:14px;background-color:#25252b;background-size:cover;background-position:center}
.prediction.versus-card{position:relative;padding:12px 14px 0!important;margin-bottom:8px!important;overflow:hidden}
.versus-card h3{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pick-options.versus-stage{display:grid!important;grid-template-columns:1fr 1fr;gap:0!important;margin:10px -14px 0!important;position:relative;isolation:isolate}
.pick.vs-side{position:relative;isolation:isolate;height:172px;border:0!important;border-radius:0!important;background:#1c1c22;color:#f5f3f0;font:800 27px/1 'Barlow Condensed';font-size:27px!important;letter-spacing:.5px;text-shadow:0 2px 10px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.95);text-align:left;padding:0 20px 18px!important;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;cursor:pointer;overflow:hidden;transition:filter .18s}
.pick.vs-side:before{content:'';position:absolute;inset:0;z-index:-1;background-image:var(--art);background-size:cover;background-position:center;filter:saturate(.9) brightness(.56);transition:transform .35s,filter .18s}
.pick.vs-side:after{content:attr(data-team);font:600 11px/1.3 'DM Sans';font-size:11px;letter-spacing:.3px;color:#e2e0e5;text-shadow:0 1px 6px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.9);margin-top:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.vs-side.left{clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);padding-right:52px!important;margin-right:-17px}
.pick.vs-side.right{clip-path:polygon(34px 0,100% 0,100% 100%,0 100%);padding-left:52px!important;margin-left:-17px;text-align:right;align-items:flex-end}
.pick.vs-side:hover:before{filter:saturate(1.1) brightness(.78)}
.pick.vs-side.active{background:#3a1218}
.pick.vs-side.active:before{filter:saturate(1.15) brightness(.92)}
.pick.vs-side.active:not([disabled]){box-shadow:inset 0 -4px 0 var(--red)}
.pick.vs-side>.vs-scrim{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:-1;background:linear-gradient(180deg,transparent,rgba(8,8,11,.82));pointer-events:none}
.versus-stage.decided .vs-side:not(.active):before{filter:grayscale(.68) brightness(.44)}
.pick.vs-side:focus-visible{outline:0;box-shadow:inset 0 0 0 3px #fff}
.pick.vs-side[disabled]{cursor:not-allowed;opacity:1!important}
.vs-seam{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%) skewX(-11deg);background:linear-gradient(180deg,transparent,var(--red),transparent);box-shadow:0 0 18px 2px #ef303877;z-index:2;pointer-events:none}
.vs-plate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;width:42px;height:42px;border-radius:50%;background:#0c0c0f;border:1px solid #5d2028;display:grid;place-items:center;font:800 15px 'Barlow Condensed';color:#ff8189;letter-spacing:.5px;box-shadow:0 6px 20px #000a}
.vs-tag{position:absolute;z-index:3;top:12px;font:800 9px 'DM Sans';letter-spacing:1px;text-transform:uppercase;color:#ffb0b5;background:#4d1a20;border:1px solid #7a2b34;border-radius:3px;padding:3px 6px;pointer-events:none;box-shadow:0 2px 8px #0009;opacity:0;visibility:hidden;transition:opacity .12s ease,visibility .12s ease}
.vs-tag.left{left:20px}.vs-tag.right{right:20px}
.vs-tag.show{opacity:1;visibility:visible}
.vs-locked{position:absolute;z-index:3;left:50%;bottom:10px;transform:translateX(-50%);font:800 8px 'DM Sans';letter-spacing:1px;text-transform:uppercase;color:#a9a7b0;background:#1a1a20cc;border:1px solid #3c3c45;border-radius:3px;padding:2px 6px;pointer-events:none}
.versus-hint{color:#8e8c95;font-size:11px;margin:-4px 0 10px}
@media(prefers-reduced-motion:no-preference){.pick.vs-side:hover:before{transform:scale(1.045)}}
@media(max-width:560px){.pick.vs-side{height:132px;font-size:22px!important;padding-bottom:14px!important}.pick.vs-side.left{padding-right:40px!important;margin-right:-11px;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%)}.pick.vs-side.right{padding-left:40px!important;margin-left:-11px;clip-path:polygon(22px 0,100% 0,100% 100%,0 100%)}.vs-seam{transform:translateX(-50%) skewX(-9deg)}.vs-plate{width:36px;height:36px;font-size:13px}}

/* ------------------------------------------------------------ Modern Predictions & Pick'em Clash ------------------------------------------------------------ */
.pred-section{display:flex;flex-direction:column;gap:12px}
.pred-clash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.pred-clash-card{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#15151d;border:1px solid #2b2b36;border-radius:9px;overflow:hidden;min-height:76px;box-shadow:0 4px 14px rgba(0,0,0,0.4);transition:border-color .15s ease,transform .15s ease}
.pred-clash-card:hover{border-color:#482934;transform:translateY(-1px)}
.pred-clash-meta{position:absolute;top:5px;left:50%;transform:translateX(-50%);z-index:4;font:800 9px 'Barlow Condensed';letter-spacing:.6px;color:#a09fa8;background:#0f0f14dd;padding:1px 6px;border-radius:3px;border:1px solid #ffffff15;pointer-events:none}
.clash-side{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#16161f;border:0;cursor:pointer;text-align:left;overflow:hidden;transition:background .15s ease,filter .15s ease}
.clash-side:before{content:'';position:absolute;inset:0;background-image:var(--art);background-size:cover;background-position:center;opacity:.28;filter:saturate(.8) brightness(.6);transition:opacity .2s,filter .2s,transform .3s}
.clash-side:hover:before{opacity:.55;filter:saturate(1.2) brightness(.85);transform:scale(1.05)}
.clash-side.left{border-right:1px solid #242430;padding-right:24px}
.clash-side.right{border-left:1px solid #242430;padding-left:24px;flex-direction:row-reverse;text-align:right}

.clash-side.is-hit{background:linear-gradient(135deg,#12331c,#141f17)!important;box-shadow:inset 0 0 0 2px #4bdd91!important}
.clash-side.is-miss{opacity:.55;filter:grayscale(.6)}
.clash-side[disabled]{cursor:default}
.clash-side-badge{position:absolute;bottom:4px;font:900 8px 'DM Sans';letter-spacing:.6px;text-transform:uppercase;padding:1px 5px;border-radius:3px;z-index:3;pointer-events:none}
.clash-side.left .clash-side-badge{left:8px}
.clash-side.right .clash-side-badge{right:8px}
.badge-picked{background:var(--red);color:#fff;box-shadow:0 0 8px rgba(239,48,56,0.6)}
.badge-hit{background:#237a3d;color:#7df0aa}
.badge-miss{background:#4a1c22;color:#ff858b}
.clash-center-vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:24px;height:24px;border-radius:50%;background:#0d0d12;border:1px solid #3d242d;display:grid;place-items:center;font:900 10px 'Barlow Condensed';color:#ff858b;box-shadow:0 2px 8px rgba(0,0,0,0.8);pointer-events:none}

/* Modern Contender Outright Pickers */
.pred-contender-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.pred-contender-card{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#16161e;border:1px solid #2d2d38;border-radius:7px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s;text-align:left;position:relative}

.pred-bracket-wrap{background:#13131a;border:1px solid #2e2e3a;border-radius:10px;padding:18px;overflow-x:auto}

/* ------------------------------------------------------------ Draft board ------------------------------------------------------------ */
.sheet-frame{width:100%;height:74vh;min-height:520px;border:0;border-radius:7px;background:#fff;display:block}

.mock-rail{padding:20px;position:sticky;top:96px}

/* ------------------------------------------------------------ Matchup of the Week / PRIMETIME Broadcast Graphic ------------------------------------------------------------ */
.matchup-hero-card{position:relative;overflow:hidden;border-radius:10px;border:1px solid #4a2834;background:linear-gradient(135deg,#1f1116 0%,#13131a 50%,#121622 100%);display:flex;flex-direction:column;justify-content:space-between;min-height:220px;box-shadow:0 8px 24px rgba(0,0,0,0.55),0 0 16px rgba(230,57,70,0.18);transition:border-color .18s ease,box-shadow .18s ease}
.matchup-hero-card:hover{border-color:#6e3345;box-shadow:0 10px 28px rgba(0,0,0,0.65),0 0 22px rgba(230,57,70,0.26)}
.matchup-hero-banner{background:linear-gradient(90deg,#5a1c25,#281d2f);padding:7px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);position:relative;z-index:2}
.matchup-hero-body{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px 14px;z-index:2}
.matchup-team-col{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.matchup-record-big{font:900 32px/1 'Barlow Condensed';color:#f5f3f0;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,0.8)}
.matchup-team-name{font:800 13px/1.1 'Barlow Condensed';color:#e2e0e8;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.matchup-vs-badge{display:flex;flex-direction:column;align-items:center;gap:4px}
.matchup-vs-circle{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#e63946,#ff9f1c);display:grid;place-items:center;font:900 16px 'Barlow Condensed';color:#fff;box-shadow:0 0 16px rgba(230,57,70,0.6);border:2px solid #ffffff40}
.matchup-nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(18,18,24,0.7);border:1px solid rgba(255,255,255,0.15);color:#c8c6ce;font-size:16px;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:5;transition:all .15s ease;backdrop-filter:blur(4px);padding:0}
.matchup-nav-arrow:hover{background:rgba(239,48,56,0.4);border-color:var(--red);color:#fff;transform:translateY(-50%) scale(1.1)}
.matchup-nav-arrow.left{left:6px}
.matchup-nav-arrow.right{right:6px}
.matchup-hero-foot{background:#0e0e14c0;border-top:1px solid #20202c;padding:6px 14px;display:flex;justify-content:center;align-items:center;position:relative;z-index:2}
/* ------------------------------------------------------------ Modern In-Season Hero & Showcase ------------------------------------------------------------ */
.in-season-hero{display:grid;grid-template-columns:1.18fr .82fr;gap:18px;align-items:stretch}
.tourney-showcase-card{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;padding:22px;background:linear-gradient(135deg,#1b1216 0%,#15151c 60%,#11141c 100%);border:1px solid #4a2832;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.55),0 0 16px rgba(239,48,56,0.12);min-height:220px}
.tourney-showcase-backdrop{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(32px) saturate(1.75) brightness(0.32);opacity:.9;pointer-events:none;z-index:0;transform:scale(1.1)}
.tourney-showcase-info{display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}
.tourney-showcase-title{font:900 36px/1.05 'Barlow Condensed';color:#f5f3f0;letter-spacing:.5px;margin:10px 0 12px}
.tourney-chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tourney-chip{display:inline-flex;align-items:center;gap:5px;background:#00000060;border:1px solid #ffffff18;border-radius:5px;padding:4px 9px;font-size:11px;color:#c8c6ce}
.tourney-chip b{color:#f5f3f0}
.tourney-poster-frame{position:relative;width:100%;height:100%;min-height:185px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.14);box-shadow:0 6px 18px rgba(0,0,0,0.65);background:#111116}
.tourney-poster-img{width:100%;height:100%;background-size:cover;background-position:center;transition:transform .25s ease}
.tourney-poster-frame:hover .tourney-poster-img{transform:scale(1.03)}
.tourney-poster-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#24141a,#15151c);padding:14px;text-align:center}

/* Modern Pulse Stat Strip */
.pulse-stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.pulse-stat-box{padding:14px 16px;background:#15151d;border-color:#2b2b36;display:flex;flex-direction:column;justify-content:space-between}
.pulse-stat-label{font-size:9px;font-weight:800;letter-spacing:.8px;color:#8e8c95;text-transform:uppercase}
.pulse-stat-val{font:800 20px 'Barlow Condensed';color:#f5f3f0;margin:4px 0 2px}
.pulse-stat-sub{font-size:11px;color:#a09fa8}

/* Modern Match Cards */
.modern-match-card{padding:14px;background:#16161d;border:1px solid #2b2b36;border-radius:8px;transition:border-color .15s ease,transform .15s ease}
.modern-match-card:hover{border-color:#5c242c;transform:translateY(-2px)}
.modern-match-card.latest-highlight{border-color:#6a242d;background:linear-gradient(135deg,#211216,#16161e);box-shadow:0 4px 16px rgba(239,48,56,0.15)}
.modern-match-body{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.modern-match-player{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:#111116;border:1px solid #22222b}
.modern-match-player.is-winner{background:rgba(239,48,56,0.10);border-color:rgba(239,48,56,0.30)}
.match-score-pill{font:900 16px 'Barlow Condensed';color:#8e8c95;padding:2px 8px;border-radius:4px;min-width:24px;text-align:center;background:#0b0b0f}
.match-score-pill.winner-pill{color:#fff;background:var(--red);box-shadow:0 0 8px rgba(239,48,56,0.4)}

@media(max-width:960px){.in-season-hero{grid-template-columns:1fr}.tourney-showcase-card{grid-template-columns:1fr}.tourney-poster-frame{height:200px}}

.draft-picks-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.draft-picks-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.draft-picks-grid{grid-template-columns:1fr}}

/* Modern Expandable Past Tournaments Accordion */
.past-tourney-card{border:1px solid #2f2f3c;border-left:3px solid #4a4a58;border-radius:8px;margin-top:8px;background:#15151e;overflow:hidden;transition:border-color .15s ease, background .15s ease}
.past-tourney-card.gold{border-left-color:#f3c245;background:linear-gradient(90deg,rgba(243,194,69,0.12),#15151e 40%)}
.past-tourney-card.silver{border-left-color:#c8c8d2;background:linear-gradient(90deg,rgba(200,200,210,0.10),#15151e 40%)}
.past-tourney-card.bronze{border-left-color:#cd7f32;background:linear-gradient(90deg,rgba(205,127,50,0.12),#15151e 40%)}
.past-tourney-card.cut{border-left-color:#a855f7;background:linear-gradient(90deg,rgba(168,85,247,0.10),#15151e 40%)}

.past-tourney-summary{display:grid;grid-template-columns:58px minmax(0,1fr) auto 24px;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;user-select:none;list-style:none}
.past-tourney-summary::-webkit-details-marker{display:none}
.past-tourney-summary:hover{background:rgba(255,255,255,0.03)}
.past-chevron{font-size:11px;color:#8e8c95;transition:transform .2s ease;display:grid;place-items:center;user-select:none}
details[open] > .past-tourney-summary .past-chevron{transform:rotate(180deg);color:var(--amber)}
.past-tourney-body{padding:12px 14px 14px;background:#101016;border-top:1px solid #232330}

.past-row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid #2f2f38;border-left:3px solid #4a4a55;border-radius:7px;margin-top:8px;background:#17171d}
.past-row.gold{border-left-color:#f3c245;background:linear-gradient(90deg,rgba(243,194,69,0.18),#17171d 55%)}
.past-row.silver{border-left-color:#c8c8d2;background:linear-gradient(90deg,rgba(200,200,210,0.15),#17171d 55%)}
.past-row.bronze{border-left-color:#cd7f32;background:linear-gradient(90deg,rgba(205,127,50,0.18),#17171d 55%)}
.past-row.cut{border-left-color:#a855f7;background:linear-gradient(90deg,rgba(168,85,247,0.12),#17171d 55%)}
.past-place{font:800 20px 'Barlow Condensed';text-align:center;color:#e9e7ec;line-height:1}
.past-place small{display:block;font:800 8px 'DM Sans';letter-spacing:.6px;color:#8e8c95;text-transform:uppercase;margin-top:2px}
.past-name{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.past-meta{font-size:10px;color:#8e8c95;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.past-rec{font:800 19px 'Barlow Condensed';color:#e9e7ec;text-align:right;line-height:1.05}
.past-rec small{display:block;font:800 8px 'DM Sans';letter-spacing:.6px;color:#8e8c95;text-transform:uppercase}
@media(max-width:700px){.pf-grid{grid-template-columns:1fr}}
/* ------------------------------------------------------------ Account link badge & Hub ------------------------------------------------------------ */
.link-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#9fe0ad;background:#16301d;border:1px solid #2f5c3b;border-radius:3px;padding:3px 7px}
.link-badge.none{color:#a09ea7;background:#26262e;border-color:#3a3a44}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #2e2e36}
.link-row:last-child{border:0}
.link-row select{background:#101014;border:1px solid #3a3a42;border-radius:5px;padding:8px;color:#fff;width:100%}
.acct-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.acct-user-card{padding:22px;display:flex;flex-direction:column;gap:14px;background:#17171d}
.acct-section-box{background:#121217;border:1px solid #2d2d38;border-radius:8px;padding:14px}
.acct-hub-card{padding:22px;background:#17171d}
.acct-hub-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;border-bottom:1px solid #2b2b35;padding-bottom:14px}
.acct-tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.acct-tool-card{display:flex;flex-direction:column;justify-content:space-between;min-height:175px;background:#131318;border:1px solid #2d2d38;border-radius:8px;padding:16px;transition:border-color .18s,transform .18s;cursor:pointer}
.acct-tool-card:hover{border-color:#5c242c;transform:translateY(-2px);background:#161620}
.acct-tool-icon{font-size:24px;margin-bottom:8px}
.acct-tool-body{flex:1;display:flex;flex-direction:column}
.acct-tool-body h4{font:800 17px 'Barlow Condensed';letter-spacing:.4px;margin:0 0 4px;color:#f5f3f0}
.acct-tool-body p{font-size:11px;color:#9d9ba4;line-height:1.45;margin:0 0 12px;min-height:32px}
.acct-tool-card button{margin-top:auto;width:100%}
@media(max-width:860px){.acct-grid{grid-template-columns:1fr}}

.badge-pill:hover{transform:translateY(-1px)}

.badge-pill.orange{background:#381a10;color:#ff9066;border:1px solid #7a3520}

/* ------------------------------------------------------------ Madden / FIFA Style OVR Cards & Badges ------------------------------------------------------------ */
.ovr-card-bronze{background:linear-gradient(145deg,#2e1e12 0%,#19120c 60%,#26170d 100%)!important;border:2px solid #8c592e!important;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.ovr-card-silver{background:linear-gradient(145deg,#242630 0%,#171820 60%,#20222a 100%)!important;border:2px solid #72768a!important;box-shadow:0 8px 24px rgba(0,0,0,0.5),0 0 12px rgba(180,185,205,0.15)}
.ovr-card-gold{background:linear-gradient(145deg,#36280a 0%,#1a1405 60%,#2e2208 100%)!important;border:2px solid #e0ad2b!important;box-shadow:0 8px 24px rgba(0,0,0,0.5),0 0 16px rgba(224,173,43,0.3)}
.ovr-card-elite{background:linear-gradient(145deg,#420f16 0%,#1c0609 50%,#3d0811 100%)!important;border:2px solid #ff404a!important;box-shadow:0 8px 28px rgba(0,0,0,0.6),0 0 20px rgba(239,48,56,0.55)!important}
.ovr-badge-pill{font:800 13px/1 'Barlow Condensed';letter-spacing:.4px;padding:4px 8px;min-width:34px;justify-content:center;text-align:center;border-radius:4px;display:inline-flex;align-items:center;gap:2px;vertical-align:middle;font-variant-numeric:tabular-nums}
.ovr-badge-pill.ovr-elite{background:linear-gradient(135deg,#ef3038,#b51821);color:#fff;border:1px solid #ff8087;box-shadow:0 0 8px rgba(239,48,56,0.6)}
.ovr-badge-pill.ovr-gold{background:linear-gradient(135deg,#e6b800,#a68000);color:#fff;border:1px solid #ffe066;box-shadow:0 0 6px rgba(255,209,102,0.4)}
.ovr-badge-pill.ovr-silver{background:linear-gradient(135deg,#6d7185,#464957);color:#fff;border:1px solid #a8abb9}
.ovr-badge-pill.ovr-bronze{background:linear-gradient(135deg,#8c542a,#543015);color:#eed;border:1px solid #b87747}

.hof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:24px}
.hof-card{padding:18px;background:#17171d;border:1px solid #2d2d38;border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.hof-card:hover{transform:translateY(-2px)}
.hof-card.hof-glow-ovr{border-color:#ef3038;background:linear-gradient(135deg,#301016,#16161c 65%);box-shadow:0 0 20px rgba(239,48,56,0.28),inset 0 0 12px rgba(239,48,56,0.08)}
.hof-card.hof-glow-ovr:hover{border-color:#ff5c64;box-shadow:0 0 28px rgba(239,48,56,0.48)}
.hof-card.hof-glow-win-streak{border-color:#ff9f1c;background:linear-gradient(135deg,#331e0a,#16161c 65%);box-shadow:0 0 20px rgba(255,159,28,0.28),inset 0 0 12px rgba(255,159,28,0.08)}
.hof-card.hof-glow-win-streak:hover{border-color:#ffb74d;box-shadow:0 0 28px rgba(255,159,28,0.48)}
.hof-card.hof-glow-active-streak{border-color:#ffd166;background:linear-gradient(135deg,#2e240c,#16161c 65%);box-shadow:0 0 20px rgba(255,209,102,0.28),inset 0 0 12px rgba(255,209,102,0.08)}
.hof-card.hof-glow-active-streak:hover{border-color:#ffe082;box-shadow:0 0 28px rgba(255,209,102,0.48)}
.hof-card.hof-glow-titles{border-color:#e0ad2b;background:linear-gradient(135deg,#36280a,#16161c 65%);box-shadow:0 0 20px rgba(224,173,43,0.30),inset 0 0 12px rgba(224,173,43,0.10)}
.hof-card.hof-glow-titles:hover{border-color:#ffd54f;box-shadow:0 0 28px rgba(224,173,43,0.50)}
.hof-card.hof-glow-topcut{border-color:#a855f7;background:linear-gradient(135deg,#251233,#16161c 65%);box-shadow:0 0 20px rgba(168,85,247,0.28),inset 0 0 12px rgba(168,85,247,0.08)}
.hof-card.hof-glow-topcut:hover{border-color:#c084fc;box-shadow:0 0 28px rgba(168,85,247,0.48)}
.hof-card.hof-glow-wins{border-color:#4bdd91;background:linear-gradient(135deg,#102e1c,#16161c 65%);box-shadow:0 0 20px rgba(75,221,145,0.28),inset 0 0 12px rgba(75,221,145,0.08)}
.hof-card.hof-glow-wins:hover{border-color:#6ee7b7;box-shadow:0 0 28px rgba(75,221,145,0.48)}
.hof-card.hof-glow-cold-streak{border-color:#38bdf8;background:linear-gradient(135deg,#0e2738,#16161c 65%);box-shadow:0 0 20px rgba(56,189,248,0.32),inset 0 0 12px rgba(56,189,248,0.10)}
.hof-card.hof-glow-cold-streak:hover{border-color:#7dd3fc;box-shadow:0 0 28px rgba(56,189,248,0.52)}
.hof-card.hof-glow-loss-streak{border-color:#f43f5e;background:linear-gradient(135deg,#2e1018,#16161c 65%);box-shadow:0 0 20px rgba(244,63,94,0.28),inset 0 0 12px rgba(244,63,94,0.08)}
.hof-card.hof-glow-loss-streak:hover{border-color:#fb7185;box-shadow:0 0 28px rgba(244,63,94,0.48)}
.hof-card.gold-card{border-color:#6e501e;background:linear-gradient(135deg,#23190d,#16161c 65%)}
.hof-card.red-card{border-color:#6b242e;background:linear-gradient(135deg,#261216,#16161c 65%)}
.hof-card-icon{font-size:26px;margin-bottom:8px}
.hof-card-val{font:800 32px 'Barlow Condensed';line-height:1;margin:4px 0 2px;color:#f5f3f0}
.hof-card-title{font:800 13px 'DM Sans';letter-spacing:.6px;text-transform:uppercase;color:#8e8c95}
.hof-card-holder{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #282832;font-size:12px}

.standings-podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:24px}
.podium-card{background:#17171d;border:1px solid #2d2d38;border-radius:8px;padding:16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s;cursor:pointer}
.podium-card:hover{transform:translateY(-2px)}
.podium-card.rank-1{border-color:#e0ad2b;background:linear-gradient(135deg,#2e2208,#16161c 68%);box-shadow:0 6px 20px rgba(224,173,43,0.15)}

.podium-rank-badge{position:absolute;top:10px;right:12px;font:900 12px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:#8e8c95}
.podium-card.rank-1 .podium-rank-badge{color:#ffd166}
.podium-card.rank-2 .podium-rank-badge{color:#d0d0dc}

.t-player-tile{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#141419;border:1px solid #2e2e38;border-radius:6px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.t-player-tile:hover{border-color:#5c242c;background:#181822}
.t-player-tile:has(input:checked){border-color:var(--red);background:#221317}

.leader.me{background:#241318;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:5px}
.leader .pts{margin-left:auto;font:800 15px 'Barlow Condensed';color:var(--amber)}
.leader-note{font-size:10px;color:#8e8c95;padding-top:11px;line-height:1.5}
/* ------------------------------------------------------------ Live Draft Room & Interactive Draft Board ------------------------------------------------------------ */
/* ------------------------------------------------------------ Live Draft Room & Interactive Draft Board ------------------------------------------------------------ */
.draft-room-layout{display:flex;flex-direction:column;gap:18px;width:100%}
.draft-hud{background:linear-gradient(135deg,#1c1618,#121217 60%);border:1px solid #3d242a;border-radius:10px;padding:18px 20px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,0.5)}
.draft-hud-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.draft-hud-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:stretch}
@media (max-width: 820px){.draft-hud-hero{grid-template-columns:1fr}}

.draft-clock-card{background:linear-gradient(135deg,#2e1217,#17171e 75%);border:2px solid #ef3038;border-radius:8px;padding:16px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 0 24px rgba(239,48,56,0.25),inset 0 0 12px rgba(239,48,56,0.06);position:relative;overflow:hidden}

function handleSpriteError(img){
  if(!img) return;
  let src = img.src || '';
  let stage = +(img.dataset.fallbackStage || 0);

  // Stage 0: Try base pokemon if mega/custom suffix failed
  if(stage === 0){
    img.dataset.fallbackStage = '1';
    if(/-mega[xyz]?\.png$/i.test(src)){
      img.src = src.replace(/-mega[xyz]?\.png$/i, '.png');
      return;
    }
    if(src.includes('lycanroc-midday.png')){
      img.src = src.replace('lycanroc-midday.png', 'lycanroc.png');
      return;
    }
    if(src.includes('/sprites/gen5/')){
      img.src = src.replace('/sprites/gen5/', '/sprites/dex/');
      return;
    }
  }

  // Stage 1: Try Showdown dex directory
  if(stage === 1){
    img.dataset.fallbackStage = '2';
    if(src.includes('/sprites/gen5/')){
      img.src = src.replace('/sprites/gen5/', '/sprites/dex/');
      return;
    }
  }

  // Final fallback to substitute doll
  img.dataset.fallbackStage = '3';
  img.src = 'https://play.pokemonshowdown.com/sprites/dex/substitute.png';
}

    if(s.includes('blaze') || s.includes('fire')) return { name: 'Paldean Tauros (Blaze)', slug: 'tauros-paldeablaze', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/tauros-paldeablaze.png' };
    return { name: 'Paldean Tauros', slug: 'tauros-paldeacombat', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/tauros-paldeacombat.png' };
  }

  // Lycanroc forms
  if(s.includes('lycanroc')){
    if(s.includes('midnight')) return { name: 'Lycanroc-Midnight', slug: 'lycanroc-midnight', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/lycanroc-midnight.png' };
    if(s.includes('dusk')) return { name: 'Lycanroc-Dusk', slug: 'lycanroc-dusk', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/lycanroc-dusk.png' };
    return { name: 'Lycanroc-Midday', slug: 'lycanroc', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/lycanroc.png' };
  }

  // Helper: check prefix/suffix for generic forms (H, A, G, P, T, I, M, O, C, F)
  let cleanName = s.replace(/[()[\]]/g, '').trim();

  // Pattern: [Prefix]-Base OR Base-[Suffix] OR "Hisuian Base"
  // Form tags: H/Hisui, A/Alola, G/Galar, P/Paldea, T/Therian, I/Incarnate, M/Mega, O/Origin, C/Crowned, F/Female
  let formType = null, baseMon = cleanName;

  // 1. Check prefixes like "h-arcanine", "hisui-arcanine", "hisuian arcanine", "t-thundurus", "mega-scizor"
  let prefixMatch = cleanName.match(/^(h|hisui|hisuian|a|alola|alolan|g|galar|galarian|p|paldea|paldean|t|therian|i|incarnate|m|mega|o|origin|c|crowned)[- ]+(.+)$/i);
  if(prefixMatch){
    formType = prefixMatch[1].toLowerCase();
    baseMon = prefixMatch[2].trim();
  } else {
    // 2. Check suffixes like "arcanine-h", "arcanine (h)", "arcanine-hisui", "thundurus-t", "scizor-m", "indeedee-f"
    let suffixMatch = cleanName.match(/^(.+?)[- ]+(h|hisui|hisuian|a|alola|alolan|g|galar|galarian|p|paldea|paldean|t|therian|i|incarnate|m|mega|o|origin|c|crowned|f|female)$/i);
    if(suffixMatch){
      baseMon = suffixMatch[1].trim();
      formType = suffixMatch[2].toLowerCase();
    }
  }

  // Normalize base name capitalization
  let baseClean = baseMon.replace(/[\s-]/g, '');
  let basePretty = baseMon.split(/[\s-]+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

  if(formType){
    // Hisuian
    if(formType === 'h' || formType === 'hisui' || formType === 'hisuian'){
      return { name: `Hisuian ${basePretty}`, slug: `${baseClean}-hisui`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-hisui.png` };
    }
    // Alolan
    if(formType === 'a' || formType === 'alola' || formType === 'alolan'){
      return { name: `Alolan ${basePretty}`, slug: `${baseClean}-alola`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-alola.png` };
    }
    // Galarian
    if(formType === 'g' || formType === 'galar' || formType === 'galarian'){
      return { name: `Galarian ${basePretty}`, slug: `${baseClean}-galar`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-galar.png` };
    }
    // Paldean
    if(formType === 'p' || formType === 'paldea' || formType === 'paldean'){
      if(baseClean === 'tauros') return { name: 'Paldean Tauros', slug: 'tauros-paldeacombat', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/tauros-paldeacombat.png' };
      return { name: `Paldean ${basePretty}`, slug: `${baseClean}-paldea`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-paldea.png` };
    }
    // Therian
    if(formType === 't' || formType === 'therian'){
      return { name: `${basePretty}-Therian`, slug: `${baseClean}-therian`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-therian.png` };
    }
    // Incarnate
    if(formType === 'i' || formType === 'incarnate'){
      return { name: `${basePretty}-Incarnate`, slug: `${baseClean}`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}.png` };
    }
    // Mega
    if(formType === 'm' || formType === 'mega'){
      if(baseClean === 'charizardx' || baseClean === 'charizard-x') return { name: 'Mega Charizard X', slug: 'charizard-megax', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/charizard-megax.png' };
      if(baseClean === 'charizardy' || baseClean === 'charizard-y') return { name: 'Mega Charizard Y', slug: 'charizard-megay', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/charizard-megay.png' };
      if(baseClean === 'mewtwox' || baseClean === 'mewtwo-x') return { name: 'Mega Mewtwo X', slug: 'mewtwo-megax', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/mewtwo-megax.png' };
      if(baseClean === 'mewtwoy' || baseClean === 'mewtwo-y') return { name: 'Mega Mewtwo Y', slug: 'mewtwo-megay', sprite: 'https://play.pokemonshowdown.com/sprites/gen5/mewtwo-megay.png' };

      // Handle custom Mega X / Y / Z with space or hyphen, e.g. "Raichu X", "Absol Z", "Garchomp Z"
      let xyzMatch = baseMon.match(/^(.+?)[- ]+(x|y|z)$/i);
      if(xyzMatch){
        let rootMon = xyzMatch[1].replace(/[\s-]/g, '').toLowerCase();
        let letter = xyzMatch[2].toUpperCase();
        let rootPretty = rootMon.charAt(0).toUpperCase() + rootMon.slice(1);
        let megaSlug = (letter === 'Z') ? `${rootMon}-mega` : `${rootMon}-mega${letter.toLowerCase()}`;
        return { name: `Mega ${rootPretty} ${letter}`, slug: megaSlug, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${megaSlug}.png` };
      }

      return { name: `Mega ${basePretty}`, slug: `${baseClean}-mega`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-mega.png` };
    }
    // Origin
    if(formType === 'o' || formType === 'origin'){
      return { name: `${basePretty}-Origin`, slug: `${baseClean}-origin`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-origin.png` };
    }
    // Crowned
    if(formType === 'c' || formType === 'crowned'){
      return { name: `${basePretty}-Crowned`, slug: `${baseClean}-crowned`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-crowned.png` };
    }
    // Female
    if(formType === 'f' || formType === 'female'){
      return { name: `${basePretty}-F`, slug: `${baseClean}-f`, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${baseClean}-f.png` };
    }
  }

  // Paradox & Tapu multi-word checks without hyphens in Showdown sprites
  const noHyphenWords = [
    'great tusk','scream tail','brute bonnet','flutter mane','slither wing','sandy shocks','roaring moon',
    'walking wake','gouging fire','raging bolt','iron treads','iron bundle','iron hands','iron jugulis',
    'iron moth','iron thorns','iron valiant','iron leaves','iron boulder','iron crown','tapu koko',
    'tapu lele','tapu bulu','tapu fini'
  ];
  if(noHyphenWords.includes(s)){
    let pretty = s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    let slug = s.replace(/\s+/g, '');
    return { name: pretty, slug, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${slug}.png` };
  }

  // General default fallback
  let slug = s.replace(/\s+/g, '-');
  let pretty = raw.replace(/\s*\(\d+.*?\)$/, '').trim();
  return { name: pretty, slug, sprite: `https://play.pokemonshowdown.com/sprites/gen5/${slug}.png` };
}

function getPokemonDatalistHtml(){
  let names = new Set(MASTER_POKEDEX);
  if(typeof draftPool !== 'undefined' && draftPool?.items){
    draftPool.items.forEach(x => { if(x.name) names.add(x.name); });
  }
  Object.values(roster||{}).forEach(arr => { (arr||[]).forEach(m => names.add(m)); });
  Object.values(teamHistory||{}).forEach(arr => { (arr||[]).forEach(h => (h.pokemon||[]).forEach(m => names.add(m))); });
  Object.values(tournamentData||{}).forEach(t => { Object.values(t.rosters||{}).forEach(arr => (arr||[]).forEach(m => names.add(m))); });
  return `<datalist id="allPokemonDatalist">${Array.from(names).sort((a,b)=>a.localeCompare(b)).map(m => `<option value="${esc(m)}">`).join('')}</datalist>`;
}

function snapshotTournamentRosters(t){
  if(!t) return;
  t.rosters = t.rosters || {};
  (t.players || []).forEach(p => {
    let currentMons = (t.rosters[p] && t.rosters[p].length) ? t.rosters[p] : [];
    if(!currentMons.length && t.draftData?.picks){
      currentMons = t.draftData.picks.filter(x => x.player === p).map(x => x.pokemon);
    }
    if(!currentMons.length && (t.status === 'ONGOING' || t.id === ongoingT()?.id)){
      currentMons = roster[p] || [];
    }
    if(currentMons.length > 0){
      t.rosters[p] = [...currentMons];
      teamHistory[p] = teamHistory[p] || [];
      let entry = teamHistory[p].find(x => (x.tournamentId && x.tournamentId === t.id) || x.tournament === t.name || x.tournament === (t.name + ' · ' + t.season) || String(x.tournament).toLowerCase() === String(t.name).toLowerCase());
      if(entry){
        entry.pokemon = [...currentMons];
        entry.tournamentId = t.id;
        if(!entry.team || entry.team === 'No default team'){
          entry.team = teamName(t, p);
        }
      } else {
        teamHistory[p].push({
          tournament: t.name,
          tournamentId: t.id,
          team: teamName(t, p),
          pokemon: [...currentMons]
        });
      }
    }
  });
}

function syncActiveRostersWithTournaments(){
  let active = ongoingT();
  let completedTournaments = Object.values(tournamentData).filter(t => t.status === 'COMPLETE');
  let validTournamentIds = new Set(Object.keys(tournamentData));
  let validTournamentNames = new Set(Object.values(tournamentData).map(t => String(t.name).toLowerCase().trim()));

  // 1. Ensure all completed tournaments are properly snapshotted in teamHistory
  completedTournaments.forEach(t => {
    snapshotTournamentRosters(t);
  });

  // 2. Clean up orphaned teamHistory entries for tournaments that no longer exist
  Object.keys(teamHistory).forEach(p => {
    if(Array.isArray(teamHistory[p])){
      teamHistory[p] = teamHistory[p].filter(entry => {
        if(entry.tournamentId && !validTournamentIds.has(entry.tournamentId)) return false;
        if(!entry.tournamentId && !validTournamentNames.has(String(entry.tournament).toLowerCase().trim())) return false;
        return true;
      });
    }
  });

  // 3. Reconcile active rosters (roster[p])
  Object.keys(profiles).forEach(p => {
    if(active && (active.players || []).includes(p)){
      // Ongoing tournament participant: active roster contains this ongoing tournament's squad
      let activeMons = (active.rosters?.[p] && active.rosters[p].length) ? active.rosters[p] : [];
      if(!activeMons.length && active.draftData?.picks){
        activeMons = active.draftData.picks.filter(x => x.player === p).map(x => x.pokemon);
      }
      roster[p] = [...activeMons];
    } else {
      // Not in an ongoing tournament or NO tournament ongoing at all:
      // Active roster should be empty (so past tournament mons only exist in past tournament history)
      roster[p] = [];
    }
  });
}

function getTournamentRoster(p, t){
  if(!t) return [];
  if(t.rosters?.[p]?.length) return t.rosters[p];
  let h = (teamHistory[p]||[]).find(x => (x.tournamentId && x.tournamentId === t.id) || x.tournament === t.name || x.tournament === (t.name + ' · ' + t.season) || String(x.tournament).toLowerCase() === String(t.name).toLowerCase());
  if(h?.pokemon?.length) return h.pokemon;
  if(t.draftData?.picks){
    let draftMons = t.draftData.picks.filter(x => x.player === p).map(x => x.pokemon);
    if(draftMons.length) return draftMons;
  }
  let activeId = ongoingT()?.id;
  if((t.id === activeId || t.status === 'ONGOING') && roster[p]?.length) return roster[p];
  return [];
}

  if(!v) return;
  roster[p] = roster[p] || [];
  roster[p].push(v);
  
  let active = ongoingT();
  if(active && (active.players||[]).includes(p)){
    active.rosters = active.rosters || {};
    active.rosters[p] = [...roster[p]];
    teamHistory[p] = teamHistory[p] || [];
    let h = teamHistory[p].find(x => (x.tournamentId && x.tournamentId === active.id) || x.tournament === active.name || x.tournament === (active.name + ' · ' + active.season) || String(x.tournament).toLowerCase() === String(active.name).toLowerCase());
    if(h){
      h.pokemon = [...roster[p]];
      h.team = teamName(active, p);
    } else {
      teamHistory[p].push({ tournament: active.name, tournamentId: active.id, team: teamName(active, p), pokemon: [...roster[p]] });
    }
    let histGrid = document.getElementById('histMonGrid_' + active.id);
    if(histGrid) histGrid.innerHTML = renderTournamentRosterGrid(p, active.id);
    let histCount = document.getElementById('histCount_' + active.id);

  persistLeague();

  let rList = document.querySelector('#rosterList');
  if(rList) rList.innerHTML = rosterList(p);
  let countEl = document.querySelector('#activeRosterCount');
  if(countEl) countEl.textContent = `${(roster[p]||[]).length} Pokémon`;

  if(input){
    input.value = '';
    updateMonAddPreview('', 'newMonPreview');
    input.focus();
  }
}

  let canEdit = moderator || (sessionUser && sessionUser === accountForPlayer(p));
  if(!tMons.length){
    return `<div class="pf-empty" style="padding:14px;border:1px dashed #2a2a38;background:#0d0d12;border-radius:6px;margin-bottom:8px">
      <span style="font-size:11px;color:#8a8894">No Pokémon recorded for this tournament roster yet.</span>
    </div>`;
  }
  return `<div class="mon-grid" style="grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px">
    ${tMons.map((m, idx) => `
      <div class="mon-chip historic ${canEdit ? 'clickable' : ''}" style="padding:6px 8px;border-radius:6px" ${canEdit ? `onclick="openReplaceMonModal('${jsArg(p)}', ${idx}, '${jsArg(t.id)}')" title="Click to replace ${esc(m)}"` : ''}>

          <span style="font:800 12px 'Barlow Condensed';color:#f5f3f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block">${esc(m)}</span>
        </div>
        ${canEdit ? `
          <div style="display:flex;align-items:center;gap:2px;flex:none">
            <button class="swap-icon" title="Replace ${esc(m)}" onclick="event.stopPropagation();openReplaceMonModal('${jsArg(p)}', ${idx}, '${jsArg(t.id)}')">⇄</button>
            <button class="x" title="Remove ${esc(m)}" onclick="event.stopPropagation();removeTournamentRosterMon('${jsArg(p)}', '${jsArg(t.id)}', ${idx})">×</button>

}

function createTournament(){

function deleteTournament(id){
  let t=tournamentData[id];
  if(!t)return;
  if(!confirm(`Delete "${t.name}" (${t.season})? This cannot be undone.`))return;

  // 1. Remove this tournament's pokemon from active rosters
  let tourneyMonsByPlayer = {};
  (t.players || []).forEach(p => {
    let mons = (t.rosters?.[p] || []);
    if(t.draftData?.picks){
      let draftMons = t.draftData.picks.filter(x => x.player === p).map(x => x.pokemon);
      mons = [...new Set([...mons, ...draftMons])];
    }
    tourneyMonsByPlayer[p] = mons.map(m => m.toLowerCase().trim());
  });

  Object.keys(tourneyMonsByPlayer).forEach(p => {
    let banned = new Set(tourneyMonsByPlayer[p]);
    if(roster[p] && roster[p].length){
      roster[p] = roster[p].filter(m => !banned.has(m.toLowerCase().trim()));
    }
  });

  // 2. Remove team history entries for this deleted tournament
  Object.keys(teamHistory).forEach(p => {
    if(Array.isArray(teamHistory[p])){
      teamHistory[p] = teamHistory[p].filter(x => !(
        (x.tournamentId && x.tournamentId === id) ||
        x.tournament === t.name ||
        x.tournament === `${t.name} · ${t.season}` ||
        String(x.tournament).toLowerCase().trim() === String(t.name).toLowerCase().trim()
      ));
    }
  });

  // 3. Delete tournament from state
  delete tournamentData[id];

  // 4. Sync active rosters so only real ongoing tournament pokemon exist
  syncActiveRostersWithTournaments();

  syncTournamentSeasons();
  if(viewTournament===id){
    viewTournament=ongoingT()?.id||Object.keys(tournamentData)[0]||null;
  }
  rebuildAllPlayerStats();
  persistLeague();
  current = 'Tournaments';
  render();
}

function groupsOf(t){
  if(t.groups && typeof t.groups === 'object' && !Array.isArray(t.groups)) {
    return t.groups;
  }
  let rawCount = t.groupCount || (typeof t.groups === 'number' ? t.groups : 1);
  let count = Math.max(1, Number(rawCount) || 1);
  let names = Array.from({length:count},(_,i)=>'Group '+String.fromCharCode(65+i));
  let buckets = Object.fromEntries(names.map(x=>[x,[]]));
  if(t.groupAssignments){
    Object.entries(t.groupAssignments).forEach(([p,g])=>{if(buckets[g])buckets[g].push(p)});
    (t.players||[]).filter(p=>!Object.hasOwn(t.groupAssignments,p)).forEach((p,i)=>buckets[names[i%count]]?.push(p));
  } else (t.players||[]).forEach((p,i)=>buckets[names[i%count]]?.push(p));
  return buckets;
}

function rebuildSchedulePreserving(t){

  (t.matches||[]).forEach(m=>{
    old[[m.group||'Group A', m.a, m.b].sort().join('|')] = m;

  let fresh = groupSchedule(t);
  fresh.forEach(m=>{
    let key = [m.group||'Group A', m.a, m.b].sort().join('|');
    let prior = old[key];
    if(prior){
      if(prior.a === m.a && prior.b === m.b){
        m.as = prior.as;
        m.bs = prior.bs;
      } else if(prior.a === m.b && prior.b === m.a){
        m.as = prior.bs;
        m.bs = prior.as;
      } else {
        m.as = prior.as;
        m.bs = prior.bs;
      }
      m.date = prior.date;
    }
  });
  t.matches = fresh;
}

function sortedTournamentsChronological(){

    let sa=Number(String(a.season||'').replace(/\D/g,''))||0;

async function getTopCutStageData(t){
  let h=hydrateTopCutManager(t);
  if(!h)return null;
  try{return await h.manager.get.stageData(0)}catch(e){return null}
}

function topCutMatchTitle(data,m){
  let group=data.group?.find(g=>g.id===m.group_id);
  if(!group)return 'Match';
  let roundsInGroup=(data.round||[]).filter(r=>r.group_id===m.group_id).sort((a,b)=>a.number-b.number);
  let round=data.round?.find(r=>r.id===m.round_id);
  if(!round)return 'Match';
  let roundCount=roundsInGroup.length;
  let matchesInRound=(data.match||[]).filter(x=>x.round_id===m.round_id);
  let label;
  if(group.number===1)label=round.number===roundCount?'Winners Final':(roundCount-round.number===1?'Winners Semifinal':'Winners Round '+round.number);
  else if(group.number===2)label=round.number===roundCount?'Losers Final':'Losers Round '+round.number;
  else label=round.number===1?'Grand Final':'Bracket Reset';
  if(matchesInRound.length>1)label+=' · Match '+m.number;
  return label;
}

async function refreshTopCutCache(t){
  if(!t)return;
  let data=await getTopCutStageData(t);
  if(data){
    let nameOf=id=>id==null?null:(data.participant.find(p=>p.id===id)?.name||null);
    let ts=t.topCutMatchTimestamps=t.topCutMatchTimestamps||{};
    let results=[],playable=[];
    data.match.forEach(m=>{
      let p1=nameOf(m.opponent1?.id),p2=nameOf(m.opponent2?.id);
      let hasResult=!!(m.opponent1?.result||m.opponent2?.result);
      if(hasResult&&p1&&p2){
        if(!ts[m.id])ts[m.id]=Date.now();
        results.push({p1,p2,s1:m.opponent1?.score??(m.opponent1?.result==='win'?2:0),s2:m.opponent2?.score??(m.opponent2?.result==='win'?2:0),title:topCutMatchTitle(data,m),matchId:m.id,completedAt:ts[m.id]});
      }else if(p1&&p2&&!hasResult){
        playable.push({id:m.id,title:topCutMatchTitle(data,m),p1,p2});
      }
    });
    let total=data.match.length;
    let done=data.match.filter(m=>m.opponent1?.result||m.opponent2?.result||m.opponent1===null||m.opponent2===null).length;
    let finalGroup=data.group.find(g=>g.number===3);
    let complete=false,champion=null;
    if(!finalGroup){
      let m=data.match[0];
      if(m&&(m.opponent1?.result||m.opponent2?.result)){complete=true;champion=m.opponent1?.result==='win'?nameOf(m.opponent1.id):nameOf(m.opponent2.id)}
    }else{
      try{let h=hydrateTopCutManager(t);let final=await h.manager.get.finalStandings(0);champion=nameOf(final[0].id);complete=true}catch(e){complete=false}
    }
    let participants=data.participant.map(p=>p.name);
    t.topCutCache={total,done,complete,champion,playable,results,participants};
    return;
  }

  // Fallback native cache builder
  let model=getTournamentTopCutModel(t);
  if(model){
    let results=model.completedList.map(m=>({p1:m.p1,p2:m.p2,s1:m.s1,s2:m.s2,title:m.title,completedAt:Date.now()}));
    let participants=model.qualifiers.map(q=>q.name);
    let total=model.wbRounds.reduce((acc,r)=>acc+r.matches.length,0)+model.lbRounds.reduce((acc,r)=>acc+r.matches.length,0)+model.gfMatches.length;
    let done=model.completedList.length;
    let complete=!!model.champion;
    t.topCutCache={total,done,complete,champion:model.champion,playable:[],results,participants};
  }
}
function isKnownPlayer(p){
  if(!p || typeof p !== 'string') return false;
  let s = p.trim();
  if(!s) return false;
  let lower = s.toLowerCase();
  if(lower.startsWith('winner') || lower.startsWith('loser') || lower.startsWith('seed #') || lower.startsWith('seed#') || lower.startsWith('wb ') || lower.startsWith('lb ') || lower === 'tbd' || lower === 'bye' || lower.includes('champion') || lower.includes('finalist') || lower.includes('winner') || lower.includes('loser')) return false;
  return true;
}

function findStageMatch(bmd, groupNum, roundNum, matchNum){
  if(!bmd || !bmd.match || !bmd.group || !bmd.round) return null;
  let group = bmd.group.find(g => g.number === groupNum);
  if(!group) return null;
  let rounds = bmd.round.filter(r => r.group_id === group.id).sort((a,b) => a.number - b.number);
  let round = rounds.find(r => r.number === roundNum);
  if(!round) return null;
  let matches = bmd.match.filter(m => m.round_id === round.id).sort((a,b) => a.number - b.number);
  let m = matches.find(m => m.number === matchNum) || matches[matchNum - 1] || null;
  if(!m) return null;

  let nameOf = id => {
    if(id == null) return null;
    let p = bmd.participant?.find(x => x.id === id);
    return p?.name || null;
  };

  let p1 = nameOf(m.opponent1?.id);
  let p2 = nameOf(m.opponent2?.id);
  let s1 = m.opponent1?.score != null ? Number(m.opponent1.score) : (m.opponent1?.result === 'win' ? 2 : (m.opponent1?.result === 'loss' ? 0 : null));
  let s2 = m.opponent2?.score != null ? Number(m.opponent2.score) : (m.opponent2?.result === 'win' ? 2 : (m.opponent2?.result === 'loss' ? 0 : null));
  let isDone = !!(m.opponent1?.result || m.opponent2?.result || (s1 != null && s2 != null && s1 !== s2));
  let winner = isDone ? (m.opponent1?.result === 'win' || (s1 > s2) ? p1 : p2) : null;
  let loser = isDone ? (winner === p1 ? p2 : p1) : null;

  return {
    id: m.id,
    p1,
    p2,
    s1,
    s2,
    isDone,
    winner,
    loser,
    raw: m
  };
}

function getTournamentTopCutModel(t){
  if(!t) return null;
  let isPreview = (!t.bracketManagerData && t.phase!=='topcut' && t.status==='ONGOING');
  
  let qualifiers=[];
  if(t.bracketManagerData?.participant?.length){
    qualifiers=t.bracketManagerData.participant.map((pt,idx)=>({name:pt.name,seed:idx+1}));
  }else if(t.topCutCache?.participants?.length){
    qualifiers=t.topCutCache.participants.map((name,idx)=>({name,seed:idx+1}));
  }else{
    qualifiers=qualified(t).map((x,idx)=>({name:x.p,seed:idx+1,group:x.group}));
  }

  let bmd = t.bracketManagerData;
  let count = qualifiers.length > 4 ? 8 : (qualifiers.length > 2 ? 4 : 2);
  let seededNames = qualifiers.map(q => q.name);
  while(seededNames.length < count) seededNames.push(null);

  function applyStageMatch(matchObj, sm){
    if(!sm) return;
    matchObj.actualMatchId = sm.id;
    if(sm.p1 != null) matchObj.p1 = sm.p1;
    else if(bmd) matchObj.p1 = null;
    if(sm.p2 != null) matchObj.p2 = sm.p2;
    else if(bmd) matchObj.p2 = null;
    matchObj.s1 = sm.s1;
    matchObj.s2 = sm.s2;
    matchObj.isDone = sm.isDone;
    matchObj.winner = sm.winner;
    matchObj.loser = sm.loser;
  }

  let wbRounds = [];
  let lbRounds = [];
  let gfMatches = [];

  if(count === 8){
    let p8Label = qualifiers.length <= 7 ? 'BYE' : 'Seed #8';
    let p7Label = qualifiers.length <= 6 ? 'BYE' : 'Seed #7';
    let wb1Matches = [
      { id:'wb1', title:'WB Quarterfinal 1', p1:seededNames[0]||'Seed #1', p1Seed:1, p2:seededNames[7]||p8Label, p2Seed:8, originP1:'Seed #1', originP2:p8Label },
      { id:'wb2', title:'WB Quarterfinal 2', p1:seededNames[3]||'Seed #4', p1Seed:4, p2:seededNames[4]||'Seed #5', p2Seed:5, originP1:'Seed #4', originP2:'Seed #5' },
      { id:'wb3', title:'WB Quarterfinal 3', p1:seededNames[1]||'Seed #2', p1Seed:2, p2:seededNames[6]||p7Label, p2Seed:7, originP1:'Seed #2', originP2:p7Label },
      { id:'wb4', title:'WB Quarterfinal 4', p1:seededNames[2]||'Seed #3', p1Seed:3, p2:seededNames[5]||'Seed #6', p2Seed:6, originP1:'Seed #3', originP2:'Seed #6' },
    ];
    [1, 2, 3, 4].forEach((num, idx)=>{
      let sm = findStageMatch(bmd, 1, 1, num);
      if(sm){
        applyStageMatch(wb1Matches[idx], sm);
      } else if(wb1Matches[idx].p2 === 'BYE' && wb1Matches[idx].p1 && isKnownPlayer(wb1Matches[idx].p1)){
        wb1Matches[idx].isDone = true;
        wb1Matches[idx].winner = wb1Matches[idx].p1;
        wb1Matches[idx].loser = null;
        wb1Matches[idx].s1 = 2;
        wb1Matches[idx].s2 = 0;
      }
    });
    wbRounds.push({ title:'Quarterfinals', name:'Round 1', matches:wb1Matches });

    let wb2Matches = [
      { id:'wb5', title:'WB Semifinal 1', p1:wb1Matches[0].winner||'Winner QF 1', p2:wb1Matches[1].winner||'Winner QF 2', originP1:'Winner of QF 1', originP2:'Winner of QF 2' },
      { id:'wb6', title:'WB Semifinal 2', p1:wb1Matches[2].winner||'Winner QF 3', p2:wb1Matches[3].winner||'Winner QF 4', originP1:'Winner of QF 3', originP2:'Winner of QF 4' },
    ];
    [1, 2].forEach((num, idx)=>{
      let sm = findStageMatch(bmd, 1, 2, num);
      if(sm){
        applyStageMatch(wb2Matches[idx], sm);
      }
    });
    wbRounds.push({ title:'Semifinals', name:'Round 2', matches:wb2Matches });

    let wb3Matches = [
      { id:'wb7', title:'Winners Final', p1:wb2Matches[0].winner||'Winner SF 1', p2:wb2Matches[1].winner||'Winner SF 2', originP1:'Winner of SF 1', originP2:'Winner of SF 2' }
    ];
    let smWf = findStageMatch(bmd, 1, 3, 1);
    if(smWf){
      applyStageMatch(wb3Matches[0], smWf);
    }
    wbRounds.push({ title:'Winners Final', name:'Round 3', matches:wb3Matches });

    let qf1Loser = wb1Matches[0].loser || (wb1Matches[0].p2 === 'BYE' ? 'BYE' : 'Loser QF 1');
    let qf2Loser = wb1Matches[1].loser || 'Loser QF 2';
    let qf3Loser = wb1Matches[2].loser || (wb1Matches[2].p2 === 'BYE' ? 'BYE' : 'Loser QF 3');
    let qf4Loser = wb1Matches[3].loser || 'Loser QF 4';

    let lb1Matches = [
      { id:'lb1', title:'LB Round 1 · Match 1', p1:qf1Loser||'BYE', p2:qf2Loser||'Loser QF 2', originP1:'BYE', originP2:'Loser of QF 2' },
      { id:'lb2', title:'LB Round 1 · Match 2', p1:qf3Loser||'BYE', p2:qf4Loser||'Loser QF 4', originP1:'BYE', originP2:'Loser of QF 4' }
    ];
    [1, 2].forEach((num, idx)=>{
      let sm = findStageMatch(bmd, 2, 1, num);
      if(sm){
        applyStageMatch(lb1Matches[idx], sm);
      } else if((lb1Matches[idx].p1 === 'BYE' || !lb1Matches[idx].p1) && lb1Matches[idx].p2 && isKnownPlayer(lb1Matches[idx].p2)){
        lb1Matches[idx].isDone = true;
        lb1Matches[idx].winner = lb1Matches[idx].p2;
        lb1Matches[idx].loser = null;
        lb1Matches[idx].s1 = 0;
        lb1Matches[idx].s2 = 2;
      } else if((lb1Matches[idx].p2 === 'BYE' || !lb1Matches[idx].p2) && lb1Matches[idx].p1 && isKnownPlayer(lb1Matches[idx].p1)){
        lb1Matches[idx].isDone = true;
        lb1Matches[idx].winner = lb1Matches[idx].p1;
        lb1Matches[idx].loser = null;
        lb1Matches[idx].s1 = 2;
        lb1Matches[idx].s2 = 0;
      }
    });
    lbRounds.push({ title:'LB Round 1', name:'Round 1', matches:lb1Matches });

    let lb2Matches = [
      { id:'lb3', title:'LB Round 2 · Match 1', p1:lb1Matches[0]?.winner||'Winner LB R1.1', p2:wb2Matches[1]?.loser||'Loser WB Semi 2', originP1:'Winner of LB R1.1', originP2:'Loser of WB Semi 2' },
      { id:'lb4', title:'LB Round 2 · Match 2', p1:lb1Matches[1]?.winner||'Winner LB R1.2', p2:wb2Matches[0]?.loser||'Loser WB Semi 1', originP1:'Winner of LB R1.2', originP2:'Loser of WB Semi 1' }
    ];
    [1, 2].forEach((num, idx)=>{
      let sm = findStageMatch(bmd, 2, 2, num);
      if(sm){
        applyStageMatch(lb2Matches[idx], sm);
      }
    });
    lbRounds.push({ title:'LB Round 2', name:'Round 2', matches:lb2Matches });

    let lb3Matches = [
      { id:'lb5', title:'Losers Semifinal', p1:lb2Matches[0]?.winner||'Winner LB R2.1', p2:lb2Matches[1]?.winner||'Winner LB R2.2', originP1:'Winner of LB R2.1', originP2:'Winner of LB R2.2' }
    ];
    let smLb3 = findStageMatch(bmd, 2, 3, 1);
    if(smLb3){
      applyStageMatch(lb3Matches[0], smLb3);
    }
    lbRounds.push({ title:'Losers Semifinal', name:'Round 3', matches:lb3Matches });

    let lb4Matches = [
      { id:'lb6', title:'Losers Final', p1:wb3Matches[0]?.loser||'Loser WB Final', p2:lb3Matches[0]?.winner||'Winner LB Semi', originP1:'Loser of WB Final', originP2:'Winner of LB Semi' }
    ];
    let smLb4 = findStageMatch(bmd, 2, 4, 1);
    if(smLb4){
      applyStageMatch(lb4Matches[0], smLb4);
    }
    lbRounds.push({ title:'Losers Final', name:'Round 4', matches:lb4Matches });

    let gf1Match = { id:'gf1', title:'Grand Finals', p1:wb3Matches[0].winner||'WB Champion', p2:lb4Matches[0].winner||'LB Champion', originP1:'WB Champion', originP2:'LB Champion' };
    let smGf = findStageMatch(bmd, 3, 1, 1);
    if(smGf){
      applyStageMatch(gf1Match, smGf);
    }
    gfMatches.push(gf1Match);

    let smGf2 = findStageMatch(bmd, 3, 2, 1);
    let lbWonGf1 = gf1Match.isDone && isKnownPlayer(gf1Match.p1) && isKnownPlayer(gf1Match.p2) && gf1Match.winner === gf1Match.p2;
    if(lbWonGf1 || (smGf2 && smGf2.isDone && smGf2.winner)){
      let gf2Match = {
        id:'gf2',
        title:'Grand Finals · Reset Match',
        p1: smGf2?.p1 || gf1Match.p1,
        p2: smGf2?.p2 || gf1Match.p2,
        originP1:'Upper Bracket Finalist',
        originP2:'Lower Bracket Finalist',
        isReset: true
      };
      if(smGf2){
        applyStageMatch(gf2Match, smGf2);
      }
      gfMatches.push(gf2Match);
    }

  } else {
    let wb1Matches = [
      { id:'wb1', title:'WB Semifinal 1', p1:seededNames[0]||'Seed #1', p1Seed:1, p2:seededNames[3]||'Seed #4', p2Seed:4, originP1:'Seed #1', originP2:'Seed #4' },
      { id:'wb2', title:'WB Semifinal 2', p1:seededNames[1]||'Seed #2', p1Seed:2, p2:seededNames[2]||'Seed #3', p2Seed:3, originP1:'Seed #2', originP2:'Seed #3' }
    ];
    let sm1 = findStageMatch(bmd, 1, 1, 1);
    if(sm1){
      applyStageMatch(wb1Matches[0], sm1);
    }
    let sm2 = findStageMatch(bmd, 1, 1, 2);
    if(sm2){
      applyStageMatch(wb1Matches[1], sm2);
    }
    wbRounds.push({ title:'Semifinals', name:'Round 1', matches:wb1Matches });

    let wb2Matches = [
      { id:'wb3', title:'Winners Final', p1:wb1Matches[0].winner||'Winner Semi 1', p2:wb1Matches[1].winner||'Winner Semi 2', originP1:'Winner of Semi 1', originP2:'Winner of Semi 2' }
    ];
    let smWf = findStageMatch(bmd, 1, 2, 1);
    if(smWf){
      applyStageMatch(wb2Matches[0], smWf);
    }
    wbRounds.push({ title:'Winners Final', name:'Round 2', matches:wb2Matches });

    let lb1Matches = [
      { id:'lb1', title:'LB Round 1', p1:wb1Matches[0].loser||'Loser Semi 1', p2:wb1Matches[1].loser||'Loser Semi 2', originP1:'Loser of Semi 1', originP2:'Loser of Semi 2' }
    ];
    let smLb1 = findStageMatch(bmd, 2, 1, 1);
    if(smLb1){
      applyStageMatch(lb1Matches[0], smLb1);
    }
    lbRounds.push({ title:'LB Round 1', name:'Round 1', matches:lb1Matches });

    let lb2Matches = [
      { id:'lb2', title:'Losers Final', p1:lb1Matches[0].winner||'Winner LB R1', p2:wb2Matches[0].loser||'Loser WB Final', originP1:'Winner of LB R1', originP2:'Loser of WB Final' }
    ];
    let smLb2 = findStageMatch(bmd, 2, 2, 1);
    if(smLb2){
      applyStageMatch(lb2Matches[0], smLb2);
    }
    lbRounds.push({ title:'Losers Final', name:'Round 2', matches:lb2Matches });

    let gf1Match = { id:'gf1', title:'Grand Finals', p1:wb2Matches[0].winner||'WB Champion', p2:lb2Matches[0].winner||'LB Champion', originP1:'WB Champion', originP2:'LB Champion' };
    let smGf = findStageMatch(bmd, 3, 1, 1);
    if(smGf){
      applyStageMatch(gf1Match, smGf);
    }
    gfMatches.push(gf1Match);

    let smGf2 = findStageMatch(bmd, 3, 2, 1);
    let lbWonGf1 = gf1Match.isDone && isKnownPlayer(gf1Match.p1) && isKnownPlayer(gf1Match.p2) && gf1Match.winner === gf1Match.p2;
    if(lbWonGf1 || (smGf2 && smGf2.isDone && smGf2.winner)){
      let gf2Match = {
        id:'gf2',
        title:'Grand Finals · Reset Match',
        p1: smGf2?.p1 || gf1Match.p1,
        p2: smGf2?.p2 || gf1Match.p2,
        originP1:'Upper Bracket Finalist',
        originP2:'Lower Bracket Finalist',
        isReset: true
      };
      if(smGf2){
        applyStageMatch(gf2Match, smGf2);
      }
      gfMatches.push(gf2Match);
    }
  }

  let allBracketMatches = [...wbRounds.flatMap(r=>r.matches), ...lbRounds.flatMap(r=>r.matches), ...gfMatches];
  let completedList = allBracketMatches.filter(m => m.isDone && isKnownPlayer(m.p1) && isKnownPlayer(m.p2) && m.s1 != null && m.s2 != null);

  if(!completedList.length && t.topCutCache?.results?.length){
    t.topCutCache.results.forEach(res=>{
      completedList.push({
        title: res.title || 'Playoff Match',
        p1: res.p1, p2: res.p2, s1: res.s1, s2: res.s2,
        winner: res.s1 > res.s2 ? res.p1 : res.p2,
        loser: res.s1 > res.s2 ? res.p2 : res.p1,
        isDone: true
      });
    });
  }

  let champion = t.champion;
  let runnerUp = null;

  if(gfMatches.length > 1){
    if(gfMatches[1].isDone){
      champion = gfMatches[1].winner;
      runnerUp = gfMatches[1].loser;
    } else {
      champion = null;
      runnerUp = null;
    }
  } else if(gfMatches[0]?.isDone && gfMatches[0].winner === gfMatches[0].p1){
    champion = gfMatches[0].winner;
    runnerUp = gfMatches[0].loser;
  }

  if(!champion && t.topCutCache?.champion && (t.status === 'COMPLETE' || !gfMatches.some(m=>!m.isDone))){
    champion = t.topCutCache.champion;
  }
  if(!runnerUp && champion && gfMatches[0]?.isDone){
    runnerUp = (champion === gfMatches[0].p1) ? gfMatches[0].p2 : gfMatches[0].p1;
  }
  let thirdPlace = (lbRounds[lbRounds.length-1]?.matches[0]?.isDone ? lbRounds[lbRounds.length-1]?.matches[0].loser : null);

  return {
    isPreview,
    qualifiers,
    wbRounds,
    lbRounds,
    gfMatches,
    completedList,
    champion,
    runnerUp,
    thirdPlace
  };
}

async function resetTopCutBracket(){
  let t = (current === 'Tournament Detail' ? activeT() : ongoingT()) || activeT();
  if(!t || !moderator) return;
  if(!confirm("Reset all playoff match scores? This will clear current match results and restart the bracket from the opening round.")) return;
  delete t.bracketManagerData;
  delete t.topCutCache;
  t.topCutMatchTimestamps = {};
  await createTopCutStage(t);
  persistLeague();
  render();
}

function openReseedBracketModal(){
  let t = (current === 'Tournament Detail' ? activeT() : ongoingT()) || activeT();
  if(!t || !moderator) return;

  let autoSeeds = seedTopCut(t).filter(Boolean);
  let currentSeeds = (t.customTopCutSeeding && t.customTopCutSeeding.length) 
    ? t.customTopCutSeeding.slice() 
    : (t.bracketManagerData?.participant?.map(p=>p.name) || autoSeeds);
  
  let count = currentSeeds.length;
  if(count < 2) count = 2;

  let playerOptions = (selectedVal) => {
    return (t.players || []).map(p => `<option value="${esc(p)}" ${p === selectedVal ? 'selected' : ''}>${esc(p)}${autoSeeds.includes(p)?` (Auto: #${autoSeeds.indexOf(p)+1})`:''}</option>`).join('');
  };

  let getPairingPreview = () => {
    if(count > 4){
      return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12px">
        <div style="background:#15151c;border:1px solid #2d2d38;border-radius:4px;padding:8px"><b>Match 1:</b> Seed #1 ${count<8?'(BYE to Semis)':'vs Seed #8'}</div>
        <div style="background:#15151c;border:1px solid #2d2d38;border-radius:4px;padding:8px"><b>Match 2:</b> Seed #4 vs Seed #5</div>
        <div style="background:#15151c;border:1px solid #2d2d38;border-radius:4px;padding:8px"><b>Match 3:</b> Seed #2 ${count<7?'(BYE to Semis)':'vs Seed #7'}</div>
        <div style="background:#15151c;border:1px solid #2d2d38;border-radius:4px;padding:8px"><b>Match 4:</b> Seed #3 vs Seed #6</div>
      </div>`;
    }
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12px">
      <div style="background:#15151c;border:1px solid #2d2d38;border-radius:4px;padding:8px"><b>Semifinal 1:</b> Seed #1 vs Seed #4</div>
      <div style="background:#15151c;border:1px solid #2d2d38;border-radius:4px;padding:8px"><b>Semifinal 2:</b> Seed #2 vs Seed #3</div>

async function applyCustomTopCutSeeding(){
  let t = (current === 'Tournament Detail' ? activeT() : ongoingT()) || activeT();
  if(!t || !moderator) return;

  let selects = [...document.querySelectorAll('.reseed-select')];
  let chosen = selects.map(s => s.value.trim());

  let duplicates = chosen.filter((item, index) => chosen.indexOf(item) !== index);
  if(duplicates.length){
    alert(`Each seed must have a unique player. "${duplicates[0]}" was selected more than once.`);
    return;
  }

  t.customTopCutSeeding = chosen;
  delete t.bracketManagerData;
  delete t.topCutCache;
  t.topCutMatchTimestamps = {};
  await createTopCutStage(t);
  persistLeague();
  closeModal();
  render();
}

  delete t.topCutCache;

async function saveTopCutScore(matchId){
  matchId = typeof matchId === 'string' && !isNaN(+matchId) ? +matchId : matchId;
  let t = (current === 'Tournament Detail' ? activeT() : ongoingT()) || activeT();
  if(!t) return;
  let h = hydrateTopCutManager(t);
  if(!h) return;
  let a = document.querySelector('#topcutScoreA')?.value;
  let b = document.querySelector('#topcutScoreB')?.value;
  let sa = a === '' || a == null ? 0 : +a;
  let sb = b === '' || b == null ? 0 : +b;
  if(sa === sb){
    alert('Top Cut matches cannot end in a tie.');
    return;
  }
  try{
    await h.manager.update.match({
      id: matchId,
      opponent1: { score: sa, result: sa > sb ? 'win' : 'loss' },
      opponent2: { score: sb, result: sb > sa ? 'win' : 'loss' }
    });
  }catch(e){
    alert("This match cannot be changed right now — " + e.message + " If you need to correct it, later dependent matches must be reset first.");
    return;
  }
  t.bracketManagerData = JSON.parse(JSON.stringify(h.storage.data));
  await refreshTopCutCache(t);
  persistLeague();
  closeModal();
  render();
}

    let tops=career.topCuts||0;
    let [w,l]=[career.wins,career.losses];

    // Detailed Placement Points from Tournament Finishes (Scaled by field size & round advancement)
    let finishPoints = 0;
    let tfList = s.tournamentFinishes || [];
    if(tfList.length > 0){
      tfList.forEach(tf => {
        let place = tf.finish?.place || 999;
        let fSize = Math.max(4, tf.tournament?.players?.length || 8);
        let fMult = Math.min(1.2, Math.max(0.85, Math.sqrt(fSize / 10)));

        // Early exits / bottom half of tournament receive 0 finish points
        if(place >= fSize * 0.65 || (place >= 7 && fSize <= 8) || place >= 100) return;

        let basePts = 0;
        if(place === 1) basePts = 180;        // Champion
        else if(place === 2) basePts = 110;   // 2nd Place / Runner-up
        else if(place === 3) basePts = 75;    // 3rd Place / Losers Finalist
        else if(place === 4) basePts = 50;    // 4th Place / Losers Semifinalist
        else if(place <= 6 && fSize >= 10) basePts = 30; // 5th-6th Place (Top 6 in 10+ field)
        else if(place <= 8 && fSize >= 14) basePts = 15; // 7th-8th Place (Top 8 in 14+ field)
        finishPoints += Math.round(basePts * fMult);
      });
    } else {
      finishPoints = cups.length * 180 + Math.max(0, tops - cups.length) * 45;
    }

    // Modernized ELO Formula: Base 1000 + Finish Points + Net Match Impact (16W / -8L) + Streaks + OVR Form
    let streakBonus = (s.maxWinStreak||0) * 5;
    let ovrImpact = Math.max(0, (ovrObj.ovr - 70) * 4);
    let score = Math.max(0, Math.round(1000 + finishPoints + (w * 16 - l * 8) + streakBonus + ovrImpact));

    return {
      p,
      score,
      ovr:ovrObj.ovr,
      ovrObj,
      champ:cups.length,
      tops,
      record:career.record,
      winPct:career.winPct,
      badges:s.badges||[]
    };
  }).sort((a,b)=>b.score-a.score || b.ovr-a.ovr);
}

window.featuredMatchIdx = 0;

function getFeaturedMatchups(t){
  if(!t) return [];
  if(t.phase === 'topcut'){
    let play = (t.topCutCache?.playable || []).filter(m => m.p1 && m.p2);
    if(play.length) {
      return play.map(m => ({
        a: m.p1,
        b: m.p2,
        label: m.title || 'Top Cut Playoff',
        group: 'TOP CUT PLAYOFFS',
        isTopCut: true,
        matchRef: m
      }));
    }
  }

  let unplayed = (t.matches || []).filter(m => (m.as === '' || m.as == null) && m.a && m.b);
  if(!unplayed.length){
    let all = (t.matches || []).filter(m => m.a && m.b).slice(0, 5);
    return all.map(m => ({
      a: m.a,
      b: m.b,
      label: m.round || m.group || 'Completed Clash',
      group: m.group ? (m.group.toUpperCase() + ' SPOTLIGHT') : 'LEAGUE SPOTLIGHT',
      isTopCut: false,
      matchRef: m
    }));
  }

  let scored = unplayed.map(m => {
    let recA = tournamentRecord(t, m.a).split('-').map(Number);
    let recB = tournamentRecord(t, m.b).split('-').map(Number);
    let wa = recA[0] || 0, la = recA[1] || 0;
    let wb = recB[0] || 0, lb = recB[1] || 0;
    let totalWins = wa + wb;
    let ovrA = calculatePlayerOVR(m.a)?.ovr || 50;
    let ovrB = calculatePlayerOVR(m.b)?.ovr || 50;
    let combinedOvr = ovrA + ovrB;
    let hype = (totalWins * 20) + (combinedOvr * 0.5) - (Math.abs(wa - wb) * 6);
    return {
      match: m,
      hype: hype,
      recA: `${wa}-${la}`,
      recB: `${wb}-${lb}`
    };
  });

  scored.sort((a, b) => b.hype - a.hype);

  return scored.slice(0, 5).map(s => ({
    a: s.match.a,
    b: s.match.b,
    label: s.match.round || s.match.group || 'League Fixture',
    group: s.match.group ? (s.match.group.toUpperCase() + ' DIVISION') : 'MATCHUP OF THE WEEK',
    recA: s.recA,
    recB: s.recB,
    isTopCut: false,
    matchRef: s.match
  }));
}

function tournamentRecord(t,p){
  let w=0,l=0;
  (t.matches||[]).forEach(m=>{
    let a=m.a,b=m.b,sa=m.as,sb=m.bs;
    if(!a||!b||sa===''||sb===''||sa==null||sb==null||+sa===+sb)return;
    if(a===p){if(+sa>+sb)w++;else l++}else if(b===p){if(+sb>+sa)w++;else l++}
  });
  let topResults = t.topCutCache?.results;
  if((!topResults || !topResults.length) && (t.bracketManagerData || t.phase==='topcut' || t.status==='COMPLETE') && typeof getTournamentTopCutModel==='function'){
    let mod = getTournamentTopCutModel(t);
    if(mod && mod.completedList) topResults = mod.completedList.map(m=>({p1:m.p1,p2:m.p2,s1:m.s1,s2:m.s2}));
  }
  (topResults||[]).forEach(m=>{
    let a=m.p1,b=m.p2,sa=m.s1,sb=m.s2;
    if(!a||!b||sa==null||sb==null||+sa===+sb)return;
    if(a===p){if(+sa>+sb)w++;else l++}else if(b===p){if(+sb>+sa)w++;else l++}
  });

}
function playerCareerStats(p){
  let wins=0,losses=0,titles=0,topCuts=0,tournaments=0,championshipCups=[];
  Object.values(tournamentData).forEach(t=>{
    let played=(t.players||[]).includes(p)||(t.matches||[]).some(m=>m.a===p||m.b===p);
    if(!played)return;
    tournaments++;
    let [w,l]=tournamentRecord(t,p).split('-').map(Number);
    wins+=w||0;losses+=l||0;
    if(t.champion===p){
      if(!championshipCups.includes(t.name))championshipCups.push(t.name);
    }
    let isTopCutActual=(t.phase==='topcut'||t.status==='COMPLETE'||!!t.bracketManagerData);
    if(isTopCutActual){
      let inCut=false;
      if(t.topCutCache?.participants?.length)inCut=t.topCutCache.participants.includes(p);
      else if(t.finalStandings)inCut=Object.values(t.finalStandings).some(arr=>arr.slice(0,advancePerGroup(t)).includes(p));
      else if(t.champion===p)inCut=true;

function rebuildAllPlayerStats(){

}

function tournamentTotalMatches(t){
  if(!t) return 0;
  let groupCount = (t.matches || []).length;
  let topCutCount = 0;
  if(t.topCutCache?.results?.length){
    topCutCount = t.topCutCache.results.length;
  } else if(t.bracketManagerData && Array.isArray(t.bracketManagerData.match)){
    topCutCount = t.bracketManagerData.match.filter(m => (m.opponent1 && m.opponent1.id != null && m.opponent2 && m.opponent2.id != null) || m.opponent1?.result || m.opponent2?.result || (m.opponent1?.score != null && m.opponent2?.score != null && +m.opponent1.score !== +m.opponent2.score)).length;
  } else if(t.topCutCache?.done != null && t.topCutCache.done > 0){
    topCutCount = t.topCutCache.done;
  } else if((t.phase === 'topcut' || t.status === 'COMPLETE') && typeof getTournamentTopCutModel === 'function'){
    let mod = getTournamentTopCutModel(t);
    if(mod && mod.completedList){
      topCutCount = mod.completedList.length;
    }
  }
  return groupCount + topCutCount;
}

function compressImage(file, maxWidth=1200, maxHeight=800, quality=0.82){
  return new Promise((resolve, reject) => {
    let reader = new FileReader();
    reader.onload = function(e){
      let img = new Image();
      img.onload = function(){
        let canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if(width > maxWidth || height > maxHeight){
          let ratio = Math.min(maxWidth / width, maxHeight / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }

        canvas.width = width;
        canvas.height = height;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;

function seedTopCut(t){let groups=Object.keys(groupsOf(t)),per=advancePerGroup(t),entries=[];for(let rank=0;rank<per;rank++)groups.forEach(g=>{let x=getStand(t,g)[rank];if(x)entries.push(x.p)});return entries}

  let groups=groupsOf(t),groupOf=p=>{for(let k in groups)if(groups[k].includes(p))return k;return null};

function isMathematicallyClinched(t,p){let g=Object.entries(groupsOf(t)).find(([,ps])=>ps.includes(p))?.[0];if(!g)return false;let ps=groupsOf(t)[g],cut=advancePerGroup(t);if(ps.length<=cut)return true;if(isGroupComplete(t,g))return getStand(t,g).findIndex(x=>x.p===p)<cut;let wins={},remaining={};ps.forEach(x=>{wins[x]=0;remaining[x]=0});groupMatches(t,g).forEach(m=>{if(m.as!==''&&m.as!=null&&m.bs!==''&&m.bs!=null){if(+m.as>+m.bs)wins[m.a]++;else if(+m.bs>+m.as)wins[m.b]++}else{remaining[m.a]=(remaining[m.a]||0)+1;remaining[m.b]=(remaining[m.b]||0)+1}});let minWins=wins[p]||0;let othersWhoCanReach=ps.filter(x=>x!==p&&((wins[x]||0)+(remaining[x]||0))>=minWins).length;return othersWhoCanReach<cut}
function getPlayerTournamentPower(p, tourn, cachedLeagueRecs){
  let leagueRecs = cachedLeagueRecs || calculateLeagueRecords();
  let ovrObj = calculatePlayerOVR(p, leagueRecs);
  let ovr = ovrObj.ovr || 70;
  let s = leagueRecs.statsByPlayer[p] || {};
  let elo = s.wins !== undefined ? (1000 + (s.wins - s.losses) * 16 + ((profiles[p]?.cups||[]).length * 40)) : 1000;

  // Tournament group form
  let gEntry = tourn ? Object.entries(groupsOf(tourn)).find(([,ps])=>ps.includes(p)) : null;
