function topCutPredictionBracket(t){
  let model = getTournamentTopCutModel(t);
  if(!model) return '<div class="card empty"><p class="sub">Top Cut bracket data unavailable.</p></div>';

  function getBracketMatchPick(mId, p1, p2){
    let explicitPick = savedPick(t, 'draftdex-bpick-' + mId);
    if(explicitPick && (explicitPick === p1 || explicitPick === p2)){
      return explicitPick;
    }
    return '';
  }

  let predMap = {};
  let count = (model.wbRounds[0]?.matches?.length || 0) * 2;

  // 1. Process Winners Bracket rounds
  (model.wbRounds || []).forEach((r, rIdx) => {
    r.matches.forEach((m, mIdx) => {
      let p1 = m.p1;
      let p2 = m.p2;

      if(count === 8){
        if(rIdx === 1){ // WB Semifinals
          let feed1 = predMap['wb' + (mIdx * 2 + 1)];
          let feed2 = predMap['wb' + (mIdx * 2 + 2)];
          if(feed1?.winner) p1 = feed1.winner;
          if(feed2?.winner) p2 = feed2.winner;
        } else if(rIdx === 2){ // WB Final
          let feed1 = predMap['wb5'];
          let feed2 = predMap['wb6'];
          if(feed1?.winner) p1 = feed1.winner;
          if(feed2?.winner) p2 = feed2.winner;
        }
      } else if(count === 4){
        if(rIdx === 1){ // WB Final (wb3)
          let feed1 = predMap['wb1'];
          let feed2 = predMap['wb2'];
          if(feed1?.winner) p1 = feed1.winner;
          if(feed2?.winner) p2 = feed2.winner;
        }
      }

      let pick = getBracketMatchPick(m.id, p1, p2);
      let isDone = m.isDone && m.winner;
      let winner = (pick === p1 || pick === p2) ? pick : (isDone ? m.winner : null);
      let loser = winner ? (winner === p1 ? p2 : p1) : null;

      predMap[m.id] = {
        id: m.id,
        title: m.title,
        p1, p2,
        p1Seed: m.p1Seed,
        p2Seed: m.p2Seed,
        chosen: pick,
        winner,
        loser,
        isDone,
        officialWinner: m.winner,
        originP1: m.originP1,
        originP2: m.originP2
      };
    });
  });

  // 2. Process Losers Bracket rounds
  (model.lbRounds || []).forEach((r, rIdx) => {
    r.matches.forEach((m, mIdx) => {
      let p1 = m.p1;
      let p2 = m.p2;

      if(count === 8){
        if(rIdx === 0){ // LB R1 (lb1, lb2)
          let wbFeed1 = predMap['wb' + (mIdx * 2 + 1)];
          let wbFeed2 = predMap['wb' + (mIdx * 2 + 2)];
          if(wbFeed1?.loser) p1 = wbFeed1.loser;
          if(wbFeed2?.loser) p2 = wbFeed2.loser;
          if(p1 === 'BYE' && p2 && p2 !== 'BYE') p1 = p2;
        } else if(rIdx === 1){ // LB R2 (lb3, lb4)
          let lbFeed = predMap['lb' + (mIdx + 1)];
          let wbFeed = predMap['wb' + (6 - mIdx)]; // wb6 / wb5
          if(lbFeed?.winner) p1 = lbFeed.winner;
          if(wbFeed?.loser) p2 = wbFeed.loser;
        } else if(rIdx === 2){ // LB Semi (lb5)
          let feed1 = predMap['lb3'];
          let feed2 = predMap['lb4'];
          if(feed1?.winner) p1 = feed1.winner;
          if(feed2?.winner) p2 = feed2.winner;
        } else if(rIdx === 3){ // LB Final (lb6)
          let wfFeed = predMap['wb7'];
          let lbFeed = predMap['lb5'];
          if(wfFeed?.loser) p1 = wfFeed.loser;
          if(lbFeed?.winner) p2 = lbFeed.winner;
        }
      } else if(count === 4){
        if(rIdx === 0){ // LB R1 (lb1)
          let wbFeed1 = predMap['wb1'];
          let wbFeed2 = predMap['wb2'];
          if(wbFeed1?.loser) p1 = wbFeed1.loser;
          if(wbFeed2?.loser) p2 = wbFeed2.loser;
        } else if(rIdx === 1){ // Losers Final (lb2)
          let lbFeed = predMap['lb1'];
          let wfFeed = predMap['wb3']; // Loser of Winners Final!
          if(lbFeed?.winner) p1 = lbFeed.winner;
          if(wfFeed?.loser) p2 = wfFeed.loser;
        }
      }

      let pick = getBracketMatchPick(m.id, p1, p2);
      let isDone = m.isDone && m.winner;
      let winner = (pick === p1 || pick === p2) ? pick : (isDone ? m.winner : null);
      let loser = winner ? (winner === p1 ? p2 : p1) : null;

      predMap[m.id] = {
        id: m.id,
        title: m.title,
        p1, p2,
        p1Seed: m.p1Seed,
        p2Seed: m.p2Seed,
        chosen: pick,
        winner,
        loser,
        isDone,
        officialWinner: m.winner,
        originP1: m.originP1,
        originP2: m.originP2
      };
    });
  });

  // 3. Process Grand Finals (gf1)
  let lastWbMatch = count === 8 ? predMap['wb7'] : (count === 4 ? predMap['wb3'] : predMap['wb1']);
  let lastLbMatch = count === 8 ? predMap['lb6'] : (count === 4 ? predMap['lb2'] : null);

  let gfP1 = lastWbMatch?.winner || model.gfMatches[0]?.p1 || 'Upper Bracket Winner';
  let gfP2 = lastLbMatch?.winner || model.gfMatches[0]?.p2 || 'Lower Bracket Winner';
  let gfId = model.gfMatches[0]?.id || 'gf1';
  let gfPick = getBracketMatchPick(gfId, gfP1, gfP2);
  let gfIsDone = model.gfMatches[0]?.isDone && model.gfMatches[0]?.winner;
  let gfWinner = (gfPick === gfP1 || gfPick === gfP2) ? gfPick : (gfIsDone ? model.gfMatches[0].winner : null);

  predMap[gfId] = {
    id: gfId,
    title: 'Championship Final',
    p1: gfP1,
    p2: gfP2,
    chosen: gfPick,
    winner: gfWinner,
    loser: gfWinner ? (gfWinner === gfP1 ? gfP2 : gfP1) : null,
    isDone: gfIsDone,
    officialWinner: model.gfMatches[0]?.winner,
    originP1: 'Upper Bracket Winner',
    originP2: 'Lower Bracket Winner'
  };

  // 4. Bracket Reset (gf2)
  let isResetRequired = (gfWinner && gfWinner === gfP2 && isKnownPlayer(gfP1) && isKnownPlayer(gfP2));
  let gf2Pick = isResetRequired ? getBracketMatchPick('gf2', gfP1, gfP2) : '';
  let gf2IsDone = model.gfMatches[1]?.isDone && model.gfMatches[1]?.winner;
  let gf2Winner = isResetRequired ? ((gf2Pick === gfP1 || gf2Pick === gfP2) ? gf2Pick : (gf2IsDone ? model.gfMatches[1].winner : null)) : null;

  if(isResetRequired || model.gfMatches[1]){
    predMap['gf2'] = {
      id: 'gf2',
      title: 'Grand Finals · Reset Match',
      p1: gfP1,
      p2: gfP2,
      chosen: gf2Pick,
      winner: gf2Winner,
      loser: gf2Winner ? (gf2Winner === gfP1 ? gfP2 : gfP1) : null,
      isDone: gf2IsDone,
      officialWinner: model.gfMatches[1]?.winner,
      originP1: 'Upper Bracket Finalist',
      originP2: 'Lower Bracket Finalist',
      isReset: true
    };
  }

  let predictedChamp = isResetRequired ? (gf2Winner || gf2Pick || 'TBD') : (gfWinner || 'TBD');

  function renderInteractivePredSlot(mObj, isP1){
    if(!mObj) return '';

      </div>`;
    }

    let isPicked = (mObj.chosen === pName);
    let isHit = mObj.isDone && mObj.officialWinner === pName && isPicked;
    let isMiss = mObj.isDone && mObj.officialWinner && mObj.officialWinner !== pName && isPicked;

    let ovrObj = calculatePlayerOVR(pName);
    let faceArt = profilePictures[pName] ? `url('${esc(profilePictures[pName])}')` : (teamCovers[pName] ? `url('${esc(teamCovers[pName])}')` : fallbackArt(pName));
    let faceLetter = (profilePictures[pName] || teamCovers[pName]) ? '' : esc((pName || '?')[0]);
    let teamStr = teamName(t, pName);

    let isClickable = !mObj.isDone && isReal && isOpponentReal;

    return `<div class="tc-slot ${isClickable ? 'interactive' : ''} ${isPicked ? 'picked' : ''} ${isHit ? 'hit' : (isMiss ? 'miss' : '')}"
      ${isClickable ? `onclick="saveBracketPredictionPick('${jsArg(mId)}', '${jsArg(pName)}')"` : ''}
      title="${mObj.isDone ? 'Match complete' : (!isOpponentReal ? 'Waiting for opponent' : (isPicked ? 'Click to unselect ' + esc(pName) : 'Click to pick ' + esc(pName) + ' to advance'))}">
      <span class="tc-slot-seed">${seed ? `#${seed}` : ''}</span>
      <div class="tc-slot-info">
        <span class="mrow-face" style="background-image:${faceArt};background-size:cover;background-position:center;width:24px;height:24px;font-size:10px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid ${ovrObj.color}">${faceLetter}</span>

          <div style="font:900 24px 'Barlow Condensed';letter-spacing:.6px;color:#f5f3f0;text-transform:uppercase">Top Cut Prediction Bracket</div>

          <div style="font:900 20px 'Barlow Condensed';color:#fff;margin-top:2px">${esc(predictedChamp)}</div>
        </div>

    <div class="card" style="padding:22px;background:#101015;border-color:#2e2e38">

        <div class="tc-bracket-grid">

  let bpickKey = 'draftdex-bpick-' + mId;
  let currentPick = savedPick(t, bpickKey);
  let isTogglingOff = (currentPick === choice);

  try {
    if(isTogglingOff){
      localStorage.removeItem('draftdex-pick-' + t.id + '-' + bpickKey);
    } else {
      localStorage.setItem('draftdex-pick-' + t.id + '-' + bpickKey, choice);
    }
  } catch(e){}

  let question = 'Top Cut Bracket Match · ' + mId;
  updateLocalPredictionInCache(t.id, question, choice, isTogglingOff);

  // Synchronous, instant 0ms UI update!
  if(current === 'Predictions' || detailTab === 'Predictions'){
    render();
  }

  // Fire Supabase sync in background
  if(supabaseClient && sessionUser){
    (async () => {
      try {
        if(isTogglingOff){
          await supabaseClient.from('predictions').delete().match({
            user_id: sessionUser.id,
            tournament_id: t.id,
            prediction_key: question
          });
        } else {
          await supabaseClient.from('predictions').upsert({
            user_id: sessionUser.id,
            tournament_id: t.id,
            prediction_key: question,
            selection: choice
          }, { onConflict: 'user_id,tournament_id,prediction_key' });
        }
      } catch(e){
        console.warn('Bracket prediction background sync error:', e);
      }
    })();
  }
}

/* ------------------------------------------------------------ 4. HALL OF FAME & LEAGUE RECORDS ENGINE ------------------------------------------------------------ */
function getChronologicalMatches(){
  let sortedTournaments=sortedTournamentsChronological();
  let allMatches=[];
  sortedTournaments.forEach((t, tIdx)=>{
    let tBaseTime = (Date.parse(t.start) || (tIdx * 100000000));
    (t.matches||[]).forEach((m,idx)=>{
      if(m.as!==''&&m.bs!==''&&m.as!=null&&m.bs!=null&&+m.as!==+m.bs){
        allMatches.push({
          tournament:t,
          tournamentId:t.id,
          tournamentName:t.name,
          stage:'group',
          a:m.a,
          b:m.b,
          sa:+m.as,
          sb:+m.bs,
          winner:+m.as>+m.bs?m.a:m.b,
          loser:+m.as>+m.bs?m.b:m.a,
          tIdx: tIdx,
          stageOrder: 1,
          time: m.completedAt || (tBaseTime + idx * 1000)
        });
      }
    });

    let topRes = t.topCutCache?.results;
    if((!topRes || !topRes.length) && typeof getTournamentTopCutModel==='function'){
      let mod = getTournamentTopCutModel(t);
      if(mod && mod.completedList) topRes = mod.completedList.map(m=>({p1:m.p1,p2:m.p2,s1:m.s1,s2:m.s2,title:m.title}));
    }
    (topRes||[]).forEach((m,idx)=>{
      if(m.s1!==''&&m.s2!==''&&m.s1!=null&&m.s2!=null&&+m.s1!==+m.s2){
        allMatches.push({
          tournament:t,
          tournamentId:t.id,
          tournamentName:t.name,
          stage:'topcut',
          a:m.p1,
          b:m.p2,
          sa:+m.s1,
          sb:+m.s2,
          winner:+m.s1>+m.s2?m.p1:m.p2,
          loser:+m.s1>+m.s2?m.p2:m.p1,
          tIdx: tIdx,
          stageOrder: 2,
          time: m.completedAt || (tBaseTime + 50000000 + idx * 1000)
        });
      }
    });
  });

  allMatches.sort((a,b)=> a.tIdx - b.tIdx || a.stageOrder - b.stageOrder || (a.time - b.time));
  return {sortedTournaments,allMatches};
}

var isCalculatingRecords = false;
function calculateLeagueRecords(){
  if(isCalculatingRecords){
    return {
      statsByPlayer: {},
      records: {
        maxOvr: { value: 0, holders: [], tournament: '' },
        maxWinStreak: { value: 0, holders: [] },
        activeWinStreak: { value: 0, holders: [] },
        maxTitles: { value: 0, holders: [] },
        maxTopCuts: { value: 0, holders: [] },
        maxCareerWins: { value: 0, holders: [] },
        maxLossStreak: { value: 0, holders: [] },
        activeLossStreak: { value: 0, holders: [] }
      }
    };
  }
  isCalculatingRecords = true;
  try {
    let {sortedTournaments,allMatches}=getChronologicalMatches();
    let allPlayers=Object.keys(profiles);
  sortedTournaments.forEach(t=>(t.players||[]).forEach(p=>{if(!allPlayers.includes(p))allPlayers.push(p)}));

  let statsByPlayer={};
  allPlayers.forEach(p=>{
    statsByPlayer[p]={
      player:p,
      matches:[],
      wins:0,
      losses:0,
      maxWinStreak:0,
      currentWinStreak:0,
      maxLossStreak:0,
      currentLossStreak:0,
      bestGD:-999,
      bestGDTournament:'',
      tournamentFinishes:[],
      badges:[]
    };
  });

  allMatches.forEach(m=>{
    if(statsByPlayer[m.a])statsByPlayer[m.a].matches.push({won:m.winner===m.a,match:m});
    if(statsByPlayer[m.b])statsByPlayer[m.b].matches.push({won:m.winner===m.b,match:m});
  });

  allPlayers.forEach(p=>{
    let s=statsByPlayer[p];
    let curW=0,maxW=0,curL=0,maxL=0;
    s.matches.forEach(item=>{
      if(item.won){
        curW++;
        curL=0;
        if(curW>maxW)maxW=curW;
      }else{
        curL++;
        curW=0;
        if(curL>maxL)maxL=curL;
      }
    });
    s.wins=s.matches.filter(x=>x.won).length;
    s.losses=s.matches.filter(x=>!x.won).length;
    s.maxWinStreak=maxW;
    s.currentWinStreak=curW;
    s.maxLossStreak=maxL;
    s.currentLossStreak=curL;
  });

  sortedTournaments.forEach(t=>{
    let isCompleteOrTopCut=(t.phase==='topcut'||t.status==='COMPLETE'||!!t.bracketManagerData);

    (t.players||[]).forEach(p=>{
      let rec=tournamentRecord(t,p);
      let [w,l]=rec.split('-').map(Number);
      let finish=tournamentFinish(t,p);

      let gEntry=Object.entries(groupsOf(t)).find(([,ps])=>ps.includes(p));
      let gStand=gEntry?getStand(t,gEntry[0]).find(x=>x.p===p):null;
      let gw=gStand?(gStand.w||0):0;
      let gl=gStand?(gStand.l||0):0;
      let gd=gStand?(gStand.gw-gStand.gl):0;
      let finalArr=t.finalStandings?.[gEntry?.[0]]||t.manualStandings?.[gEntry?.[0]];
      let gSeed=Array.isArray(finalArr)&&finalArr.includes(p)?(finalArr.indexOf(p)+1):(gStand?getStand(t,gEntry[0]).indexOf(gStand)+1:0);
      let groupSize=gEntry?groupsOf(t)[gEntry[0]]?.length||4:4;
      let gComplete=isGroupComplete(t,gEntry?.[0])||isCompleteOrTopCut;

      if(statsByPlayer[p]){
        if(gd>statsByPlayer[p].bestGD){
          statsByPlayer[p].bestGD=gd;
          statsByPlayer[p].bestGDTournament=t.name;
        }

        statsByPlayer[p].tournamentFinishes.push({
          tournament:t,
          finish,
          w:w||0,
          l:l||0,
          gw,
          gl,
          gComplete,
          gd,
          gSeed,
          groupSize
        });

        let tMatches = allMatches.filter(m => m.tournamentId === t.id && (m.a === p || m.b === p));
        let playoffMatches = tMatches.filter(m => m.stage === 'topcut');
        let playoffGameWins = playoffMatches.reduce((sum, m) => sum + (m.a === p ? (m.sa || 0) : (m.sb || 0)), 0);
        let playoffGameLosses = playoffMatches.reduce((sum, m) => sum + (m.a === p ? (m.sb || 0) : (m.sa || 0)), 0);
        let totalGamesWon = gw + playoffGameWins;
        let totalGamesLost = gl + playoffGameLosses;

        // Unrivaled: Perfect Tournament (Did not drop a single game in groups or top cut)
        if(finish && finish.place === 1 && totalGamesLost === 0 && totalGamesWon >= 4){
          if(!statsByPlayer[p].badges.some(b => b.id === 'unrivaled-' + t.id)){
            statsByPlayer[p].badges.push({
              id: 'unrivaled-' + t.id,
              icon: '⚜️',
              name: `Unrivaled (${t.name})`,
              desc: `Flawless championship run in ${t.name} without dropping a single game (${totalGamesWon}-0)`,
              category: 'championship',
              color: 'gold'
            });
          }
        }

        // Perfect run / Undefeated Champion (Whole tournament without a match loss)
        if(finish && finish.place === 1 && (l || 0) === 0 && (w || 0) >= 2){
          if(!statsByPlayer[p].badges.some(b => b.id === 'undefeated-champ-' + t.id)){
            statsByPlayer[p].badges.push({
              id: 'undefeated-champ-' + t.id,
              icon: '🌟',
              name: `Undefeated Champ (${t.name})`,
              desc: `Won ${t.name} without dropping a single match (${w}-0)`,
              category: 'championship',
              color: 'gold'
            });
          }
        }

        // Clean Sheet: Flawless in group stage
        if(gComplete && gw >= 2 && gl === 0){
          if(!statsByPlayer[p].badges.some(b => b.id === 'cleansheet-' + t.id)){
            statsByPlayer[p].badges.push({
              id: 'cleansheet-' + t.id,
              icon: '🛡️',
              name: `Clean Sheet (${t.name})`,
              desc: `Flawless group stage without a single match loss (${gw}-0) in ${t.name}`,
              category: 'dominance',
              color: 'teal'
            });
          }
        }

        // Clutch King: Won 4 or more intense Game-3 deciders (2-1 matches) in a tournament
        let clutchWins = tMatches.filter(m => m.winner === p && ((m.sa === 2 && m.sb === 1) || (m.sa === 1 && m.sb === 2))).length;
        if(clutchWins >= 4){
          if(!statsByPlayer[p].badges.some(b => b.id === 'clutch-king-' + t.id)){
            statsByPlayer[p].badges.push({
              id: 'clutch-king-' + t.id,
              icon: '🎯',
              name: `Clutch King (${t.name})`,
              desc: `Won ${clutchWins} intense Game-3 deciders (2-1 matches) in ${t.name}`,
              category: 'performance',
              color: 'purple'
            });
          }
        }

        // Dark Horse: Projected as a Dark Horse by playoff odds before Match 1 and won the Championship
        let isChamp = (t.champion === p) || (finish && finish.place === 1);
        if(!isChamp && typeof getTournamentTopCutModel === 'function'){
          let topCutModel = getTournamentTopCutModel(t);
          let gf = topCutModel?.gfMatches || [];
          let lastGf = gf[gf.length - 1];
          if(lastGf?.isDone && lastGf.winner === p){
            isChamp = true;
          }
        }
        if(isChamp){
          let preOdds = getPreTournamentOdds(t, { statsByPlayer });
          let isDarkHorse = preOdds?.darkHorses?.includes(p);
          if(!isDarkHorse && preOdds?.list){
            let idx = preOdds.list.findIndex(x => x.player === p);
            if(idx >= 3 && ((preOdds.list[idx]?.champPct || 0) >= 3.5 || (idx <= 5 && (preOdds.list[idx]?.champPct || 0) >= 2.5))){
              isDarkHorse = true;
            }
          }
          if(isDarkHorse){
            if(!statsByPlayer[p].badges.some(b => b.id === 'dark-horse-' + t.id)){
              statsByPlayer[p].badges.push({
                id: 'dark-horse-' + t.id,
                icon: '🐴',
                name: `Dark Horse (${t.name})`,
                desc: `Projected as a Dark Horse by pre-tournament odds and went on to win the ${t.name} Championship`,
                category: 'championship',
                color: 'amber'
              });
            }
          }
        }

        // Victim: Went winless in group stage (0 wins in a completed group stage)
        if(gComplete && gw === 0 && gl >= 1){
          if(!statsByPlayer[p].badges.some(b => b.id === 'victim-' + t.id)){
            statsByPlayer[p].badges.push({
              id: 'victim-' + t.id,
              icon: '💀',
              name: `Victim (${t.name})`,
              desc: `Went winless in ${t.name} group stage (0-${gl})`,
              category: 'notoriety',
              color: 'red'
            });
          }
        }

        // Prediction King: Top prediction score in a tournament with predictions scored
        let pk = t.predictionKing || t.predictionLeader || t.predictionWinner;
        if(!pk && predictionScoresCache[t.id]?.rows?.length){
          let accounts = predictionScoresCache[t.id].accounts || [];
          let byId = Object.fromEntries(accounts.map(a => [a.id, a.username]));
          let { rows: board } = scorePredictionRows(t, predictionScoresCache[t.id].rows, id => byId[id] || id);
          if(board.length && board[0].pts > 0){
            pk = board[0].u;
            t.predictionKing = pk;
          }
        }
        let pkPlayer = pk ? ((typeof playerForAccount === 'function' ? playerForAccount(pk) : null) || (profiles[pk] ? pk : null) || pk) : null;
        if(pkPlayer === p){
          if(!statsByPlayer[p].badges.some(b => b.id === 'prediction-king-' + t.id)){
            statsByPlayer[p].badges.push({
              id: 'prediction-king-' + t.id,
              icon: '🔮',
              name: `Prediction King (${t.name})`,
              desc: `Scored the most prediction points in ${t.name}`,
              category: 'predictions',
              color: 'purple'
            });
          }
        }

        // Oracle: Perfect Predictions (100% accuracy across ALL of the tournament's predictions, 0 misses)
        let totalSettledKeys = [];
        (t.matches || []).forEach(m => {
          if(m.as !== '' && m.as != null && m.bs !== '' && m.bs != null){
            totalSettledKeys.push('Who wins: ' + m.a + ' vs ' + m.b);
          }
        });
        if(t.status === 'COMPLETE'){
          Object.keys(groupsOf(t)).forEach(g => {
            totalSettledKeys.push('Who will top ' + g + '?');
          });
          if(t.champion || finish.place === 1){
            totalSettledKeys.push('Who will be the ' + t.name + ' Champion?');
          }
        }
        let topCutModel = getTournamentTopCutModel(t);
        let allBracketMatches = [
          ...(topCutModel.wbRounds || []).flatMap(r => r.matches),
          ...(topCutModel.lbRounds || []).flatMap(r => r.matches),
          ...(topCutModel.gfMatches || [])
        ];
        allBracketMatches.forEach(bm => {
          if(bm.isDone && bm.winner){
            totalSettledKeys.push('draftdex-bpick-' + bm.id);
          }
        });

        let tPredRows = (predictionScoresCache[t.id]?.rows || []).concat(getLocalPredictionRows(t.id));
        if(totalSettledKeys.length >= 4 && tPredRows.length){
          let accounts = predictionScoresCache[t.id]?.accounts || [];
          let byId = Object.fromEntries(accounts.map(a => [a.id, a.username]));
          let pRows = tPredRows.filter(r => {
            let uName = byId[r.user_id] || r.user_id;
            let targetP = (typeof playerForAccount === 'function' ? playerForAccount(uName) : null) || (profiles[uName] ? uName : null) || uName;
            return targetP === p;
          });
          
          let pRowMap = {};
          pRows.forEach(r => {
            pRowMap[r.prediction_key] = r.selection;
          });

          // Must have predicted every settled prediction in the tournament and gotten 100% right
          let allCorrect = totalSettledKeys.every(k => {
            let userChoice = pRowMap[k] || (k.startsWith('draftdex-bpick-') ? pRowMap['Top Cut Bracket Match · ' + k.slice(15)] : null);
            if(!userChoice) return false;
            let outcome = predictionOutcome(t, k);
            return outcome.answer != null && outcome.answer === userChoice;
          });

          if(allCorrect){
            if(!statsByPlayer[p].badges.some(b => b.id === 'oracle-' + t.id)){
              statsByPlayer[p].badges.push({
                id: 'oracle-' + t.id,
                icon: '👁️',
                name: `Oracle (${t.name})`,
                desc: `Predicted 100% of ALL ${t.name} outcomes correctly (${totalSettledKeys.length}/${totalSettledKeys.length} perfect picks, 0 misses)`,
                category: 'predictions',
                color: 'indigo'
              });
            }
          }
        }

        // Cinderella Run: Strict rare miracle award for true underdogs who made an improbable deep playoff run
        if(t.status === 'COMPLETE' && finish && (finish.place === 1 || finish.place === 2)){
          let isTrueUnderdog = (gSeed >= 3) || (gw <= gl) || (gSeed >= 2 && groupSize >= 5);
          let wonAsUnderdog = (finish.place === 1 && isTrueUnderdog);
          let miracleFinalist = (finish.place === 2 && (gSeed >= 3 || (gw <= gl && gSeed >= 2)));

          if(wonAsUnderdog || miracleFinalist){
            if(!statsByPlayer[p].badges.some(b => b.id === 'cinderella-' + t.id)){
              statsByPlayer[p].badges.push({
                id: 'cinderella-' + t.id,
                icon: '✨',
                name: `Cinderella Run (${t.name})`,
                desc: `Underdog miracle run in ${t.name}, advancing from #${gSeed} group seed to ${finish.label} (${finish.note})`,
                category: 'miracle',
                color: 'magenta'
              });
            }
          }
        }
      }
    });
  });

  // Most Improved: Exactly ONE player per tournament (evaluated chronologically from tournament 2 onwards)
  for(let tIdx=1;tIdx<sortedTournaments.length;tIdx++){
    let currT=sortedTournaments[tIdx];
    let candidates=[];

    allPlayers.forEach(p=>{
      let s=statsByPlayer[p];
      if(!s)return;
      let tf=s.tournamentFinishes;
      let currIdx=tf.findIndex(x=>x.tournament.id===currT.id);
      if(currIdx<=0)return; // Must have played in a previous tournament

      let currF=tf[currIdx];
      let prevF=tf[currIdx-1];

      let prevRankVal=prevF.finish.place;
      let currRankVal=currF.finish.place;

      let placeImprovement=prevRankVal-currRankVal;
      let winImprovement=currF.w-prevF.w;
      let gdImprovement=currF.gd-prevF.gd;

      let score=placeImprovement*10+winImprovement*5+gdImprovement;

      if((placeImprovement>0||winImprovement>=2)&&score>0){
        candidates.push({
          p,
          score,
          currF,
          prevF,
          prevTName:prevF.tournament.name,
          currTName:currT.name
        });
      }
    });

    if(candidates.length>0){
      candidates.sort((a,b)=>b.score-a.score);
      let winner=candidates[0];
      if(winner.score>=5){
        statsByPlayer[winner.p].badges.push({
          id:'improved-'+currT.id,
          icon:'🚀',
          name:`Most Improved (${winner.currTName})`,
          desc:`Biggest improvement in ${winner.currTName} (${winner.currF.finish.label}) after ${winner.prevF.finish.label} in ${winner.prevTName}`,
          category:'improvement',
          color:'green'
        });
      }
    }
  }

  // Global Leaders
  let maxWinAll=Math.max(0,...allPlayers.map(p=>statsByPlayer[p].maxWinStreak));
  let maxActiveWinAll=Math.max(0,...allPlayers.map(p=>statsByPlayer[p].currentWinStreak));
  let maxLossAll=Math.max(0,...allPlayers.map(p=>statsByPlayer[p].maxLossStreak));
  let maxActiveLossAll=Math.max(0,...allPlayers.map(p=>statsByPlayer[p].currentLossStreak));
  let maxTitlesAll=Math.max(0,...allPlayers.map(p=>(profiles[p]?.cups||[]).length));
  let maxTopsAll=Math.max(0,...allPlayers.map(p=>Number(profiles[p]?.tops)||0));

  allPlayers.forEach(p=>{
    let s=statsByPlayer[p];
    let career=playerCareerStats(p);

    // All-Time Record Streak King (Permanent Hall of Fame badge for the #1 all-time record holder)
    if(s.maxWinStreak>=3&&s.maxWinStreak===maxWinAll){
      s.badges.push({
        id:'record-win-streak',
        icon:'🔥',
        name:`All-Time Streak King (${s.maxWinStreak}W)`,
        desc:`Holds the all-time league record of ${s.maxWinStreak} consecutive match wins`,
        category:'streak',
        color:'red'
      });
    }

    // Active Win Streak (TEMPORARY: Only shown while the player is currently riding a 3+ match win streak)
    if(s.currentWinStreak>=3){
      s.badges.push({
        id:'active-win-streak',
        icon:'⚡',
        name:`On Fire (${s.currentWinStreak}W)`,
        desc:`Currently riding an active streak of ${s.currentWinStreak} consecutive match wins`,
        category:'streak',
        color:'orange'
      });
    }

    // Active Cold Slump (TEMPORARY: Only shown while the player is on an active 3+ match loss slump)
    if(s.currentLossStreak>=3&&s.currentLossStreak===maxActiveLossAll){
      s.badges.push({
        id:'active-loss-streak',
        icon:'❄️',
        name:`Cold Slump (${s.currentLossStreak}L)`,
        desc:`Current active slump of ${s.currentLossStreak} matches`,
        category:'streak',
        color:'cyan'
      });
    }

    if(career.titles>=2){
      s.badges.push({
        id:'dynasty-badge',
        icon:'🏛️',
        name:`${career.titles}x Dynasty Champion`,
        desc:`Won ${career.titles} League Championships: ${career.championshipCups.join(', ')}`,
        category:'trophy',
        color:'gold'
      });
    }else if(career.titles===1){
      s.badges.push({
        id:'champion-badge',
        icon:'🏆',
        name:'League Champion',
        desc:`Won: ${career.championshipCups.join(', ')}`,
        category:'trophy',
        color:'gold'
      });
    }

    // Triple Crown (Three-Peat): Won 3 consecutive tournament championships in a row
    let playerCompletedTs = sortedTournaments.filter(t => t.status === 'COMPLETE' && (t.players || []).includes(p));
    for(let i = 2; i < playerCompletedTs.length; i++){
      let t1 = playerCompletedTs[i-2], t2 = playerCompletedTs[i-1], t3 = playerCompletedTs[i];
      let w1 = (t1.champion === p || s.tournamentFinishes.find(x => x.tournament.id === t1.id)?.finish?.place === 1);
      let w2 = (t2.champion === p || s.tournamentFinishes.find(x => x.tournament.id === t2.id)?.finish?.place === 1);
      let w3 = (t3.champion === p || s.tournamentFinishes.find(x => x.tournament.id === t3.id)?.finish?.place === 1);
      if(w1 && w2 && w3){
        let badgeId = 'triple-crown-' + t3.id;
        if(!s.badges.some(b => b.id === badgeId)){
          s.badges.push({
            id: badgeId,
            icon: '👑',
            name: `Triple Crown (${t1.name} → ${t3.name})`,
            desc: `Legendary three-peat: Won 3 consecutive tournament championships in a row (${t1.name}, ${t2.name}, ${t3.name})`,
            category: 'championship',
            color: 'gold'
          });
        }
      }
    }

    if(career.topCuts>=5){
      s.badges.push({
        id:'playoff-royalty',
        icon:'🏰',
        name:`${career.topCuts}x Playoff Royalty`,
        desc:`Reached Top Cut in ${career.topCuts} tournaments`,
        category:'playoffs',
        color:'purple'
      });
    }else if(career.topCuts>=3){
      s.badges.push({
        id:'playoff-regular',
        icon:'🏅',
        name:`${career.topCuts}x Playoff Regular`,
        desc:`Reached Top Cut in ${career.topCuts} tournaments`,
        category:'playoffs',
        color:'silver'
      });
    }

    let totalGames=s.wins+s.losses;
    if(totalGames>=5&&career.winPct>=70){
      s.badges.push({
        id:'win-pct-elite',
        icon:'📈',
        name:`${career.winPct}% Win Rate`,
        desc:`Career record of ${career.record} (${career.winPct}% win rate)`,
        category:'efficiency',
        color:'green'
      });
    }

    if(s.bestGD>=5){
      s.badges.push({
        id:'blowout-king',
        icon:'💥',
        name:`+${s.bestGD} GD (${s.bestGDTournament})`,
        desc:`Dominant +${s.bestGD} game differential in ${s.bestGDTournament}`,
        category:'dominance',
        color:'amber'
      });
    }
  });

  let maxOvrAll=0,maxOvrHolders=[],maxOvrTournament='';
  let goatCandidate=null,maxGoatScore=0;
  allPlayers.forEach(p=>{
    let s=statsByPlayer[p];
    let career=playerCareerStats(p);
    let tf = s.tournamentFinishes || [];
    let prof = profiles[p] || {};
    let playerPeak = prof.peakOvr || 0;
    let playerPeakTourney = prof.peakOvrTourney || '';

    // 1. Evaluate historical OVR milestone after each completed tournament appearance
    tf.forEach((finishItem, fIdx) => {
      let subTfs = tf.slice(0, fIdx + 1);
      let tObj = finishItem.tournament;
      let isChampAtTime = (tObj.champion === p);
      let totalWAtTime = subTfs.reduce((sum, x) => sum + (x.w || 0), 0);
      let totalLAtTime = subTfs.reduce((sum, x) => sum + (x.l || 0), 0);

      let simulatedStats = {
        statsByPlayer: {
          [p]: {
            wins: totalWAtTime,
            losses: totalLAtTime,
            maxWinStreak: s.maxWinStreak,
            currentWinStreak: isChampAtTime ? 3 : 0,
            currentLossStreak: 0,
            tournamentFinishes: subTfs
          }
        }
      };
      let histObj = calculatePlayerOVR(p, simulatedStats);
      if(histObj.ovr > playerPeak){
        playerPeak = histObj.ovr;
        let rawSeason = (tObj.season || tObj.name || 'Season 1').replace(/[()]/g, '').trim();
        let seasonMatch = rawSeason.match(/Season\s*\d+/i);
        playerPeakTourney = seasonMatch ? seasonMatch[0].replace(/Season\s*/i, 'Season ') : (rawSeason || 'Season 1');
      }
    });

    // 2. Check current live OVR
    let currentObj = calculatePlayerOVR(p, {statsByPlayer});
    if(currentObj.ovr >= playerPeak){
      playerPeak = currentObj.ovr;
      let lastT = tf[tf.length - 1]?.tournament;
      let rawSeason = (lastT?.season || lastT?.name || 'Season 1').replace(/[()]/g, '').trim();
      let seasonMatch = rawSeason.match(/Season\s*\d+/i);
      playerPeakTourney = seasonMatch ? seasonMatch[0].replace(/Season\s*/i, 'Season ') : (rawSeason || 'Season 1');
    }

    if(playerPeak > (prof.peakOvr || 0)){
      prof.peakOvr = playerPeak;
      prof.peakOvrTourney = playerPeakTourney;
    }

    s.peakOvr = playerPeak;
    s.peakOvrTourney = playerPeakTourney;

    if(playerPeak > maxOvrAll){
      maxOvrAll = playerPeak;
      maxOvrHolders = [p];
      maxOvrTournament = playerPeakTourney;
    } else if(playerPeak === maxOvrAll && maxOvrAll > 0){
      if(!maxOvrHolders.includes(p)) maxOvrHolders.push(p);
    }

    // GOAT determination: high OVR + titles + top cuts
    let goatScore=(currentObj.ovr*2)+(career.titles*30)+(career.topCuts*12)+(s.wins*3);
    if((career.titles>0||career.topCuts>=2||currentObj.ovr>=80)&&goatScore>maxGoatScore){
      maxGoatScore=goatScore;
      goatCandidate=p;
    }
  });

  if(goatCandidate){
    statsByPlayer[goatCandidate].badges.unshift({
      id:'goat-badge',
      icon:'🐐',
      name:'GOAT',
      desc:`The Greatest of All Time: League #1 ranked player with ${profiles[goatCandidate]?.cups?.length||0} championship(s) and dominant career resume`,
      category:'prestige',
      color:'gold'
    });
  }

  let maxCareerWinsAll=0;
  allPlayers.forEach(p=>{
    if(statsByPlayer[p].wins>maxCareerWinsAll)maxCareerWinsAll=statsByPlayer[p].wins;
  });

  // Apply Moderator Custom / Granted Badges & Filter Revoked Badges
  allPlayers.forEach(p=>{
    let s=statsByPlayer[p];
    if(!s)return;
    let prof=profiles[p]||{};
    let granted=(prof.customBadges||prof.grantedBadges||[]);
    let revoked=(prof.revokedBadges||[]);

    if(revoked.length>0){
      s.badges=s.badges.filter(b=>{
        return !revoked.some(r=>{
          if(typeof r === 'object' && r) return r.id === b.id || r.name === b.name;
          return r === b.id || r === b.name;
        });
      });
    }

    granted.forEach(gb=>{
      if(!s.badges.some(b=>b.id===gb.id||b.name===gb.name)){
        s.badges.push(gb);
      }
    });
  });

    return {
      statsByPlayer,
      records:{
        maxOvr:{value:maxOvrAll,holders:maxOvrHolders,tournament:maxOvrTournament},
        maxWinStreak:{value:maxWinAll,holders:allPlayers.filter(p=>statsByPlayer[p].maxWinStreak===maxWinAll&&maxWinAll>0)},
        activeWinStreak:{value:maxActiveWinAll,holders:allPlayers.filter(p=>statsByPlayer[p].currentWinStreak===maxActiveWinAll&&maxActiveWinAll>0)},
        maxTitles:{value:maxTitlesAll,holders:allPlayers.filter(p=>(profiles[p]?.cups||[]).length===maxTitlesAll&&maxTitlesAll>0)},
        maxTopCuts:{value:maxTopsAll,holders:allPlayers.filter(p=>Number(profiles[p]?.tops)===maxTopsAll&&maxTopsAll>0)},
        maxCareerWins:{value:maxCareerWinsAll,holders:allPlayers.filter(p=>statsByPlayer[p].wins===maxCareerWinsAll&&maxCareerWinsAll>0)},
        maxLossStreak:{value:maxLossAll,holders:allPlayers.filter(p=>statsByPlayer[p].maxLossStreak===maxLossAll&&maxLossAll>0)},
        activeLossStreak:{value:maxActiveLossAll,holders:allPlayers.filter(p=>statsByPlayer[p].currentLossStreak===maxActiveLossAll&&maxActiveLossAll>0)}
      }
    };
  } finally {
    isCalculatingRecords = false;
  }
}

function swapGroupPlacements(first,second,targetGroup){
  let t=tournamentData[window.editingTournamentId]||activeT();
  if(!t||!first||!moderator||t.phase==='topcut')return;
  let buckets=groupsOf(t),assign={};
  Object.entries(buckets).forEach(([g,players])=>players.forEach(p=>assign[p]=g));
  let source=assign[first];
  if(second){
    let other=assign[second];assign[first]=other;assign[second]=source;
    if(source===other){let ai=t.players.indexOf(first),bi=t.players.indexOf(second);if(ai>=0&&bi>=0)[t.players[ai],t.players[bi]]=[t.players[bi],t.players[ai]]}
  }else if(targetGroup&&source!==targetGroup){assign[first]=targetGroup}
  t.groupAssignments=assign;rebuildSchedulePreserving(t);persistLeague();openGroupPlacementEditor();render()
}

      visiting an archived tournament the editor opened via activeT()

}

function saveTournamentPlayers(){
  let t=tournamentData[window.editingTournamentId]||activeT();
  if(!t)return;
  if(t.phase==='topcut'){alert('Participants are locked after Top Cut begins.');return}
  let selected=[...document.querySelectorAll('.tPlayerChoice:checked')].map(x=>x.value);
  let newP=document.querySelector('#editNewPlayer').value.trim();
  if(newP){
    if(!profiles[newP]){profiles[newP]={team:'No default team',record:'0-0',tops:0,cups:[]};roster[newP]=[];teamHistory[newP]=[]}
    selected.push(newP);
  }
  if(selected.length<2){alert('A tournament needs at least two players.');return}
  
  let oldPlayersSet = new Set(t.players||[]);
  let newPlayersSet = new Set(selected);
  let playersChanged = oldPlayersSet.size !== newPlayersSet.size || [...oldPlayersSet].some(p => !newPlayersSet.has(p));
  
  if(playersChanged){
    t.players = [...(t.players||[]).filter(p => newPlayersSet.has(p)), ...selected.filter(p => !oldPlayersSet.has(p))];
  }

  t.teamNames=t.teamNames||{};
  /* store real team name overrides; blank clears the override */
  document.querySelectorAll('.tTeamName').forEach(x=>{
    let p=x.dataset.player,v=x.value.trim();
    if(!t.players.includes(p))return;
    if(v)t.teamNames[p]=v;else delete t.teamNames[p];
  });
  Object.keys(t.teamNames).forEach(p=>{if(!t.players.includes(p))delete t.teamNames[p]});
  
  let assign={};
  document.querySelectorAll('.playerGroup').forEach(x=>{if(t.players.includes(x.dataset.player))assign[x.dataset.player]=x.value});
  let groupNames=Object.keys(groupsOf(t));
  t.players.filter(p=>!assign[p]).forEach((p,i)=>assign[p]=groupNames[i%groupNames.length]);
  
  let oldAssignJson = JSON.stringify(t.groupAssignments||{});
  let newAssignJson = JSON.stringify(assign);
  let assignChanged = oldAssignJson !== newAssignJson;
  t.groupAssignments=assign;

  // Never rebuild schedule for completed tournaments or when only team names were edited
  if(t.status !== 'COMPLETE' && (playersChanged || assignChanged)){
    rebuildSchedulePreserving(t);
  }
  
  rebuildAllPlayerStats();
  persistLeague();
  closeModal();
  render();
}

  if(teamStore.key===key)return teamStore;
  let saved=readTeamStore(key);
  teamStore={key,teams:saved?.teams||[],activeId:saved?.activeId||null,updatedAt:saved?.updatedAt||0,adoptedGuest:!!saved?.adoptedGuest};
  /* one-time migration from the old single mock draft */
  if(!teamStore.teams.length){
    let legacy=null;try{legacy=JSON.parse(localStorage.getItem('draftdex-mock-'+key)||'null')}catch{}
    if(legacy?.picks?.length){teamStore.teams=[{id:teamId(),name:'My first team',picks:legacy.picks.map(x=>({name:String(x.name),cost:+x.cost||0}))}];teamStore.activeId=teamStore.teams[0].id;writeTeams(false)}
  }
  /* teams built before signing in follow the FIRST account that signs
     in on this browser; the guest copy is then marked claimed so a
     second account on the same machine cannot see them. */
  if(key!=='guest'&&!teamStore.teams.length&&!teamStore.adoptedGuest){
    let guest=readTeamStore('guest');
    if(guest?.teams?.length&&!guest.claimed){
      teamStore.teams=JSON.parse(JSON.stringify(guest.teams));
      teamStore.activeId=guest.activeId||guest.teams[0].id;
      try{localStorage.setItem('draftdex-teams-guest',JSON.stringify({...guest,claimed:true}))}catch{}
    }
    teamStore.adoptedGuest=true;writeTeams(false);
  }
  if(!teamStore.activeId&&teamStore.teams.length)teamStore.activeId=teamStore.teams[0].id;
  return teamStore
}
function teamId(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

   SPRINT 4: INTERACTIVE LIVE DRAFT ROOM & GOOGLE SHEETS IMPORTER
   ------------------------------------------------------------ */
var draftRoomSubTab = 'room'; // 'room' | 'board' | 'rosters' | 'planner' | 'sheet'
var draftBoardSearch = '';
var draftBoardTierFilter = 'all';
var draftBoardAvailOnly = false;
var draftPendingImport = null;

function ensureTournamentDraft(t){
  if(!t) return null;
  if(!t.draftData){
    t.draftData = {
      status: 'pending',
      pointBudget: 100,
      maxRosterSize: 10,
      order: [...(t.players || [])],
      currentPickIndex: 0,
      board: [],
      picks: []
    };
  }
  if(!t.draftData.order || !t.draftData.order.length){
    t.draftData.order = [...(t.players || [])];
  }
  if(!t.draftData.picks) t.draftData.picks = [];
  if(!t.draftData.board) t.draftData.board = [];
  if(t.draftData.pointBudget === undefined) t.draftData.pointBudget = 100;
  if(t.draftData.maxRosterSize === undefined) t.draftData.maxRosterSize = 10;
  return t.draftData;
}

function getDraftOrderList(t){
  let d = ensureTournamentDraft(t);
  return (d && d.order && d.order.length) ? d.order : (t?.players || []);
}

function getDraftTotalPicks(t){
  let order = getDraftOrderList(t);
  let rounds = t?.draftData?.maxRosterSize || 10;
  return order.length * rounds;
}

function getDraftPickDetails(t, pickIdx){
  let order = getDraftOrderList(t);
  let n = Math.max(1, order.length);
  let round = Math.floor(pickIdx / n) + 1;
  let posInRound = pickIdx % n;
  let isReversed = (round % 2 === 0);
  let player = !isReversed ? order[posInRound] : order[n - 1 - posInRound];
  let pickNumber = pickIdx + 1;
  let pickInRound = posInRound + 1;
  return { round, pickNumber, player, pickIdx, posInRound, pickInRound, isReversed };
}

function getDraftCurrentTurn(t){
  let d = ensureTournamentDraft(t);
  if(!d) return null;
  let totalPicks = getDraftTotalPicks(t);
  let picks = d.picks || [];
  let isComplete = (picks.length >= totalPicks);
  let currentPickDetails = isComplete ? null : getDraftPickDetails(t, picks.length);
  let upcoming = [];
  if(!isComplete){
    for(let i = 1; i <= 8; i++){
      let nextIdx = picks.length + i;
      if(nextIdx < totalPicks){
        upcoming.push(getDraftPickDetails(t, nextIdx));
      }
    }
  }
  let order = getDraftOrderList(t);
  return {
    isComplete,
    status: d.status || (isComplete ? 'completed' : 'pending'),
    totalPicks,
    currentPickNumber: picks.length + 1,
    currentRound: currentPickDetails?.round || Math.ceil(totalPicks / Math.max(1, order.length)),
    player: currentPickDetails?.player || null,
    pickIdx: picks.length,
    upcoming
  };
}

function getDraftCoachStats(t, p){
  let d = ensureTournamentDraft(t);
  let picks = (d?.picks || []).filter(x => x.player === p);
  if(!picks.length && t?.rosters?.[p]?.length){
    picks = t.rosters[p].map((mon, idx) => ({
      round: idx + 1,
      pickNumber: idx + 1,
      player: p,
      pokemon: mon,
      cost: findPokemonCostOnBoard(t, mon)
    }));
  }
  let pointsSpent = picks.reduce((sum, x) => sum + (x.cost || 0), 0);
  let budget = d?.pointBudget || 0;
  let maxSlots = d?.maxRosterSize || Math.max(10, picks.length);
  let remainingBudget = budget > 0 ? (budget - pointsSpent) : null;
  let openSlots = Math.max(0, maxSlots - picks.length);
  let slotsAfterPick = Math.max(0, openSlots - 1);
  let minPointsReserve = slotsAfterPick * 1; // 1 point minimum for each remaining slot
  let maxAffordableCost = (budget > 0 && remainingBudget !== null) ? Math.max(0, remainingBudget - minPointsReserve) : Infinity;

  return {
    player: p,
    picks,
    count: picks.length,
    maxSlots,
    openSlots,
    slotsAfterPick,
    pointsSpent,
    budget,
    remainingBudget,
    minPointsReserve,
    maxAffordableCost,
    isRosterFull: picks.length >= maxSlots
  };
}

function findPokemonCostOnBoard(t, pokemonName){
  let d = ensureTournamentDraft(t);
  if(!d || !d.board) return 0;
  let cleanTarget = (pokemonName || '').toLowerCase().trim();
  for(let tier of d.board){
    for(let mon of (tier.pokemon || [])){
      if(mon.toLowerCase().trim() === cleanTarget){
        return tier.cost || 0;
      }
    }
  }
  return 0;
}

function parseDraftBoardData(rawText){
  if(!rawText || !rawText.trim()){
    return { tiers: [], totalMons: 0, error: 'Empty text provided.' };
  }

  let rawLines = rawText.split(/\r?\n/);
  let lines = rawLines.filter(l => l.trim().length > 0);
  if(!lines.length) return { tiers: [], totalMons: 0, error: 'No data lines found.' };

  let hasTabs = lines.some(l => l.includes('\t'));
  let delimiter = hasTabs ? '\t' : (lines.some(l => l.includes(',')) ? ',' : '\t');

  let grid = lines.map(line => {
    if(delimiter === ','){
      let row = [], inQ = false, cur = '';
      for(let i = 0; i < line.length; i++){
        let c = line[i];
        if(c === '"'){ inQ = !inQ; }
        else if(c === ',' && !inQ){ row.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      row.push(cur.trim());
      return row;
    }
    return line.split('\t').map(c => c.trim());
  });

  function extractPointCost(s){
    if(!s) return null;
    let str = String(s).trim();
    let m = str.match(/^(?:Tier\s*\d+[\s:\-–—]+)?(\d{1,2})\s*(?:pts?|points?|p)?$/i)
         || str.match(/(\d{1,2})\s*(?:pts?|points?|p)\b/i)
         || str.match(/Tier\s*\d+\s*\((\d{1,2})\s*(?:pts?|points?|p)?\)/i);
    if(m) return parseInt(m[1], 10);
    if(/^\d{1,2}$/.test(str)){
      let num = parseInt(str, 10);
      if(num >= 1 && num <= 40) return num;
    }
    return null;
  }

  // Format 1: 2-Column Row-pairs (Pokemon, Cost) or (Cost, Pokemon)
  let isRowPairCandidate = grid.every(r => r.filter(c => c.length > 0).length <= 3) && grid.length >= 3;
  if(isRowPairCandidate){
    let validPairs = 0;
    let map = {};
    grid.forEach(row => {
      let cells = row.filter(c => c.length > 0);
      if(cells.length >= 2){
        let mon = '', cost = null;
        let c0 = extractPointCost(cells[0]);
        let c1 = extractPointCost(cells[1]);
        if(c1 !== null && isNaN(+cells[0])){
          mon = cells[0]; cost = c1;
        } else if(c0 !== null && isNaN(+cells[1])){
          mon = cells[1]; cost = c0;
        }
        if(mon && cost !== null && isNaN(+mon)){
          validPairs++;
          let tierKey = 'cost_' + cost;
          if(!map[tierKey]){
            map[tierKey] = { id: 'tier-' + cost, name: `${cost} Points`, cost: cost, pokemon: [] };
          }
          let clean = formatPokemonDisplayName(mon);
          if(clean && !map[tierKey].pokemon.includes(clean)){
            map[tierKey].pokemon.push(clean);
          }
        }
      }
    });
    if(validPairs >= 4){
      let tiers = Object.values(map).sort((a,b) => b.cost - a.cost);
      let totalMons = tiers.reduce((sum, t) => sum + t.pokemon.length, 0);
      if(totalMons > 0) return { tiers, totalMons, type: 'row-pairs' };
    }
  }

  // Format 2: Multi-Column Table (Google Sheets with sprite columns & merged headers)
  let bestHeaderRowIdx = -1;
  let maxCostsFound = 0;
  for(let r = 0; r < Math.min(grid.length, 12); r++){
    let row = grid[r];
    let costsInRow = 0;
    row.forEach(cell => {
      if(extractPointCost(cell) !== null) costsInRow++;
    });
    if(costsInRow > maxCostsFound){
      maxCostsFound = costsInRow;
      bestHeaderRowIdx = r;
    }
  }

  if(bestHeaderRowIdx >= 0 && maxCostsFound >= 1){
    let headerRow = grid[bestHeaderRowIdx];
    let tierColumns = [];
    headerRow.forEach((cell, colIdx) => {
      let cost = extractPointCost(cell);
      if(cost !== null){
        let name = cell.match(/\b\d+\s*points?\b/i) ? cell : `${cost} Points`;
        tierColumns.push({ colIdx, cost, name });
      }
    });

    if(tierColumns.length > 0){
      let tierMap = {};

      tierColumns.forEach((tCol, i) => {
        let nextColIdx = (i + 1 < tierColumns.length) ? tierColumns[i+1].colIdx : (grid[0]?.length || 100);
        let startCol = tCol.colIdx;
        let endCol = nextColIdx - 1;

        if(!tierMap[tCol.cost]){
          tierMap[tCol.cost] = {
            id: 'tier-' + tCol.cost,
            name: tCol.name,
            cost: tCol.cost,
            pokemon: []
          };
        }

        for(let r = bestHeaderRowIdx + 1; r < grid.length; r++){
          let row = grid[r];
          if(!row) continue;
          for(let c = startCol; c <= Math.min(endCol, row.length - 1); c++){
            let val = row[c];
            if(!val || val.length < 2) continue;
            if(val.startsWith('=') || val.startsWith('http') || val.startsWith('data:')) continue;
            if(/^\d+$/.test(val)) continue;
            if(extractPointCost(val) !== null && val.toLowerCase().includes('point')) continue;

            let clean = formatPokemonDisplayName(val);
            if(clean && clean.length >= 2 && !tierMap[tCol.cost].pokemon.includes(clean)){
              tierMap[tCol.cost].pokemon.push(clean);
            }
          }
        }
      });

      let tiers = Object.values(tierMap)
        .filter(t => t.pokemon.length > 0)
        .sort((a,b) => b.cost - a.cost);
      let totalMons = tiers.reduce((sum, t) => sum + t.pokemon.length, 0);

      if(tiers.length > 0 && totalMons > 0){
        return { tiers, totalMons, type: 'columns' };
      }
    }
  }

  // Format 3: Line Section Headers (e.g. === 16 Points === followed by Pokémon)
  if(!hasTabs){
    let sectionMap = {};
    let curTier = null;
    lines.forEach(line => {
      let trimmed = line.trim();
      let cost = extractPointCost(trimmed);
      if(cost !== null && (trimmed.toLowerCase().includes('point') || trimmed.toLowerCase().includes('tier') || trimmed.startsWith('='))){
        let name = trimmed.replace(/^[\s=*\-#]+|[\s=*\-#]+$/g, '').trim() || `${cost} Points`;
        curTier = { id: 'tier-' + cost, name: name, cost: cost, pokemon: [] };
        if(!sectionMap[cost]){
          sectionMap[cost] = curTier;
        } else {
          curTier = sectionMap[cost];
        }
      } else if(curTier && trimmed.length >= 2 && !trimmed.startsWith('=')){
        let clean = formatPokemonDisplayName(trimmed);
        if(clean && !curTier.pokemon.includes(clean)){
          curTier.pokemon.push(clean);
        }
      }
    });

    let sectionTiers = Object.values(sectionMap).filter(t => t.pokemon.length > 0).sort((a,b) => b.cost - a.cost);
    let totalSectionMons = sectionTiers.reduce((sum, t) => sum + t.pokemon.length, 0);
    if(sectionTiers.length > 0 && totalSectionMons >= 2){
      return { tiers: sectionTiers, totalMons: totalSectionMons, type: 'sections' };
    }
  }

  // Format 4: Fallback Column Scanning
  let maxCols = Math.max(...grid.map(r => r.length));
  let fallbackTiers = [];
  for(let c = 0; c < maxCols; c++){
    let colValues = grid.map(r => r[c]).filter(v => v && v.length > 0);
    if(!colValues.length) continue;
    let header = colValues[0];
    let cost = extractPointCost(header) || Math.max(1, 20 - fallbackTiers.length * 2);
    let mons = [];
    for(let i = 1; i < colValues.length; i++){
      let v = colValues[i];
      if(!v || v.startsWith('=') || /^\d+$/.test(v)) continue;
      let clean = formatPokemonDisplayName(v);
      if(clean && !mons.includes(clean)) mons.push(clean);
    }
    if(mons.length > 0){
      fallbackTiers.push({
        id: 'tier-' + cost + '-' + c,
        name: header.match(/\d+/) ? header : `${cost} Points`,
        cost: cost,
        pokemon: mons
      });
    }
  }

  fallbackTiers.sort((a,b) => b.cost - a.cost);
  let totalMons = fallbackTiers.reduce((sum, t) => sum + t.pokemon.length, 0);
  return { tiers: fallbackTiers, totalMons, type: 'fallback' };
}

function openDraftBoardImporter(tId){
  if(!moderator) return;
  let t = tournamentData[tId] || ongoingT() || activeT();
  if(!t) return;

function moveDraftOrder(tId, idx, dir){
  let t = tournamentData[tId] || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  let order = d.order;
  let target = idx + dir;
  if(target < 0 || target >= order.length) return;
  let temp = order[idx];
  order[idx] = order[target];
  order[target] = temp;
  let host = document.getElementById('draftOrderListContainer');
  if(host) host.innerHTML = renderDraftOrderListRows(order, tId);
}

function randomizeDraftOrder(tId){
  let t = tournamentData[tId] || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  let order = d.order;
  for(let i = order.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    let temp = order[i];
    order[i] = order[j];
    order[j] = temp;
  }
  let host = document.getElementById('draftOrderListContainer');
  if(host) host.innerHTML = renderDraftOrderListRows(order, tId);
}

  let t = tournamentData[tId] || activeT();

  persistLeague();
  closeModal();
  render();
}

function saveRenamedBoardPokemon(tId, oldMonName, cost, tierName){
  if(!moderator) return;
  let t = tournamentData[tId] || ongoingT() || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  if(!d) return;

  let inp = document.getElementById('renameMonInput');
  let newName = inp ? inp.value.trim() : '';
  if(!newName){
    alert('Please enter a valid Pokémon name.');
    return;
  }

  if(newName.toLowerCase() === oldMonName.toLowerCase()){
    openDraftConfirmationModal(tId, oldMonName, cost, tierName);
    return;
  }

  let oldClean = oldMonName.toLowerCase().trim();

  // 1. Update in draft board tiers
  let replacedInBoard = false;
  (d.board || []).forEach(tier => {
    if(Array.isArray(tier.pokemon)){
      for(let i = 0; i < tier.pokemon.length; i++){
        if(tier.pokemon[i].toLowerCase().trim() === oldClean){
          tier.pokemon[i] = newName;
          replacedInBoard = true;
        }
      }
    }
  });

  if(!replacedInBoard && d.board?.length){
    let targetTier = d.board.find(x => x.name === tierName || x.cost === cost) || d.board[0];
    if(targetTier && Array.isArray(targetTier.pokemon)){
      targetTier.pokemon.push(newName);
    }
  }

  // 2. Update in draft picks
  (d.picks || []).forEach(pick => {
    if(pick.pokemon && pick.pokemon.toLowerCase().trim() === oldClean){
      pick.pokemon = newName;
    }
  });

  // 3. Update in tournament rosters
  if(t.rosters){
    Object.keys(t.rosters).forEach(coach => {
      t.rosters[coach] = (t.rosters[coach] || []).map(m => m.toLowerCase().trim() === oldClean ? newName : m);
    });
  }

  // 4. Update in global rosters
  if(typeof roster !== 'undefined'){
    Object.keys(roster).forEach(coach => {
      roster[coach] = (roster[coach] || []).map(m => m.toLowerCase().trim() === oldClean ? newName : m);
    });
  }

  persistLeague();
  render();
  openDraftConfirmationModal(t.id, newName, cost, tierName);
}

  let d = ensureTournamentDraft(t);
  if(!d) return;

  if(d.status === 'paused'){
    alert('The draft is currently paused by a moderator.');
    return;
  }
  if(d.status === 'completed'){
    alert('The draft has already finished!');
    return;
  }

  let turn = getDraftCurrentTurn(t);
  if(turn.isComplete){
    alert('All draft picks have already been made.');
    return;
  }

  let targetPlayer = forcedPlayer || turn.player;
  if(!targetPlayer){
    alert('No player is currently on the clock.');
    return;
  }

  // Account authentication check
  if(!moderator && !forcedPlayer){
    let linked = (typeof playerForAccount === 'function' ? playerForAccount(window.currentAccount?.username) : null) || window.currentAccount?.username;
    if(linked !== targetPlayer){
      alert(`It is currently ${targetPlayer}'s turn to pick. Only ${targetPlayer} or a moderator can draft this Pokémon.`);
      return;
    }
  }

  let alreadyPicked = (d.picks || []).some(x => x.pokemon.toLowerCase().trim() === pokemonName.toLowerCase().trim());
  if(alreadyPicked){
    alert(`${pokemonName} has already been drafted!`);
    return;
  }

  let cost = findPokemonCostOnBoard(t, pokemonName);
  let stats = getDraftCoachStats(t, targetPlayer);

  if(stats.budget > 0 && stats.remainingBudget < cost){
    alert(`${targetPlayer} only has ${stats.remainingBudget} pts remaining, but ${pokemonName} costs ${cost} pts.`);
    return;
  }
  if(stats.budget > 0 && cost > stats.maxAffordableCost){
    alert(`Roster Reserve Guardrail: ${targetPlayer} must keep at least 1 point for every remaining slot (${stats.minPointsReserve} pts for ${stats.slotsAfterPick} slot(s)). Maximum affordable on this pick is ${stats.maxAffordableCost} pts.`);
    return;
  }
  if(stats.count >= stats.maxSlots){
    alert(`${targetPlayer}'s roster is already full (${stats.maxSlots}/${stats.maxSlots} Pokémon).`);
    return;
  }

  d.picks.push({
    round: turn.currentRound,
    pickNumber: turn.currentPickNumber,
    player: targetPlayer,
    pokemon: pokemonName,
    cost: cost,
    timestamp: Date.now()
  });

  // Automatically place Pokémon onto active tournament roster!
  if(!t.rosters) t.rosters = {};
  if(!t.rosters[targetPlayer]) t.rosters[targetPlayer] = [];
  if(!t.rosters[targetPlayer].includes(pokemonName)){
    t.rosters[targetPlayer].push(pokemonName);
  }

  if(!roster[targetPlayer]) roster[targetPlayer] = [];
  if(!roster[targetPlayer].includes(pokemonName)){
    roster[targetPlayer].push(pokemonName);
  }

  if(d.picks.length >= getDraftTotalPicks(t)){
    d.status = 'completed';
  }

  persistLeague();
  render();
}

function undoDraftPick(tId){
  if(!moderator) return;
  let t = tournamentData[tId] || activeT();
  if(!t || !t.draftData || !t.draftData.picks?.length) return;
  if(!confirm('Undo the last draft pick?')) return;

  let lastPick = t.draftData.picks.pop();
  if(lastPick){
    let p = lastPick.player;
    let mon = lastPick.pokemon;
    if(t.rosters?.[p]){
      t.rosters[p] = t.rosters[p].filter(m => m.toLowerCase().trim() !== mon.toLowerCase().trim());
    }
    if(roster[p]){
      roster[p] = roster[p].filter(m => m.toLowerCase().trim() !== mon.toLowerCase().trim());
    }
    if(t.draftData.status === 'completed'){
      t.draftData.status = 'active';
    }
  }

  persistLeague();
  render();
}

function startDraft(tId){
  if(!moderator) return;
  let t = tournamentData[tId] || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  d.status = 'active';
  persistLeague();
  render();
}

function pauseDraft(tId){
  if(!moderator) return;
  let t = tournamentData[tId] || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  d.status = 'paused';
  persistLeague();
  render();
}

function resumeDraft(tId){
  if(!moderator) return;
  let t = tournamentData[tId] || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  d.status = 'active';
  persistLeague();

}

function completeDraftAndAdvance(tId){
  if(!moderator) return;
  let t = tournamentData[tId] || activeT();
  if(!t) return;
  if(!confirm(`Finish draft for ${t.name} and advance to Group Stage? All drafted rosters will be locked in.`)) return;

  let d = ensureTournamentDraft(t);
  d.status = 'completed';
  t.phase = 'group';
  current = 'Matches';
  persistLeague();
  render();
}

function resetDraftPicks(tId){
  if(!moderator) return;
  let t = tournamentData[tId] || activeT();
  if(!t) return;
  if(!confirm(`Reset all draft picks for ${t.name}? Rosters will be cleared.`)) return;

  let d = ensureTournamentDraft(t);
  d.picks = [];
  d.status = 'pending';
  (t.players || []).forEach(p => {
    if(t.rosters?.[p]) t.rosters[p] = [];
    if(roster?.[p]) roster[p] = [];
  });

  persistLeague();
  render();
}

/* --- Draft Views --- */

  let curOvr = curPlayer ? calculatePlayerOVR(curPlayer) : null;

      : (d.status === 'completed' 
        ? '<span class="status" style="background:#0d2d1f;border-color:#10b981;color:#10b981"><i style="background:#10b981"></i>DRAFT COMPLETE</span>' 
        : '<span class="status" style="background:#22222c;border-color:#4a4a58;color:#a09fa8"><i style="background:#a09fa8"></i>PENDING START</span>'));

    <div style="display:flex;gap:6px;flex-wrap:wrap">

      ${d.status === 'active' ? `<button class="btn ghost btn-sm" onclick="pauseDraft('${jsArg(t.id)}')">⏸️ Pause</button>` : ''}
      ${d.status === 'paused' ? `<button class="btn btn-sm" onclick="resumeDraft('${jsArg(t.id)}')">▶️ Resume</button>` : ''}
      ${d.picks?.length ? `<button class="btn ghost btn-sm" style="color:#ff9ba1" onclick="undoDraftPick('${jsArg(t.id)}')">↩️ Undo Pick</button>` : ''}
      <button class="btn ghost btn-sm" onclick="openDraftOrderEditor('${jsArg(t.id)}')">🔀 Draft Order</button>
      <button class="btn ghost btn-sm" onclick="openDraftBoardImporter('${jsArg(t.id)}')">📥 Import Sheet</button>
      ${d.status === 'completed' || d.picks?.length >= getDraftTotalPicks(t) ? `<button class="btn btn-sm" style="background:#10b981;border-color:#34d399" onclick="completeDraftAndAdvance('${jsArg(t.id)}')">🏁 Start Group Stage →</button>` : ''}

            <span class="tag" style="background:#1e1e28;color:#c0bfca">Round <b>${turn.currentRound}</b> · Pick <b>${turn.currentPickNumber} of ${turn.totalPicks}</b></span>
          </div>
          ${modActions}
        </div>

        <div class="draft-hud-hero">
          <!-- On The Clock Card -->
          <div class="draft-clock-card ${d.status === 'paused' ? 'paused' : (d.status === 'completed' ? 'completed' : '')}">
            <div class="draft-clock-avatar" style="background-image:${faceArt};border-color:${curOvr?.color || '#fff'}">
              ${faceLetter}
            </div>
            <div style="min-width:0;flex:1">
              <div style="font-size:10px;font-weight:800;letter-spacing:1px;color:${d.status === 'active' ? '#ff858b' : '#ffd166'};text-transform:uppercase">
                ${d.status === 'completed' ? 'Draft Finished' : (d.status === 'paused' ? 'Draft Paused' : (isMe ? '⭐ YOU ARE ON THE CLOCK!' : '⏳ ON THE CLOCK'))}
              </div>
              <div style="font:800 22px 'Barlow Condensed';color:#f5f3f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2">
                ${turn.isComplete ? 'All Rosters Drafted' : esc(curPlayer)}
              </div>
              <div style="font-size:11px;color:#a09fa8;margin-top:2px">
                ${turn.isComplete ? 'Ready for Group Stage' : esc(teamName(t, curPlayer))}
              </div>
            </div>

            ${coachStats ? `
              <div style="text-align:right;border-left:1px solid #3d242c;padding-left:14px">
                <div style="font-size:10px;font-weight:800;color:#8e8c95;text-transform:uppercase">Budget Left</div>
                <div style="font:800 18px 'Barlow Condensed';color:#ffd166">${coachStats.budget > 0 ? `${coachStats.remainingBudget} <small style="font-size:11px;color:#8e8c95">pts</small>` : 'Unlimited'}</div>
                <div style="font-size:10px;color:#a09fa8;margin-top:2px">${coachStats.count}/${coachStats.maxSlots} drafted</div>
              </div>
            ` : ''}
          </div>

          <!-- Upcoming Picks on Deck -->
          <div class="draft-info-card">
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                <span style="font-size:10px;font-weight:800;color:#a09fa8;text-transform:uppercase;letter-spacing:.6px">Next On The Clock · On Deck</span>
                <span class="tag" style="background:#242432;color:#ffd166;font-size:9px;border:1px solid #3a3a4c;padding:1px 6px">Snake Rotation</span>
              </div>

              <div class="draft-upcoming-grid">
                ${turn.upcoming.slice(0, 4).map((u, i) => {
                  let uFace = profilePictures[u.player] ? `url('${esc(profilePictures[u.player])}')` : (teamCovers[u.player] ? `url('${esc(teamCovers[u.player])}')` : fallbackArt(u.player));
                  let uLetter = (profilePictures[u.player] || teamCovers[u.player]) ? '' : esc((u.player || '?')[0]);
                  let uOvr = calculatePlayerOVR(u.player);

                  return `
                    <div class="draft-upcoming-chip">
                      <span class="avatar mini" style="background-image:${uFace};background-size:cover;background-position:center;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid ${uOvr.color};font-size:10px;flex:none">${uLetter}</span>
                      <div style="min-width:0;flex:1">
                        <div style="font-size:9px;font-weight:800;color:${i === 0 ? '#ff8e95' : '#ffd166'}">#${u.pickNumber} ${i === 0 ? '· On Deck' : ''}</div>
                        <div style="font:800 12px 'Barlow Condensed';color:#f5f3f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.player)}</div>
                      </div>
                    </div>
                  `;
                }).join('') || '<div style="font-size:11px;color:#8e8c95;padding:6px">No upcoming picks remaining</div>'}
              </div>
            </div>

            <div style="font-size:10px;color:#8e8c95;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #232330;padding-top:8px">
              <span>Order: <b>${d.order.join(' → ')}</b></span>
              <span>Cap: <b>${d.pointBudget ? d.pointBudget + ' pts' : 'Unlimited'}</b></span>
            </div>
          </div>
        </div>

        <!-- Snake Order Strip Timeline -->
        <div class="draft-snake-strip-wrap">
          <div class="draft-snake-track">
            ${Array.from({length: turn.totalPicks}, (_, idx) => {
              let pickInfo = getDraftPickDetails(t, idx);
              let isDone = idx < d.picks.length;
              let isCurrent = idx === d.picks.length;
              let pickObj = d.picks[idx];
              let pFace = profilePictures[pickInfo.player] ? `url('${esc(profilePictures[pickInfo.player])}')` : (teamCovers[pickInfo.player] ? `url('${esc(teamCovers[pickInfo.player])}')` : fallbackArt(pickInfo.player));
              let pLetter = (profilePictures[pickInfo.player] || teamCovers[pickInfo.player]) ? '' : esc((pickInfo.player || '?')[0]);
              let pOvr = calculatePlayerOVR(pickInfo.player);
              let roundStart = (pickInfo.posInRound === 0);

              return `
                ${roundStart ? `<span class="draft-round-divider">R${pickInfo.round} ${pickInfo.isReversed ? '↩' : '→'}</span>` : ''}
                <div class="draft-snake-tile ${isCurrent ? 'current' : (isDone ? 'done' : '')}" title="Round ${pickInfo.round} · Pick #${pickInfo.pickNumber} · ${esc(pickInfo.player)}">
                  <span class="avatar mini" style="background-image:${pFace};background-size:cover;background-position:center;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1px solid ${pOvr.color};font-size:8px;flex:none">${pLetter}</span>
                  <span style="font:800 11px 'Barlow Condensed'">${pickInfo.round}.${pickInfo.pickInRound}</span>
                  <b>${esc(pickInfo.player)}</b>
                  ${isDone && pickObj ? `
                    <div style="display:inline-flex;align-items:center;gap:3px;margin-left:2px">
                      <img src="${esc(pokeSprite(pickObj.pokemon))}" style="width:18px;height:18px;object-fit:contain" onerror="handleSpriteError(this)">
                      <span style="color:#ffd166;font-size:10px;font-weight:800">${esc(pickObj.pokemon)}</span>
                    </div>
                  ` : (isCurrent ? `<span style="font-size:9px;color:#fff;background:rgba(0,0,0,0.3);padding:1px 4px;border-radius:3px">ON CLOCK</span>` : '')}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>

      <!-- Navigation Subtabs -->
      <div class="tabs" style="margin-top:4px">
        <button class="${draftRoomSubTab === 'room' ? 'active' : ''}" onclick="draftRoomSubTab='room';render()">📋 Tiered Board & Planner</button>
        <button class="${draftRoomSubTab === 'rosters' ? 'active' : ''}" onclick="draftRoomSubTab='rosters';render()">👥 Coach Rosters & Budgets</button>
        <button class="${draftRoomSubTab === 'sheet' ? 'active' : ''}" onclick="draftRoomSubTab='sheet';render()">📊 Google Sheets Embed</button>
      </div>

      <!-- Tab Content Area -->
      ${draftRoomSubTab === 'rosters' 
        ? DraftRostersView(t) 
        : (draftRoomSubTab === 'sheet' 
          ? `<div class="card">${sheetIds(boardLink).id ? `<iframe class="sheet-frame" src="${esc(sheetEmbedUrl())}" title="League draft sheet" loading="lazy"></iframe>` : `<div class="empty"><div class="card-title">Connect the cost sheet</div><p class="sub">Add the Google Sheets link in Board settings to show it here.</p></div>`}</div>`
          : DraftBoardView(t))}
    </div>
  `;
}

function renderDraftBoardTierColumns(t){
  let d = ensureTournamentDraft(t);
  if(!d) return '';
  let board = d.board || [];
  let draftedSet = new Set((d.picks || []).map(x => x.pokemon.toLowerCase().trim()));
  let draftedByMap = {};
  (d.picks || []).forEach(p => {
    draftedByMap[p.pokemon.toLowerCase().trim()] = p;
  });

  let filteredBoard = board.map(tier => {
    let filteredMons = (tier.pokemon || []).filter(mon => {
      let clean = mon.toLowerCase().trim();
      let matchesSearch = !draftBoardSearch || clean.includes(draftBoardSearch.toLowerCase().trim());
      let isDrafted = draftedSet.has(clean);
      let matchesAvail = !draftBoardAvailOnly || !isDrafted;
      let matchesTier = (draftBoardTierFilter === 'all' || tier.id === draftBoardTierFilter || String(tier.cost) === draftBoardTierFilter);
      return matchesSearch && matchesAvail && matchesTier;
    });
    return { ...tier, filteredMons };
  });

  return filteredBoard.map(tier => {
    let availCount = tier.pokemon.filter(m => !draftedSet.has(m.toLowerCase().trim())).length;
    return `
      <div class="draft-tier-col">
        <div class="draft-tier-head">
          <span style="color:#ffd166">${esc(tier.name)}</span>
          <span class="tag" style="background:#2d2210;color:#ffd166;font-size:10px;border:1px solid #5a4218">${tier.cost} pts · ${availCount}/${tier.pokemon.length}</span>
        </div>

        <div class="draft-tier-items">
          ${tier.filteredMons.map(mon => {
            let clean = mon.toLowerCase().trim();
            let isDrafted = draftedSet.has(clean);
            let draftInfo = isDrafted ? draftedByMap[clean] : null;
            let spriteUrl = pokeSprite(mon);

            return `
              <div class="draft-mon-card ${isDrafted ? 'drafted' : ''}" onclick="${isDrafted ? '' : `openDraftConfirmationModal('${jsArg(t.id)}', '${jsArg(mon)}', ${tier.cost}, '${jsArg(tier.name)}')`}">
                <div style="display:flex;align-items:center;gap:8px;min-width:0">
                  <img src="${esc(spriteUrl)}" class="draft-sprite" alt="${esc(mon)}" loading="lazy" onerror="handleSpriteError(this)">
                  <div style="min-width:0">
                    <div class="draft-mon-name" title="${esc(mon)}">${esc(mon)}</div>
                    ${isDrafted && draftInfo ? `
                      <div style="font-size:9px;color:#ff8e95;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                        Drafted by ${esc(draftInfo.player)} (#${draftInfo.pickNumber})
                      </div>
                    ` : ''}
                  </div>
                </div>

                ${!isDrafted ? `
                  <span class="draft-mon-cost">${tier.cost} pts</span>
                ` : `
                  <span style="font-size:11px;color:#6b6a75;font-weight:700">Picked</span>
                `}
              </div>
            `;
          }).join('') || '<div style="padding:14px;font-size:11px;color:#6b6a75;text-align:center">No matches in this tier</div>'}
        </div>
      </div>
    `;
  }).join('');
}

              <input type="checkbox" ${draftBoardAvailOnly ? 'checked' : ''} onchange="draftBoardAvailOnly=this.checked;handleDraftBoardFilterChange()" style="accent-color:var(--red)">
              Available (${totalAvailable}/${totalMons})
            </label>

            <select onchange="draftBoardTierFilter=this.value;handleDraftBoardFilterChange()" style="padding:6px 10px;background:#181822;border:1px solid #363648;border-radius:6px;color:#f5f3f0;font-size:11px">
              <option value="all">All Tiers (${board.length})</option>
              ${board.map(tier => `<option value="${esc(tier.id)}" ${draftBoardTierFilter === tier.id ? 'selected' : ''}>${esc(tier.name)} · ${tier.cost} pts</option>`).join('')}
            </select>

            <div style="display:inline-flex;border:1px solid #363648;border-radius:6px;overflow:hidden;background:#181822">
              <button class="btn ghost btn-sm" onclick="scrollDraftBoard(-280)" title="Scroll Left (Higher Tiers)" style="border-radius:0;padding:6px 10px!important;border:0;border-right:1px solid #363648;font-size:11px">◀</button>
              <button class="btn ghost btn-sm" onclick="scrollDraftBoard(280)" title="Scroll Right (Lower Tiers)" style="border-radius:0;padding:6px 10px!important;border:0;font-size:11px">▶</button>
            </div>

              <button class="btn ghost btn-sm" onclick="openDraftBoardImporter('${jsArg(t.id)}')">⚙️ Edit</button>
