        ${builderHTML()}
      </aside>
    </div>
  `;
}

function openModeratorSwapModal(tId, coach, currentMon, round, pickNumber, currentCost){
  if(!moderator) return;
  let t = tournamentData[tId] || ongoingT() || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  if(!d) return;

  let stats = getDraftCoachStats(t, coach);
  let board = d.board || [];
  let draftedSet = new Set((d.picks || []).map(x => x.pokemon.toLowerCase().trim()));

  let budgetForReplacement = (stats.remainingBudget !== null ? (stats.remainingBudget + currentCost) : null);
  let minReserve = stats.openSlots * 1;
  let maxAllowed = (stats.budget > 0 && budgetForReplacement !== null) ? Math.max(0, budgetForReplacement - minReserve) : Infinity;

  // Group board pokemon by tier
  let optionsHtml = '';
  board.forEach(tier => {
    let avail = (tier.pokemon || []).filter(m => !draftedSet.has(m.toLowerCase().trim()) || m.toLowerCase().trim() === currentMon.toLowerCase().trim());
    if(avail.length > 0){
      optionsHtml += `<optgroup label="${esc(tier.name)} · ${tier.cost} pts">`;
      avail.forEach(m => {
        let isCur = (m.toLowerCase().trim() === currentMon.toLowerCase().trim());
        optionsHtml += `<option value="${esc(m)}" data-cost="${tier.cost}" ${isCur ? 'selected' : ''}>${esc(m)} (${tier.cost} pts)${isCur ? ' [Current]' : ''}</option>`;
      });
      optionsHtml += `</optgroup>`;
    }
  });

  let curSprite = pokeSprite(currentMon);

  document.querySelector('#modal').innerHTML = `
    <div class="modal-wrap">
      <div class="modal" style="max-width:520px">
        <div class="modal-head">
          <div>
            <div class="eyebrow" style="color:var(--amber)">Moderator Action</div>
            <h2>Swap Drafted Pokémon</h2>
          </div>
          <button class="close" onclick="closeModal()">×</button>
        </div>

        <!-- Coach Summary -->
        <div style="background:#181822;border:1px solid #2b2b3a;padding:12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-top:10px">
          <div>
            <div style="font-size:10px;font-weight:800;color:#8e8c95;text-transform:uppercase">Coach</div>
            <div style="font:800 16px 'Barlow Condensed';color:#f5f3f0">${esc(coach)} <span style="font-size:12px;color:#a09fa8">(${esc(teamName(t, coach))})</span></div>
            <div style="font-size:11px;color:#ffd166;margin-top:2px">Round ${round} · Pick #${pickNumber}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:10px;font-weight:800;color:#8e8c95;text-transform:uppercase">Current Budget</div>
            <div style="font:800 15px 'Barlow Condensed';color:#ffd166">${stats.budget > 0 ? `${stats.remainingBudget} / ${stats.budget} pts left` : 'Unlimited'}</div>
            <div style="font-size:10px;color:#8e8c95">${stats.count}/${stats.maxSlots} slots filled</div>
          </div>
        </div>

        <!-- Current Pokémon Card -->
        <div style="margin-top:14px;background:#14141b;border:1px solid #282836;border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:10px">
            <img src="${esc(curSprite)}" style="width:40px;height:40px;object-fit:contain" onerror="handleSpriteError(this)">
            <div>
              <div style="font-size:10px;color:#8e8c95;font-weight:800;text-transform:uppercase">Currently Drafted</div>
              <div style="font:800 16px 'Barlow Condensed';color:#ff8e95">${esc(currentMon)}</div>
            </div>
          </div>
          <span class="tag" style="background:#2d2412;color:#ffd166;font-size:12px;font-weight:800;border:1px solid #5a4218">${currentCost} pts</span>
        </div>

        <!-- Replacement Selector -->
        <div class="field" style="margin-top:16px">
          <label style="font-weight:800;color:#e2e0e8;font-size:12px">Select Replacement Pokémon from Board</label>
          <select id="modSwapMonSelect" onchange="updateModSwapPreview('${jsArg(t.id)}', '${jsArg(coach)}', ${currentCost}, ${stats.remainingBudget || 0}, ${stats.openSlots}, ${stats.budget || 0})" style="padding:10px;background:#181822;border:1px solid #3a3a4c;border-radius:6px;color:#f5f3f0;font-size:13px;width:100%">
            ${optionsHtml || '<option value="">No available Pokémon found on board</option>'}
          </select>
          <span style="font-size:11px;color:#8e8c95;margin-top:4px;display:block">
            Max replacement cost: <b style="color:#ffd166">${stats.budget > 0 ? `${maxAllowed} pts` : 'Unlimited'}</b> 
            ${stats.budget > 0 && stats.openSlots > 0 ? `(reserving ${minReserve} pts for ${stats.openSlots} other open slots)` : ''}
          </span>
        </div>

        <!-- Dynamic Live Swap Preview -->
        <div id="modSwapPreviewBox" style="background:#121218;border:1px solid #262634;border-radius:8px;padding:10px 14px;margin-top:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px">
            <span style="color:#a09fa8">New Budget Left:</span>
            <span id="modSwapNewBudget" style="font:800 14px 'Barlow Condensed';color:#ffd166">${stats.remainingBudget !== null ? `${stats.remainingBudget} pts` : 'Unlimited'}</span>
          </div>
          <div id="modSwapStatusMsg" style="font-size:11px;margin-top:4px;color:#4bdd91">✓ Ready to swap</div>
        </div>

        <div class="creator-actions" style="margin-top:18px;display:flex;justify-content:space-between;gap:8px">
          <button class="btn ghost" style="color:#ff8e95" onclick="executeModeratorRemovePick('${jsArg(t.id)}', '${jsArg(coach)}', '${jsArg(currentMon)}', ${pickNumber})">🗑️ Remove Pick</button>
          <div style="display:flex;gap:8px">
            <button class="btn ghost" onclick="closeModal()">Cancel</button>
            <button id="modSwapConfirmBtn" class="btn" onclick="executeModeratorSwap('${jsArg(t.id)}', '${jsArg(coach)}', '${jsArg(currentMon)}', ${pickNumber})">🔄 Confirm Swap</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function updateModSwapPreview(tId, coach, oldCost, curRemaining, openSlots, totalBudget){
  let select = document.getElementById('modSwapMonSelect');
  if(!select) return;
  let opt = select.selectedOptions[0];
  let newCost = opt ? +(opt.getAttribute('data-cost') || 0) : 0;
  let costDiff = newCost - oldCost;

  let newRemaining = (totalBudget > 0) ? (curRemaining - costDiff) : null;
  let minReserve = openSlots * 1;
  let maxAllowed = (totalBudget > 0) ? (curRemaining + oldCost - minReserve) : Infinity;

  let budgetEl = document.getElementById('modSwapNewBudget');
  let statusEl = document.getElementById('modSwapStatusMsg');
  let btn = document.getElementById('modSwapConfirmBtn');

  if(budgetEl){
    budgetEl.textContent = (newRemaining !== null) ? `${newRemaining} pts (${costDiff > 0 ? '+' : ''}${costDiff}p diff)` : 'Unlimited';
    budgetEl.style.color = (newRemaining !== null && newRemaining < 0) ? '#ff4b54' : '#ffd166';
  }

  if(totalBudget > 0 && newCost > maxAllowed){
    if(statusEl){
      statusEl.style.color = '#ff4b54';
      statusEl.innerHTML = `⚠️ Violates reserve rule: Needs at least ${minReserve} pts reserved for ${openSlots} other open slots (Max affordable: ${maxAllowed} pts).`;
    }
    if(btn){
      btn.disabled = true;
      btn.style.opacity = '0.4';
      btn.style.cursor = 'not-allowed';
    }
  } else {
    if(statusEl){
      statusEl.style.color = '#4bdd91';
      statusEl.innerHTML = `✓ Valid swap · Cost: ${newCost} pts (Within budget & reserve requirements)`;
    }
    if(btn){
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.style.cursor = 'pointer';
    }
  }
}

function executeModeratorSwap(tId, coach, oldMon, pickNumber){
  if(!moderator) return;
  let t = tournamentData[tId] || ongoingT() || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  if(!d) return;

  let select = document.getElementById('modSwapMonSelect');
  let newMon = select ? select.value : '';
  if(!newMon || newMon === oldMon){
    alert('Please select a different Pokémon to swap in.');
    return;
  }

  let alreadyTaken = (d.picks || []).some(x => x.pokemon.toLowerCase().trim() === newMon.toLowerCase().trim() && !(x.player === coach && x.pickNumber === pickNumber));
  if(alreadyTaken){
    alert(`${newMon} has already been drafted by another coach!`);
    return;
  }

  let newCost = findPokemonCostOnBoard(t, newMon);
  let oldCost = findPokemonCostOnBoard(t, oldMon);
  let stats = getDraftCoachStats(t, coach);

  let budgetForReplacement = (stats.remainingBudget !== null ? (stats.remainingBudget + oldCost) : null);
  let minReserveForRemaining = stats.openSlots * 1;
  let maxAllowedCost = (stats.budget > 0 && budgetForReplacement !== null) ? (budgetForReplacement - minReserveForRemaining) : Infinity;

  if(stats.budget > 0 && newCost > maxAllowedCost){
    alert(`Cannot swap to ${newMon} (${newCost} pts). Maximum affordable replacement cost is ${maxAllowedCost} pts to reserve ${minReserveForRemaining} pts for ${stats.openSlots} other open slots.`);
    return;
  }

  let pickObj = (d.picks || []).find(x => x.player === coach && (x.pickNumber === pickNumber || x.pokemon.toLowerCase().trim() === oldMon.toLowerCase().trim()));
  if(pickObj){
    pickObj.pokemon = newMon;
    pickObj.cost = newCost;
  }

  if(t.rosters && t.rosters[coach]){
    let idx = t.rosters[coach].findIndex(m => m.toLowerCase().trim() === oldMon.toLowerCase().trim());
    if(idx !== -1){
      t.rosters[coach][idx] = newMon;
    } else {
      t.rosters[coach].push(newMon);
    }
  }

  if(roster && roster[coach]){
    let idx = roster[coach].findIndex(m => m.toLowerCase().trim() === oldMon.toLowerCase().trim());
    if(idx !== -1){
      roster[coach][idx] = newMon;
    }
  }

  persistLeague();
  closeModal();
  render();
}

function executeModeratorRemovePick(tId, coach, monName, pickNumber){
  if(!moderator) return;
  if(!confirm(`Are you sure you want to remove ${monName} from ${coach}'s roster? This pick slot will become open again.`)) return;

  let t = tournamentData[tId] || ongoingT() || activeT();
  if(!t) return;
  let d = ensureTournamentDraft(t);
  if(!d) return;

  d.picks = (d.picks || []).filter(x => !(x.player === coach && (x.pickNumber === pickNumber || x.pokemon.toLowerCase().trim() === monName.toLowerCase().trim())));

  if(t.rosters && t.rosters[coach]){
    t.rosters[coach] = t.rosters[coach].filter(m => m.toLowerCase().trim() !== monName.toLowerCase().trim());
  }
  if(roster && roster[coach]){
    roster[coach] = roster[coach].filter(m => m.toLowerCase().trim() !== monName.toLowerCase().trim());
  }

  persistLeague();
  closeModal();
  render();
}

function DraftRostersView(t){
  let d = ensureTournamentDraft(t);
  let order = getDraftOrderList(t);
  if(!order || !order.length) return '<div class="empty card"><div class="card-title">No Coaches in Draft Order</div></div>';

  let coachStatsMap = {};
  order.forEach(p => {
    coachStatsMap[p] = getDraftCoachStats(t, p);
  });

  let totalRounds = d.rounds || d.maxRosterSize || t?.draftData?.maxRosterSize || Math.max(10, ...order.map(p => coachStatsMap[p]?.picks?.length || 0));

  return `
    ${moderator ? `
      <div style="margin-bottom:14px;padding:9px 14px;background:#181524;border:1px solid #3d3554;border-radius:8px;font-size:11px;color:#ffd166;display:flex;align-items:center;gap:8px">
        <span>👑 <b>Moderator Mode:</b> Click on any drafted Pokémon cell below to swap it for an undrafted Pokémon on the board or adjust a coach's roster.</span>
      </div>
    ` : ''}

    <div class="draft-matrix-scroll-wrap">
      <div class="draft-matrix-board" style="grid-template-columns: 74px repeat(${order.length}, minmax(180px, 1fr));">
        <!-- Top Left Corner Cell -->
        <div class="draft-matrix-header-cell" style="justify-content:center;align-items:center;text-align:center;background:#14141c">
          <span style="font:800 11px 'Barlow Condensed';letter-spacing:.8px;color:#8e8c95;text-transform:uppercase">ROUND</span>
          <span style="font-size:9px;color:#605e6c">Snake 🔀</span>
        </div>

        <!-- Coach Column Headers -->
        ${order.map((p, colIdx) => {
          let stats = coachStatsMap[p];
          let faceArt = profilePictures[p] ? `url('${esc(profilePictures[p])}')` : (teamCovers[p] ? `url('${esc(teamCovers[p])}')` : fallbackArt(p));
          let faceLetter = (profilePictures[p] || teamCovers[p]) ? '' : esc((p || '?')[0]);
          let ovrObj = calculatePlayerOVR(p);

          return `
            <div class="draft-matrix-header-cell">
              <div style="display:flex;align-items:center;gap:8px;min-width:0">
                <span class="avatar mini" style="background-image:${faceArt};background-size:cover;background-position:center;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid ${ovrObj.color};flex:none">${faceLetter}</span>
                <div style="min-width:0;flex:1">
                  <div style="font-weight:800;font-size:13px;color:#f5f3f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${playerLink(p)}</div>
                  <div style="font-size:10px;color:#8e8c95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(teamName(t, p))}</div>
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid #282836;padding-top:4px;font-size:10px">
                <span style="color:#ffd166;font-weight:800;font-size:11px">${stats.budget > 0 ? `${stats.pointsSpent}/${stats.budget}p` : `${stats.pointsSpent}p`}</span>
                <span style="color:#8e8c95;font-weight:700">${stats.count}/${stats.maxSlots} Mons</span>
              </div>
            </div>
          `;
        }).join('')}

        <!-- Rounds Rows -->
        ${Array.from({length: totalRounds}, (_, rIdx) => {
          let roundNum = rIdx + 1;
          let isReversed = (roundNum % 2 === 0);

          return `
            <!-- Round Header Cell -->
            <div class="draft-matrix-round-cell">
              <span style="font-size:12px;font-weight:900">R${roundNum}</span>
              <span style="font-size:13px;color:${isReversed ? '#ff8e95' : '#4bdd91'};margin-top:2px">${isReversed ? '←' : '→'}</span>
            </div>

            <!-- Team Pick Cells for this Round -->
            ${order.map((coach, colIdx) => {
              let posInRound = isReversed ? (order.length - 1 - colIdx) : colIdx;
              let pickNumber = (roundNum - 1) * order.length + posInRound + 1;
              let stats = coachStatsMap[coach];
              let pickObj = (d.picks || []).find(x => x.pickNumber === pickNumber) || (d.picks || []).find(x => x.player === coach && x.round === roundNum) || (stats.picks && stats.picks[rIdx]);

              if(pickObj){
                let spriteUrl = pokeSprite(pickObj.pokemon);
                return `
                  <div class="draft-matrix-cell drafted ${moderator ? 'mod-clickable' : ''}"
                       title="${esc(pickObj.pokemon)} (${pickObj.cost} pts) · Round ${roundNum}, Pick #${pickNumber}${moderator ? ' · Click to swap out' : ''}"
                       ${moderator ? `onclick="openModeratorSwapModal('${jsArg(t.id)}', '${jsArg(coach)}', '${jsArg(pickObj.pokemon)}', ${pickObj.round || roundNum}, ${pickObj.pickNumber || pickNumber}, ${pickObj.cost || 0})"` : ''}>
                    <div class="draft-matrix-cell-head">
                      <span class="draft-matrix-pick-num">${roundNum}.${posInRound + 1} <small>#${pickNumber}</small></span>
                      <span class="draft-matrix-cost">${pickObj.cost}p ${moderator ? '✏️' : ''}</span>
                    </div>
                    <div class="draft-matrix-cell-body">
                      <img src="${esc(spriteUrl)}" class="draft-matrix-sprite" alt="${esc(pickObj.pokemon)}" loading="lazy" onerror="handleSpriteError(this)">
                      <div class="draft-matrix-mon-name" title="${esc(pickObj.pokemon)}">${esc(pickObj.pokemon)}</div>
                    </div>
                  </div>
                `;
              } else {
                return `
                  <div class="draft-matrix-cell empty" title="Round ${roundNum} · Pick #${pickNumber} (Open slot)">
                    <div class="draft-matrix-cell-head">
                      <span class="draft-matrix-pick-num">${roundNum}.${posInRound + 1} <small>#${pickNumber}</small></span>
                      <span class="draft-matrix-dir">${isReversed ? '←' : '→'}</span>
                    </div>
                    <div class="draft-matrix-empty-slot">
                      <span>Slot ${roundNum}</span>
                    </div>
                  </div>
                `;
              }
            }).join('')}
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* --- Navigation & Board Main Handler --- */
function Board(){
  let t = ongoingT() || activeT();
  let hasActiveDraft = t && (t.hasDraft || t.phase === 'draft' || t.draftData);

  if(hasActiveDraft){
    return head('Live Draft Room', (t.season || '') + ': ' + t.name + ' · Snake Draft & Board') + DraftRoom(t);
  }

  let s=sheetIds(boardLink),embed=sheetEmbedUrl();
  let actions=`<div style="display:flex;gap:8px;flex-wrap:wrap">${moderator?`<button class="btn ghost" onclick="openBoardSettings()">Board settings</button>`:''}<button class="btn" onclick="openBoardLink()">Open in Google Sheets ↗</button></div>`;
  setTimeout(pullRemoteTeams,0);
  return head('Draft','Cost sheet & team planner',actions)
    +`<div class="tools-layout">
      <div class="card">
        <div class="board-note"><span>${s.id?'Live view of the league cost sheet. Edits made in Google Sheets show up here on refresh.':'No sheet connected yet.'}</span></div>
        ${embed?`<iframe class="sheet-frame" src="${esc(embed)}" title="League draft sheet" loading="lazy"></iframe>`
               :`<div class="empty"><div class="card-title">Connect the cost sheet</div><p class="sub">Add the Google Sheets link in Board settings to show it here.</p></div>`}
      </div>
      <aside class="card builder" id="teamBuilder">${builderHTML()}</aside>
    </div>`;
}
function openBoardSettings(){
  if(!moderator)return;
  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:560px">
    <div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Board settings</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <div class="field"><label>Google Sheets link</label><input id="boardInput" type="url" value="${esc(boardLink)}" placeholder="https://docs.google.com/spreadsheets/d/..."></div>
    <p class="sub">Open the sheet tab that holds the costs before copying the link — the tab is remembered too.</p>
    <div class="creator-actions"><button class="btn" onclick="saveBoardLink()">Save link</button></div></div></div>`;
}
try {
  render();
} catch(e) {
  console.error('Initial render failed:', e);
  let app = document.querySelector('#app');
  if(app) {
    app.innerHTML = `<div class="card empty" style="border-color:#ff4b54;margin:24px"><div class="card-title" style="color:#ff4b54">Render Error</div><p class="sub">${esc(e.message || String(e))}</p></div>`;
  }
}
</script>
