<body><div class="shell"><header class="topbar"><div class="brand"><span class="ball"></span>DRAFTDEX</div><nav class="nav" id="nav"></nav><button class="account" onclick="go('Account')"><span class="mode-dot"></span><span id="accountText">Ethan · Moderator</span></button></header><main class="page" id="app"></main></div><div id="modal"></div>
<script>
const tabs=['Home','Standings','Matches','Top Cut','Teams','Playoff Odds','Predictions','Records','Tournaments','Draft Board'];let current='Home',viewTournament=null,detailTab='Group Stage',matchFilterPlayers=[];
function toggleMatchFilter(v){let i=matchFilterPlayers.indexOf(v);if(i>=0)matchFilterPlayers.splice(i,1);else matchFilterPlayers.push(v);render()}
function clearMatchFilters(){matchFilterPlayers=[];render()}
const profiles={};
const roster={};
function rr(names){let out=[],r=1;for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){out.push({id:r+'-'+i+j,round:'Round '+r,a:names[i],b:names[j],as:'',bs:'',date:'TBD'});r=r===5?1:r+1}return out}
const tournamentData={};
let cut=+localStorage.getItem('draftdex-cut')||4,boardLink=localStorage.getItem('draftdex-board')||'https://docs.google.com/spreadsheets/';let moderator=true;
function save(){localStorage.setItem('draftdex-cut',cut);localStorage.setItem('draftdex-board',boardLink)}

function head(title,over,action=''){return `<div class="page-head"><div><div class="eyebrow">${over}</div><h1>${title}</h1></div>${action}</div>`}
function nav(){document.querySelector('#nav').innerHTML=tabs.map(t=>`<button class="${current===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}
function go(t){current=t;render()}
function render(){
  nav();
  let view = current==='Tournament Detail' ? tournamentDetail() :
             current==='Playoff Odds' ? playoffOdds() :
             current==='Records' ? Records() :
             current==='Draft Board' ? Board() :
             current==='Top Cut' ? TopCut() :
             (typeof window[current] === 'function' ? window[current]() :
             (typeof window[current.replace(/\s+/g,'')] === 'function' ? window[current.replace(/\s+/g,'')]() : Home()));
  document.querySelector('#app').innerHTML=view;
  if(current==='Top Cut'||(current==='Tournament Detail'&&detailTab==='Top Cut'))mountTopCutViewer();
}

function bracketMatch(a,an,b,bn,as='—',bs='—'){return `<div class="bracket-match"><div class="bracket-row"><span><span class="seed">${a}</span>${an}</span><span class="bracket-score">${as}</span></div><div class="bracket-row"><span><span class="seed">${b}</span>${bn}</span><span class="bracket-score">${bs}</span></div></div>`}

function rosterList(p){return (roster[p]||[]).map((m,i)=>`<div class="edit-mon">${m}${moderator?`<button onclick="removeMon('${p}',${i})">Remove</button>`:''}</div>`).join('')}


function openTournament(id){viewTournament=id;detailTab='Group Stage';current='Tournament Detail';render()}






/* Management upgrades */
const teamHistory={};
const teamCovers={};
const profilePictures={};
const pulsePanelImages={};
function ongoingT(){return Object.values(tournamentData).find(t=>t.status==='ONGOING')||null}
function activeT(){return tournamentData[viewTournament]||ongoingT()||Object.values(tournamentData)[0]||null}



function noTournament(){return head('No active tournament','League management')+`<div class="card empty"><div class="card-title">The league is between tournaments</div><p class="sub">Browse the archive or create the next season when you are ready.</p><button class="btn" onclick="go('Tournaments')">View tournament archive</button></div>`}




function closeModal(){document.querySelector('#modal').innerHTML='';render()}


function addMon(p){let v=document.querySelector('#newMon').value.trim();if(v){roster[p]??=[];roster[p].push(v);persistLeague();openProfile(p)}}function removeMon(p,i){roster[p].splice(i,1);persistLeague();openProfile(p)}function addHistoryMon(p,i){let v=document.querySelector('#historyMon'+i).value.trim();if(v){teamHistory[p][i].pokemon.push(v);persistLeague();openProfile(p)}}function removeHistoryMon(p,i,j){teamHistory[p][i].pokemon.splice(j,1);persistLeague();openProfile(p)}



function saveBracket(){let t=activeT();t.bracket=[['bm1a','bm1b'],['bm2a','bm2b']].map(row=>row.map(id=>document.querySelector('#'+id).value));closeModal();current='Top Cut';render()}



try{let savedLeague=JSON.parse(localStorage.getItem('draftdex-tournaments')||'null');if(savedLeague){Object.keys(tournamentData).forEach(k=>delete tournamentData[k]);Object.assign(tournamentData,savedLeague)}let savedProfiles=JSON.parse(localStorage.getItem('draftdex-profiles')||'null');if(savedProfiles)Object.assign(profiles,savedProfiles);let savedRosters=JSON.parse(localStorage.getItem('draftdex-rosters')||'null');if(savedRosters)Object.assign(roster,savedRosters);let savedHistory=JSON.parse(localStorage.getItem('draftdex-history')||'null');if(savedHistory)Object.assign(teamHistory,savedHistory);let savedCovers=JSON.parse(localStorage.getItem('draftdex-teamcovers')||'null');if(savedCovers)Object.assign(teamCovers,savedCovers);let savedPics=JSON.parse(localStorage.getItem('draftdex-profilepics')||'null');if(savedPics)Object.assign(profilePictures,savedPics);let savedPulse=JSON.parse(localStorage.getItem('draftdex-pulsepanels')||'null');if(savedPulse)Object.assign(pulsePanelImages,savedPulse);let savedAccountLinks=JSON.parse(localStorage.getItem('draftdex-accountlinks')||'null');if(savedAccountLinks&&typeof accountLinks!=='undefined')Object.assign(accountLinks,savedAccountLinks);migrateAllBrackets();rebuildAllPlayerStats()}catch(e){}
addEventListener('beforeunload',()=>{clearTimeout(syncTimer);flushSync()});
/* Group-stage and flexible-cut upgrades */

function groupMatches(t,g){return t.matches.filter(m=>(m.group||'Group A')===g)}
function groupSchedule(t){let buckets=groupsOf(t);return Object.entries(buckets).flatMap(([g,ps])=>rr(ps).map(m=>({...m,group:g}))) }


function qualified(t){return Object.keys(groupsOf(t)).flatMap(g=>getStand(t,g).slice(0,advancePerGroup(t)).map((x,i)=>({...x,group:g,groupSeed:i+1}))).sort((a,b)=>a.groupSeed-b.groupSeed||b.gw-a.gw||(b.gw-b.gl)-(a.gw-a.gl))}













function tournamentNumber(t){let all=Object.values(tournamentData);return Math.max(1,all.indexOf(t)+1)}



function topCutPredictionMatches(t){if(!t.topCutMatches){let q=qualified(t),out=[];for(let i=0;i<Math.ceil(q.length/2);i++)out.push({a:q[i]?.p||'BYE',b:q[q.length-1-i]?.p||'BYE',as:'',bs:'',round:'Top Cut opening round'});t.topCutMatches=out}return t.topCutMatches}
function Predictions(){let t=ongoingT();if(!t)return head('Predictions','Tournament picks')+`<div class="card empty"><div class="card-title">Predictions are inactive</div><p class="sub">Predictions open automatically when a new tournament begins.</p></div>`;viewTournament=t.id;return head('Predictions',t.name+' · pick the outcomes')+predictions(t)}

function historyTournamentOptions(){let past=Object.values(tournamentData).filter(t=>t.status==='COMPLETE');return past.length?past.map(t=>`<option value="${t.name} · ${t.season}">${t.name} · ${t.season}</option>`).join(''):'<option>No completed tournaments yet</option>'}

function openProfile(p){let q=ensureProfile(p);document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Player profile · linked account</div><h2>${p}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="profile-layout" style="margin-top:18px"><aside class="card profile-card"><div class="avatar" style="background:${profileArt(p)}">${profilePictures[p]||teamCovers[p]?``:p[0]}</div><div class="profile-name">${p}</div><div class="mini-stats"><div><b>${q.cups.length}x</b><span>Champion</span></div><div><b>${q.tops}x</b><span>Top Cut</span></div><div><b>${q.record}</b><span>All-time W-L</span></div></div>${q.cups.length?`<div style="margin-top:14px"><div class="card-title">Championships</div>${q.cups.map(c=>`<div class="sub" style="margin-top:4px">🏆 ${c}</div>`).join('')}</div>`:''}${moderator?`<div class="card" style="padding:14px;margin-top:14px;background:#111116;border-color:#32323a"><div class="eyebrow">Profile art</div><div class="sub" style="margin-top:6px">Update the player photo and the team cover used across the site.</div><div class="creator-actions" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn ghost" onclick="openProfilePictureEditor('${p}')">Edit profile picture</button><button class="btn ghost" onclick="openTeamCoverEditor('${p}')">Edit team cover</button></div></div>`:''}</aside><section class="card roster-editor"><div class="card-title">Current roster</div>${moderator?`<div class="poke-search"><input id="newMon" placeholder="Search / add a Pokémon"><button class="btn" onclick="addMon('${p}')">Add</button></div>`:''}<div class="roster-edit-list" id="rosterList">${rosterList(p)}</div><div class="section"><div class="card-title">Team history</div>${historyList(p)}${moderator?`<div class="card" style="padding:14px;margin-top:12px"><div class="field"><label>Previous tournament</label><select id="historyTournament">${historyTournamentOptions()}</select></div><div class="field"><label>Team name in that tournament</label><input id="historyTeam" placeholder="e.g. Obsidian Owls"></div><button class="btn ghost" style="margin-top:12px" onclick="addHistoryTeam('${p}')">+ Add historical team</button></div>`:''}</div></section></div></div></div>`}
function addHistoryTeam(p){let tournament=document.querySelector('#historyTournament').value,team=document.querySelector('#historyTeam').value.trim()||'Unnamed team';if(tournament==='No completed tournaments yet'){alert('Complete a tournament first.');return}teamHistory[p]??=[];teamHistory[p].push({tournament,team,pokemon:[]});persistLeague();openProfile(p)}

function createTournament(){let name=document.querySelector('#tn').value.trim()||'Untitled Cup',selected=[...document.querySelectorAll('.profileChoice:checked')].map(x=>x.value),newPs=document.querySelector('#newPlayers').value.split(',').map(x=>x.trim()).filter(Boolean);newPs.forEach(p=>{if(!profiles[p]){profiles[p]={team:'Unassigned team',record:'0-0',tops:0,cups:[]};roster[p]=[];teamHistory[p]=[]}if(!selected.includes(p))selected.push(p)});if(selected.length<2){alert('Choose at least two existing profiles or add new players.');return}let stillOngoing=ongoingT();if(stillOngoing){alert(`"${stillOngoing.name}" is still ongoing. End it (from the Top Cut page) or delete it from the archive before starting a new tournament, so its stats aren't lost.`);return}let id='t'+Date.now(),groupCount=Math.min(+document.querySelector('#gc').value,selected.length),perGroup=Math.max(1,+document.querySelector('#ap').value||1);tournamentData[id]={id,name,season:'Season '+(Object.keys(tournamentData).length+1),status:'ONGOING',start:document.querySelector('#sd').value||'TBD',end:document.querySelector('#ed').value||'TBD',regulation:document.querySelector('#tr').value||'Custom regulation',players:selected,groups:groupCount,groupCount,advancePerGroup:perGroup,matches:[],champion:null,pred:selected.map(p=>[p,0])};tournamentData[id].matches=groupSchedule(tournamentData[id]);viewTournament=id;current='Tournament Detail';persistLeague();closeModal();render()}

/* Final league-management controls */
function teamName(t,p){return t&&Object.prototype.hasOwnProperty.call(t,'teamNames')?(t.teamNames[p]||'Unassigned team'):(profiles[p]?.team||'Unassigned team')}



function teamCoverBg(p){return teamCovers[p]?`style="background-image:linear-gradient(90deg,rgba(20,20,25,.92),rgba(20,20,25,.68)),url('${teamCovers[p]}');background-size:cover;background-position:center"`:''}
function Teams(){let t=ongoingT();if(!t)return noTournament();return head('Teams',t.name+' rosters',moderator?`<button class="btn ghost" onclick="openTournamentPlayers()">Edit tournament teams</button>`:'')+`<div class="teams">${t.players.map(p=>`<div style="position:relative"><button class="card team-card" ${teamCoverBg(p)} onclick="openProfile('${p}')"><div class="eyebrow">${p}</div><h3>${teamName(t,p)}</h3><div class="roster">${(roster[p]||[]).map(x=>`<span class="mon">${x}</span>`).join('')}</div><p class="sub">View profile & team history →</p></button>${moderator?`<button class="cover-edit" onclick="event.stopPropagation();openTeamCoverEditor('${p}')">Edit cover</button>`:''}</div>`).join('')}</div>`}

function openTeamCoverEditor(p){document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:510px"><div class="modal-head"><div><div class="eyebrow">Team cover</div><h2>${p}'s team</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="sub">Choose a Pokémon image up to 2 MB. This limit is for the current browser/JSON storage setup, not your website host.</p><div class="field"><label>Upload cover image</label><input id="teamCoverFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewTeamCover(event)"></div><div id="teamCoverPreview" style="height:190px;border-radius:6px;margin-top:14px;background:${teamCovers[p]?`url('${teamCovers[p]}') center/cover`:'#25252b'}"></div><div class="creator-actions"><button class="btn ghost" onclick="removeTeamCover('${p}')">Remove cover</button><button class="btn" onclick="saveTeamCover('${p}')">Save cover</button></div></div></div>`}
function saveTeamCover(p){if(!window.pendingTeamCover){closeModal();return}teamCovers[p]=window.pendingTeamCover;window.pendingTeamCover=null;persistLeague();closeModal();render()}
function removeTeamCover(p){delete teamCovers[p];window.pendingTeamCover=null;persistLeague();closeModal();render()}
function openProfilePictureEditor(p){document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:510px"><div class="modal-head"><div><div class="eyebrow">Profile picture</div><h2>${p}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="sub">This image shows on the player profile card and leaderboard-style avatar chips. It keeps the same upload limit as team covers.</p><div class="field"><label>Upload profile picture</label><input id="profilePicFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewProfilePicture(event)"></div><div id="profilePicPreview" style="height:190px;border-radius:6px;margin-top:14px;background:${profilePictures[p]||teamCovers[p]?`url('${profilePictures[p]||teamCovers[p]}') center/cover`:'#25252b'}"></div><div class="creator-actions"><button class="btn ghost" onclick="removeProfilePicture('${p}')">Remove picture</button><button class="btn" onclick="saveProfilePicture('${p}')">Save picture</button></div></div></div>`}
function saveProfilePicture(p){if(!window.pendingProfilePicture){closeModal();return}profilePictures[p]=window.pendingProfilePicture;window.pendingProfilePicture=null;persistLeague();closeModal();render()}
function removeProfilePicture(p){delete profilePictures[p];window.pendingProfilePicture=null;persistLeague();closeModal();render()}

function createProfile(){let p=document.querySelector('#profileNewName').value.trim(),team=document.querySelector('#profileNewTeam').value.trim();if(!p){alert('Enter a player name.');return}if(profiles[p]){alert('That profile already exists.');return}profiles[p]={team:team||'No default team',record:'0-0',tops:0,cups:[]};roster[p]=[];teamHistory[p]=[];persistLeague();openProfileManager()}





function topScore(i){let t=ongoingT(),m=t.topCutMatches[i],a=document.querySelector('#ta'+i).value,b=document.querySelector('#tb'+i).value;m.as=a===''?0:+a;m.bs=b===''?0:+b;m.date=new Date().toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});persistLeague();render()}




function playerLink(p){return `<button class="player-link" onclick="openProfile('${p}')">${p}</button>`}

function matchCard(m,latest=false){return `<article class="card match-card ${latest?'latest':''}"><div class="match-meta"><span>${latest?'Latest result':m.group||m.round}</span><span>${m.date}</span></div><div class="pair"><div class="pair-row ${+m.as>+m.bs?'win':''}"><span>${playerLink(m.a)}</span><span class="score">${m.as}</span></div><div class="pair-row ${+m.bs>+m.as?'win':''}"><span>${playerLink(m.b)}</span><span class="score">${m.bs}</span></div></div></article>`}









function TopCut(){let t=ongoingT();if(!t)return noTournament();viewTournament=t.id;if(!t.bracketManagerData)return head('Top Cut',t.name+' · pending group stage')+topCutSection(t,true)+`<p class="sub">Top Cut seeds update live from standings. Finalize the group stage from the Matches page to start the double-elimination bracket.</p>`;let ready=t.topCutCache?.complete;return head('Top Cut',t.name+' · live double elimination')+topCutSection(t,false)+`${moderator?`<div class="creator-actions">${ready?`<button class="btn" onclick="endTournament()">End tournament · ${esc(t.topCutCache.champion)} wins!</button>`:`<p class="sub">Complete every bracket match to enable ending the tournament (${t.topCutCache?.done||0}/${t.topCutCache?.total||0} played).</p>`}</div>`:''}`}

function openTournamentRecordEditor(id){let t=tournamentData[id];document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:520px"><div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Edit tournament record</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tournament name</label><input id="recordName" value="${t.name}"></div><div class="field"><label>Start date</label><input id="recordStart" value="${t.start}"></div><div class="field"><label>End date</label><input id="recordEnd" value="${t.end}"></div><div class="field"><label>Regulation</label><input id="recordRule" value="${t.regulation}"></div><p class="sub">Player teams and rosters can be corrected from the Teams / player-profile pages. Editing an old roster updates that player's stored history.</p><div class="creator-actions"><button class="btn" onclick="saveTournamentRecord('${id}')">Save record</button></div></div></div>`}
function saveTournamentRecord(id){let t=tournamentData[id];t.name=document.querySelector('#recordName').value.trim()||t.name;t.start=document.querySelector('#recordStart').value.trim()||t.start;t.end=document.querySelector('#recordEnd').value.trim()||t.end;t.regulation=document.querySelector('#recordRule').value.trim()||t.regulation;persistLeague();closeModal()}

async function refreshTopCutCache(t){

    let p1=nameOf(m.opponent1?.id),p2=nameOf(m.opponent2?.id);
    let hasResult=!!(m.opponent1?.result||m.opponent2?.result);
    if(hasResult&&p1&&p2){
      if(!ts[m.id])ts[m.id]=Date.now();
      results.push({p1,p2,s1:m.opponent1?.score??(m.opponent1?.result==='win'?1:0),s2:m.opponent2?.score??(m.opponent2?.result==='win'?1:0),title:topCutMatchTitle(data,m),matchId:m.id,completedAt:ts[m.id]});

      playable.push({id:m.id,title:topCutMatchTitle(data,m),p1,p2});
    }
  });
  let total=data.match.length;
  let done=data.match.filter(m=>m.opponent1?.result||m.opponent2?.result||m.opponent1===null||m.opponent2===null).length;
  let finalGroup=data.group.find(g=>g.number===3);

}

/* The library only shows the "#N" seed badge in round 1 by design (later rounds just show
   the name). Extend that same badge to every round so a player's original seed stays
   visible throughout the whole bracket, not just their opening match. */
function injectSeedBadges(mount,data){
  let seedOf={};
  data.match.forEach(m=>{
    let round=data.round.find(r=>r.id===m.round_id);
    if(!round||round.number!==1)return;
    if(m.opponent1?.position!=null&&m.opponent1?.id!=null)seedOf[m.opponent1.id]=m.opponent1.position;
    if(m.opponent2?.position!=null&&m.opponent2?.id!=null)seedOf[m.opponent2.id]=m.opponent2.position;
  });
  data.match.forEach(m=>{
    let round=data.round.find(r=>r.id===m.round_id);
    if(!round||round.number===1)return;
    ['opponent1','opponent2'].forEach((slot,i)=>{
      let opp=m[slot];
      if(!opp||opp.id==null)return;
      let seed=seedOf[opp.id];
      if(seed==null)return;
      let participantEl=mount.querySelector(`.match[data-match-id="${m.id}"] .participant:nth-of-type(${i+1})`);
      if(!participantEl)return;
      let nameEl=participantEl.querySelector('.name');
      if(!nameEl||nameEl.querySelector('.seed-badge'))return;
      let badge=mount.ownerDocument.createElement('span');
      badge.className='seed-badge';
      badge.textContent='#'+seed+' ';
      nameEl.insertBefore(badge,nameEl.firstChild);
    });
  });
}
/* Fills in the "Winner of X" / "Loser of Y" placeholder the library itself only shows for
   cross-bracket feeds (a losers-bracket slot fed by a winners-bracket loser, or the grand
   final's losers-bracket slot) -- it deliberately leaves same-bracket internal progression
   (e.g. a winners-round-2 slot fed by a winners-round-1 winner) unlabeled by design. */
function topCutSlotOrigin(data,match,slot){
  let group=data.group.find(g=>g.id===match.group_id);
  let rounds=data.round.filter(r=>r.group_id===match.group_id).sort((a,b)=>a.number-b.number);
  let round=data.round.find(r=>r.id===match.round_id);
  let m=match.number;
  if(group.number===1){
    if(round.number===1)return null;
    let prevRound=rounds.find(r=>r.number===round.number-1);
    let prevMatches=data.match.filter(x=>x.round_id===prevRound.id).sort((a,b)=>a.number-b.number);
    let src=prevMatches[slot==='opponent1'?(m-1)*2:(m-1)*2+1];
    return src?{match:src,type:'winner'}:null;
  }
  if(group.number===2){
    if(round.number===1)return null;
    if(round.number%2===1){
      let prevRound=rounds.find(r=>r.number===round.number-1);
      let prevMatches=data.match.filter(x=>x.round_id===prevRound.id).sort((a,b)=>a.number-b.number);
      let src=prevMatches[slot==='opponent1'?(m-1)*2:(m-1)*2+1];
      return src?{match:src,type:'winner'}:null;
    }
    if(slot==='opponent2'){
      let prevRound=rounds.find(r=>r.number===round.number-1);
      let prevMatches=data.match.filter(x=>x.round_id===prevRound.id).sort((a,b)=>a.number-b.number);
      let src=prevMatches[m-1];
      return src?{match:src,type:'winner'}:null;
    }
    return null;
  }
  if(group.number===3&&round.number===1&&slot==='opponent1'){
    let wbGroup=data.group.find(g=>g.number===1);
    let wbRounds=data.round.filter(r=>r.group_id===wbGroup.id).sort((a,b)=>a.number-b.number);
    let lastWbRound=wbRounds[wbRounds.length-1];
    let src=data.match.find(x=>x.round_id===lastWbRound.id);
    return src?{match:src,type:'winner'}:null;
  }
  return null;
}
function injectTopCutLabels(mount,data){
  data.match.forEach(m=>{
    ['opponent1','opponent2'].forEach((slot,i)=>{
      let opp=m[slot];
      if(opp&&opp.id!=null)return;
      let participantEl=mount.querySelector(`.match[data-match-id="${m.id}"] .participant:nth-of-type(${i+1})`);
      if(!participantEl)return;
      let nameEl=participantEl.querySelector('.name');
      if(!nameEl||nameEl.getAttribute('title'))return;
      let origin=topCutSlotOrigin(data,m,slot);
      if(!origin)return;
      let label=(origin.type==='winner'?'Winner of ':'Loser of ')+topCutMatchTitle(data,origin.match);
      nameEl.classList.add('hint');
      nameEl.setAttribute('title',label);
      nameEl.textContent=label;
    });
  });
}

function playerCareerStats(p){
  let wins=0,losses=0,titles=0,topCuts=0,tournaments=0,championshipCups=[];
  Object.values(tournamentData).forEach(t=>{
    let played=(t.players||[]).includes(p)||(t.matches||[]).some(m=>m.a===p||m.b===p);
    if(!played)return;
    tournaments++;
    let [w,l]=tournamentRecord(t,p).split('-').map(Number);
    wins+=w||0;losses+=l||0;
    let f=tournamentFinish(t,p);
    if(f.place===1||t.champion===p){
      if(!championshipCups.includes(t.name))championshipCups.push(t.name);
    }
    let isTopCutActual=(t.phase==='topcut'||t.status==='COMPLETE'||!!t.bracketManagerData);
    if(isTopCutActual){
      let inCut=false;
      if(t.topCutCache?.participants?.length)inCut=t.topCutCache.participants.includes(p);
      else if(t.finalStandings)inCut=Object.values(t.finalStandings).some(arr=>arr.slice(0,advancePerGroup(t)).includes(p));
      else if(f.place<=3)inCut=true;
      if(inCut)topCuts++;
    }
  });

  let totalGames=wins+losses,winPct=totalGames>0?Math.round(wins/totalGames*100):0;
  return {wins,losses,record:`${wins}-${losses}`,titles,topCuts,tournaments,winPct,championshipCups}
}

function seedTopCut(t){let groups=Object.keys(groupsOf(t)),per=advancePerGroup(t),entries=[];for(let rank=0;rank<per;rank++)groups.forEach(g=>{let x=getStand(t,g)[rank];if(x)entries.push(x.p)});return entries}
function topCutBracketSeedOrder(size){let order=[1,2];for(let n=4;n<=size;n*=2)order=order.flatMap(seed=>[seed,n+1-seed]);return order}
function buildTopCutSeeding(t){
  let names=seedTopCut(t).filter(Boolean);
  let groups=groupsOf(t),groupOf=p=>{for(let k in groups)if(groups[k].includes(p))return k;return null};
  let size=nextPow2(Math.max(2,names.length));
  let seeding=names.slice();
  while(seeding.length<size)seeding.push(null);
  let order=topCutBracketSeedOrder(size);
  let positions=order.map(seed=>seeding[seed-1]);
  for(let i=0;i<positions.length;i+=2){
    let a=positions[i],b=positions[i+1];
    if(a&&b&&groupOf(a)===groupOf(b)){
      for(let j=0;j<positions.length;j++){
        if(j===i||j===i+1)continue;
        let partnerIdx=j%2===0?j+1:j-1,candidate=positions[j],partner=positions[partnerIdx];
        if(candidate&&groupOf(candidate)!==groupOf(a)&&(!partner||groupOf(partner)!==groupOf(b))){
          [positions[i+1],positions[j]]=[positions[j],positions[i+1]];
          let seedIdxB=order[i+1]-1,seedIdxJ=order[j]-1;
          [seeding[seedIdxB],seeding[seedIdxJ]]=[seeding[seedIdxJ],seeding[seedIdxB]];
          break;
        }
      }
    }
  }
  return {seeding,size};
}
function isGroupComplete(t,g){let ms=groupMatches(t,g);return ms.length>0&&ms.every(m=>m.as!==''&&m.as!=null&&m.bs!==''&&m.bs!=null)}
function isMathematicallyEliminated(t,p){let g=Object.entries(groupsOf(t)).find(([,ps])=>ps.includes(p))?.[0];if(!g)return true;let ps=groupsOf(t)[g],cut=advancePerGroup(t);if(ps.length<=cut)return false;if(isGroupComplete(t,g))return getStand(t,g).findIndex(x=>x.p===p)>=cut;let wins={},remaining={};ps.forEach(x=>{wins[x]=0;remaining[x]=0});groupMatches(t,g).forEach(m=>{if(m.as!==''&&m.as!=null&&m.bs!==''&&m.bs!=null){if(+m.as>+m.bs)wins[m.a]++;else if(+m.bs>+m.as)wins[m.b]++}else{remaining[m.a]=(remaining[m.a]||0)+1;remaining[m.b]=(remaining[m.b]||0)+1}});let maxWins=(wins[p]||0)+(remaining[p]||0);return ps.filter(x=>x!==p&&(wins[x]||0)>maxWins).length>=cut}

function playoffOddsData(t){if(!t||!t.players)return {};let cut=advancePerGroup(t),groups=groupsOf(t);let key=JSON.stringify({matches:(t.matches||[]).map(m=>[m.a,m.b,m.as,m.bs,m.group]),advance:cut,groups:t.groupAssignments||{},players:t.players,manual:t.manualStandings||{}});if(oddsCache.key===key&&oddsCache.data)return oddsCache.data;let data={},runs=2000;for(let [g,ps] of Object.entries(groups)){let gCut=Math.min(cut,ps.length);if(ps.length<=cut){ps.forEach(p=>data[p]=100);continue}if(isGroupComplete(t,g)){let standings=getStand(t,g);standings.forEach((x,i)=>{data[x.p]=i<gCut?100:0});continue}let gMatches=groupMatches(t,g),counts=Object.fromEntries(ps.map(p=>[p,0]));for(let run=0;run<runs;run++){let sim=Object.fromEntries(ps.map(p=>[p,{p,w:0,l:0,gw:0,gl:0,results:{}}]));gMatches.forEach(m=>{let hasReported=m.as!==''&&m.as!=null&&m.bs!==''&&m.bs!=null,sa,sb;if(hasReported){sa=+m.as;sb=+m.bs}else{let aChance=winChance(m.a,m.b,t),aWins=Math.random()<aChance,sweep=Math.random()<0.55;if(aWins){sa=2;sb=sweep?0:1}else{sb=2;sa=sweep?0:1}}let a=sim[m.a],b=sim[m.b];if(a&&b){a.gw+=sa;a.gl+=sb;b.gw+=sb;b.gl+=sa;if(sa>sb){a.w++;b.l++;a.results[m.b]=1;b.results[m.a]=0}else if(sb>sa){b.w++;a.l++;b.results[m.a]=1;a.results[m.b]=0}}});let list=Object.values(sim);list.sort((a,b)=>{let basic=(b.w-a.w)||(b.gw-a.gw)||((b.gw-b.gl)-(a.gw-a.gl));if(basic)return basic;let ah=a.results[b.p],bh=b.results[a.p];if(ah!==undefined&&bh!==undefined)return bh-ah;return a.p.localeCompare(b.p)});let manual=t.manualStandings?.[g];if(Array.isArray(manual)&&manual.length===list.length&&manual.every(p=>ps.includes(p))){let rank=Object.fromEntries(manual.map((p,i)=>[p,i]));list.sort((a,b)=>rank[a.p]-rank[b.p])}list.slice(0,gCut).forEach(x=>counts[x.p]++)}ps.forEach(p=>{if(isMathematicallyEliminated(t,p))data[p]=0;else if(isMathematicallyClinched(t,p))data[p]=100;else{let pct=Math.round(counts[p]/runs*100);data[p]=Math.max(1,Math.min(99,pct))}})}oddsCache={key,data};return data}

/* ---------- shared helpers ---------- */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function jsArg(s){return esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"))}
function hueOf(s){let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))%360;return h}
function fallbackArt(label){let h=hueOf(label||'team');return `linear-gradient(135deg,hsl(${h} 42% 26%),hsl(${(h+38)%360} 38% 11%))`}

/* ══ 1. TEAM COVERS: compress uploads ══════════════════════════════
   Same editor, same teamCovers storage — only the file handler
   changes. Raw 2 MB base64 per team breaks the realtime payload
   limit once a few covers exist; 900px JPEG keeps sync healthy. */
function shrinkImage(file,maxW,quality){return new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=()=>reject(new Error('read'));r.onload=()=>{let i=new Image();i.onerror=()=>reject(new Error('decode'));i.onload=()=>{let w=Math.min(maxW,i.width),h=Math.round(i.height*(w/i.width)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};i.src=r.result};r.readAsDataURL(file)})}

  if(f.size>8000000){alert('Please use an image smaller than 8 MB.');e.target.value='';return}

    window.pendingTeamCover=data;
    document.querySelector('#teamCoverPreview').style.background=`url('${data}') center/cover`;

}

}

function teamArt(p,t){let img=teamCovers[p];return img?`url('${esc(img)}')`:fallbackArt(teamName(t||ongoingT(),p)+p)}

/* ══ 2. DRAFT BOARD ════════════════════════════════════════════════ */
const LEAGUE_SHEET='https://docs.google.com/spreadsheets/d/1Yp2dd_1VljvlX7XA-vCZBqMv4IMcZell3wSLkTjI8fI/edit';
var boardTab='Draft Sheet',poolStatus='',mockSearch='',poolSort='cost',affordableOnly=false;
var draftPool=(()=>{try{return JSON.parse(localStorage.getItem('draftdex-pool')||'null')||{items:[],syncedAt:null,source:''}}catch{return {items:[],syncedAt:null,source:''}}})();
var mockDraft={key:null,picks:[],budget:100,slots:10};

function sheetIds(url){
  let id=(String(url||'').match(/\/spreadsheets\/d\/(?:e\/)?([A-Za-z0-9-_]+)/)||[])[1]||'';
  let gid=(String(url||'').match(/[#&?]gid=([0-9]+)/)||[])[1]||'';
  return {id,gid,published:/\/spreadsheets\/d\/e\//.test(String(url||''))}
}
function sheetEmbedUrl(){
  let s=sheetIds(boardLink);if(!s.id)return '';
  if(s.published)return `https://docs.google.com/spreadsheets/d/e/${s.id}/pubhtml?widget=true&headers=false${s.gid?'&gid='+s.gid:''}`;
  return `https://docs.google.com/spreadsheets/d/${s.id}/preview${s.gid?'#gid='+s.gid:''}`
}
function setBoardTab(x){boardTab=x;render();scrollTo(0,0)}

function Board(){
  let s=sheetIds(boardLink),embed=sheetEmbedUrl();
  let actions=`<div style="display:flex;gap:8px;flex-wrap:wrap">${moderator?`<button class="btn ghost" onclick="openBoardSettings()">Board settings</button>`:''}<button class="btn" onclick="openBoardLink()">Open in Google Sheets ↗</button></div>`;
  let body=boardTab==='My Mock Draft'?mockView():`
    <div class="card">
      <div class="board-note"><span>${s.id?'Live view of the league cost sheet. Edits made in Google Sheets show up here on refresh.':'No sheet connected yet.'}</span>
      <span>${draftPool.items.length?`${draftPool.items.length} Pokémon loaded for mock drafts`:'Draft pool not loaded'} ${moderator?`· <button class="link" onclick="syncDraftPool()">Sync draft pool</button>`:''}</span></div>
      ${embed?`<iframe class="sheet-frame" src="${esc(embed)}" title="League draft sheet" loading="lazy"></iframe>`
             :`<div class="empty"><div class="card-title">Connect the cost sheet</div><p class="sub">Add the Google Sheets link in Board settings to show it here.</p></div>`}
    </div>
    <p class="sub">Blank frame? In Google Sheets open <b>Share → General access</b> and set it to <b>Anyone with the link · Viewer</b>. Private sheets cannot be embedded.</p>`;
  return head('Draft Tools','Costs, tiers & mock drafts',actions)
    +`<div class="tabs">${['Draft Sheet','My Mock Draft'].map(x=>`<button class="${boardTab===x?'active':''}" onclick="setBoardTab('${x}')">${x}</button>`).join('')}</div>`
    +body
}

function openBoardSettings(){
  if(!moderator)return;
  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:620px">
    <div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Board settings</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <div class="field"><label>Google Sheets link</label><input id="boardInput" type="url" value="${esc(boardLink)}" placeholder="https://docs.google.com/spreadsheets/d/..."></div>
    <p class="sub">Open the sheet tab that holds the costs before copying the link — the tab is remembered too.</p>
    <div class="creator-actions"><button class="btn ghost" onclick="syncDraftPool(true)">Save & sync draft pool</button><button class="btn" onclick="saveBoardLink()">Save link</button></div>
    <div class="section"><div class="card-title">Draft pool</div>
      <p class="sub">${draftPool.items.length?`${draftPool.items.length} Pokémon · ${esc(draftPool.source||'sheet')}${draftPool.syncedAt?' · synced '+new Date(draftPool.syncedAt).toLocaleString():''}`:'Nothing loaded yet. Syncing reads the sheet and shares the pool with everyone so nobody else has to load it.'}</p>
      <div class="creator-actions" style="justify-content:flex-start"><button class="btn ghost" onclick="openPasteCSV()">Paste sheet data instead</button>${draftPool.items.length?`<button class="btn ghost" onclick="openPoolColumns()">Fix columns</button>`:''}</div>
    </div></div></div>`
}
function saveBoardLink(){
  let value=document.querySelector('#boardInput').value.trim();
  if(!/^https?:\/\//i.test(value)){alert('Use a full URL starting with https://');return}
  boardLink=value;localStorage.setItem('draftdex-board',boardLink);persistLeague();closeModal();render()
}

/* --- reading the sheet ------------------------------------------- */
function parseCSV(text){
  let rows=[],row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    let c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else if(c!=='\r')cell+=c;
  }
  row.push(cell);rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()))
}
function notSummary(s){return !/^(total|sum|points?|cost|tier|name|pok[eé]mon|team|player|trainer|round|banned|available|drafted|remaining|budget|notes?)\b/i.test(String(s).trim())}
function looksLikeMon(s){s=String(s).trim();return /^[A-Za-z][A-Za-z0-9'’.\- é:]{1,26}$/.test(s)&&s.split(/\s+/).length<=3&&notSummary(s)}
function poolScore(items){return items.filter(x=>looksLikeMon(x.name)&&x.cost>=0&&x.cost<=60).length}
function dedupe(items){let seen=new Set();return items.filter(x=>{let k=x.name.toLowerCase();if(seen.has(k)||!x.name)return false;seen.add(k);return true})}
function poolFromRows(rows){
  let candidates=[];
  /* a. header row with a name column and a cost column */
  for(let r=0;r<Math.min(rows.length,12);r++){
    let nameCol=rows[r].findIndex(c=>/^(pok[eé]mon|name|species|mon)s?\b/i.test(c));
    let costCol=rows[r].findIndex(c=>/^(cost|points?|pts|price|value|tier)s?\b/i.test(c));
    if(nameCol>-1&&costCol>-1){
      let items=[];
      for(let i=r+1;i<rows.length;i++){
        let n=rows[i][nameCol]||'',c=parseFloat(String(rows[i][costCol]||'').replace(/[^0-9.]/g,''));
        if(n&&Number.isFinite(c)&&looksLikeMon(n))items.push({name:n,cost:c});
      }
      candidates.push({items:dedupe(items),mode:'columns'});
    }
  }
  /* b. tier grid — a numeric header cell with names listed underneath */
  let tier=[];
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){
    let cell=String(rows[r][c]||'').trim();
    let m=cell.match(/^\$?(\d{1,2})\s*(pts?|points?)?$/i)||cell.match(/^tier\s*(\d{1,2})$/i);
    if(!m)continue;
    let cost=+m[1];
    for(let i=r+1;i<rows.length;i++){
      let v=(rows[i]||[])[c]||'';
      if(!v)break;
      if(/^\$?\d{1,2}\s*(pts?|points?)?$/i.test(v)||/^tier\s*\d{1,2}$/i.test(v))break;
      if(looksLikeMon(v))tier.push({name:v,cost});
    }
  }
  candidates.push({items:dedupe(tier),mode:'tiers'});
  /* c. name cell with a number next to it */
  let pairs=[];
  rows.forEach(r=>r.forEach((v,c)=>{
    let next=String(r[c+1]??'');
    if(looksLikeMon(v)&&/^\d{1,2}(\.\d+)?$/.test(next))pairs.push({name:v,cost:+next});
  }));
  candidates.push({items:dedupe(pairs),mode:'pairs'});
  candidates.sort((a,b)=>poolScore(b.items)-poolScore(a.items));
  return candidates[0]||{items:[],mode:'none'}
}
function applyPool(items,mode,source){
  items=dedupe(items.filter(x=>x.name&&Number.isFinite(x.cost))).sort((a,b)=>b.cost-a.cost||a.name.localeCompare(b.name));
  draftPool={items,syncedAt:Date.now(),source:source||'Google Sheet',mode};
  try{localStorage.setItem('draftdex-pool',JSON.stringify(draftPool))}catch{}
  if(moderator)persistLeague();
  return items.length
}
async function syncDraftPool(fromSettings){
  if(fromSettings){let v=document.querySelector('#boardInput')?.value.trim();if(v&&/^https?:\/\//i.test(v)){boardLink=v;localStorage.setItem('draftdex-board',boardLink)}}
  let s=sheetIds(boardLink);
  if(!s.id){alert('Add a Google Sheets link first.');return}
  poolStatus='Reading the sheet…';if(!fromSettings)render();
  let urls=s.published
    ?[`https://docs.google.com/spreadsheets/d/e/${s.id}/pub?output=csv${s.gid?'&gid='+s.gid:''}`]
    :[`https://docs.google.com/spreadsheets/d/${s.id}/gviz/tq?tqx=out:csv${s.gid?'&gid='+s.gid:''}`,
      `https://docs.google.com/spreadsheets/d/${s.id}/gviz/tq?tqx=out:csv`,
      `https://docs.google.com/spreadsheets/d/${s.id}/export?format=csv${s.gid?'&gid='+s.gid:''}`];
  for(let url of urls){
    try{
      let res=await fetch(url,{cache:'no-store'});
      if(!res.ok)continue;
      let text=await res.text();
      if(/^\s*</.test(text))continue;
      window.poolRows=parseCSV(text);
      let found=poolFromRows(window.poolRows);
      let n=applyPool(found.items,found.mode,'Google Sheet');
      poolStatus=n?`Loaded ${n} Pokémon from the sheet.`:'The sheet loaded but no Pokémon/cost pairs were recognised — use “Fix columns”.';
      closeModal();boardTab='My Mock Draft';render();
      if(!n)openPoolColumns();
      return
    }catch(e){}
  }
  poolStatus='';
  closeModal();
  alert('The sheet could not be read from the browser.\n\nEither set Share → “Anyone with the link · Viewer”, or in Google Sheets use File → Share → Publish to web → CSV and paste that link here.\n\nYou can also paste the sheet data manually.');
  openPasteCSV()
}
function openPasteCSV(){
  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:620px">
    <div class="modal-head"><div><div class="eyebrow">Draft pool</div><h2>Paste sheet data</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <p class="sub">Select the cost columns in Google Sheets, copy, and paste below. Tier layouts (a cost in the header with Pokémon underneath) and Name/Cost column layouts both work.</p>
    <div class="field"><textarea id="poolPaste" rows="10" placeholder="Pokémon	Cost&#10;Garchomp	18"></textarea></div>
    <div class="creator-actions"><button class="btn" onclick="importPastedPool()">Load pool</button></div></div></div>`
}
function importPastedPool(){
  let raw=document.querySelector('#poolPaste').value;
  if(!raw.trim())return;
  window.poolRows=raw.includes('\t')?raw.split('\n').map(r=>r.split('\t').map(x=>x.trim())):parseCSV(raw);
  let found=poolFromRows(window.poolRows),n=applyPool(found.items,found.mode,'Pasted data');
  closeModal();
  if(!n){alert('No Pokémon and cost pairs were found in that text.');return}
  poolStatus=`Loaded ${n} Pokémon.`;boardTab='My Mock Draft';render()
}
function nameColumnCandidates(rows){
  let width=Math.max(0,...rows.map(r=>r.length)),cols=[];
  for(let c=0;c<width;c++){
    let names=rows.map(r=>(r[c]||'').trim()).filter(v=>looksLikeMon(v));
    if(names.length>=2)cols.push({col:c,hits:names.length,sample:[...new Set(names)].slice(0,3).join(', ')});
  }
  return cols.sort((a,b)=>b.hits-a.hits)
}
/* Work out the cost for a chosen name column without asking the user:
   first look for the numeric column that lines up with it, then fall
   back to a tier header sitting above the names in the same column. */
function costsForNameColumn(rows,nameCol){
  let rowsWithNames=rows.map((r,i)=>[i,(r[nameCol]||'').trim()]).filter(([,n])=>looksLikeMon(n));
  if(!rowsWithNames.length)return {items:[],via:'none'};
  let tally={};
  rowsWithNames.forEach(([i])=>(rows[i]||[]).forEach((v,c)=>{
    if(c===nameCol)return;
    let num=parseFloat(String(v).replace(/[^0-9.]/g,''));
    if(Number.isFinite(num)&&num>=0&&num<=60&&/\d/.test(String(v)))tally[c]=(tally[c]||0)+1;
  }));
  let best=Object.entries(tally).sort((a,b)=>b[1]-a[1]||Math.abs(a[0]-nameCol)-Math.abs(b[0]-nameCol))[0];
  if(best&&best[1]>=rowsWithNames.length*.6){
    let c=+best[0];
    return {items:rowsWithNames.map(([i,n])=>({name:n,cost:parseFloat(String(rows[i][c]).replace(/[^0-9.]/g,''))})).filter(x=>Number.isFinite(x.cost)),
            via:'the numbers in column '+String.fromCharCode(65+c)};
  }
  let items=[];
  rowsWithNames.forEach(([i,n])=>{
    for(let up=i-1;up>=0;up--){
      let v=String((rows[up]||[])[nameCol]||'').trim();
      if(!v)continue;
      let m=v.match(/^\$?(\d{1,2})\s*(pts?|points?)?$/i)||v.match(/^tier\s*(\d{1,2})$/i);
      if(m){items.push({name:n,cost:+m[1]});return}
      if(looksLikeMon(v))continue;
      return
    }
  });
  return {items,via:'the tier headings above each name'}
}
function openPoolColumns(){
  let rows=window.poolRows||[];
  if(!rows.length){openPasteCSV();return}
  let cols=nameColumnCandidates(rows);
  if(!cols.length){closeModal();alert('No column in that sheet looks like a list of Pokémon. Try the paste option, or point the board link at the tab that holds the costs.');openPasteCSV();return}
  let opts=cols.map((x,i)=>`<option value="${x.col}" ${i?'':'selected'}>${esc(x.sample)}${x.hits>3?' …':''} · ${x.hits} name${x.hits===1?'':'s'}</option>`).join('');
  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:540px">
    <div class="modal-head"><div><div class="eyebrow">Draft pool</div><h2>Which list is the Pokémon?</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <p class="sub">Pick the list that holds the Pokémon names. Their costs are read automatically from the sheet.</p>
    <div class="field"><label>Pokémon list</label><select id="poolNameCol">${opts}</select></div>
    <div class="creator-actions"><button class="btn" onclick="applyPoolColumns()">Load pool</button></div></div></div>`
}
function applyPoolColumns(){
  let rows=window.poolRows||[],nameCol=+document.querySelector('#poolNameCol').value;
  let found=costsForNameColumn(rows,nameCol),items=found.items,note=found.via;
  /* A tier heading means the sheet is a grid of cost columns, so pull the
     rest of the tiers too rather than loading only the column they clicked. */
  if(found.via.indexOf('tier')>-1){
    let all=[...items];
    nameColumnCandidates(rows).forEach(x=>{
      if(x.col===nameCol)return;
      let extra=costsForNameColumn(rows,x.col);
      if(extra.via.indexOf('tier')>-1)all.push(...extra.items);
    });
    if(all.length>items.length){items=all;note='the tier headings above each column'}
  }
  let count=applyPool(items,'names+auto-cost','Google Sheet');
  closeModal();
  poolStatus=count?`Loaded ${count} Pokémon, costs read from ${note}.`:'Those names loaded but no costs lined up with them. Try the paste option so the costs come across too.';
  if(!count)openPasteCSV();else boardTab='My Mock Draft';
  render()
}
/* --- the private mock draft --------------------------------------- */
function accountKey(){return window.currentAccount?.username||sessionUser?.id||'guest'}
function ensureMock(){
  let key=accountKey();
  if(mockDraft.key===key)return mockDraft;
  let saved=null;try{saved=JSON.parse(localStorage.getItem('draftdex-mock-'+key)||'null')}catch{}
  mockDraft={key,picks:saved?.picks||[],budget:saved?.budget??100,slots:saved?.slots??10};
  return mockDraft
}
function saveMock(){try{localStorage.setItem('draftdex-mock-'+mockDraft.key,JSON.stringify(mockDraft))}catch{}}
function mockSpent(){return ensureMock().picks.reduce((n,x)=>n+(+x.cost||0),0)}
function draftMon(name,cost){
  let m=ensureMock();
  if(m.picks.some(x=>x.name.toLowerCase()===String(name).toLowerCase()))return;
  if(m.picks.length>=m.slots){poolStatus=`That is ${m.slots} Pokémon already — raise the roster size to add more.`;refreshMock();return}
  m.picks.push({name,cost:+cost||0});saveMock();poolStatus='';refreshMock()
}
function undraftMon(i){let m=ensureMock();m.picks.splice(i,1);saveMock();refreshMock()}
function clearMock(){let m=ensureMock();if(!m.picks.length)return;m.picks=[];saveMock();refreshMock()}
function setMockNumber(field,value){let m=ensureMock();m[field]=Math.max(1,+value||0);saveMock();refreshMock()}
function copyMock(){
  let m=ensureMock();if(!m.picks.length)return;
  let text=m.picks.map(x=>`${x.name} — ${x.cost}`).join('\n')+`\nTotal: ${mockSpent()} / ${m.budget}`;
  navigator.clipboard?.writeText(text).then(()=>{poolStatus='Team copied to your clipboard.';refreshMock()},()=>{})
}
function addCustomPick(){
  let name=document.querySelector('#customMon').value.trim(),cost=parseFloat(document.querySelector('#customCost').value);
  if(!name||!Number.isFinite(cost)){poolStatus='Enter a Pokémon and a cost.';refreshMock();return}
  draftMon(name,cost)
}
function refreshMock(){
  let rail=document.querySelector('#mockRail'),list=document.querySelector('#poolList');
  if(!rail||!list){render();return}
  rail.innerHTML=mockRail();list.innerHTML=poolList()
}
function updatePool(v){mockSearch=v;let list=document.querySelector('#poolList');if(list)list.innerHTML=poolList()}
function setPoolSort(v){poolSort=v;render()}
function toggleAffordable(){affordableOnly=!affordableOnly;render()}

function poolList(){
  let m=ensureMock(),left=m.budget-mockSpent(),q=mockSearch.trim().toLowerCase();
  let items=draftPool.items.filter(x=>!q||x.name.toLowerCase().includes(q));
  if(affordableOnly)items=items.filter(x=>x.cost<=left);
  items=[...items].sort(poolSort==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.cost-a.cost||a.name.localeCompare(b.name));
  if(!items.length)return `<p class="sub" style="grid-column:1/-1">No Pokémon match that filter.</p>`;
  return items.slice(0,400).map(x=>{
    let taken=m.picks.some(p=>p.name.toLowerCase()===x.name.toLowerCase());
    return `<button class="pool-mon ${taken?'taken':''} ${x.cost>left&&!taken?'pricey':''}" ${taken?'disabled':''} onclick="draftMon('${jsArg(x.name)}',${x.cost})">
      <img src="${esc(monSprite(x.name))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="pool-name">${esc(x.name)}</span><span class="pool-cost">${x.cost}</span></button>`
  }).join('')
}
function mockRail(){
  let m=ensureMock(),spent=mockSpent(),left=m.budget-spent,over=left<0;
  return `<div class="eyebrow">Your board</div>
    <div class="budget-num ${over?'over':''}">${spent}<span style="font-size:19px;color:#9d9ba4"> / ${m.budget}</span></div>
    <div class="budget-sub">${over?`${Math.abs(left)} points over budget`:`${left} points left`} · ${m.picks.length} of ${m.slots} slots</div>
    <div class="budget-bar ${over?'over':''}"><span style="width:${Math.min(100,m.budget?spent/m.budget*100:0)}%"></span></div>
    <div style="margin-top:16px">${m.picks.length?m.picks.map((x,i)=>`<div class="mock-pick"><img src="${esc(monSprite(x.name))}" alt="" onerror="this.style.visibility='hidden'"><span>${esc(x.name)}</span><b>${x.cost}</b><button title="Remove" onclick="undraftMon(${i})">×</button></div>`).join(''):'<p class="sub">Pick from the list to build a team.</p>'}</div>
    <div class="mock-actions"><button class="chip" onclick="copyMock()">Copy list</button><button class="chip" onclick="clearMock()">Clear team</button></div>
    <div class="creator-grid" style="margin-top:6px"><div class="field"><label>Budget</label><input type="number" min="1" value="${m.budget}" onchange="setMockNumber('budget',this.value)"></div>
    <div class="field"><label>Roster size</label><input type="number" min="1" value="${m.slots}" onchange="setMockNumber('slots',this.value)"></div></div>
    <p class="sub">${esc(poolStatus)||'This team is saved in your browser only — no one else on the site can see it.'}</p>`
}
function mockView(){
  let m=ensureMock();
  let pool=draftPool.items.length?`
    <div class="card">
      <div class="pool-toolbar">
        <input type="search" placeholder="Search ${draftPool.items.length} Pokémon" value="${esc(mockSearch)}" oninput="updatePool(this.value)">
        <button class="chip ${poolSort==='cost'?'on':''}" onclick="setPoolSort('cost')">By cost</button>
        <button class="chip ${poolSort==='name'?'on':''}" onclick="setPoolSort('name')">A–Z</button>
        <button class="chip ${affordableOnly?'on':''}" onclick="toggleAffordable()">Affordable only</button>
      </div>
      <div class="pool-grid" id="poolList">${poolList()}</div>
      <div class="status-line">Costs come from the league sheet${draftPool.syncedAt?' · synced '+new Date(draftPool.syncedAt).toLocaleDateString():''}. ${moderator?'<button class="link" onclick="syncDraftPool()">Re-sync</button>':''}</div>
    </div>`:`
    <div class="card empty">
      <div class="card-title">Load the draft pool</div>
      <p class="sub">Pull the Pokémon and their costs out of the league sheet, then build a practice team against your ${m.budget}-point budget.</p>
      <div class="mock-actions" style="justify-content:center"><button class="btn" onclick="syncDraftPool()">Load from the sheet</button><button class="btn ghost" onclick="openPasteCSV()">Paste sheet data</button></div>
      <p class="sub" style="margin-top:18px">${esc(poolStatus)}</p>
    </div>`;
  return `<div class="mock-layout"><div>${pool}
    <div class="card" style="padding:16px;margin-top:15px">
      <div class="eyebrow">Not on the sheet?</div>

/* ══ 3. VERSUS GRAPHICS ON PREDICTIONS ═════════════════════════════
   Question text is byte-identical to the friend's version, so
   already-saved picks and the Supabase predictions table still match. */
function savedPick(t,question){try{return localStorage.getItem('draftdex-pick-'+(t?.id||'')+'-'+question)||''}catch{return ''}}
function versusBlock(t,over,question,a,b,locked){
  let chosen=savedPick(t,question);
  let side=(p,cls)=>`<button class="pick vs-side ${cls} ${chosen===p?'active':''}" ${locked?'disabled':''} data-team="${esc(teamName(t,p))}" data-pick="${esc(p)}" style="--art:${teamArt(p,t)}" onclick="pick(this)"><span class="vs-scrim"></span>${esc(p)}</button>`;
  return `<div class="prediction card versus-card">
    <div class="eyebrow">${esc(over)}</div><h3>${esc(question)}</h3>
    <div class="pick-options versus-stage ${locked?'decided':''}">
      ${side(a,'left')}<span class="vs-seam"></span><span class="vs-plate">VS</span>${side(b,'right')}
      <span class="vs-tag left ${chosen===a?'show':''}" data-pick-tag="${esc(a)}">Your pick</span><span class="vs-tag right ${chosen===b?'show':''}" data-pick-tag="${esc(b)}">Your pick</span>
      ${locked?'<span class="vs-locked">Locked</span>':''}
    </div>
  </div>`
}
function predictions(t=activeT()){
  let started=(t.matches||[]).some(x=>x.as!==''&&x.as!=null),groups=groupsOf(t);
  let block=(over,q,opts,locked=false)=>{
    if(opts.length===2&&opts.every(x=>x&&x!=='TBD'&&x!=='BYE'))return versusBlock(t,over,q,opts[0],opts[1],locked);
    let chosen=savedPick(t,q);
    return `<div class="prediction card"><div class="eyebrow">${esc(over)}</div><h3>${esc(q)}</h3>
      <div class="pick-options">${opts.map(x=>predictionPick(x,locked,chosen===x)).join('')}</div>
      ${locked?'<p class="sub">Prediction locked.</p>':''}</div>`
  };
  let leaderboard=`<aside class="card leaderboard"><div class="card-title">Prediction leaders</div>${(t.pred||[]).map(([p,pt],i)=>`<div class="leader"><span class="rank">${i+1}</span><span class="mini-avatar" style="background-image:${profileArt(p,t)};background-size:cover;background-position:center">${profilePictures[p]||teamCovers[p]?'':esc(p[0]||'')}</span><b>${esc(p)}</b><span class="pts">${pt} pts</span></div>`).join('')}</aside>`;
  if(t.phase==='topcut'){
    let live=[...(t.topCutCache?.playable||[]).map(m=>({p1:m.p1,p2:m.p2,title:m.title,locked:false})),...(t.topCutCache?.results||[]).map(m=>({p1:m.p1,p2:m.p2,title:m.title,locked:true}))];
    return `<div class="pred-layout"><div><div class="eyebrow" style="margin:4px 0 8px">Live Top Cut predictions · 20 points each</div>
      ${live.length?'<p class="versus-hint">Tap a side to lock in your pick. Each matchup locks once it is scored.</p>':''}
      ${live.map(m=>block('20 points · '+m.title,'Who wins: '+m.p1+' vs '+m.p2,[m.p1,m.p2],m.locked)).join('')}
      <p class="sub">New predictions appear automatically whenever the bracket produces a new playable matchup. Each locks when that matchup is scored.</p></div>${leaderboard}</div>`
  }
  let games=t.matches||[];
  return `<div class="pred-layout"><div>
    ${block('100 points · tournament outcome','Who will be the '+t.name+' Champion?',t.players,started)}
    ${Object.entries(groups).map(([g,ps])=>block('45 points · '+g+' outcome','Who will top '+g+'?',ps,started)).join('')}
    <div class="eyebrow" style="margin:22px 0 8px">Group-stage match predictions · 8 points each</div>
    ${games.length?'<p class="versus-hint">Tap a side to lock in your pick. Each matchup locks once it is scored.</p>':''}
    ${games.map(m=>block('8 points · '+(m.group||'Group A'),'Who wins: '+m.a+' vs '+m.b,[m.a,m.b],m.as!==''&&m.bs!=='')).join('')}
  </div>${leaderboard}</div>`
}
function predictionPick(label,locked=false,active=false){
  return `<button class="pick ${active?'active':''}" ${locked?'disabled style="opacity:.55;cursor:not-allowed"':''} onclick="pick(this)">${esc(label)}</button>`
}

/* ══ shared state: carry the draft pool through the rev-tracked sync ═ */
async function flushSync(){
  if(!supabaseClient||!moderator)return;
  let snapshotJson=JSON.stringify({tournaments:tournamentData,profiles,roster,teamHistory,teamCovers,profilePictures,pulsePanelImages,cut,boardLink,draftPool});
  if(snapshotJson===lastSentSnapshot)return;
  lastSentSnapshot=snapshotJson;knownRev++;
  let payload=JSON.parse(snapshotJson);payload.rev=knownRev;
  await supabaseClient.from('league_state').update({data:payload,updated_at:new Date().toISOString()}).eq('id','main')
}
(function(){
  let base=window.applySharedState;
  window.applySharedState=function(data){
    base(data);
    if(data&&data.draftPool&&Array.isArray(data.draftPool.items)&&data.draftPool.items.length>=(draftPool.items||[]).length)draftPool=data.draftPool;
    if(!sheetIds(boardLink).id)boardLink=LEAGUE_SHEET;
  }
})();

/* ══ 4. NAVIGATION: league order, and "Draft Board" is now "Draft Tools" ══ */
tabs.length=0;
tabs.push('Home','Standings','Teams','Draft Tools','Matches','Top Cut','Playoff Odds','Predictions','Tournaments');
function go(tab){
  current=tab==='Draft Board'?'Draft Tools':tab;
  try{render();scrollTo(0,0)}
  catch(e){document.querySelector('#app').innerHTML=`<div class="card empty"><div class="card-title">Page error</div><p class="sub">Refresh the site once, then try again.</p></div>`}
}
function render(){
  let active=document.activeElement;
  if(current==='Account'&&active&&/^auth(Username|Password)$/.test(active.id||''))return;
  if(current==='Draft Board')current='Draft Tools';
  nav();
  let pages={Home,Standings,Matches,'Top Cut':TopCut,Teams,Predictions,'Playoff Odds':playoffOdds,Tournaments,'Draft Tools':Board,'Draft Board':Board,Account,'Tournament Detail':tournamentDetail};
  document.querySelector('#app').innerHTML=(pages[current]||Home)()
  mountTopCutViewer();
}

/* Point the board at the league sheet the first time only — a saved
   moderator link always wins. */
if(!sheetIds(boardLink).id){boardLink=LEAGUE_SHEET;localStorage.setItem('draftdex-board',boardLink)}
render();
</script>

@media(max-width:560px){.mrow-face{width:28px;height:28px;font-size:13px}.mrow-name{font-size:12px}.score-competitor .mrow-id{flex-direction:row}.score-competitor.right .mrow-id{flex-direction:row}}
</style>
<script>
/* ══════════════════════════════════════════════════════════════════
   SPRINT 3
   1. Player profiles: roster/history visuals + automatic Past Tournaments
   2. Accounts linked to player profiles
   3. Prediction points scored per account, not per player profile
   4. League name in one place (LEAGUE below)
   6. Edit qualification moved to the tournament page
   7. Arrange groups moved to the tournament page
   8. Playoff "Rating" shown as "Form" on a 0-100 scale (math untouched)
   9. Fix: assigned team names not saving
   10. Matches page visual pass (no behaviour changes)
   Declarations here override the ones above, as with the earlier layers.
   ══════════════════════════════════════════════════════════════════ */

/* ══ 4. LEAGUE IDENTITY ════════════════════════════════════════════
   Every user-facing mention of the league reads from here, so the
   name can be changed in one place. Chosen to match what is already
   baked into this codebase: the cherry-with-a-leaf logo in .ball and
   the cherrymoon.local auth domain. Auth strings are NOT touched —
   changing those would lock existing accounts out. */
const LEAGUE={
  name:'Cherry Moon Draft League',
  short:'Cherry Moon',
  wordmark:'CHERRY MOON',
  tagline:'Pokémon draft league'
};
(function brandLeague(){
  document.title=LEAGUE.name;
  let brand=document.querySelector('.brand');
  if(brand)brand.innerHTML=`<span class="ball"></span>${esc(LEAGUE.wordmark)}`;
})();

/* ══ 1. PLAYER PROFILES ════════════════════════════════════════════ */

/* --- current roster --- */
function rosterList(p){
  let mons=roster[p]||[];
  if(!mons.length)return `<div class="pf-empty">No Pokémon drafted yet.</div>`;
  return `<div class="mon-grid">${mons.map((m,i)=>`<div class="mon-chip">
    <img src="${esc(monSprite(m))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <span>${esc(m)}</span>
    ${moderator?`<button class="x" title="Remove ${esc(m)}" onclick="removeMon('${jsArg(p)}',${i})">×</button>`:''}
  </div>`).join('')}</div>`
}

/* --- team history --- */
function historyList(p){
  let h=teamHistory[p]||[];
  if(!h.length)return `<div class="pf-empty">No previous team has been recorded.</div>`;
  return h.map((x,i)=>`<div class="hist-card">
    <div class="hist-top">
      <b>${esc(x.team)}</b><span class="hist-when">${esc(x.tournament)}</span>
      ${moderator?`<button class="save" style="color:#ff9ba1" onclick="removeHistoryTeam('${jsArg(p)}',${i})">Remove team</button>`:''}
    </div>
    ${(x.pokemon||[]).length?`<div class="mon-grid">${x.pokemon.map((m,j)=>`<div class="mon-chip historic">
      <img src="${esc(monSprite(m))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span>${esc(m)}</span>
      ${moderator?`<button class="x" title="Remove ${esc(m)}" onclick="removeHistoryMon('${jsArg(p)}',${i},${j})">×</button>`:''}
    </div>`).join('')}</div>`:`<div class="pf-empty">No Pokémon recorded for this team.</div>`}
    ${moderator?`<div class="poke-search" style="margin-top:11px"><input id="historyMon${i}" placeholder="Add Pokémon to this team"><button class="save" onclick="addHistoryMon('${jsArg(p)}',${i})">Add</button></div>`:''}
  </div>`).join('')
}

/* --- past tournaments (automatic) ---
   Everything here is derived from tournament data that already exists:
   the same record maths the stats engine uses, plus the finish worked
   out from the champion, the bracket cache, and the group standings. */
function tournamentFinish(t,p){
  if(t.champion===p)return {place:1,label:'1st',note:'Champion',cls:'gold'};
  let cache=t.topCutCache,inCut=false;
  let isTopCutLive=(t.phase==='topcut'||t.status==='COMPLETE'||!!t.bracketManagerData);
  if(isTopCutLive){
    if(cache&&Array.isArray(cache.participants)&&cache.participants.length)inCut=cache.participants.includes(p);
    else if(t.finalStandings)inCut=Object.values(t.finalStandings).some(arr=>arr.slice(0,advancePerGroup(t)).includes(p));
    if(inCut){
      let losses=(cache?.results||[]).filter(m=>(m.p1===p&&+m.s2>+m.s1)||(m.p2===p&&+m.s1>+m.s2));
      let last=losses.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))[0];
      let title=last?.title||'';
      if(/grand final|final/i.test(title)&&!/semi|quarter/i.test(title))
        return {place:2,label:'2nd',note:'Runner-up',cls:'silver'};
      return {place:3,label:'Top Cut',note:title?'Out in '+title:(cache?.complete?'Reached Top Cut':(t.status==='COMPLETE'?'Top Cut':'In Top Cut')),cls:'cut'};
    }
  }
  /* group stage only — report where they placed in their own group */
  let entry=Object.entries(groupsOf(t)).find(([,ps])=>ps.includes(p));
  if(entry){
    try{
      let stand=getStand(t,entry[0]),idx=stand.findIndex(x=>x.p===p);
      if(idx>-1)return {place:100+idx,label:ordinal(idx+1),note:(Object.keys(groupsOf(t)).length>1?entry[0]+' · ':'')+(t.status==='COMPLETE'?'group stage':'current rank'),cls:''};
    }catch(e){}
  }
  return {place:999,label:'—',note:t.status==='COMPLETE'?'Group stage':'Participating',cls:''};
}
function ordinal(n){let s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function pastTournaments(p){
  let played=Object.values(tournamentData)
    .filter(t=>(t.players||[]).includes(p)||(t.matches||[]).some(m=>m.a===p||m.b===p))
    .sort((a,b)=>(Date.parse(b.start)||0)-(Date.parse(a.start)||0)||String(b.season||'').localeCompare(String(a.season||'')));
  if(!played.length)return `<div class="pf-empty">No tournament appearances recorded yet.</div>`;
  return played.map(t=>{
    let rec=tournamentRecord(t,p);
    let f=tournamentFinish(t,p);
    let hist=(teamHistory[p]||[]).find(h=>h.tournament===t.name||h.tournament===(t.name+' · '+t.season));
    return `<div class="past-row ${f.cls}">
      <div class="past-place">${esc(f.label)}<small>${t.status==='ONGOING'?'so far':'finish'}</small></div>
      <div style="min-width:0">
        <div class="past-name">${esc(t.name)}</div>
        <div class="past-meta">${esc([t.season,f.note,teamName(t,p)].filter(x=>x&&x!=='Unassigned team').join(' · '))}</div>
        ${hist?.pokemon?.length?`<div class="mon-grid" style="margin-top:6px;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:5px">${hist.pokemon.map(m=>`<div class="mon-chip historic" style="padding:3px 6px"><img src="${esc(monSprite(m))}" alt="" style="width:24px;height:24px" loading="lazy" onerror="this.style.visibility='hidden'"><span style="font-size:10px">${esc(m)}</span></div>`).join('')}</div>`:''}
      </div>
      <div class="past-rec">${esc(rec)}<small>W-L</small></div>
    </div>`
  }).join('');
}

/* --- the profile modal --- */
function openProfile(p){
  let q=ensureProfile(p),acct=accountForPlayer(p),career=playerCareerStats(p);
  let faceArt=profilePictures[p]?`url('${esc(profilePictures[p])}')`:(teamCovers[p]?`url('${esc(teamCovers[p])}')`:fallbackArt(p));
  let faceLetter=(profilePictures[p]||teamCovers[p])?'':esc((p||'?')[0]);
  let team=profiles[p]?.team&&profiles[p].team!=='No default team'?profiles[p].team:'No default team';
  let pBadges=(calculateLeagueRecords().statsByPlayer[p]?.badges)||[];

  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:860px">
    <div class="modal-head"><div><div class="eyebrow">Player Profile</div><h2>${esc(p)}</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <div class="pf-grid" style="margin-top:18px">
      <aside class="card profile-card" style="padding:18px">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
          <div class="avatar" style="background-image:${faceArt};background-size:cover;background-position:center;width:76px;height:76px;font-size:32px;border-radius:50%;border:2px solid #ffffff24;box-shadow:0 6px 18px rgba(0,0,0,0.5);display:grid;place-items:center">${faceLetter}</div>
          <div class="profile-name" style="margin:12px 0 3px;font:800 26px 'Barlow Condensed';letter-spacing:.4px">${esc(p)}</div>
          <div style="display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:2px">
            <span style="font-size:11px;font-weight:700;color:#c0bec8;background:#202028;border:1px solid #363642;padding:2px 8px;border-radius:4px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(team)}</span>
            ${acct?`<span class="link-badge">◆ ${esc(acct)}</span>`:`<span class="link-badge none">No account linked</span>`}
          </div>
        </div>

        <div class="pf-stats-grid">
          <div class="pf-stat-box">
            <span class="pf-stat-val">${career.titles}</span>
            <span class="pf-stat-lbl">Titles</span>
          </div>
          <div class="pf-stat-box">
            <span class="pf-stat-val">${career.topCuts}</span>
            <span class="pf-stat-lbl">Top Cuts</span>
          </div>
          <div class="pf-stat-box">
            <span class="pf-stat-val">${career.record}</span>
            <span class="pf-stat-lbl">Career W-L</span>
          </div>
          <div class="pf-stat-box">
            <span class="pf-stat-val">${career.winPct}%</span>
            <span class="pf-stat-lbl">Win Rate</span>
          </div>
        </div>

        ${career.championshipCups.length?`
          <div class="pf-trophy-banner">
            <div class="pf-trophy-title">🏆 Championships</div>
            ${career.championshipCups.map(c=>`<div class="pf-trophy-item">${esc(c)}</div>`).join('')}
          </div>
        `:''}

        ${pBadges.length?`
          <div style="background:#131318;border:1px solid #2b2b35;border-radius:8px;padding:12px">
            <div class="eyebrow" style="margin-bottom:8px">Hall of Fame Badges (${pBadges.length})</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${pBadges.map(b=>`<span class="badge-pill ${b.color}" title="${esc(b.desc)}">${b.icon} ${esc(b.name)}</span>`).join('')}
            </div>
          </div>
        `:''}

        ${moderator?`
          <div class="pf-mod-box">
            <div class="eyebrow" style="margin-bottom:8px">Moderator tools</div>
            <div class="pf-mod-actions">
              <button class="btn ghost btn-sm" onclick="openProfilePictureEditor('${jsArg(p)}')">Edit photo</button>
              <button class="btn ghost btn-sm" onclick="openTeamCoverEditor('${jsArg(p)}')">Edit cover</button>
              <button class="btn ghost btn-sm" onclick="editProfile('${jsArg(p)}')">Default team</button>
              <button class="btn ghost btn-sm" onclick="openAccountLinks('${jsArg(p)}')">Link account</button>
            </div>
          </div>
        `:''}
      </aside>

      <section class="card roster-editor" style="padding:18px">
        <div class="pf-section">
          <div class="pf-head">
            <h4>Current Roster</h4>
            <span class="pf-count">${(roster[p]||[]).length} Pokémon</span>
          </div>
          ${moderator?`
            <div class="poke-search" style="margin-bottom:12px;display:flex;gap:8px">
              <input id="newMon" placeholder="Search / add a Pokémon" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addMon('${jsArg(p)}')}">
              <button class="btn" onclick="addMon('${jsArg(p)}')">Add</button>
            </div>
          `:''}
          <div id="rosterList">${rosterList(p)}</div>
        </div>

        <div class="pf-section">
          <div class="pf-head">
            <h4>Tournament History</h4>
            <span class="pf-count">${career.tournaments} tournament${career.tournaments===1?'':'s'}</span>
          </div>
          ${pastTournaments(p)}
        </div>
      </section>
    </div></div></div>`
}

/* ══ 2. ACCOUNTS LINKED TO PLAYER PROFILES ═════════════════════════
   The link lives in league_state (moderator-writable) rather than in
   user_profiles, so no schema migration is needed and players cannot
   claim to be someone else. Keyed by account username. */
var accountLinks=(()=>{try{return JSON.parse(localStorage.getItem('draftdex-accountlinks')||'{}')||{}}catch{return {}}})();
/* Links are validated against live profiles, so a deleted player can
   never leave an account pointing at a profile that no longer exists. */
function accountForPlayer(p){return (p&&profiles[p])?(Object.keys(accountLinks).find(u=>accountLinks[u]===p)||null):null}
function playerForAccount(u){let p=u?accountLinks[u]:null;return (p&&profiles[p])?p:null}
(function(){
  let base=window.deleteProfile;
  if(typeof base!=='function')return;
  window.deleteProfile=function(p){
    let had=accountForPlayer(p);
    base(p);
    if(profiles[p])return;                       /* the delete was cancelled */
    Object.keys(accountLinks).forEach(u=>{if(accountLinks[u]===p)delete accountLinks[u]});
    if(had){try{localStorage.setItem('draftdex-accountlinks',JSON.stringify(accountLinks))}catch{}persistLeague()}
  }
})();
function myPlayer(){return playerForAccount(window.currentAccount?.username)}
function knownAccounts(){
  let names=new Set(Object.keys(accountLinks));
  (window.leagueAccounts||[]).forEach(a=>names.add(a.username));
  if(window.currentAccount?.username)names.add(window.currentAccount.username);
  return [...names].filter(Boolean).sort((a,b)=>a.localeCompare(b))
}
async function loadAccounts(){
  if(!supabaseClient)return window.leagueAccounts||[];
  try{
    let {data}=await supabaseClient.from('user_profiles').select('id,username,role');
    window.leagueAccounts=data||[];
  }catch(e){}
  return window.leagueAccounts||[]
}
function openAccountLinks(focusPlayer){
  if(!moderator)return;
  loadAccounts().then(()=>{
    let players=Object.keys(profiles).sort((a,b)=>a.localeCompare(b));
    let accounts=knownAccounts();
    let rows=accounts.length?accounts.map(u=>`<div class="link-row">
      <div><b>${esc(u)}</b><div class="sub" style="margin:2px 0 0">${accountLinks[u]?'Plays as '+esc(accountLinks[u]):'Not linked to a player yet'}</div></div>
      <select class="accountLink" data-account="${esc(u)}">
        <option value="">— no player —</option>
        ${players.map(p=>`<option value="${esc(p)}" ${accountLinks[u]===p?'selected':''} ${accountForPlayer(p)&&accountForPlayer(p)!==u?'disabled':''}>${esc(p)}${accountForPlayer(p)&&accountForPlayer(p)!==u?' (taken)':''}</option>`).join('')}
      </select></div>`).join(''):'<p class="sub">No accounts found yet. Accounts appear here once somebody signs up.</p>';
    document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:620px">
      <div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Link accounts to players</h2></div><button class="close" onclick="closeModal()">×</button></div>
      <p class="sub">Connect each sign-in account to the player profile it belongs to. Linked players see their own profile from the account page, and prediction points are tracked against the account.</p>
      ${focusPlayer&&!accountForPlayer(focusPlayer)?`<p class="sub" style="color:#ffb0b5">${esc(focusPlayer)} has no account linked yet.</p>`:''}
      <div class="card" style="padding:6px 14px">${rows}</div>
      <div class="creator-actions"><button class="btn" onclick="saveAccountLinks()">Save links</button></div>
    </div></div>`
  })
}
function saveAccountLinks(){
  if(!moderator)return;
  let next={};
  document.querySelectorAll('.accountLink').forEach(sel=>{let p=sel.value.trim();if(p)next[sel.dataset.account]=p});
  accountLinks=next;
  try{localStorage.setItem('draftdex-accountlinks',JSON.stringify(accountLinks))}catch{}
  persistLeague();closeModal();render()
}

function Account(){
  if(!sessionUser)return head('Sign in',LEAGUE.short+' account')+`<div class="card account-panel" style="max-width:520px;padding:28px">
    <div class="card-title" style="margin-bottom:6px">Account Access</div>
    <p class="sub" style="margin:0 0 20px">Sign in or create a trainer account to track prediction points and access your profile.</p>
    <div class="field"><label>Username</label><input id="authUsername" autocomplete="username" placeholder="Trainer username"></div>
    <div class="field"><label>Password</label><input id="authPassword" autocomplete="current-password" type="password" placeholder="Password"></div>
    <div class="creator-actions" style="justify-content:start;margin-top:22px"><button class="btn" onclick="signIn()">Sign in</button><button class="btn ghost" onclick="signUp()">Create account</button></div>
    <p id="authNotice" class="sub" style="display:none;margin-top:14px"></p>
    ${supabaseReady()?'':'<p class="sub" style="margin-top:16px;color:#ff9fa6">Supabase is not configured yet. Add your project credentials to <code>supabase-config.js</code>.</p>'}</div>`;

  let username=window.currentAccount?.username||'Trainer',mine=myPlayer();
  let faceArt=mine?(profilePictures[mine]?`url('${esc(profilePictures[mine])}')`:(teamCovers[mine]?`url('${esc(teamCovers[mine])}')`:fallbackArt(mine))):fallbackArt(username);
  let faceLetter=mine?((profilePictures[mine]||teamCovers[mine])?'':esc(mine[0]||'')):esc(username[0]||'T');
  let myTeam=mine?esc(profiles[mine]?.team||'No default team'):'';

  return head('Your Account','Identity & Permissions')+`
    <div class="acct-grid">
      <aside class="card acct-user-card">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
          <div class="avatar" style="background-image:${faceArt};background-size:cover;background-position:center;width:76px;height:76px;font-size:30px;border:2px solid #ffffff20;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,0.5);display:grid;place-items:center">${faceLetter}</div>
          <h2 style="font:800 28px 'Barlow Condensed';margin:14px 0 6px;letter-spacing:.5px">${esc(username)}</h2>
          <div style="margin-bottom:14px">
            ${moderator?`<span class="tag" style="background:#3b1319;color:#ff8e95;border:1px solid #6b242e;font-size:10px;padding:4px 10px;letter-spacing:.7px">👑 Moderator</span>`:`<span class="tag" style="background:#162c1e;color:#7df0aa;border:1px solid #2f5c3b;font-size:10px;padding:4px 10px;letter-spacing:.7px">🎮 Trainer</span>`}
          </div>
        </div>

        <div class="acct-section-box">
          <div class="eyebrow" style="margin-bottom:6px">Player Profile</div>
          ${mine?`
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#141419;border:1px solid #2f2f38;border-radius:6px;padding:10px 12px;margin-top:8px">
              <div style="min-width:0">
                <div style="font-size:14px;font-weight:800">${esc(mine)}</div>
                <div style="font-size:10px;color:#9d9ba4;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${myTeam}</div>
              </div>
              <button class="btn ghost btn-sm" onclick="openProfile('${jsArg(mine)}')">View</button>
