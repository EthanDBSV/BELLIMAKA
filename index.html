<body><div class="shell"><header class="topbar"><div class="brand"><span class="ball"></span>DRAFTDEX</div><nav class="nav" id="nav"></nav><button class="account" onclick="go('Account')"><span class="mode-dot"></span><span id="accountText">Ethan · Moderator</span></button></header><main class="page" id="app"></main></div><div id="modal"></div>
<script>
const tabs=['Home','Standings','Matches','Top Cut','Teams','Predictions','Tournaments','Draft Board'];let current='Home',viewTournament='scarlet',detailTab='Group Stage';
const profiles={Ethan:{team:'Pallet Raiders',record:'12-5',tops:2,cups:['Obsidian Cup']},Maya:{team:'Celadon Comets',record:'10-6',tops:2,cups:['Indigo Invitational']},Noah:{team:'Vermilion Vipers',record:'8-8',tops:1,cups:[]},Jules:{team:'Lavender Lunatics',record:'7-9',tops:1,cups:[]},Theo:{team:'Saffron Shocks',record:'6-8',tops:0,cups:[]},Ivy:{team:'Cerulean Tides',record:'5-9',tops:0,cups:[]}};
const roster={Ethan:['Garchomp','Rotom-Wash','Talonflame','Amoonguss','Mamoswine','Milotic'],Maya:['Dragapult','Azumarill','Iron Valiant','Krookodile','Togekiss','Noivern'],Noah:['Zapdos','Scizor','Primarina','Hippowdon','Weavile','Mimikyu'],Jules:['Heatran','Meowscarada','Slowking','Mamoswine','Salamence','Tinkaton'],Theo:['Volcarona','Great Tusk','Greninja','Corviknight','Rillaboom','Magnezone'],Ivy:['Cinderace','Gholdengo','Excadrill','Hydreigon','Clefable','Roserade']};
function rr(names){let out=[],r=1;for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){out.push({id:r+'-'+i+j,round:'Round '+r,a:names[i],b:names[j],as:'',bs:'',date:'TBD'});r=r===5?1:r+1}return out}
const scarlet=rr(Object.keys(profiles));Object.assign(scarlet[0],{as:2,bs:1,date:'Today · 6:34 PM'});Object.assign(scarlet[1],{as:2,bs:0,date:'Today · 4:10 PM'});Object.assign(scarlet[2],{as:1,bs:2,date:'Yesterday · 8:02 PM'});
const tournamentData={scarlet:{id:'scarlet',name:'Scarlet Circuit',season:'Season 3',status:'ONGOING',start:'Aug 3, 2026',end:'Sep 2, 2026',regulation:'Regulation I · National Dex',players:Object.keys(profiles),groups:1,advance:4,matches:scarlet,champion:null,pred:[['Maya',62],['Noah',54],['Ethan',46],['Ivy',38]]},indigo:{id:'indigo',name:'Indigo Invitational',season:'Season 2',status:'COMPLETE',start:'May 2, 2026',end:'May 29, 2026',regulation:'Regulation G · Singles',players:['Maya','Ethan','Noah','Jules','Theo','Ivy'],groups:1,advance:4,matches:rr(['Maya','Ethan','Noah','Jules','Theo','Ivy']).map((m,i)=>({...m,as:i%3===0?1:2,bs:i%3===0?2:0,date:'May '+(3+i)+', 2026'})),champion:'Maya',pred:[['Noah',91],['Maya',86],['Ethan',75],['Ivy',52]]},obsidian:{id:'obsidian',name:'Obsidian Cup',season:'Season 1',status:'COMPLETE',start:'Jan 9, 2026',end:'Feb 13, 2026',regulation:'Regulation F · Singles',players:['Ethan','Maya','Noah','Jules'],groups:1,advance:2,matches:rr(['Ethan','Maya','Noah','Jules']).map((m,i)=>({...m,as:i%2?2:1,bs:i%2?0:2,date:'Jan '+(10+i)+', 2026'})),champion:'Ethan',pred:[['Ethan',72],['Maya',65],['Noah',41]]}};
let cut=+localStorage.getItem('draftdex-cut')||4,boardLink=localStorage.getItem('draftdex-board')||'https://docs.google.com/spreadsheets/';let moderator=true;
function activeT(){return tournamentData[viewTournament]}function save(){localStorage.setItem('draftdex-cut',cut);localStorage.setItem('draftdex-board',boardLink)}
function getStand(t=activeT()){let s={};t.players.forEach(p=>s[p]={p,w:0,l:0,gw:0,gl:0,h2h:0});t.matches.filter(m=>m.as!==''&&m.bs!=='').forEach(m=>{let a=s[m.a],b=s[m.b];if(!a||!b)return;a.gw+=+m.as;a.gl+=+m.bs;b.gw+=+m.bs;b.gl+=+m.as;if(+m.as>+m.bs){a.w++;b.l++;a.h2h++}else{b.w++;a.l++;b.h2h++}});return Object.values(s).sort((a,b)=>b.w-a.w||b.gw-a.gw||(b.gw-b.gl)-(a.gw-a.gl)||b.h2h-a.h2h)}
function head(title,over,action=''){return `<div class="page-head"><div><div class="eyebrow">${over}</div><h1>${title}</h1></div>${action}</div>`}function nav(){document.querySelector('#nav').innerHTML=tabs.map(t=>`<button class="${current===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}
function standingTable(t=activeT()){let list=getStand(t),advance=t.id==='scarlet'?cut:t.advance;return `<table class="standings"><thead><tr><th>#</th><th>Trainer / Team</th><th>W-L</th><th>GW</th><th>GD</th><th>H2H</th><th>Status</th></tr></thead><tbody>${list.map((x,i)=>{let cls=i<advance?'safe':t.status==='COMPLETE'?'':'out';return `<tr class="${cls}"><td class="rank">${i+1}</td><td class="player">${x.p}<span class="team">${profiles[x.p]?.team||'Unassigned team'}</span></td><td>${x.w}-${x.l}</td><td>${x.gw}</td><td>${x.gw-x.gl>0?'+':''}${x.gw-x.gl}</td><td>${x.h2h}</td><td>${t.status==='COMPLETE'&&x.p===t.champion?'<span class="tag safe">Champion</span>':i<advance?'<span class="tag safe">Top Cut</span>':t.status==='ONGOING'?'<span class="tag out">Outside cut</span>':'—'}</td></tr>`}).join('')}</tbody></table>`}
function matchCard(m,latest=false){return `<article class="card match-card ${latest?'latest':''}"><div class="match-meta"><span>${latest?'Latest result':m.round}</span><span>${m.date}</span></div><div class="pair"><div class="pair-row ${+m.as>+m.bs?'win':''}"><span>${m.a}</span><span class="score">${m.as}</span></div><div class="pair-row ${+m.bs>+m.as?'win':''}"><span>${m.b}</span><span class="score">${m.bs}</span></div></div></article>`}
function Home(){let t=activeT(),played=t.matches.filter(m=>m.as!==''),next=t.matches.find(m=>m.as==='')||t.matches[0];return head(t.season+': '+t.name,'Current tournament',moderator?`<button class="btn" onclick="go('Matches')">Enter match scores</button>`:'')+`<section class="hero"><div class="hero-main"><span class="status"><i></i>GROUP STAGE LIVE</span><div class="hero-title">${t.name.toUpperCase().replace(' ','<br>')}</div><div class="hero-info">${t.regulation} · ${t.players.length} trainers · double elimination Top Cut</div><div class="next"><span>${next.a}<small>${profiles[next.a]?.team}</small></span><b>NEXT UP</b><span style="text-align:right">${next.b}<small>${profiles[next.b]?.team}</small></span></div></div><aside class="card pulse"><div class="card-title">Tournament pulse</div><div class="progress-label"><span>Group stage progress</span><b>${Math.round(played.length/t.matches.length*100)}%</b></div><div class="progress"><span style="width:${Math.round(played.length/t.matches.length*100)}%"></span></div><div class="stats"><div class="stat"><b>${played.length}</b>Matches played</div><div class="stat"><b>${t.players.length}</b>Trainers</div><div class="stat"><b>Top ${cut}</b>Advance</div></div></aside></section><section class="section"><div class="section-head"><h2>RECENT RESULTS</h2><button class="link" onclick="go('Matches')">VIEW ALL MATCHES →</button></div><div class="match-grid">${played.slice(0,3).map((m,i)=>matchCard(m,i===0)).join('')}</div></section><section class="section"><div class="section-head"><h2>GROUP A STANDINGS</h2><button class="link" onclick="go('Standings')">FULL STANDINGS →</button></div><div class="card table-wrap">${standingTable()}</div></section>`}
function Standings(){let t=activeT();return head('Standings',t.name+' · Group A',moderator&&t.id==='scarlet'?`<button class="btn ghost" onclick="openSettings()">Edit Top Cut</button>`:'')+`<div class="card table-wrap">${standingTable(t)}</div><p class="sub">Tiebreak order: match record, games won, game differential, then head-to-head.</p>`}
function matchesView(t=activeT(),editable=t.id==='scarlet'&&moderator){let rounds={};t.matches.forEach((m,i)=>{(rounds[m.round]??=[]).push([m,i])});return `<div class="card round-list">${Object.entries(rounds).map(([r,arr])=>`<div class="round-title">${r} · ${arr.length} matches</div>${arr.map(([m,i])=>`<div class="match-row"><div class="match-date">${m.date}</div><div class="vs"><span>${m.a}</span><em>VS</em><span>${m.b}</span></div><div class="score-edit">${editable?`<input id="a${i}" type="number" min="0" value="${m.as}"><b>-</b><input id="b${i}" type="number" min="0" value="${m.bs}">`:`<b>${m.as===''?'—':m.as+' - '+m.bs}</b>`}</div>${editable?`<button class="save" onclick="score(${i})">Save</button>`:'<span></span>'}</div>`).join('')}`).join('')}</div>`}
function Matches(){let t=activeT();return head('Matches',t.name+' · full round robin',moderator&&t.id==='scarlet'?`<button class="btn" onclick="addCustom()">+ Add custom match</button>`:'')+`<div class="match-layout">${matchesView(t)}<aside class="card side"><div class="card-title">Round robin</div><p class="sub">Every trainer plays every other trainer once.</p><div class="side-line"><b>${t.matches.length}</b> total scheduled matches</div><div class="side-line"><b>${t.matches.filter(x=>x.as!=='').length}</b> scores reported</div><div class="side-line">Custom matches can be added by moderators.</div></aside></div>`}
function bracketMatch(a,an,b,bn,as='—',bs='—'){return `<div class="bracket-match"><div class="bracket-row"><span><span class="seed">${a}</span>${an}</span><span class="bracket-score">${as}</span></div><div class="bracket-row"><span><span class="seed">${b}</span>${bn}</span><span class="bracket-score">${bs}</span></div></div>`}function bracket(t=activeT()){let s=getStand(t),n=i=>s[i]?.p||'TBD';return `<div class="card bracket"><div class="bracket-title">Winners bracket</div><div class="bracket-board"><div><div class="bracket-title">Round 1</div><div class="bracket-col">${bracketMatch('1',n(0),'4',n(3),'2','1')}${bracketMatch('2',n(1),'3',n(2))}</div></div><div class="connector"></div><div><div class="bracket-title">Winners Final</div><div class="bracket-col semi">${bracketMatch('W1',n(0),'W2','TBD')}</div></div><div class="connector"></div><div><div class="bracket-title">Grand Final</div><div class="bracket-col final">${bracketMatch('W','TBD','L','TBD')}</div></div></div><div class="lower-bracket"><div class="bracket-title">Losers bracket · elimination round</div><div style="width:210px">${bracketMatch('L1',n(3),'L2','TBD')}</div></div></div>`}function TopCut(){let t=activeT();return head('Top Cut',t.name+' · double elimination',moderator&&t.id==='scarlet'?`<button class="btn ghost" onclick="alert('In production, this opens a bracket editor with seed, bye, and loser-placement controls.')">Edit bracket</button>`:'')+bracket(t)+`<p class="sub">Higher seeds face lower seeds. The graphic includes winner paths, loser paths, and a grand final.</p>`}
function Teams(){return head('Teams',activeT().name+' rosters',moderator?`<button class="btn ghost" onclick="go('Draft Board')">Open Draft Board ↗</button>`:'')+`<div class="teams">${activeT().players.map(p=>`<button class="card team-card" onclick="openProfile('${p}')"><div class="eyebrow">${p}</div><h3>${profiles[p]?.team||'New team'}</h3><div class="roster">${(roster[p]||[]).map(x=>`<span class="mon">${x}</span>`).join('')}</div><p class="sub">View profile & team history →</p></button>`).join('')}</div>`}
function openProfile(p){let q=profiles[p]||{team:'Unassigned',record:'0-0',tops:0,cups:[]};document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Player profile · linked account</div><h2>${p}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="profile-layout" style="margin-top:18px"><aside class="card profile-card"><div class="avatar">${p[0]}</div><div class="profile-name">${p}</div><div class="profile-info">Account: @${p.toLowerCase()}_trainer</div><div class="mini-stats"><div><b>${q.record}</b><span>All-time W-L</span></div><div><b>${q.tops}x</b><span>Top Cut</span></div></div><p class="sub">Champion: ${q.cups.length?q.cups.join(', '):'No titles yet'}</p></aside><section class="card roster-editor"><div class="card-title">Current roster</div>${moderator?`<div class="poke-search"><input id="newMon" placeholder="Search / add a Pokémon"><button class="btn" onclick="addMon('${p}')">Add</button></div>`:'<p class="sub">Only your linked player profile is visible to you here.</p>'}<div class="roster-edit-list" id="rosterList">${rosterList(p)}</div><div class="section"><div class="eyebrow">Team history</div><p class="sub">${q.team} · Scarlet Circuit<br>Previous team: ${p==='Ethan'?'Obsidian Owls':'No prior team recorded'}</p></div></section></div></div></div>`}function rosterList(p){return (roster[p]||[]).map((m,i)=>`<div class="edit-mon">${m}${moderator?`<button onclick="removeMon('${p}',${i})">Remove</button>`:''}</div>`).join('')}function addMon(p){let v=document.querySelector('#newMon').value.trim();if(v){roster[p]??=[];roster[p].push(v);document.querySelector('#rosterList').innerHTML=rosterList(p);document.querySelector('#newMon').value=''}}function removeMon(p,i){roster[p].splice(i,1);document.querySelector('#rosterList').innerHTML=rosterList(p)}
function predictions(t=activeT(),compact=false){let names=t.players;let block=(over,q,opts)=>`<div class="prediction card"><div class="eyebrow">${over}</div><h3>${q}</h3><div class="pick-options">${opts.map((x,i)=>`<button class="pick ${i===0?'active':''}" onclick="pick(this)">${x}</button>`).join('')}</div></div>`;let games=t.matches.filter(x=>x.as==='').slice(0,4);return `<div class="pred-layout"><div>${block('50 points · tournament','Who will be the ${t.name} Champion?',names)}${block('30 points · group stage','Who will top Group A?',names)}${games.map(m=>block('10 points · '+m.round,'Who wins: '+m.a+' vs '+m.b,[m.a,m.b])).join('')}${compact?'':''}</div><aside class="card leaderboard"><div class="card-title">Prediction leaders</div>${t.pred.map(([p,pt],i)=>`<div class="leader"><span class="rank">${i+1}</span><span class="mini-avatar">${p[0]}</span><b>${p}</b><span class="pts">${pt} pts</span></div>`).join('')}<p class="sub">Points are tracked by player account, not by tournament profile.</p></aside></div>`}function Predictions(){return head('Predictions',activeT().name+' · pick the outcomes')+predictions()}
function tournamentCard(t){return `<button class="card archive-card" onclick="openTournament('${t.id}')"><div class="${t.status==='ONGOING'?'status':'eyebrow'}">${t.status==='ONGOING'?'<i></i>':''}${t.status}</div><h3>${t.name} · ${t.season}</h3><p>${t.champion?'Champion: '+t.champion:'Group stage · '+t.players.length+' trainers'}<br>${t.regulation}</p><div class="archive-stats"><span><b>${t.matches.length}</b>Matches</span><span><b>${t.start}</b>Started</span></div></button>`}function Tournaments(){return head('Tournaments','League archive',moderator?`<button class="btn" onclick="openCreator()">+ New tournament</button>`:'')+`<div class="archive">${Object.values(tournamentData).map(tournamentCard).join('')}</div><p class="sub">Select any tournament to view its group stage, standings, Top Cut, matches, and prediction leaderboard.</p>`}
function openTournament(id){viewTournament=id;detailTab='Group Stage';current='Tournament Detail';render()}function tournamentDetail(){let t=activeT(),content=detailTab==='Group Stage'?matchesView(t,false):detailTab==='Standings'?`<div class="card table-wrap">${standingTable(t)}</div>`:detailTab==='Top Cut'?bracket(t):predictions(t,true);return head(t.name,t.season+' · '+t.status,`<button class="btn ghost" onclick="go('Tournaments')">← Tournament archive</button>`)+`<div class="tabs">${['Group Stage','Standings','Top Cut','Predictions'].map(x=>`<button class="${detailTab===x?'active':''}" onclick="detailTab='${x}';render()">${x}</button>`).join('')}</div><div class="detail-layout"><div>${content}</div><aside class="card side"><div class="card-title">Tournament record</div><div class="side-line">${t.regulation}</div><div class="side-line"><b>${t.players.length}</b> players · ${t.groups} group</div><div class="side-line">Top ${t.id==='scarlet'?cut:t.advance} advance</div><div class="side-line">${t.start} → ${t.end}</div>${t.champion?`<div class="side-line"><b>Champion: ${t.champion}</b></div>`:''}</aside></div>`}
function Board(){return head('Draft Board','External league resource')+`<div class="card empty"><div class="card-title">Your draft board lives in one place</div><p class="sub">Use the link below to open your chosen Google Sheet or external draft platform.</p><button class="btn" onclick="window.open(boardLink,'_blank')">Open Draft Board ↗</button>${moderator?`<div class="field" style="max-width:500px;margin:24px auto 0"><label>Moderator: update board link</label><input id="boardInput" value="${boardLink}"><button class="btn ghost" style="margin-top:8px" onclick="boardLink=document.querySelector('#boardInput').value;save();alert('Draft Board link saved.')">Save link</button></div>`:''}</div>`}
function Account(){return head('Your account','Identity & permissions')+`<div class="card account-panel"><div class="eyebrow">Signed in as</div><div class="profile-name">Ethan <span style="font-size:15px;color:#aaa">@ethan_trainer</span></div><div class="role-box"><b>${moderator?'Moderator mode active':'Player mode active'}</b><br>${moderator?'You can create tournaments, enter scores, edit rosters, and manage archived records.':'You can submit predictions and view your linked player profile. League data is read-only.'}</div><div class="creator-actions" style="justify-content:start"><button class="btn" onclick="moderator=!moderator;document.querySelector('#accountText').textContent=moderator?'Ethan · Moderator':'Ethan · Player';render()">Switch to ${moderator?'Player':'Moderator'} view</button><button class="btn ghost" onclick="openProfile('Ethan')">Open my player profile</button></div><p class="sub">A production launch needs a real sign-in service. Each account should hold a role (player or moderator) and a linked playerProfileId. The server must enforce moderator-only writes; hiding buttons in the browser is not security.</p></div>`}
function openCreator(){let options=Object.keys(profiles).map(p=>`<option>${p}</option>`).join('');document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Create tournament</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="creator-grid"><div class="field"><label>Tournament name</label><input id="tn" placeholder="e.g. Crystal Clash"></div><div class="field"><label>Regulation</label><input id="tr" placeholder="e.g. Regulation I · Singles"></div><div class="field"><label>Number of players</label><input id="tp" type="number" min="2" value="6"></div><div class="field"><label>Players per group</label><input id="pg" type="number" min="2" value="6"></div><div class="field"><label>Advance per group</label><input id="ap" type="number" min="1" value="4"></div><div class="field"><label>Start date</label><input id="sd" type="date"></div><div class="field"><label>End date</label><input id="ed" type="date"></div><div class="field"><label>Existing player profiles</label><select id="selectPlayers" multiple size="4">${options}</select></div></div><div class="field"><label>New player profile name (optional)</label><input id="newPlayer" placeholder="Create a profile and add them"></div><p class="sub">Choose existing profiles or add a new one. On creation, an all-play-all round-robin schedule is generated automatically; you can add custom matches later.</p><div class="creator-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="createTournament()">Create tournament</button></div></div></div>`}function createTournament(){let name=document.querySelector('#tn').value.trim()||'Untitled Cup',selected=[...document.querySelector('#selectPlayers').selectedOptions].map(x=>x.value),newP=document.querySelector('#newPlayer').value.trim(),count=+document.querySelector('#tp').value||selected.length||2;if(newP){profiles[newP]={team:'Unassigned team',record:'0-0',tops:0,cups:[]};roster[newP]=[];selected.push(newP)}while(selected.length<count){let fallback=Object.keys(profiles).find(x=>!selected.includes(x));if(fallback)selected.push(fallback);else break}let id='t'+Date.now();tournamentData[id]={id,name,season:'New tournament',status:'ONGOING',start:document.querySelector('#sd').value||'TBD',end:document.querySelector('#ed').value||'TBD',regulation:document.querySelector('#tr').value||'Custom regulation',players:selected,groups:Math.ceil(selected.length/(+document.querySelector('#pg').value||selected.length)),advance:+document.querySelector('#ap').value||4,matches:rr(selected),champion:null,pred:selected.map((p,i)=>[p,0])};viewTournament=id;current='Tournament Detail';closeModal();render()}
function openSettings(){document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:430px"><div class="modal-head"><div><div class="eyebrow">Moderator setting</div><h2>Top Cut size</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Number of Scarlet Circuit players advancing</label><select id="cutSelect">${[2,4,6].map(x=>`<option ${x===cut?'selected':''}>${x}</option>`).join('')}</select></div><div class="creator-actions"><button class="btn" onclick="cut=+document.querySelector('#cutSelect').value;save();closeModal();render()">Save Top Cut</button></div></div></div>`}function closeModal(){document.querySelector('#modal').innerHTML=''}function score(i){let m=activeT().matches[i],a=document.querySelector('#a'+i).value,b=document.querySelector('#b'+i).value;if(a===''||b===''){alert('Enter both scores.');return}m.as=+a;m.bs=+b;m.date='Today · just now';render()}function addCustom(){let t=activeT();t.matches.push({id:Date.now(),round:'Custom',a:t.players[0],b:t.players[1],as:'',bs:'',date:'Unscheduled'});render()}function pick(el){el.parentElement.querySelectorAll('.pick').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function go(t){if(t==='Draft Board'){current='Draft Board'}else current=t;render();scrollTo(0,0)}function render(){nav();let pages={Home,Standings,Matches,'Top Cut':TopCut,Teams,Predictions,Tournaments,'Draft Board':Board,Account,'Tournament Detail':tournamentDetail};document.querySelector('#app').innerHTML=pages[current]()}render();
</script>
<script>
/* Management upgrades */
const teamHistory={Ethan:[{tournament:'Obsidian Cup · S1',team:'Obsidian Owls',pokemon:['Garchomp','Rotom-Wash','Corviknight']}],Maya:[{tournament:'Indigo Invitational · S2',team:'Celadon Comets',pokemon:['Dragapult','Azumarill','Togekiss']}],Noah:[],Jules:[],Theo:[],Ivy:[]};
function ongoingT(){return Object.values(tournamentData).find(t=>t.status==='ONGOING')||null}
function activeT(){return tournamentData[viewTournament]||ongoingT()||Object.values(tournamentData)[0]||null}
function recapRankings(){return Object.entries(profiles).map(([p,q])=>{let [w,l]=q.record.split('-').map(Number),champ=q.cups.length,score=champ*100+q.tops*35+(w-l)*3;return {p,score,champ,tops:q.tops,record:q.record}}).sort((a,b)=>b.score-a.score)}
function OffseasonHome(){let last=Object.values(tournamentData).filter(t=>t.status==='COMPLETE').at(-1),r=recapRankings(),pred=Object.values(tournamentData).flatMap(t=>t.pred).reduce((a,[p,x])=>(a[p]=(a[p]||0)+x,a),{}),best=Object.entries(pred).sort((a,b)=>b[1]-a[1])[0];return head('League Off-Season','No tournament is currently ongoing',moderator?`<button class="btn" onclick="openCreator()">+ Create next tournament</button>`:'')+`<section class="hero"><div class="hero-main"><span class="status"><i></i>SEASON RECAP</span><div class="hero-title">${last?last.name.toUpperCase():'THE LEAGUE ARCHIVE'}</div><div class="hero-info">${last?`Last champion: ${last.champion} · ${last.regulation}`:'Create a tournament to begin recording the league.'}</div></div><aside class="card pulse"><div class="card-title">Last season leaders</div><div class="stats"><div class="stat"><b>${last?.champion||'—'}</b>Champion</div><div class="stat"><b>${best?.[0]||'—'}</b>Prediction king</div><div class="stat"><b>${best?.[1]||0}</b>All-time points</div></div></aside></section><section class="section"><div class="section-head"><h2>PLAYER POWER RANKING</h2><span class="sub">100 per title · 35 per Top Cut · +3 per career win over .500</span></div><div class="card table-wrap"><table class="standings"><thead><tr><th>#</th><th>Player</th><th>League score</th><th>Titles</th><th>Top Cuts</th><th>All-time W-L</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td class="rank">${i+1}</td><td class="player">${x.p}<span class="team">${profiles[x.p].team}</span></td><td><b>${x.score}</b></td><td>${x.champ}</td><td>${x.tops}</td><td>${x.record}</td></tr>`).join('')}</tbody></table></div></section>`}
function Home(){let t=ongoingT();if(!t)return OffseasonHome();viewTournament=t.id;let played=t.matches.filter(m=>m.as!==''),next=t.matches.find(m=>m.as==='')||t.matches[0],percent=t.matches.length?Math.round(played.length/t.matches.length*100):0;return head(t.season+': '+t.name,'Current tournament',moderator?`<button class="btn" onclick="go('Matches')">Enter match scores</button>`:'')+`<section class="hero"><div class="hero-main"><span class="status"><i></i>GROUP STAGE LIVE</span><div class="hero-title">${t.name.toUpperCase().replace(' ','<br>')}</div><div class="hero-info">${t.regulation} · ${t.players.length} trainers · double elimination Top Cut</div><div class="next"><span>${next.a}<small>${profiles[next.a]?.team}</small></span><b>NEXT UP</b><span style="text-align:right">${next.b}<small>${profiles[next.b]?.team}</small></span></div></div><aside class="card pulse"><div class="card-title">Tournament Pulse</div><div class="progress-label"><span>Group stage progress</span><b>${percent}%</b></div><div class="progress"><span style="width:${percent}%"></span></div><div class="stats"><div class="stat"><b>${played.length}</b>Matches played</div><div class="stat"><b>${t.matches.length-played.length}</b>Matches remaining</div><div class="stat"><b>Top ${cut}</b>Advance</div></div></aside></section><section class="section"><div class="section-head"><h2>RECENT RESULTS</h2><button class="link" onclick="go('Matches')">VIEW ALL MATCHES →</button></div><div class="match-grid">${played.slice(0,3).map((m,i)=>matchCard(m,i===0)).join('')}</div></section><section class="section"><div class="section-head"><h2>GROUP A STANDINGS</h2><button class="link" onclick="go('Standings')">FULL STANDINGS →</button></div><div class="card table-wrap">${standingTable(t)}</div></section>`}
function noTournament(){return head('No active tournament','League management')+`<div class="card empty"><div class="card-title">The league is between tournaments</div><p class="sub">Browse the archive or create the next season when you are ready.</p><button class="btn" onclick="go('Tournaments')">View tournament archive</button></div>`}
function Matches(){let t=ongoingT();if(!t)return noTournament();viewTournament=t.id;return head('Matches',t.name+' · all scheduled matches',moderator?`<button class="btn" onclick="addCustom()">+ Add custom match</button>`:'')+`<div class="match-layout">${matchesView(t,true)}<aside class="card side"><div class="card-title">Schedule</div><p class="sub">Matches can be played in any order. Scores receive their completion timestamp when saved.</p><div class="side-line"><b>${t.matches.length}</b> total scheduled matches</div><div class="side-line"><b>${t.matches.filter(x=>x.as!=='').length}</b> scores reported</div></aside></div>`}
function matchesView(t=activeT(),editable=t?.id==='scarlet'&&moderator){if(!t)return '';return `<div class="card round-list">${t.matches.map((m,i)=>`<div class="match-row"><div class="match-date">${m.as===''?'UNREPORTED':m.date}</div><div class="vs"><span>${m.a}</span><em>VS</em><span>${m.b}</span></div><div class="score-edit">${editable?`<input id="a${i}" type="number" min="0" value="${m.as}"><b>-</b><input id="b${i}" type="number" min="0" value="${m.bs}">`:`<b>${m.as===''?'—':m.as+' - '+m.bs}</b>`}</div>${editable?`<button class="save" onclick="score(${i})">Save score</button>`:'<span></span>'}</div>`).join('')}</div>`}
function score(i){let t=activeT(),m=t.matches[i],a=document.querySelector('#a'+i).value,b=document.querySelector('#b'+i).value;if(a===''||b===''){alert('Enter both scores.');return}m.as=+a;m.bs=+b;m.date=new Date().toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});render()}
function predictions(t=activeT()){let names=t.players,block=(over,q,opts)=>`<div class="prediction card"><div class="eyebrow">${over}</div><h3>${q}</h3><div class="pick-options">${opts.map((x,i)=>`<button class="pick ${i===0?'active':''}" onclick="pick(this)">${x}</button>`).join('')}</div></div>`,games=t.matches.filter(x=>x.as==='').slice(0,5);return `<div class="pred-layout"><div>${block('100 points · tournament outcome','Who will be the ${t.name} Champion?',names)}${block('45 points · group outcome','Who will top Group A?',names)}${games.map(m=>block('8 points · individual match','Who wins: '+m.a+' vs '+m.b,[m.a,m.b])).join('')}<p class="sub">Point hierarchy: a champion call is worth 12.5 match calls; a group winner is worth more than five. Harder predictions carry more value.</p></div><aside class="card leaderboard"><div class="card-title">Prediction leaders</div>${t.pred.map(([p,pt],i)=>`<div class="leader"><span class="rank">${i+1}</span><span class="mini-avatar">${p[0]}</span><b>${p}</b><span class="pts">${pt} pts</span></div>`).join('')}<p class="sub">Points are attached to accounts, not tournament records.</p></aside></div>`}
function closeModal(){document.querySelector('#modal').innerHTML='';render()}

function persistLeague(){localStorage.setItem('draftdex-tournaments',JSON.stringify(tournamentData));localStorage.setItem('draftdex-rosters',JSON.stringify(roster));localStorage.setItem('draftdex-history',JSON.stringify(teamHistory))}

function groupsOf(t){let count=Math.max(1,Number(t.groupCount||t.groups||1));let names=Array.from({length:count},(_,i)=>'Group '+String.fromCharCode(65+i));let buckets=Object.fromEntries(names.map(x=>[x,[]]));t.players.forEach((p,i)=>buckets[names[i%count]].push(p));return buckets}
function groupMatches(t,g){return t.matches.filter(m=>(m.group||'Group A')===g)}
function groupSchedule(t){let buckets=groupsOf(t);return Object.entries(buckets).flatMap(([g,ps])=>rr(ps).map(m=>({...m,group:g}))) }
function getStand(t=activeT(),group=null){let buckets=groupsOf(t),g=group||Object.keys(buckets)[0],members=buckets[g]||t.players;let s={};members.forEach(p=>s[p]={p,w:0,l:0,gw:0,gl:0,h2h:0});groupMatches(t,g).filter(m=>m.as!==''&&m.bs!=='').forEach(m=>{let a=s[m.a],b=s[m.b];if(!a||!b)return;a.gw+=+m.as;a.gl+=+m.bs;b.gw+=+m.bs;b.gl+=+m.as;if(+m.as>+m.bs){a.w++;b.l++;a.h2h++}else if(+m.bs>+m.as){b.w++;a.l++;b.h2h++}});return Object.values(s).sort((a,b)=>b.w-a.w||b.gw-a.gw||(b.gw-b.gl)-(a.gw-a.gl)||b.h2h-a.h2h)}
function advancePerGroup(t){return t.id==='scarlet'?cut:Number(t.advance||2)}
function qualified(t){return Object.keys(groupsOf(t)).flatMap(g=>getStand(t,g).slice(0,advancePerGroup(t)).map((x,i)=>({...x,group:g,groupSeed:i+1}))).sort((a,b)=>a.groupSeed-b.groupSeed||b.gw-a.gw||(b.gw-b.gl)-(a.gw-a.gl))}
function standingTable(t=activeT(),group='Group A'){let list=getStand(t,group),advance=advancePerGroup(t);return `<div class="eyebrow" style="padding:16px 14px 0">${group}</div><table class="standings"><thead><tr><th>#</th><th>Trainer / Team</th><th>W-L</th><th>GW</th><th>GD</th><th>H2H</th><th>Status</th></tr></thead><tbody>${list.map((x,i)=>`<tr class="${i<advance?'safe':'out'}"><td class="rank">${i+1}</td><td class="player">${x.p}<span class="team">${profiles[x.p]?.team||'Unassigned team'}</span></td><td>${x.w}-${x.l}</td><td>${x.gw}</td><td>${x.gw-x.gl>0?'+':''}${x.gw-x.gl}</td><td>${x.h2h}</td><td><span class="tag ${i<advance?'safe':'out'}">${i<advance?'Top Cut':'Outside cut'}</span></td></tr>`).join('')}</tbody></table>`}
function Standings(){let t=ongoingT();if(!t)return noTournament();viewTournament=t.id;let groups=Object.keys(groupsOf(t));return head('Standings',t.name+' · group stage',moderator?`<button class="btn ghost" onclick="openSettings()">Edit qualification</button>`:'')+`<div class="tabs">${groups.map(g=>`<button class="${g===window.standingGroup?'active':''}" onclick="window.standingGroup='${g}';render()">${g}</button>`).join('')}</div><div class="card table-wrap">${standingTable(t,window.standingGroup&&groups.includes(window.standingGroup)?window.standingGroup:groups[0])}</div><p class="sub">Top ${advancePerGroup(t)} from each group advance. Tiebreak order: match record, games won, game differential, then head-to-head.</p>`}
function matchesView(t=activeT(),editable=t?.id==='scarlet'&&moderator){if(!t)return '';let groups=Object.keys(groupsOf(t));return `<div>${groups.map(g=>`<section class="card round-list" style="margin-bottom:15px"><div class="round-title">${g} · ${groupMatches(t,g).length} matches</div>${groupMatches(t,g).map(m=>{let i=t.matches.indexOf(m);return `<div class="match-row"><div class="match-date">${m.as===''?'UNREPORTED':m.date}</div><div class="vs"><span>${m.a}</span><em>VS</em><span>${m.b}</span></div><div class="score-edit">${editable?`<input id="a${i}" type="number" min="0" placeholder="0" value="${m.as}"><b>-</b><input id="b${i}" type="number" min="0" placeholder="0" value="${m.bs}">`:`<b>${m.as===''?'—':m.as+' - '+m.bs}</b>`}</div>${editable?`<button class="save" onclick="score(${i})">Save score</button>`:'<span></span>'}</div>`}).join('')}</section>`).join('')}</div>`}
function score(i){let t=activeT(),m=t.matches[i],a=document.querySelector('#a'+i).value,b=document.querySelector('#b'+i).value;m.as=a===''?0:+a;m.bs=b===''?0:+b;m.date=new Date().toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});persistLeague();render()}
function Matches(){let t=ongoingT();if(!t)return noTournament();viewTournament=t.id;let groups=Object.keys(groupsOf(t));return head('Matches',t.name+' · group stage',moderator?`<button class="btn" onclick="addCustom()">+ Add custom match</button>`:'')+`<div class="match-layout">${matchesView(t,true)}<aside class="card side"><div class="card-title">Schedule</div><p class="sub">Matches can be played in any order and are organized by group.</p>${groups.map(g=>`<div class="side-line"><b>${g}</b><br>${groupMatches(t,g).filter(x=>x.as!=='').length}/${groupMatches(t,g).length} complete</div>`).join('')}</aside></div>`}
function bracket(t=activeT()){let q=qualified(t),n=q.length,pairs=[];for(let i=0;i<Math.ceil(n/2);i++)pairs.push([q[i]?.p||'BYE',q[n-1-i]?.p||'BYE']);return `<div class="card bracket"><div class="bracket-title">Top Cut · ${n} qualifying players</div><div class="bracket-board" style="grid-template-columns:repeat(${Math.min(4,Math.max(2,pairs.length))},210px);gap:22px;min-width:${Math.max(500,pairs.length*220)}px"><div><div class="bracket-title">Opening round</div><div class="bracket-col">${pairs.map((x,i)=>bracketMatch(i+1,x[0],n-i,x[1])).join('')}</div></div><div><div class="bracket-title">Winners path</div><div class="bracket-col semi">${bracketMatch('W','Advancing seed','W','Advancing seed')}</div></div><div><div class="bracket-title">Losers path</div><div class="bracket-col semi">${bracketMatch('L','Lower bracket','L','Lower bracket')}</div></div><div><div class="bracket-title">Grand Final</div><div class="bracket-col final">${bracketMatch('W','Winners Final','L','Losers Final')}</div></div></div></div>`}

function openSettings(){let t=ongoingT();document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:430px"><div class="modal-head"><div><div class="eyebrow">Moderator setting</div><h2>Group qualification</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Players advancing from each group</label><input id="cutSelect" type="number" min="1" max="${Math.max(...Object.values(groupsOf(t)).map(x=>x.length))}" value="${advancePerGroup(t)}"></div><p class="sub">This number is applied to every group and immediately changes the Top Cut field.</p><div class="creator-actions"><button class="btn" onclick="cut=Math.max(1,+document.querySelector('#cutSelect').value||1);persistLeague();closeModal();render()">Save qualification</button></div></div></div>`}
function predictions(t=activeT()){let names=t.players,groupName=Object.keys(groupsOf(t))[0],block=(over,q,opts)=>`<div class="prediction card"><div class="eyebrow">${over}</div><h3>${q}</h3><div class="pick-options">${opts.map((x,i)=>`<button class="pick ${i===0?'active':''}" onclick="pick(this)">${x}</button>`).join('')}</div></div>`,games=t.matches.filter(x=>x.as==='').slice(0,5);return `<div class="pred-layout"><div>${block('100 points · tournament outcome','Who will be the '+t.name+' Champion?',names)}${block('45 points · group outcome','Who will top '+groupName+'?',groupsOf(t)[groupName])}${games.map(m=>block('8 points · individual match','Who wins: '+m.a+' vs '+m.b,[m.a,m.b])).join('')}</div><aside class="card leaderboard"><div class="card-title">Prediction leaders</div>${t.pred.map(([p,pt],i)=>`<div class="leader"><span class="rank">${i+1}</span><span class="mini-avatar">${p[0]}</span><b>${p}</b><span class="pts">${pt} pts</span></div>`).join('')}</aside></div>`}
function openCreator(){let options=Object.keys(profiles).map(p=>`<option>${p}</option>`).join('');document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Create tournament</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="creator-grid"><div class="field"><label>Tournament name</label><input id="tn" placeholder="e.g. Crystal Clash"></div><div class="field"><label>Regulation</label><input id="tr" placeholder="e.g. Regulation I · Singles"></div><div class="field"><label>Number of players</label><input id="tp" type="number" min="2" value="8"></div><div class="field"><label>Number of groups</label><select id="gc"><option value="1">1 group</option><option value="2">2 groups</option><option value="4">4 groups</option></select></div><div class="field"><label>Players advancing per group</label><input id="ap" type="number" min="1" value="2"></div><div class="field"><label>Start date</label><input id="sd" type="date"></div><div class="field"><label>End date</label><input id="ed" type="date"></div><div class="field"><label>Existing player profiles</label><select id="selectPlayers" multiple size="4">${options}</select></div></div><div class="field"><label>New player profile name (optional)</label><input id="newPlayer" placeholder="Create a profile and add them"></div><p class="sub">Players are distributed evenly across groups. Each group gets its own round-robin schedule and standings.</p><div class="creator-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="createTournament()">Create tournament</button></div></div></div>`}
function createTournament(){let name=document.querySelector('#tn').value.trim()||'Untitled Cup',selected=[...document.querySelector('#selectPlayers').selectedOptions].map(x=>x.value),newP=document.querySelector('#newPlayer').value.trim(),count=+document.querySelector('#tp').value||selected.length||2;if(newP){profiles[newP]={team:'Unassigned team',record:'0-0',tops:0,cups:[]};roster[newP]=[];teamHistory[newP]=[];selected.push(newP)}while(selected.length<count){let fallback=Object.keys(profiles).find(x=>!selected.includes(x));if(fallback)selected.push(fallback);else break}let id='t'+Date.now(),groupCount=+document.querySelector('#gc').value;tournamentData[id]={id,name,season:'New tournament',status:'ONGOING',start:document.querySelector('#sd').value||'TBD',end:document.querySelector('#ed').value||'TBD',regulation:document.querySelector('#tr').value||'Custom regulation',players:selected,groups:groupCount,groupCount,advance:+document.querySelector('#ap').value||1,matches:[],champion:null,pred:selected.map(p=>[p,0])};tournamentData[id].matches=groupSchedule(tournamentData[id]);Object.values(tournamentData).forEach(t=>{if(t.id!==id&&t.status==='ONGOING')t.status='COMPLETE'});viewTournament=id;current='Tournament Detail';persistLeague();closeModal();render()}

function getStand(t=activeT(),group=null){let buckets=groupsOf(t),g=group||Object.keys(buckets)[0],members=buckets[g]||t.players,s={};members.forEach(p=>s[p]={p,w:0,l:0,gw:0,gl:0,h2h:0,results:{}});groupMatches(t,g).filter(m=>m.as!==''&&m.bs!=='').forEach(m=>{let a=s[m.a],b=s[m.b];if(!a||!b)return;a.gw+=+m.as;a.gl+=+m.bs;b.gw+=+m.bs;b.gl+=+m.as;if(+m.as>+m.bs){a.w++;b.l++;a.results[m.b]=1;b.results[m.a]=0}else if(+m.bs>+m.as){b.w++;a.l++;b.results[m.a]=1;a.results[m.b]=0}});let list=Object.values(s);list.sort((a,b)=>{let basic=b.w-a.w||b.gw-a.gw||(b.gw-b.gl)-(a.gw-a.gl);if(basic)return basic;let ah=a.results[b.p],bh=b.results[a.p];if(ah!==undefined&&bh!==undefined)return bh-ah;return a.p.localeCompare(b.p)});for(let i=0;i<list.length-1;i++){let a=list[i],b=list[i+1];if(a.w===b.w&&a.gw===b.gw&&a.gw-a.gl===b.gw-b.gl&&a.results[b.p]!==undefined){a.h2h=a.results[b.p];b.h2h=b.results[a.p]}}return list}

function Matches(){let t=ongoingT();if(!t)return noTournament();viewTournament=t.id;let complete=t.matches.length>0&&t.matches.every(m=>m.as!==''&&m.bs!=='');return head('Matches',t.name+' · group stage',moderator&&t.phase!=='topcut'?`<div><button class="btn ghost" onclick="addCustom()">+ Add custom match</button> <button class="btn" onclick="endGroupStage()">End group stage</button></div>`:'')+`<div class="match-layout">${matchesView(t,true)}<aside class="card side"><div class="card-title">Schedule</div><p class="sub">${t.phase==='topcut'?'Group stage locked and finalized.':'Matches can be played in any order.'}</p><div class="side-line"><b>${t.matches.length}</b> total scheduled matches</div><div class="side-line"><b>${t.matches.filter(x=>x.as!=='').length}</b> scores reported</div>${!complete&&t.phase!=='topcut'?'<div class="side-line">Enter all scores before finalizing the group stage.</div>':''}</aside></div>`}
function doubleBracket(t){let bm=t.bracketMatches||[];let map=Object.fromEntries(bm.map(m=>[m.id,m]));let card=id=>{let m=map[id];if(!m)return '';let edit=moderator&&t.status==='ONGOING';return `<div class="bracket-match"><div class="bracket-row"><span>${m.p1?playerLink(m.p1):'TBD'}</span>${edit?`<input id="bs${id}a" type="number" min="0" placeholder="0" value="${m.s1}">`:`<span class="bracket-score">${m.s1===''?'—':m.s1}</span>`}</div><div class="bracket-row"><span>${m.p2?playerLink(m.p2):'TBD'}</span>${edit?`<input id="bs${id}b" type="number" min="0" placeholder="0" value="${m.s2}">`:`<span class="bracket-score">${m.s2===''?'—':m.s2}</span>`}</div>${edit?`<button class="save" style="width:100%;border-radius:0" onclick="bracketScore('${id}')">Save score</button>`:''}</div>`};return `<div class="card bracket"><div class="bracket-title">Double elimination · ${t.name}</div><div class="bracket-board"><div><div class="bracket-title">Winners Round 1</div><div class="bracket-col">${card('w1')}${card('w2')}</div></div><div class="connector"></div><div><div class="bracket-title">Winners / Losers</div><div class="bracket-col semi">${card('wf')}${card('lr1')}</div></div><div class="connector"></div><div><div class="bracket-title">Losers Final / Grand Final</div><div class="bracket-col">${card('lf')}${card('gf')}</div></div></div></div>`}
function buildDoubleElim(t){let q=qualified(t).map(x=>x.p);while(q.length<4)q.push('BYE');t.bracketMatches=[{id:'w1',round:'Winners R1',p1:q[0],p2:q[3],s1:'',s2:''},{id:'w2',round:'Winners R1',p1:q[1],p2:q[2],s1:'',s2:''},{id:'wf',round:'Winners Final',p1:'',p2:'',s1:'',s2:''},{id:'lr1',round:'Losers R1',p1:'',p2:'',s1:'',s2:''},{id:'lf',round:'Losers Final',p1:'',p2:'',s1:'',s2:''},{id:'gf',round:'Grand Final',p1:'',p2:'',s1:'',s2:''}]}
function result(m){if(!m||m.s1===''||m.s2===''||m.p1==='BYE'||m.p2==='BYE')return null;if(+m.s1===+m.s2)return null;return {winner:+m.s1>+m.s2?m.p1:m.p2,loser:+m.s1>+m.s2?m.p2:m.p1}}
function propagate(t){let x=Object.fromEntries(t.bracketMatches.map(m=>[m.id,m])),r1=result(x.w1),r2=result(x.w2);if(r1){x.wf.p1=r1.winner;x.lr1.p1=r1.loser}if(r2){x.wf.p2=r2.winner;x.lr1.p2=r2.loser}let wf=result(x.wf),lr=result(x.lr1);if(wf){x.lf.p1=wf.loser;x.gf.p1=wf.winner}if(lr)x.lf.p2=lr.winner;let lf=result(x.lf);if(lf)x.gf.p2=lf.winner}
function bracketScore(id){let t=ongoingT(),m=t.bracketMatches.find(x=>x.id===id);if(!m.p1||!m.p2||m.p1==='BYE'||m.p2==='BYE'){alert('Wait until this matchup is populated.');return}m.s1=document.querySelector('#bs'+id+'a').value===''?0:+document.querySelector('#bs'+id+'a').value;m.s2=document.querySelector('#bs'+id+'b').value===''?0:+document.querySelector('#bs'+id+'b').value;if(m.s1===m.s2){alert('Top Cut matches cannot end in a tie.');m.s1='';m.s2='';return}propagate(t);persistLeague();render()}
function endGroupStage(){let t=ongoingT();if(t.matches.some(m=>m.as===''||m.bs==='')){alert('Enter a score for every group-stage match before ending the group stage.');return}t.phase='topcut';buildDoubleElim(t);persistLeague();current='Top Cut';render()}
function TopCut(){let t=ongoingT();if(!t)return noTournament();viewTournament=t.id;if(t.phase!=='topcut')return head('Top Cut',t.name+' · pending group stage')+bracket(t)+`<p class="sub">Top Cut seeds update live from standings. Finalize the group stage from the Matches page to start the double-elimination bracket.</p>`;return head('Top Cut',t.name+' · live double elimination')+doubleBracket(t)+`${moderator?`<div class="creator-actions"><button class="btn" onclick="endTournament()">End tournament</button></div>`:''}`}
function endTournament(){let t=ongoingT(),gf=t.bracketMatches?.find(m=>m.id==='gf'),r=result(gf);if(!r){alert('Complete the Grand Final before ending the tournament.');return}if(!confirm(`End ${t.name} and record ${r.winner} as champion?`))return;t.champion=r.winner;t.status='COMPLETE';t.phase='complete';profiles[r.winner].cups.push(t.name);profiles[r.winner].tops++;persistLeague();current='Home';render()}

function result(m){if(!m||!m.p1||!m.p2)return null;if(m.p1==='BYE'&&m.p2!=='BYE')return {winner:m.p2,loser:'BYE'};if(m.p2==='BYE'&&m.p1!=='BYE')return {winner:m.p1,loser:'BYE'};if(m.s1===''||m.s2===''||+m.s1===+m.s2)return null;return {winner:+m.s1>+m.s2?m.p1:m.p2,loser:+m.s1>+m.s2?m.p2:m.p1}}

function groupsOf(t){let count=Math.max(1,Number(t.groupCount||t.groups||1)),names=Array.from({length:count},(_,i)=>'Group '+String.fromCharCode(65+i)),buckets=Object.fromEntries(names.map(x=>[x,[]]));if(t.groupAssignments){Object.entries(t.groupAssignments).forEach(([p,g])=>{if(buckets[g])buckets[g].push(p)});t.players.filter(p=>!Object.hasOwn(t.groupAssignments,p)).forEach((p,i)=>buckets[names[i%count]].push(p))}else t.players.forEach((p,i)=>buckets[names[i%count]].push(p));return buckets}
function rebuildSchedulePreserving(t){let old={};t.matches.forEach(m=>old[[m.group||'Group A',m.a,m.b].sort().join('|')]=m);let fresh=groupSchedule(t);fresh.forEach(m=>{let prior=old[[m.group,m.a,m.b].sort().join('|')];if(prior){m.as=prior.as;m.bs=prior.bs;m.date=prior.date}});t.matches=fresh}
function openTournamentPlayers(){let t=activeT(),groups=Object.keys(groupsOf(t)),choices=Object.keys(profiles).map(p=>`<label class="side-line" style="display:grid;grid-template-columns:20px 1fr 130px;gap:8px;align-items:center"><input class="tPlayerChoice" type="checkbox" value="${p}" ${t.players.includes(p)?'checked':''}> <span>${p}</span><select class="playerGroup" data-player="${p}">${groups.map(g=>`<option ${groupsOf(t)[g].includes(p)?'selected':''}>${g}</option>`).join('')}</select></label>`).join('');document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Edit ${t.name} players</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="sub">Team-name-only changes preserve every reported score. If you move participants between groups, a new group schedule is created and any unchanged matchup scores are retained.</p><div class="card" style="padding:5px 14px">${choices}</div><div id="teamNamesEdit">${t.players.map(p=>`<div class="field"><label>${p}'s team in this tournament</label><input class="tTeamName" data-player="${p}" value="${teamName(t,p)==='Unassigned team'?'':teamName(t,p)}" placeholder="Team name"></div>`).join('')}</div><div class="creator-actions"><button class="btn" onclick="saveTournamentPlayers()">Save participants & teams</button></div></div></div>`}
function saveTournamentPlayers(){let t=activeT();if(t.phase==='topcut'){alert('Participants are locked after Top Cut begins.');return}let selected=[...document.querySelectorAll('.tPlayerChoice:checked')].map(x=>x.value);if(selected.length<2){alert('A tournament needs at least two players.');return}let oldPlayers=t.players.join('|'),oldAssign=JSON.stringify(t.groupAssignments||{});t.players=selected;t.teamNames=t.teamNames||{};document.querySelectorAll('.tTeamName').forEach(x=>t.teamNames[x.dataset.player]=x.value.trim());let assign={};document.querySelectorAll('.playerGroup').forEach(x=>{if(selected.includes(x.dataset.player))assign[x.dataset.player]=x.value});t.groupAssignments=assign;let changed=oldPlayers!==selected.join('|')||oldAssign!==JSON.stringify(assign);if(changed)rebuildSchedulePreserving(t);persistLeague();closeModal()}

function matchesView(t=activeT(),editable=t?.id==='scarlet'&&moderator){if(!t)return '';editable=editable&&t.phase!=='topcut'&&t.status==='ONGOING';let groups=Object.keys(groupsOf(t));return `<div>${groups.map(g=>`<section class="card round-list" style="margin-bottom:15px"><div class="round-title">${g} · ${groupMatches(t,g).length} matches</div>${groupMatches(t,g).map(m=>{let i=t.matches.indexOf(m);return `<div class="match-row aligned"><div class="match-date">${m.as===''?'UNREPORTED':m.date}</div><div class="match-player">${playerLink(m.a)}</div><div class="match-vs">VS</div><div class="match-player">${playerLink(m.b)}</div><div class="score-edit">${editable?`<input id="a${i}" type="number" min="0" placeholder="0" value="${m.as}"><b>-</b><input id="b${i}" type="number" min="0" placeholder="0" value="${m.bs}">`:`<b>${m.as===''?'—':m.as+' - '+m.bs}</b>`}</div>${editable?`<button class="save" onclick="score(${i})">Save score</button>`:''}${editable&&m.custom?`<button class="save" style="color:#ff969c" onclick="removeCustom(${i})">Remove</button>`:''}</div>`}).join('')}</section>`).join('')}</div>`}
function seedTopCut(t){let buckets=groupsOf(t),groups=Object.keys(buckets),per=advancePerGroup(t),byGroup=Object.fromEntries(groups.map(g=>[g,getStand(t,g).slice(0,per).map(x=>x.p)]));if(groups.length===2&&per>=2){return [byGroup[groups[0]][0],byGroup[groups[1]][per-1],byGroup[groups[1]][0],byGroup[groups[0]][per-1]]}return qualified(t).map(x=>x.p)}
function buildDoubleElim(t){let q=seedTopCut(t);while(q.length<4)q.push('BYE');t.bracketMatches=[{id:'w1',title:'Winners Round 1 · Match 1',p1:q[0],p2:q[1],s1:'',s2:''},{id:'w2',title:'Winners Round 1 · Match 2',p1:q[2],p2:q[3],s1:'',s2:''},{id:'wf',title:'Winners Final',p1:'',p2:'',s1:'',s2:''},{id:'lr1',title:'Losers Round 1',p1:'',p2:'',s1:'',s2:''},{id:'lf',title:'Losers Final',p1:'',p2:'',s1:'',s2:''},{id:'gf',title:'Grand Final',p1:'',p2:'',s1:'',s2:''}]}
function doubleBracket(t){let map=Object.fromEntries((t.bracketMatches||[]).map(m=>[m.id,m])),card=id=>{let m=map[id];if(!m)return '';let edit=moderator&&t.status==='ONGOING';return `<div class="bracket-box"><div class="bracket-match-title">${m.title}</div><div class="bracket-match"><div class="bracket-row"><span>${m.p1?playerLink(m.p1):'TBD'}</span>${edit?`<input id="bs${id}a" type="number" min="0" placeholder="0" value="${m.s1}">`:`<span class="bracket-score">${m.s1===''?'—':m.s1}</span>`}</div><div class="bracket-row"><span>${m.p2?playerLink(m.p2):'TBD'}</span>${edit?`<input id="bs${id}b" type="number" min="0" placeholder="0" value="${m.s2}">`:`<span class="bracket-score">${m.s2===''?'—':m.s2}</span>`}</div>${edit?`<button class="save" style="width:100%;border-radius:0" onclick="bracketScore('${id}')">Save score</button>`:''}</div></div>`};return `<div class="card bracket"><div class="bracket-title">Double elimination · ${t.name}</div><div class="bracket-grid-final"><div>${card('w1')}${card('w2')}</div><div>${card('wf')}${card('lr1')}</div><div>${card('lf')}</div><div>${card('gf')}</div></div></div>`}
function applyTournamentStats(t){if(t.statsApplied)return;let all=[...t.matches,...(t.bracketMatches||[])];let record={};t.players.forEach(p=>record[p]={w:0,l:0});all.forEach(m=>{let r=result(m);if(r&&record[r.winner]&&record[r.loser]){record[r.winner].w++;record[r.loser].l++}});Object.entries(record).forEach(([p,x])=>{let [w,l]=(profiles[p].record||'0-0').split('-').map(Number);profiles[p].record=`${w+x.w}-${l+x.l}`});qualified(t).forEach(x=>profiles[x.p].tops=(profiles[x.p].tops||0)+1);t.statsApplied=true}

/* Supabase connection: activate by filling in supabase-config.js */
var supabaseClient=null,sessionUser=null;
function supabaseReady(){let c=window.DRAFTDEX_SUPABASE;return c&&c.url&&c.anonKey&&window.supabase}
function statePayload(){return {tournaments:tournamentData,profiles,roster,teamHistory,cut,boardLink}}
function applySharedState(data){if(!data||!data.tournaments)return;Object.keys(tournamentData).forEach(k=>delete tournamentData[k]);Object.assign(tournamentData,data.tournaments||{});Object.keys(profiles).forEach(k=>delete profiles[k]);Object.assign(profiles,data.profiles||{});Object.keys(roster).forEach(k=>delete roster[k]);Object.assign(roster,data.roster||{});Object.keys(teamHistory).forEach(k=>delete teamHistory[k]);Object.assign(teamHistory,data.teamHistory||{});cut=data.cut||cut;boardLink=data.boardLink||boardLink}
async function initSupabase(){if(!supabaseReady())return;supabaseClient=window.supabase.createClient(window.DRAFTDEX_SUPABASE.url,window.DRAFTDEX_SUPABASE.anonKey);let {data:{session}}=await supabaseClient.auth.getSession();await updateSession(session);supabaseClient.auth.onAuthStateChange(async(_,s)=>await updateSession(s));supabaseClient.channel('league-state').on('postgres_changes',{event:'UPDATE',schema:'public',table:'league_state',filter:'id=eq.main'},p=>{applySharedState(p.new.data);render()}).subscribe()}
async function updateSession(session){sessionUser=session?.user||null;moderator=false;if(sessionUser&&supabaseClient){let {data}=await supabaseClient.from('user_profiles').select('role,username,prediction_points').eq('id',sessionUser.id).single();moderator=data?.role==='moderator';window.currentAccount=data||null}let label=document.querySelector('#accountText');if(label)label.textContent=sessionUser?(moderator?'Moderator':'Player'):'Sign in';if(supabaseClient){let {data}=await supabaseClient.from('league_state').select('data').eq('id','main').single();applySharedState(data?.data)}render()}
async function persistLeague(){localStorage.setItem('draftdex-tournaments',JSON.stringify(tournamentData));localStorage.setItem('draftdex-rosters',JSON.stringify(roster));localStorage.setItem('draftdex-history',JSON.stringify(teamHistory));if(supabaseClient&&moderator){await supabaseClient.from('league_state').update({data:statePayload(),updated_at:new Date().toISOString()}).eq('id','main')}}
async function signIn(){if(!supabaseClient){alert('Add your Supabase URL and publishable key to supabase-config.js first.');return}let email=document.querySelector('#authEmail').value,password=document.querySelector('#authPassword').value,{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)alert(error.message)}
async function signUp(){if(!supabaseClient){alert('Add your Supabase URL and publishable key to supabase-config.js first.');return}let email=document.querySelector('#authEmail').value,password=document.querySelector('#authPassword').value,username=document.querySelector('#authUsername').value,{error}=await supabaseClient.auth.signUp({email,password,options:{data:{username}}});if(error)alert(error.message);else alert('Account created. Check your email if confirmation is enabled.')}
async function signOut(){if(supabaseClient)await supabaseClient.auth.signOut()}
function Account(){if(!sessionUser)return head('Sign in','League account')+`<div class="card account-panel" style="max-width:520px"><div class="card-title">Account access</div><p class="sub">Use your Draftdex account to save predictions and see your points. Moderators can edit league data.</p><div class="field"><label>Username (for new accounts)</label><input id="authUsername" placeholder="Trainer name"></div><div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="Password"></div><div class="creator-actions" style="justify-content:start"><button class="btn" onclick="signIn()">Sign in</button><button class="btn ghost" onclick="signUp()">Create account</button></div>${supabaseReady()?'':'<p class="sub">Supabase is not configured yet. Add your project credentials to <code>supabase-config.js</code>.</p>'}</div>`;return head('Your account','Identity & permissions')+`<div class="card account-panel"><div class="eyebrow">Signed in</div><div class="profile-name">${window.currentAccount?.username||sessionUser.email}</div><div class="role-box"><b>${moderator?'Moderator':'Player'}</b><br>${moderator?'League editing is enabled for this account.':'League information is read-only. Your predictions are tied to this account.'}</div><p class="sub">Prediction points: <b>${window.currentAccount?.prediction_points||0}</b></p>${moderator?`<div class="creator-actions" style="justify-content:start"><button class="btn" onclick="openProfileManager()">Manage player profiles</button></div>`:''}<button class="btn ghost" onclick="signOut()">Sign out</button></div>`}
setTimeout(initSupabase,0);
render();
function score(i){let t=activeT();if(t.phase==='topcut'){alert('Group-stage scores are locked after Top Cut seeding.');return}let m=t.matches[i],a=document.querySelector('#a'+i).value,b=document.querySelector('#b'+i).value;m.as=a===''?0:+a;m.bs=b===''?0:+b;m.completedAt=Date.now();m.date=new Date(m.completedAt).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});persistLeague();render()}
function bracketScore(id){let t=ongoingT(),m=t.bracketMatches.find(x=>x.id===id);if(!m.p1||!m.p2||m.p1==='BYE'||m.p2==='BYE'){alert('Wait until this matchup is populated.');return}m.s1=document.querySelector('#bs'+id+'a').value===''?0:+document.querySelector('#bs'+id+'a').value;m.s2=document.querySelector('#bs'+id+'b').value===''?0:+document.querySelector('#bs'+id+'b').value;if(m.s1===m.s2){alert('Top Cut matches cannot end in a tie.');m.s1='';m.s2='';return}m.completedAt=Date.now();propagate(t);persistLeague();render()}
function allResults(t){let group=t.matches.filter(m=>m.as!==''&&m.bs!=='').map(m=>({...m,label:m.group||'Group A'})),top=(t.bracketMatches||[]).filter(m=>m.s1!==''&&m.s2!=='').map(m=>({...m,a:m.p1,b:m.p2,as:m.s1,bs:m.s2,label:m.title||m.round,date:m.completedAt?new Date(m.completedAt).toLocaleString():''}));return [...group,...top].sort((a,b)=>(b.completedAt||Date.parse(b.date)||0)-(a.completedAt||Date.parse(a.date)||0))}
function Home(){let t=ongoingT();if(!t)return OffseasonHome();viewTournament=t.id;let results=allResults(t),next=t.phase==='topcut'?(t.bracketMatches||[]).find(m=>m.p1&&m.p2&&m.s1===''&&m.s2===''):t.matches.find(m=>m.as===''),total=t.phase==='topcut'?(t.bracketMatches||[]).length:t.matches.length,done=t.phase==='topcut'?results.filter(m=>m.title).length:t.matches.filter(m=>m.as!=='').length,pct=total?Math.round(done/total*100):0,groups=Object.keys(groupsOf(t));return head(t.season+': '+t.name,'Current tournament',moderator?`<button class="btn" onclick="go(t.phase==='topcut'?'Top Cut':'Matches')">Enter match scores</button>`:'')+`<section class="hero"><div class="hero-main" data-season="S${tournamentNumber(t)}"><span class="status"><i></i>${t.phase==='topcut'?'TOP CUT LIVE':'GROUP STAGE LIVE'}</span><div class="hero-title">${t.name.toUpperCase().replace(' ','<br>')}</div><div class="hero-info">${t.regulation} · ${t.players.length} trainers</div>${next?`<div class="next"><span>${playerLink(next.a||next.p1)}<small>${next.label||next.title||next.group||'Next match'}</small></span><b>NEXT UP</b><span style="text-align:right">${playerLink(next.b||next.p2)}<small>${next.label||next.title||next.group||'Next match'}</small></span></div>`:'<div class="next"><b>ALL MATCHES COMPLETE</b></div>'}</div><aside class="card pulse"><div class="card-title">Tournament Pulse</div><div class="progress-label"><span>${t.phase==='topcut'?'Top Cut':'Group stage'} progress</span><b>${pct}%</b></div><div class="progress"><span style="width:${pct}%"></span></div><div class="stats"><div class="stat"><b>${done}</b>Matches played</div><div class="stat"><b>${total-done}</b>Matches remaining</div><div class="stat"><b>${advancePerGroup(t)}×${groups.length}</b>Top Cut</div></div></aside></section><section class="section"><div class="section-head"><h2>RECENT RESULTS</h2><button class="link" onclick="go(t.phase==='topcut'?'Top Cut':'Matches')">VIEW ALL →</button></div><div class="match-grid">${results.slice(0,3).map((m,i)=>`<article class="card match-card ${i===0?'latest':''}"><div class="match-meta"><span>${i===0?'Latest result':m.label}</span><span>${m.date||''}</span></div><div class="pair"><div class="pair-row ${+m.as>+m.bs?'win':''}"><span>${playerLink(m.a)}</span><span class="score">${m.as}</span></div><div class="pair-row ${+m.bs>+m.as?'win':''}"><span>${playerLink(m.b)}</span><span class="score">${m.bs}</span></div></div></article>`).join('')}</div></section><section class="section"><div class="section-head"><h2>GROUP STANDINGS</h2><button class="link" onclick="go('Standings')">FULL STANDINGS →</button></div><div style="display:grid;grid-template-columns:repeat(${groups.length>1?2:1},minmax(0,1fr));gap:14px">${groups.map(g=>`<div class="card table-wrap">${standingTable(t,g)}</div>`).join('')}</div></section>`}
async function pick(el){if(el.disabled)return;el.parentElement.querySelectorAll('.pick').forEach(x=>x.classList.remove('active'));el.classList.add('active');let t=ongoingT(),key=el.closest('.prediction')?.querySelector('h3')?.textContent||'prediction',choice=el.textContent;localStorage.setItem('draftdex-pick-'+(t?.id||'')+'-'+key,choice);if(supabaseClient&&sessionUser&&t){await supabaseClient.from('predictions').upsert({user_id:sessionUser.id,tournament_id:t.id,prediction_key:key,selection:choice},{onConflict:'user_id,tournament_id,prediction_key'})}}
function recapRankings(){return Object.entries(profiles).map(([p,q])=>{let [w,l]=q.record.split('-').map(Number),score=Math.max(0,q.cups.length*100+q.tops*35+(w-l)*3);return {p,score,champ:q.cups.length,tops:q.tops,record:q.record}}).sort((a,b)=>b.score-a.score)}
function revertTournamentStats(t){if(!t.statsApplied)return;let all=[...t.matches,...(t.bracketMatches||[])],record={};t.players.forEach(p=>record[p]={w:0,l:0});all.forEach(m=>{let r=result(m);if(r&&record[r.winner]&&record[r.loser]){record[r.winner].w++;record[r.loser].l++}});Object.entries(record).forEach(([p,x])=>{let [w,l]=(profiles[p].record||'0-0').split('-').map(Number);profiles[p].record=`${Math.max(0,w-x.w)}-${Math.max(0,l-x.l)}`});qualified(t).forEach(x=>profiles[x.p].tops=Math.max(0,(profiles[x.p].tops||0)-1));if(t.champion)profiles[t.champion].cups=profiles[t.champion].cups.filter(x=>x!==t.name)}
function deleteTournament(id){let t=tournamentData[id];if(!t||!confirm(`Delete ${t.name}?`))return;revertTournamentStats(t);delete tournamentData[id];persistLeague();viewTournament=ongoingT()?.id||Object.keys(tournamentData)[0]||null;current='Tournaments';render()}
render();
if(!tabs.includes('Playoff Odds'))tabs.splice(5,0,'Playoff Odds');
function winChance(a,b,t){let qa=profiles[a]||{record:'0-0'},qb=profiles[b]||{record:'0-0'},[aw,al]=qa.record.split('-').map(Number),[bw,bl]=qb.record.split('-').map(Number);let current=getStand(t).find(x=>x.p===a),other=getStand(t).find(x=>x.p===b),career=(aw-al)-(bw-bl),form=(current?(current.w-current.l):0)-(other?(other.w-other.l):0);return Math.max(.12,Math.min(.88,.5+career*.015+form*.055))}
function playoffOdds(){let t=ongoingT();if(!t)return noTournament();let counts=Object.fromEntries(t.players.map(p=>[p,0])),runs=1000,groups=groupsOf(t);for(let run=0;run<runs;run++){for(let [g,ps] of Object.entries(groups)){let wins=Object.fromEntries(ps.map(p=>[p,0]));groupMatches(t,g).forEach(m=>{if(m.as!==''&&m.bs!==''){if(+m.as>+m.bs)wins[m.a]++;else if(+m.bs>+m.as)wins[m.b]++}else{let c=winChance(m.a,m.b,t);wins[Math.random()<c?m.a:m.b]++}});Object.entries(wins).sort((a,b)=>b[1]-a[1]||Math.random()-.5).slice(0,advancePerGroup(t)).forEach(([p])=>counts[p]++)}}let rows=Object.entries(counts).map(([p,n])=>({p,odds:Math.round(n/runs*100)})).sort((a,b)=>b.odds-a.odds);return head('Playoff Calculator',t.name+' · projected Top Cut chances')+`<div class="card table-wrap"><table class="standings"><thead><tr><th>#</th><th>Trainer</th><th>Top Cut chance</th><th>Why</th></tr></thead><tbody>${rows.map((x,i)=>`<tr class="${i<advancePerGroup(t)*Object.keys(groups).length?'safe':''}"><td class="rank">${i+1}</td><td class="player">${playerLink(x.p)}<span class="team">${teamName(t,x.p)}</span></td><td><b>${x.odds}%</b></td><td><div class="progress" style="width:160px"><span style="width:${x.odds}%"></span></div></td></tr>`).join('')}</tbody></table></div><p class="sub">1,000 simulated finishes. Each unplayed match is weighted by career W-L record (30%) and current tournament form (70%), then group qualification rules are applied. This is a forecast, not a guarantee.</p>`}
function render(){nav();let pages={Home,Standings,Matches,'Top Cut':TopCut,Teams,Predictions,'Playoff Odds':playoffOdds,Tournaments,'Draft Board':Board,Account,'Tournament Detail':tournamentDetail};document.querySelector('#app').innerHTML=(pages[current]||Home)()}
render();
function usernameAuthEmail(username){let normalized=username.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');return normalized?normalized+'@draftdex.invalid':''}
async function signIn(){if(!supabaseClient){alert('Add your Supabase URL and publishable key to supabase-config.js first.');return}let username=document.querySelector('#authUsername').value,password=document.querySelector('#authPassword').value,email=usernameAuthEmail(username);if(!email||!password){alert('Enter your username and password.');return}let {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)alert(error.message)}
async function signUp(){if(!supabaseClient){alert('Add your Supabase URL and publishable key to supabase-config.js first.');return}let username=document.querySelector('#authUsername').value.trim(),password=document.querySelector('#authPassword').value,email=usernameAuthEmail(username);if(username.length<3||!email||password.length<6){alert('Use a username of at least 3 characters and a password of at least 6 characters.');return}let {error}=await supabaseClient.auth.signUp({email,password,options:{data:{username}}});if(error)alert(error.message);else alert('Account created. You can sign in now.')}
function Account(){if(!sessionUser)return head('Sign in','League account')+`<div class="card account-panel" style="max-width:520px"><div class="card-title">Account access</div><p class="sub">Create a username and password. An email address is not shown or requested.</p><div class="field"><label>Username</label><input id="authUsername" autocomplete="username" placeholder="Trainer name"></div><div class="field"><label>Password</label><input id="authPassword" autocomplete="current-password" type="password" placeholder="Password"></div><div class="creator-actions" style="justify-content:start"><button class="btn" onclick="signIn()">Sign in</button><button class="btn ghost" onclick="signUp()">Create account</button></div>${supabaseReady()?'':'<p class="sub">Supabase is not configured yet. Add your project credentials to <code>supabase-config.js</code>.</p>'}</div>`;return head('Your account','Identity & permissions')+`<div class="card account-panel"><div class="eyebrow">Signed in</div><div class="profile-name">${window.currentAccount?.username||'Trainer'}</div><div class="role-box"><b>${moderator?'Moderator':'Player'}</b><br>${moderator?'League editing is enabled for this account.':'League information is read-only. Your predictions are tied to this account.'}</div><p class="sub">Prediction points: <b>${window.currentAccount?.prediction_points||0}</b></p><button class="btn ghost" onclick="signOut()">Sign out</button></div>`}
var originalOpenCreator=openCreator;
function openCreator(){originalOpenCreator();let g=document.querySelector('#gc');if(g)g.innerHTML=Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1} group${i?'s':''}</option>`).join('')}
function dragName(p,id,slot){return `<span class="bracket-drag" draggable="${moderator}" data-match="${id}" data-slot="${slot}" ondblclick="openProfile('${p}')">${p}</span>`}
function doubleBracket(t){let map=Object.fromEntries((t.bracketMatches||[]).map(m=>[m.id,m])),card=id=>{let m=map[id];if(!m)return '';let edit=moderator&&t.status==='ONGOING',name=(p,slot)=>p&&p!=='TBD'?dragName(p,id,slot):'TBD';return `<div class="bracket-box"><div class="bracket-match-title">${m.title}</div><div class="bracket-match"><div class="bracket-row"><span>${name(m.p1,'p1')}</span>${edit?`<input id="bs${id}a" type="number" min="0" placeholder="0" value="${m.s1}">`:`<span class="bracket-score">${m.s1===''?'—':m.s1}</span>`}</div><div class="bracket-row"><span>${name(m.p2,'p2')}</span>${edit?`<input id="bs${id}b" type="number" min="0" placeholder="0" value="${m.s2}">`:`<span class="bracket-score">${m.s2===''?'—':m.s2}</span>`}</div>${edit?`<button class="save" style="width:100%;border-radius:0" onclick="bracketScore('${id}')">Save score</button>`:''}</div></div>`};return `<div class="card bracket"><div class="bracket-title">Double elimination · ${t.name}</div><p class="sub">Moderators can drag a player name onto another first-round slot to swap seeds.</p><div class="bracket-grid-final"><div>${card('w1')}${card('w2')}</div><div>${card('wf')}${card('lr1')}</div><div>${card('lf')}</div><div>${card('gf')}</div></div></div>`}
document.addEventListener('dragstart',e=>{let x=e.target.closest('.bracket-drag');if(x&&moderator)e.dataTransfer.setData('text/plain',JSON.stringify({match:x.dataset.match,slot:x.dataset.slot}))});document.addEventListener('dragover',e=>{if(e.target.closest('.bracket-drag'))e.preventDefault()});document.addEventListener('drop',e=>{let target=e.target.closest('.bracket-drag');if(!target||!moderator)return;e.preventDefault();let source;try{source=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return}let t=ongoingT(),a=t?.bracketMatches?.find(m=>m.id===source.match),b=t?.bracketMatches?.find(m=>m.id===target.dataset.match);if(!a||!b||source.match==='wf'||source.match==='lr1'||source.match==='lf'||source.match==='gf'||target.dataset.match==='wf'||target.dataset.match==='lr1'||target.dataset.match==='lf'||target.dataset.match==='gf')return;let av=a[source.slot],bv=b[target.dataset.slot];a[source.slot]=bv;b[target.dataset.slot]=av;a.s1=a.s2=b.s1=b.s2='';propagate(t);persistLeague();render()});
render();
function endGroupStage(){let t=ongoingT(),size=qualified(t).length;if(t.matches.some(m=>m.as===''||m.bs==='')){alert('Enter a score for every group-stage match before ending the group stage.');return}if(size>4){alert(`This build can create and score up to 10 groups, but its double-elimination bracket engine currently supports 2 or 4 qualifying players. A generalized 6–100 player double-elimination generator is required before starting this ${size}-player Top Cut.`);return}t.phase='topcut';buildDoubleElim(t);persistLeague();current='Top Cut';render()}
render();
</script></body></html>
