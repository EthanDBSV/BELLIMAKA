/* ══ 3. PREDICTION POINTS BELONG TO ACCOUNTS ═══════════════════════
   Scored from the predictions table against the real results, so the
   leaderboard lists sign-in accounts rather than tournament players.
   Nothing is written back: user_profiles.prediction_points can only be
   updated by its owner under the current RLS policy, so totals are
   derived on read instead. */
/* A group-stage question and a Top Cut question can produce the exact
   same key ("Who wins: A vs B"), so resolve the answer and its point
   value together rather than guessing the value from the key alone. */
function predictionOutcome(t,key){
  if(/^Who will be the .* Champion\?$/.test(key))
    return {value:100,answer:(t.champion&&t.champion!=='TBD'&&t.champion!=='BYE')?t.champion:null};
  let top=key.match(/^Who will top (.+)\?$/);
  if(top){
    let g=top[1],buckets=groupsOf(t);
    if(!buckets[g])return {value:45,answer:null};
    let done=(t.matches||[]).filter(m=>(m.group||'Group A')===g).every(m=>m.as!==''&&m.as!=null);
    if(!done)return {value:45,answer:null};
    try{return {value:45,answer:getStand(t,g)[0]?.p||null}}catch(e){return {value:45,answer:null}}
  }
  /* Top Cut questions carry a prefix so a bracket rematch of a group
     pairing can never be scored against the group result. */
  let cut=key.match(/^Top Cut · Who wins: (.+) vs (.+)$/);
  if(cut){
    let bm=(t.topCutCache?.results||[]).find(x=>(x.p1===cut[1]&&x.p2===cut[2])||(x.p1===cut[2]&&x.p2===cut[1]));
    if(bm&&+bm.s1!==+bm.s2)return {value:20,answer:+bm.s1>+bm.s2?bm.p1:bm.p2};
    return {value:20,answer:null};
  }
  let vs=key.match(/^Who wins: (.+) vs (.+)$/);
  if(vs){
    let [,a,b]=vs;
    let m=(t.matches||[]).find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
    if(m){
      if(m.as===''||m.as==null||m.bs===''||m.bs==null||+m.as===+m.bs)return {value:8,answer:null};
      return {value:8,answer:+m.as>+m.bs?m.a:m.b};
    }
    /* legacy rows written before the prefix existed */
    let bm=(t.topCutCache?.results||[]).find(x=>(x.p1===a&&x.p2===b)||(x.p1===b&&x.p2===a));
    if(bm&&+bm.s1!==+bm.s2)return {value:20,answer:+bm.s1>+bm.s2?bm.p1:bm.p2};
    return {value:20,answer:null};
  }
  return {value:0,answer:null}
}
function predictionAnswer(t,key){return predictionOutcome(t,key).answer}
function predictionValue(key,t){return predictionOutcome(t,key).value}
function scorePredictionRows(t,rows,nameOf){
  let totals={},settled=0,pending=0,cache={};
  rows.forEach(r=>{
    if(!(r.prediction_key in cache))cache[r.prediction_key]=predictionOutcome(t,r.prediction_key);
    let {answer,value}=cache[r.prediction_key];
    let who=nameOf(r.user_id);
    if(!who)return;
    totals[who]=totals[who]||{pts:0,hits:0,made:0,open:0};
    totals[who].made++;
    if(answer==null){totals[who].open++;pending++;return}
    settled++;
    if(answer===r.selection){totals[who].pts+=value;totals[who].hits++}
  });
  return {rows:Object.entries(totals).map(([u,v])=>({u,...v})).sort((a,b)=>b.pts-a.pts||b.hits-a.hits||a.u.localeCompare(b.u)),settled,pending}
}
function leaderboardShell(t){
  return `<aside class="card leaderboard" id="predLeaders" data-tournament="${esc(t?.id||'')}">
    <div class="card-title">Prediction leaders</div>
    <p class="sub" id="predLeadersBody">Loading account scores…</p></aside>`
}
async function renderPredictionLeaders(t){
  let host=document.querySelector('#predLeaders');
  if(!host||!t)return;
  let body=host.querySelector('#predLeadersBody');
  if(!supabaseClient||!supabaseReady()){
    body.outerHTML=`<p class="sub" id="predLeadersBody">Sign-in is not configured, so prediction points cannot be tracked yet.</p>`;
    return
  }
  let rows=[],accounts=[];
  try{
    let res=await supabaseClient.from('predictions').select('user_id,prediction_key,selection').eq('tournament_id',t.id);
    rows=res.data||[];
    accounts=await loadAccounts();
  }catch(e){
    let el=document.querySelector('#predLeadersBody');
    if(el)el.textContent='Prediction scores could not be loaded right now.';
    return
  }
  if(document.querySelector('#predLeaders')?.dataset.tournament!==t.id)return;
  let byId=Object.fromEntries((accounts||[]).map(a=>[a.id,a.username]));
  let {rows:board,settled,pending}=scorePredictionRows(t,rows,id=>byId[id]||null);
  let me=window.currentAccount?.username;
  let list=board.length?board.map((x,i)=>{
    let player=playerForAccount(x.u);
    return `<div class="leader ${x.u===me?'me':''}">
      <span class="rank">${i+1}</span>
      <span class="mini-avatar" style="background-image:${player?teamArt(player,t):fallbackArt(x.u)};background-size:cover;background-position:center">${player&&(teamCovers[player]||profilePictures[player])?'':esc(x.u[0]||'')}</span>
      <b>${esc(x.u)}${player?`<span class="sub" style="display:block;font-size:9px">as ${esc(player)}</span>`:''}</b>
      <span class="pts">${x.pts} pts</span></div>`
  }).join(''):'<p class="sub">No predictions submitted yet. Points are awarded once results come in.</p>';
  let note=`<div class="leader-note">${settled} scored · ${pending} still open. Points follow the sign-in account, so they stay with you across tournaments whether or not you are playing.</div>`;
  let target=document.querySelector('#predLeaders');
  if(target)target.innerHTML=`<div class="card-title">Prediction leaders</div>${list}${note}`
}

/* predictions(): same layout, account-based leaderboard */
function predictions(t=activeT()){
  let started=(t.matches||[]).some(x=>x.as!==''&&x.as!=null),groups=groupsOf(t);
  let block=(over,q,opts,locked=false)=>{
    if(opts.length===2&&opts.every(x=>x&&x!=='TBD'&&x!=='BYE'))return versusBlock(t,over,q,opts[0],opts[1],locked);
    let chosen=savedPick(t,q);
    return `<div class="prediction card"><div class="eyebrow">${esc(over)}</div><h3>${esc(q)}</h3>
      <div class="pick-options">${opts.map(x=>predictionPick(x,locked,chosen===x)).join('')}</div>
      ${locked?'<p class="sub">Prediction locked.</p>':''}</div>`
  };
  setTimeout(()=>renderPredictionLeaders(t),0);
  let leaderboard=leaderboardShell(t);
  if(t.phase==='topcut'){
    let live=(t.bracketMatches||t.topCutCache?.playable||[]).filter(m=>m.p1&&m.p2&&m.p1!=='BYE'&&m.p2!=='BYE');
    return `<div class="pred-layout"><div><div class="eyebrow" style="margin:4px 0 8px">Live Top Cut predictions · 20 points each</div>
      ${live.length?'<p class="versus-hint">Tap a side to lock in your pick. Each matchup locks once it is scored.</p>':''}
      ${live.map(m=>block('20 points · '+m.title,'Top Cut · Who wins: '+m.p1+' vs '+m.p2,[m.p1,m.p2],m.s1!==''&&m.s2!=='')).join('')}
      <p class="sub">New predictions appear automatically whenever the bracket produces a new playable matchup. Each locks when that matchup is scored.</p></div>${leaderboard}</div>`
  }
  let games=t.matches||[];
  return `<div class="pred-layout"><div>
    ${block('100 points · tournament outcome','Who will be the '+t.name+' Champion?',t.players,started)}
    ${Object.entries(groups).map(([g,ps])=>block('45 points · '+g+' outcome','Who will top '+g+'?',ps,started)).join('')}
    <div class="eyebrow" style="margin:22px 0 8px">Group-stage match predictions · 8 points each</div>
    ${games.length?'<p class="versus-hint">Tap a side to lock in your pick. Each matchup locks once it is scored.</p>':''}
    ${games.map(m=>block('8 points · '+(m.group||'Group A'),'Who wins: '+m.a+' vs '+m.b,[m.a,m.b],m.as!==''&&m.bs!=='')).join('')}
  </div>${leaderboard}</div>`
}

/* ══ 4. HALL OF FAME & LEAGUE RECORDS ENGINE ═══════════════════════ */
function getChronologicalMatches(){
  let sortedTournaments=Object.values(tournamentData).sort((a,b)=>{
    let da=Date.parse(a.start)||0,db=Date.parse(b.start)||0;
    if(da!==db)return da-db;
    let sa=Number(String(a.season).replace(/\D/g,''))||0;
    let sb=Number(String(b.season).replace(/\D/g,''))||0;
    return sa-sb;
  });

  let allMatches=[];
  sortedTournaments.forEach(t=>{
    (t.matches||[]).forEach((m,idx)=>{
      if(m.as!==''&&m.bs!==''&&m.as!=null&&m.bs!=null&&+m.as!==+m.bs){
        allMatches.push({
          tournament:t,
          tournamentId:t.id,
          tournamentName:t.name,
          stage:'group',
          a:m.a,
          b:m.b,
          sa:+m.as,
          sb:+m.bs,
          winner:+m.as>+m.bs?m.a:m.b,
          loser:+m.as>+m.bs?m.b:m.a,
          time:m.completedAt||(t.start?Date.parse(t.start)+idx*1000:idx*1000)
        });
      }
    });

    (t.topCutCache?.results||[]).forEach((m,idx)=>{
      if(m.s1!==''&&m.s2!==''&&m.s1!=null&&m.s2!=null&&+m.s1!==+m.s2){
        allMatches.push({
          tournament:t,
          tournamentId:t.id,
          tournamentName:t.name,
          stage:'topcut',
          a:m.p1,
          b:m.p2,
          sa:+m.s1,
          sb:+m.s2,
          winner:+m.s1>+m.s2?m.p1:m.p2,
          loser:+m.s1>+m.s2?m.p2:m.p1,
          time:m.completedAt||(t.end?Date.parse(t.end)+idx*1000:1000000000000+idx*1000)
        });
      }
    });
  });

  allMatches.sort((a,b)=>a.time-b.time);
  return {sortedTournaments,allMatches};
}

function calculateLeagueRecords(){
  let {sortedTournaments,allMatches}=getChronologicalMatches();
  let allPlayers=Object.keys(profiles);
  sortedTournaments.forEach(t=>(t.players||[]).forEach(p=>{if(!allPlayers.includes(p))allPlayers.push(p)}));

  let statsByPlayer={};
  allPlayers.forEach(p=>{
    statsByPlayer[p]={
      player:p,
      matches:[],
      wins:0,
      losses:0,
      maxWinStreak:0,
      currentWinStreak:0,
      maxLossStreak:0,
      currentLossStreak:0,
      bestGD:-999,
      bestGDTournament:'',
      tournamentFinishes:[],
      badges:[]
    };
  });

  allMatches.forEach(m=>{
    if(statsByPlayer[m.a])statsByPlayer[m.a].matches.push({won:m.winner===m.a,match:m});
    if(statsByPlayer[m.b])statsByPlayer[m.b].matches.push({won:m.winner===m.b,match:m});
  });

  allPlayers.forEach(p=>{
    let s=statsByPlayer[p];
    let curW=0,maxW=0,curL=0,maxL=0;
    s.matches.forEach(item=>{
      if(item.won){
        curW++;
        curL=0;
        if(curW>maxW)maxW=curW;
      }else{
        curL++;
        curW=0;
        if(curL>maxL)maxL=curL;
      }
    });
    s.wins=s.matches.filter(x=>x.won).length;
    s.losses=s.matches.filter(x=>!x.won).length;
    s.maxWinStreak=maxW;
    s.currentWinStreak=curW;
    s.maxLossStreak=maxL;
    s.currentLossStreak=curL;
  });

  sortedTournaments.forEach(t=>{
    let isCompleteOrTopCut=(t.phase==='topcut'||t.status==='COMPLETE'||!!t.bracketManagerData);

    (t.players||[]).forEach(p=>{
      let rec=tournamentRecord(t,p);
      let [w,l]=rec.split('-').map(Number);
      let finish=tournamentFinish(t,p);

      let gEntry=Object.entries(groupsOf(t)).find(([,ps])=>ps.includes(p));
      let gStand=gEntry?getStand(t,gEntry[0]).find(x=>x.p===p):null;
      let gd=gStand?(gStand.gw-gStand.gl):0;
      let gSeed=gStand?getStand(t,gEntry[0]).indexOf(gStand)+1:0;
      let groupSize=gEntry?groupsOf(t)[gEntry[0]]?.length||4:4;

      if(statsByPlayer[p]){
        if(gd>statsByPlayer[p].bestGD){
          statsByPlayer[p].bestGD=gd;
          statsByPlayer[p].bestGDTournament=t.name;
        }

        statsByPlayer[p].tournamentFinishes.push({
          tournament:t,
          finish,
          w:w||0,
          l:l||0,
          gd,
          gSeed,
          groupSize
        });

        // Perfect run / Undefeated Champion
        if(finish.place===1&&(l||0)===0&&(w||0)>0){
          statsByPlayer[p].badges.push({
            id:'undefeated-'+t.id,
            icon:'🛡️',
            name:`Undefeated Champ (${t.name})`,
            desc:`Won ${t.name} without a single match loss (${w}-0)`,
            category:'championship',
            color:'gold'
          });
        }

        // Cinderella Run: Overperformed expectations in general for this tournament
        let isLowSeed=(gSeed>=3||(gSeed===2&&groupSize<=3));
        let reachedCut=isCompleteOrTopCut&&(finish.place<=3);
        let reachedFinals=(finish.place===1||finish.place===2);
        let upsetRun=isLowSeed&&reachedCut;
        let surpriseFinalist=reachedFinals&&(isLowSeed||(w>l&&gSeed>=2));

        if(upsetRun||surpriseFinalist){
          statsByPlayer[p].badges.push({
            id:'cinderella-'+t.id,
            icon:'👠',
            name:`Cinderella Run (${t.name})`,
            desc:`Overperformed expectations in ${t.name}, advancing to ${finish.label} (${finish.note})`,
            category:'miracle',
            color:'purple'
          });
        }
      }
    });
  });

  // Most Improved: Exactly ONE player per tournament (evaluated chronologically from tournament 2 onwards)
  for(let tIdx=1;tIdx<sortedTournaments.length;tIdx++){
    let currT=sortedTournaments[tIdx];
    let candidates=[];

    allPlayers.forEach(p=>{
      let s=statsByPlayer[p];
      if(!s)return;
      let tf=s.tournamentFinishes;
      let currIdx=tf.findIndex(x=>x.tournament.id===currT.id);
      if(currIdx<=0)return; // Must have played in a previous tournament

      let currF=tf[currIdx];
      let prevF=tf[currIdx-1];

      let prevRankVal=prevF.finish.place;
      let currRankVal=currF.finish.place;

      let placeImprovement=prevRankVal-currRankVal;
      let winImprovement=currF.w-prevF.w;
      let gdImprovement=currF.gd-prevF.gd;

      let score=placeImprovement*10+winImprovement*5+gdImprovement;

      if((placeImprovement>0||winImprovement>=2)&&score>0){
        candidates.push({
          p,
          score,
          currF,
          prevF,
          prevTName:prevF.tournament.name,
          currTName:currT.name
        });
      }
    });

    if(candidates.length>0){
      candidates.sort((a,b)=>b.score-a.score);
      let winner=candidates[0];
      if(winner.score>=5){
        statsByPlayer[winner.p].badges.push({
          id:'improved-'+currT.id,
          icon:'🚀',
          name:`Most Improved (${winner.currTName})`,
          desc:`Biggest improvement in ${winner.currTName} (${winner.currF.finish.label}) after ${winner.prevF.finish.label} in ${winner.prevTName}`,
          category:'improvement',
          color:'green'
        });
      }
    }
  }

  // Global Leaders
  let maxWinAll=Math.max(0,...allPlayers.map(p=>statsByPlayer[p].maxWinStreak));
  let maxActiveWinAll=Math.max(0,...allPlayers.map(p=>statsByPlayer[p].currentWinStreak));
  let maxLossAll=Math.max(0,...allPlayers.map(p=>statsByPlayer[p].maxLossStreak));
  let maxActiveLossAll=Math.max(0,...allPlayers.map(p=>statsByPlayer[p].currentLossStreak));
  let maxTitlesAll=Math.max(0,...allPlayers.map(p=>(profiles[p]?.cups||[]).length));
  let maxTopsAll=Math.max(0,...allPlayers.map(p=>Number(profiles[p]?.tops)||0));

  allPlayers.forEach(p=>{
    let s=statsByPlayer[p];
    let career=playerCareerStats(p);

    if(s.maxWinStreak>=3&&s.maxWinStreak===maxWinAll){
      s.badges.push({
        id:'record-win-streak',
        icon:'🔥',
        name:`All-Time Streak King (${s.maxWinStreak}W)`,
        desc:`Holds the all-time league record of ${s.maxWinStreak} consecutive match wins`,
        category:'streak',
        color:'red'
      });
    }else if(s.maxWinStreak>=4){
      s.badges.push({
        id:'high-win-streak',
        icon:'🔥',
        name:`${s.maxWinStreak}x Win Streak`,
        desc:`Won ${s.maxWinStreak} consecutive matches`,
        category:'streak',
        color:'red'
      });
    }

    if(s.currentWinStreak>=2&&s.currentWinStreak===maxActiveWinAll){
      s.badges.push({
        id:'active-win-streak',
        icon:'⚡',
        name:`On Fire (${s.currentWinStreak}W)`,
        desc:`Current active win streak of ${s.currentWinStreak} matches`,
        category:'streak',
        color:'amber'
      });
    }

    if(s.currentLossStreak>=3&&s.currentLossStreak===maxActiveLossAll){
      s.badges.push({
        id:'active-loss-streak',
        icon:'❄️',
        name:`Cold Slump (${s.currentLossStreak}L)`,
        desc:`Current active slump of ${s.currentLossStreak} matches`,
        category:'streak',
        color:'blue'
      });
    }

    if(career.titles>0){
      s.badges.push({
        id:'champion-badge',
        icon:'👑',
        name:career.titles===1?'League Champion':`${career.titles}x Champion`,
        desc:`Won: ${career.championshipCups.join(', ')}`,
        category:'trophy',
        color:'gold'
      });
    }

    if(career.topCuts>=2){
      s.badges.push({
        id:'top-cut-veteran',
        icon:'⚔️',
        name:`${career.topCuts}x Top Cut`,
        desc:`Reached Top Cut in ${career.topCuts} tournaments`,
        category:'playoffs',
        color:'silver'
      });
    }

    let totalGames=s.wins+s.losses;
    if(totalGames>=5&&career.winPct>=70){
      s.badges.push({
        id:'win-pct-elite',
        icon:'🎯',
        name:`${career.winPct}% Win Rate`,
        desc:`Career record of ${career.record} (${career.winPct}% win rate)`,
        category:'efficiency',
        color:'green'
      });
    }

    if(s.bestGD>=5){
      s.badges.push({
        id:'blowout-king',
        icon:'💥',
        name:`+${s.bestGD} GD (${s.bestGDTournament})`,
        desc:`Dominant +${s.bestGD} game differential in ${s.bestGDTournament}`,
        category:'dominance',
        color:'amber'
      });
    }

    if(totalGames>=8){
      s.badges.push({
        id:'iron-trainer',
        icon:'🏅',
        name:'Iron Trainer',
        desc:`Fought in ${totalGames} career matches`,
        category:'veteran',
        color:'gray'
      });
    }
  });

  return {
    statsByPlayer,
    records:{
      maxWinStreak:{value:maxWinAll,holders:allPlayers.filter(p=>statsByPlayer[p].maxWinStreak===maxWinAll&&maxWinAll>0)},
      activeWinStreak:{value:maxActiveWinAll,holders:allPlayers.filter(p=>statsByPlayer[p].currentWinStreak===maxActiveWinAll&&maxActiveWinAll>0)},
      maxLossStreak:{value:maxLossAll,holders:allPlayers.filter(p=>statsByPlayer[p].maxLossStreak===maxLossAll&&maxLossAll>0)},
      activeLossStreak:{value:maxActiveLossAll,holders:allPlayers.filter(p=>statsByPlayer[p].currentLossStreak===maxActiveLossAll&&maxActiveLossAll>0)},
      maxTitles:{value:maxTitlesAll,holders:allPlayers.filter(p=>(profiles[p]?.cups||[]).length===maxTitlesAll&&maxTitlesAll>0)},
      maxTopCuts:{value:maxTopsAll,holders:allPlayers.filter(p=>Number(profiles[p]?.tops)===maxTopsAll&&maxTopsAll>0)}
    }
  };
}

function swapGroupPlacements(first,second,targetGroup){
  let t=tournamentData[window.editingTournamentId]||activeT();
  if(!t||!first||!moderator||t.phase==='topcut')return;
  let buckets=groupsOf(t),assign={};
  Object.entries(buckets).forEach(([g,players])=>players.forEach(p=>assign[p]=g));
  let source=assign[first];
  if(second){
    let other=assign[second];assign[first]=other;assign[second]=source;
    if(source===other){let ai=t.players.indexOf(first),bi=t.players.indexOf(second);if(ai>=0&&bi>=0)[t.players[ai],t.players[bi]]=[t.players[bi],t.players[ai]]}
  }else if(targetGroup&&source!==targetGroup){assign[first]=targetGroup}
  t.groupAssignments=assign;rebuildSchedulePreserving(t);persistLeague();openGroupPlacementEditor();render()
}

/* ══ 8. PLAYOFF "FORM" ON A 0-100 SCALE ════════════════════════════
   playoffRating and winChance are untouched — the simulation still
   runs on exactly the same numbers. This only changes what is shown:
   the raw rating is mapped through the same logistic the simulation
   uses, so 50 is the neutral baseline and the ordering is identical. */
function playoffForm(p,t){return Math.round(100/(1+Math.exp(-(playoffRating(p,t)-1000)/130)))}
function playoffOdds(){
  let t=ongoingT();if(!t)return noTournament();
  let data=playoffOddsData(t);
  let rows=Object.entries(data).map(([p,odds])=>({p,odds,form:playoffForm(p,t),accolades:playoffAccolades(p)})).sort((a,b)=>b.odds-a.odds);
  return head('Playoff Calculator',t.name+' · projected Top Cut chances')
    +`<div class="card table-wrap"><table class="standings">
      <thead><tr><th>#</th><th>Trainer</th><th>Top Cut chance</th><th>Projection</th></tr></thead>
      <tbody>${rows.map((x,i)=>`<tr class="${x.odds===100?'safe':x.odds===0?'out':'hunt'}">
        <td class="rank">${i+1}</td>
        <td class="player">${playerLink(x.p)}<span class="team">Form ${x.form}/100 · ${x.accolades.titles} title${x.accolades.titles===1?'':'s'} · ${x.accolades.tops} Top Cut${x.accolades.tops===1?'':'s'}</span></td>
        <td><b>${x.odds}%</b></td>
        <td><div class="progress" style="width:160px"><span style="width:${x.odds}%;background:${x.odds===100?'var(--green)':x.odds===0?'var(--red)':'var(--amber)'}"></span></div></td></tr>`).join('')}</tbody></table></div>`
    +`<p class="sub">2,000 simulated finishes. Form runs 0-100 with 50 as the league-average baseline: it blends all-time W-L (career form), this tournament's W-L (current form), game differential, plus a bonus per title and per Top Cut. Players with no record or accolades sit at 50.</p>`
}

/* ══ 9. FIX: ASSIGNED TEAM NAMES NOT SAVING ════════════════════════
   Three separate faults, all of which looked like "it didn't save":
   a) Teams uses ongoingT() but never set viewTournament, so after
      visiting an archived tournament the editor opened via activeT()
      and wrote the team names onto that OLD tournament instead.
   b) A blank box stored '' and teamName() treated any tournament with
      a teamNames object as authoritative, so it printed "Unassigned
      team" instead of falling back to the profile's default.
   c) Boxes were only rendered for players already in the tournament,
      so a player ticked in the same visit had nowhere to type a team. */
function teamName(t,p){
  let explicit=t&&t.teamNames?String(t.teamNames[p]||'').trim():'';
  if(explicit)return explicit;
  let fallback=String(profiles[p]?.team||'').trim();
  if(fallback&&fallback!=='No default team')return fallback;
  return 'Unassigned team'
}
function Teams(){
  let t=ongoingT();if(!t)return noTournament();
  viewTournament=t.id;                    /* (a) keep the editor on this tournament */
  return head('Teams',t.name+' rosters',moderator?`<button class="btn ghost" onclick="openTournamentPlayers()">Edit tournament teams</button>`:'')
    +`<div class="teams">${t.players.map(p=>`<div style="position:relative">
      <button class="card team-card" ${teamCoverBg(p)} onclick="openProfile('${jsArg(p)}')">
        <div class="eyebrow">${esc(p)}</div><h3>${esc(teamName(t,p))}</h3>
        <div class="roster">${(roster[p]||[]).map(x=>`<span class="mon">${esc(x)}</span>`).join('')}</div>
        <p class="sub">View profile & team history →</p></button>
      ${moderator?`<button class="cover-edit" onclick="event.stopPropagation();openTeamCoverEditor('${jsArg(p)}')">Edit cover</button>`:''}
    </div>`).join('')}</div>`
}
function openTournamentPlayers(){
  let t=activeT();if(!t)return;
  window.editingTournamentId=t.id;        /* pin it so the save cannot drift */
  let groups=Object.keys(groupsOf(t)),buckets=groupsOf(t);
  let rows=Object.keys(profiles).sort((a,b)=>a.localeCompare(b)).map(p=>{
    let inT=t.players.includes(p),explicit=t.teamNames?String(t.teamNames[p]||'').trim():'';
    return `<div class="link-row" style="grid-template-columns:20px minmax(0,1fr) 130px minmax(0,1fr)">
      <input class="tPlayerChoice" type="checkbox" value="${esc(p)}" ${inT?'checked':''}>
      <span><b>${esc(p)}</b>${accountForPlayer(p)?`<div class="sub" style="font-size:9px;margin-top:2px">◆ ${esc(accountForPlayer(p))}</div>`:''}</span>
      <select class="playerGroup" data-player="${esc(p)}">${groups.map(g=>`<option ${buckets[g].includes(p)?'selected':''}>${esc(g)}</option>`).join('')}</select>
      <input class="tTeamName" data-player="${esc(p)}" value="${esc(explicit)}" placeholder="${esc(profiles[p]?.team&&profiles[p].team!=='No default team'?profiles[p].team:'Team name')}">
    </div>`
  }).join('');
  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:760px">
    <div class="modal-head"><div><div class="eyebrow">Moderator only · ${esc(t.name)}</div><h2>Players & teams</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <p class="sub">Tick who is playing, set their group, and give each one a team name for this tournament. Leave a team box empty to fall back to that player's default team.</p>
    <div class="card" style="padding:6px 14px">${rows}</div>
    <div class="field" style="margin-top:14px"><label>Add new player profile</label><input id="editNewPlayer" placeholder="New player name"></div>
    <div class="creator-actions"><button class="btn" onclick="saveTournamentPlayers()">Save participants & teams</button></div>
  </div></div>`
}
function saveTournamentPlayers(){
  let t=tournamentData[window.editingTournamentId]||activeT();
  if(!t)return;
  if(t.phase==='topcut'){alert('Participants are locked after Top Cut begins.');return}
  let selected=[...document.querySelectorAll('.tPlayerChoice:checked')].map(x=>x.value);
  let newP=document.querySelector('#editNewPlayer').value.trim();
  if(newP){
    if(!profiles[newP]){profiles[newP]={team:'No default team',record:'0-0',tops:0,cups:[]};roster[newP]=[];teamHistory[newP]=[]}
    selected.push(newP);
  }
  if(selected.length<2){alert('A tournament needs at least two players.');return}
  let oldPlayers=t.players.join('|'),oldAssign=JSON.stringify(t.groupAssignments||{});
  t.players=[...new Set(selected)];
  t.teamNames=t.teamNames||{};
  /* (b) only store real names; a blank box clears the override */
  document.querySelectorAll('.tTeamName').forEach(x=>{
    let p=x.dataset.player,v=x.value.trim();
    if(!t.players.includes(p))return;
    if(v)t.teamNames[p]=v;else delete t.teamNames[p];
  });
  Object.keys(t.teamNames).forEach(p=>{if(!t.players.includes(p))delete t.teamNames[p]});
  let assign={};
  document.querySelectorAll('.playerGroup').forEach(x=>{if(t.players.includes(x.dataset.player))assign[x.dataset.player]=x.value});
  let groupNames=Object.keys(groupsOf(t));
  t.players.filter(p=>!assign[p]).forEach((p,i)=>assign[p]=groupNames[i%groupNames.length]);
  t.groupAssignments=assign;
  let changed=oldPlayers!==t.players.join('|')||oldAssign!==JSON.stringify(assign);
  if(changed)rebuildSchedulePreserving(t);
  rebuildAllPlayerStats();persistLeague();closeModal();render()
}

/* ══ 10. MATCHES PAGE — VISUALS ONLY ═══════════════════════════════
   Same inputs, same ids, same score()/removeCustom() calls; this only
   adds team art, team names, and a won/lost treatment. */
function playerFace(p,t){
  let art=profilePictures[p]?`url('${esc(profilePictures[p])}')`:(teamCovers[p]?`url('${esc(teamCovers[p])}')`:fallbackArt(p));
  let letter=(profilePictures[p]||teamCovers[p])?'':esc((p||'?')[0]);
  return `<span class="mrow-face" style="background-image:${art}">${letter}</span>`
}
function renderMatchRow(m,i,t){
  let editable=moderator&&t.status==='ONGOING'&&t.phase!=='topcut';
  let a=m.a||'TBD',b=m.b||'TBD';
  let av=scoreDrafts['a'+i]??m.as??'',bv=scoreDrafts['b'+i]??m.bs??'';
  let reported=m.as!==''&&m.as!=null&&m.bs!==''&&m.bs!=null;
  let aWon=reported&&+m.as>+m.bs,bWon=reported&&+m.bs>+m.as;
  let label=m.custom?'Custom · '+(m.group||'Group match'):(m.group||'Group match');
  let side=(p,score,won,lost,id,cls)=>`<div class="score-competitor ${cls} ${won?'winner':''} ${lost?'loser':''}">
    <span class="mrow-id">${playerFace(p,t)}<span class="mrow-text">
      <span class="mrow-name">${matchPlayerName(p)}</span>
      <span class="mrow-team">${esc(teamName(t,p))}</span>
      ${won?'<span class="win-flag">▲ Winner</span>':''}
    </span></span>
    ${editable?`<input aria-label="${esc(p)} score" id="${id}" class="score-box" type="number" min="0" inputmode="numeric" placeholder="0" value="${esc(score)}">`
              :`<b class="score-box" style="display:grid;place-items:center">${reported?esc(cls==='right'?m.bs:m.as):'—'}</b>`}</div>`;
  return `<article class="score-match ${reported?'done':'live'}" data-players="${esc(a)}|${esc(b)}">
    <div class="score-match-head">
      <span class="st"><i></i>${reported?'Reported'+(m.date?' · '+esc(m.date):''):'Awaiting result'}</span>
      <span>${esc(label)}</span></div>
    <div class="score-match-body">
      ${side(a,av,aWon,bWon,'a'+i,'')}
      <div class="score-match-vs">VS</div>
      ${side(b,bv,bWon,aWon,'b'+i,'right')}
    </div>
    ${editable?`<div class="score-match-foot"><button class="save" onclick="score(${i})">Save result</button>${m.custom?`<button class="save" style="color:#ff969c" onclick="removeCustom(${i})">Remove</button>`:''}</div>`:''}
  </article>`
}

/* Top Cut question text gained a "Top Cut · " prefix; keep reading the
   old key so picks made before this change still show as selected. */
function savedPick(t,question){
  try{
    let id=t?.id||'',hit=localStorage.getItem('draftdex-pick-'+id+'-'+question);
    if(hit)return hit;
    if(question.startsWith('Top Cut · '))return localStorage.getItem('draftdex-pick-'+id+'-'+question.slice(10))||'';
    return ''
  }catch{return ''}
}

/* ══ SHARED STATE: carry account links alongside everything else ════ */
async function flushSync(){
  if(!supabaseClient||!moderator)return;
  let snapshotJson=JSON.stringify({tournaments:tournamentData,profiles,roster,teamHistory,teamCovers,profilePictures,pulsePanelImages,cut,boardLink,draftPool,accountLinks});
  if(snapshotJson===lastSentSnapshot)return;
  lastSentSnapshot=snapshotJson;knownRev++;
  let payload=JSON.parse(snapshotJson);payload.rev=knownRev;
  await supabaseClient.from('league_state').update({data:payload,updated_at:new Date().toISOString()}).eq('id','main')
}
(function(){
  let base=window.applySharedState;
  window.applySharedState=function(data){
    base(data);
    if(data&&data.accountLinks&&typeof data.accountLinks==='object'){
      accountLinks=data.accountLinks;
      try{localStorage.setItem('draftdex-accountlinks',JSON.stringify(accountLinks))}catch{}
    }
  }
})();

if(supabaseReady())loadAccounts();
render();
</script>
<style>
/* ══ 5. DRAFT TOOLS: sheet + team planner on one page ══ */
.tools-layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}

<script>
/* ══════════════════════════════════════════════════════════════════
   5. DRAFT TOOLS REWORK
   The sheet-parsing pool proved unreliable, so the planner is now
   manual entry on the same page as the spreadsheet: read the cost off
   the sheet, type the Pokémon and its price beside it. Teams are
   named, capped at 10 Pokémon / 100 points, saved per account (with a
   cross-device copy in the account's auth metadata when signed in).
   ══════════════════════════════════════════════════════════════════ */
const TEAM_BUDGET=100,TEAM_SLOTS=10;
var teamStore={key:null,teams:[],activeId:null,updatedAt:0,adoptedGuest:false};
var builderStatus='';window.__teamsPulled={};

function readTeamStore(key){try{return JSON.parse(localStorage.getItem('draftdex-teams-'+key)||'null')}catch{return null}}
function ensureTeams(){
  let key=accountKey();
  if(teamStore.key===key)return teamStore;
  let saved=readTeamStore(key);
  teamStore={key,teams:saved?.teams||[],activeId:saved?.activeId||null,updatedAt:saved?.updatedAt||0,adoptedGuest:!!saved?.adoptedGuest};
  /* one-time migration from the old single mock draft */
  if(!teamStore.teams.length){
    let legacy=null;try{legacy=JSON.parse(localStorage.getItem('draftdex-mock-'+key)||'null')}catch{}
    if(legacy?.picks?.length){teamStore.teams=[{id:teamId(),name:'My first team',picks:legacy.picks.map(x=>({name:String(x.name),cost:+x.cost||0}))}];teamStore.activeId=teamStore.teams[0].id;writeTeams(false)}
  }
  /* teams built before signing in follow the FIRST account that signs
     in on this browser; the guest copy is then marked claimed so a
     second account on the same machine cannot see them. */
  if(key!=='guest'&&!teamStore.teams.length&&!teamStore.adoptedGuest){
    let guest=readTeamStore('guest');
    if(guest?.teams?.length&&!guest.claimed){
      teamStore.teams=JSON.parse(JSON.stringify(guest.teams));
      teamStore.activeId=guest.activeId||guest.teams[0].id;
      try{localStorage.setItem('draftdex-teams-guest',JSON.stringify({...guest,claimed:true}))}catch{}
    }
    teamStore.adoptedGuest=true;writeTeams(false);
  }
  if(!teamStore.activeId&&teamStore.teams.length)teamStore.activeId=teamStore.teams[0].id;
  return teamStore
}
function teamId(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function activeTeam(){let s=ensureTeams();return s.teams.find(x=>x.id===s.activeId)||null}
function writeTeams(bump=true){
  if(bump)teamStore.updatedAt=Date.now();
  try{localStorage.setItem('draftdex-teams-'+teamStore.key,JSON.stringify({teams:teamStore.teams,activeId:teamStore.activeId,updatedAt:teamStore.updatedAt,adoptedGuest:teamStore.adoptedGuest}))}catch{}
  if(bump)schedulePushTeams()
}
var teamsPushTimer=null;
function schedulePushTeams(){
  if(!supabaseClient||!sessionUser)return;
  clearTimeout(teamsPushTimer);
  teamsPushTimer=setTimeout(async()=>{
    try{await supabaseClient.auth.updateUser({data:{draftTeams:{teams:teamStore.teams,activeId:teamStore.activeId,updatedAt:teamStore.updatedAt,adoptedGuest:teamStore.adoptedGuest}}})}catch(e){}
  },800)
}
async function pullRemoteTeams(){
  if(!supabaseClient||!sessionUser)return;
  let key=accountKey();
  if(window.__teamsPulled[key])return;
  window.__teamsPulled[key]=true;
  try{
    let {data}=await supabaseClient.auth.getUser();
    let remote=data?.user?.user_metadata?.draftTeams;
    ensureTeams();
    if(remote&&Array.isArray(remote.teams)&&(remote.updatedAt||0)>(teamStore.updatedAt||0)&&teamStore.key===accountKey()){
      teamStore.teams=remote.teams;teamStore.activeId=remote.activeId||remote.teams[0]?.id||null;
      teamStore.updatedAt=remote.updatedAt;teamStore.adoptedGuest=!!remote.adoptedGuest;
      writeTeams(false);refreshBuilder();
    }
  }catch(e){}
}
function fmtPts(n){return Number.isInteger(+n)?+n:+(+n).toFixed(1)}
function teamSpent(team){return fmtPts((team?.picks||[]).reduce((n,x)=>n+(+x.cost||0),0))}

/* --- actions (each refreshes only the builder, never the iframe) --- */
function refreshBuilder(){let host=document.querySelector('#teamBuilder');if(host)host.innerHTML=builderHTML()}
function createTeam(){
  let box=document.querySelector('#newTeamName'),name=(box?.value||'').trim()||'Team '+(ensureTeams().teams.length+1);
  if(name.length>40)name=name.slice(0,40);
  let s=ensureTeams(),team={id:teamId(),name,picks:[]};
  s.teams.push(team);s.activeId=team.id;builderStatus='';writeTeams();refreshBuilder();
  setTimeout(()=>document.querySelector('#tmName')?.focus(),0)
}
function switchTeam(id){let s=ensureTeams();if(!s.teams.some(x=>x.id===id))return;s.activeId=id;window.renamingTeam=null;builderStatus='';writeTeams();refreshBuilder()}
function startRenameTeam(){window.renamingTeam=ensureTeams().activeId;refreshBuilder();setTimeout(()=>document.querySelector('#renameTeam')?.focus(),0)}
function commitRenameTeam(){
  let team=activeTeam(),box=document.querySelector('#renameTeam');
  if(team&&box){let v=box.value.trim();if(v)team.name=v.slice(0,40)}
  window.renamingTeam=null;writeTeams();refreshBuilder()
}
function deleteTeam(){
  let s=ensureTeams(),team=activeTeam();
  if(!team)return;
  if(!confirm('Delete "'+team.name+'"? This cannot be undone.'))return;
  s.teams=s.teams.filter(x=>x.id!==team.id);
  s.activeId=s.teams[0]?.id||null;
  builderStatus='';writeTeams();refreshBuilder()
}
function addTeamMon(){
  let team=activeTeam();if(!team)return;
  let nameBox=document.querySelector('#tmName'),costBox=document.querySelector('#tmCost');
  let name=(nameBox?.value||'').trim(),cost=parseFloat(costBox?.value);
  if(!name||!Number.isFinite(cost)||cost<0){builderStatus='Enter a Pokémon and its cost from the sheet.';refreshBuilder();setTimeout(()=>document.querySelector(name?'#tmCost':'#tmName')?.focus(),0);return}
  if(team.picks.length>=TEAM_SLOTS){builderStatus='That is all '+TEAM_SLOTS+' slots — remove a Pokémon to add another.';refreshBuilder();return}
  if(team.picks.some(x=>x.name.toLowerCase()===name.toLowerCase())){builderStatus=name+' is already on this team.';refreshBuilder();setTimeout(()=>document.querySelector('#tmName')?.focus(),0);return}
  team.picks.push({name:name.slice(0,30),cost:fmtPts(cost)});
  builderStatus='';writeTeams();refreshBuilder();
  setTimeout(()=>{let b=document.querySelector('#tmName');if(b){b.value='';b.focus()}let c=document.querySelector('#tmCost');if(c)c.value=''},0)
}
function removeTeamMon(i){let team=activeTeam();if(!team)return;team.picks.splice(i,1);builderStatus='';writeTeams();refreshBuilder()}
function copyTeam(){
  let team=activeTeam();if(!team||!team.picks.length)return;
  let text=team.name+'\n'+team.picks.map(x=>`${x.name} — ${x.cost}`).join('\n')+`\nTotal: ${teamSpent(team)} / ${TEAM_BUDGET}`;
  navigator.clipboard?.writeText(text).then(()=>{builderStatus='Copied to your clipboard.';refreshBuilder()},()=>{})
}
function teamKeydown(e){if(e.key==='Enter'){e.preventDefault();addTeamMon()}}

/* --- markup --- */
function builderHTML(){
  let s=ensureTeams(),team=activeTeam(),who=s.key==='guest'?'this browser':(window.currentAccount?.username||'your account');
  let chips=`<div class="team-chips">${s.teams.map(t=>`<button class="team-chip ${t.id===s.activeId?'on':''}" title="${esc(t.name)}" onclick="switchTeam('${jsArg(t.id)}')">${esc(t.name)}</button>`).join('')}<button class="team-chip new" onclick="window.renamingTeam=null;switchTeam('${jsArg(s.activeId||'')}');document.querySelector('#newTeamRow').style.display='grid';document.querySelector('#newTeamName').focus()">+ New team</button></div>
  <div id="newTeamRow" style="display:${s.teams.length?'none':'grid'};grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:10px">
    <input id="newTeamName" placeholder="Name this team (e.g. Rain squad)" maxlength="40" onkeydown="if(event.key==='Enter'){event.preventDefault();createTeam()}">
    <button class="btn" onclick="createTeam()">Create</button></div>`;
  if(!team)return `<div class="eyebrow">Team planner</div>
    <p class="sub" style="margin-top:9px">Plan a draft before it happens: read a Pokémon's cost off the sheet, type it in, and watch the total. ${TEAM_SLOTS} Pokémon, ${TEAM_BUDGET} points.</p>
    ${chips}
    <p class="tm-note">Teams are private and saved to ${esc(who)}.</p>`;
  let spent=teamSpent(team),left=fmtPts(TEAM_BUDGET-spent),over=left<0;
  let nameRow=window.renamingTeam===team.id
    ?`<div class="tm-name-row"><input id="renameTeam" value="${esc(team.name)}" maxlength="40" onkeydown="if(event.key==='Enter'){event.preventDefault();commitRenameTeam()}"><button class="save" onclick="commitRenameTeam()">Save</button></div>`
    :`<div class="tm-name-row"><div class="tm-name">${esc(team.name)}</div><button class="save" onclick="startRenameTeam()">Rename</button></div>`;
  let free=Math.max(0,TEAM_SLOTS-team.picks.length);
  return `<div class="eyebrow">Team planner</div>
    ${chips}
    ${nameRow}
    <div class="tm-add">
      <input id="tmName" placeholder="Pokémon" maxlength="30" onkeydown="teamKeydown(event)">
      <input id="tmCost" type="number" min="0" step="any" placeholder="Cost" inputmode="decimal" onkeydown="teamKeydown(event)">
      <button class="btn" onclick="addTeamMon()">Add</button></div>
    <div class="tm-status">${esc(builderStatus)}</div>
    <div class="tm-count">
      <div class="budget-num ${over?'over':''}" style="margin:0">${spent}<span style="font-size:17px;color:#9d9ba4"> / ${TEAM_BUDGET}</span></div>
      <div class="slots"><b>${team.picks.length}</b> / ${TEAM_SLOTS} Pokémon</div></div>
    <div class="budget-bar ${over?'over':''}"><span style="width:${Math.min(100,spent/TEAM_BUDGET*100)}%"></span></div>
    <div class="budget-sub">${over?fmtPts(Math.abs(left))+' points over budget':left+' points left'}</div>
    <div class="tm-list">
      ${team.picks.map((x,i)=>`<div class="tm-item"><img src="${esc(monSprite(x.name))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span>${esc(x.name)}</span><b>${fmtPts(x.cost)}</b><button title="Remove ${esc(x.name)}" onclick="removeTeamMon(${i})">×</button></div>`).join('')}
      ${Array.from({length:free},(_,i)=>`<div class="tm-slot-free">Slot ${team.picks.length+i+1} open</div>`).join('')}
    </div>
    <div class="mock-actions"><button class="chip" onclick="copyTeam()">Copy list</button><button class="chip" onclick="deleteTeam()" style="color:#ff9ba1">Delete team</button></div>
    <p class="tm-note">Teams are private and saved to ${esc(who)}${s.key!=='guest'?' — they follow your account when you sign in elsewhere':''}.</p>`
}

/* --- the page: spreadsheet and planner together --- */
function Board(){
  let s=sheetIds(boardLink),embed=sheetEmbedUrl();
  let actions=`<div style="display:flex;gap:8px;flex-wrap:wrap">${moderator?`<button class="btn ghost" onclick="openBoardSettings()">Board settings</button>`:''}<button class="btn" onclick="openBoardLink()">Open in Google Sheets ↗</button></div>`;
  setTimeout(pullRemoteTeams,0);
  return head('Draft Tools','Cost sheet & team planner',actions)
    +`<div class="tools-layout">
      <div class="card">
        <div class="board-note"><span>${s.id?'Live view of the league cost sheet. Edits made in Google Sheets show up here on refresh.':'No sheet connected yet.'}</span></div>
        ${embed?`<iframe class="sheet-frame" src="${esc(embed)}" title="League draft sheet" loading="lazy"></iframe>`
               :`<div class="empty"><div class="card-title">Connect the cost sheet</div><p class="sub">Add the Google Sheets link in Board settings to show it here.</p></div>`}
      </div>
      <aside class="card builder" id="teamBuilder">${builderHTML()}</aside>
    </div>
    <p class="sub">Blank frame? In Google Sheets open <b>Share → General access</b> and set it to <b>Anyone with the link · Viewer</b>. Private sheets cannot be embedded.</p>`
}
function openBoardSettings(){
  if(!moderator)return;
  document.querySelector('#modal').innerHTML=`<div class="modal-wrap"><div class="modal" style="max-width:560px">
    <div class="modal-head"><div><div class="eyebrow">Moderator only</div><h2>Board settings</h2></div><button class="close" onclick="closeModal()">×</button></div>
    <div class="field"><label>Google Sheets link</label><input id="boardInput" type="url" value="${esc(boardLink)}" placeholder="https://docs.google.com/spreadsheets/d/..."></div>
    <p class="sub">Open the sheet tab that holds the costs before copying the link — the tab is remembered too.</p>
    <div class="creator-actions"><button class="btn" onclick="saveBoardLink()">Save link</button></div></div></div>`
}
render();
</script>
